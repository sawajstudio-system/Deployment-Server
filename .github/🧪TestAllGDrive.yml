name: 🧪 Test All GDrive Folders

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      # Teeno Folder IDs
      GDRIVE_F_SHORT_ID: ${{ secrets.GDRIVE_F_SHORT_ID }}
      GDRIVE_F_LONG_ID: ${{ secrets.GDRIVE_F_LONG_ID }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 2. 📦 Install requests
        run: pip install requests
        
      - name: 3. 🪶 Fetch & Run Test
        run: |
          echo "📥 Downloading test_gdrive_all.py..."
          curl -sSL -f -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/A_API_room/02_audio_media/test_gdrive_all.py" \
            -o /tmp/test_gdrive_all.py
          
          if [ -s /tmp/test_gdrive_all.py ]; then
            echo "✅ File mil gayi!"
            python /tmp/test_gdrive_all.py
          else
            echo "❌ File download fail ho gaya."
            exit 1
          fi
          rm -f /tmp/test_gdrive_all.py
