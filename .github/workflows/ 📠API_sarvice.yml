name: 📠api_sarvice

on:
  workflow_dispatch:
    inputs:
      repo_choice:
        description: 'Kaunsi repo export karni hai?'
        required: true
        default: 'all'
        type: choice
        options:
          - all
          - admin
          - hosting_sarvar
          - Development

jobs:
  generate_txt:
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TELEGRAM_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_CHAT: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      GITHUB_TOKEN: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install deps
        run: pip install requests

      - name: 3. 🚀 Generate and Send TXT
        env:
          REPO_CHOICE: ${{ inputs.repo_choice }}
        run: |
          python << 'PYEOF'
          import os, requests, base64, time, sys

          GITHUB_TOKEN = os.environ.get("GITHUB_TOKEN")
          TG_TOKEN     = os.environ.get("TELEGRAM_TOKEN")
          TG_CHAT      = os.environ.get("TELEGRAM_CHAT")
          CHOICE       = os.environ.get("REPO_CHOICE", "all")

          ALL_REPOS = {
              "admin":          "sawajstudio-system/admin",
              "hosting_sarvar": "sawajstudio-system/hosting_sarvar",
              "Development":    "sawajstudio-system/Development",
          }

          if CHOICE == "all":
              REPOS = list(ALL_REPOS.values())
          elif CHOICE in ALL_REPOS:
              REPOS = [ALL_REPOS[CHOICE]]
          else:
              print(f"❌ Invalid repo_choice: {CHOICE}")
              sys.exit(1)

          print(f"🎯 Selected: {CHOICE} -> {REPOS}")

          OUTPUT_FILE     = f"Combined_Export_{CHOICE}.txt"
          MAX_FILE_MB     = 45
          REQUEST_TIMEOUT = 30
          RETRIES         = 3

          SKIP_DIRS = {".git", "node_modules", "__pycache__", ".venv", "venv",
                       "temp", "tmp", "dist", "build", ".next", ".cache",
                       "coverage", ".pytest_cache", ".mypy_cache"}

          BINARY_EXTS = {".png",".jpg",".jpeg",".gif",".webp",".svg",".ico",
                         ".mp4",".mp3",".wav",".mov",".avi",
                         ".ttf",".otf",".woff",".woff2",".eot",
                         ".pdf",".zip",".tar",".gz",".rar",".7z",
                         ".exe",".dll",".so",".dylib",".pyc",".pyo",
                         ".lock",".bin",".dat",".db",".sqlite"}

          headers = {
              "Authorization": f"token {GITHUB_TOKEN}",
              "Accept": "application/vnd.github.v3+json",
          }

          def safe_get(url, **kw):
              for attempt in range(RETRIES):
                  try:
                      r = requests.get(url, headers=headers,
                                       timeout=REQUEST_TIMEOUT, **kw)
                      if r.status_code in (200, 404, 401):
                          return r
                  except requests.RequestException:
                      pass
                  time.sleep(2 * (attempt + 1))
              return None

          def fetch_repo_files(repo_name, fobj):
              print(f"📦 {repo_name} ...")
              r = safe_get(f"https://api.github.com/repos/{repo_name}")
              if not r or r.status_code != 200:
                  fobj.write(f"\n\n[ERROR] repo info {repo_name}\n")
                  return 0
              branch = r.json().get("default_branch", "main")

              r = safe_get(
                  f"https://api.github.com/repos/{repo_name}/git/trees/"
                  f"{branch}?recursive=1")
              if not r or r.status_code != 200:
                  fobj.write(f"\n\n[ERROR] tree {repo_name}\n")
                  return 0

              tree = r.json().get("tree", [])

              fobj.write(f"\n\n{'='*80}\n")
              fobj.write(f"📂 REPOSITORY: {repo_name}\n🌿 Branch: {branch}\n")
              fobj.write(f"{'='*80}\n")

              count = 0
              for item in tree:
                  if item["type"] != "blob":
                      continue
                  path  = item["path"]
                  parts = path.split("/")

                  if any(p in SKIP_DIRS for p in parts):
                      continue
                  if any(path.lower().endswith(e) for e in BINARY_EXTS):
                      continue
                  if item.get("size", 0) > 2 * 1024 * 1024:
                      fobj.write(f"\n--- ⏭ SKIPPED (>2MB): {path} ---\n")
                      continue

                  blob = safe_get(
                      f"https://api.github.com/repos/{repo_name}/git/blobs/"
                      f"{item['sha']}")
                  if not blob or blob.status_code != 200:
                      fobj.write(f"\n[ERROR] blob {path}\n")
                      continue

                  try:
                      raw     = base64.b64decode(blob.json()["content"])
                      content = raw.decode("utf-8")
                  except (UnicodeDecodeError, KeyError):
                      fobj.write(f"\n--- 🚫 BINARY: {path} ---\n")
                      continue

                  fobj.write(f"\n\n{'='*60}\n📄 FILE: {path}\n{'='*60}\n")
                  fobj.write(content)
                  count += 1
                  time.sleep(0.05)

              print(f"✅ {repo_name}: {count} files")
              return count

          # ── MAIN ──────────────────────────────────────────
          total = 0
          with open(OUTPUT_FILE, "w", encoding="utf-8", errors="replace") as f:
              f.write("╔" + "═"*68 + "╗\n")
              f.write(f"║  SAWAJ STUDIO - EXPORT: {CHOICE:<39}║\n")
              f.write("╚" + "═"*68 + "╝\n")
              for repo in REPOS:
                  total += fetch_repo_files(repo, f)
              f.write(f"\n\n=== TOTAL FILES: {total} ===\n")

          size_mb = os.path.getsize(OUTPUT_FILE) / (1024*1024)
          print(f"📊 Final size: {size_mb:.2f} MB")

          if size_mb > MAX_FILE_MB:
              print(f"⚠️ File too big for Telegram ({size_mb:.1f}MB > {MAX_FILE_MB}MB).")
              sys.exit(1)

          # ── TELEGRAM ──────────────────────────────────────
          if not TG_TOKEN or not TG_CHAT:
              print("❌ Telegram tokens missing"); sys.exit(1)

          print("📤 Sending to Telegram...")
          with open(OUTPUT_FILE, "rb") as f:
              r = requests.post(
                  f"https://api.telegram.org/bot{TG_TOKEN}/sendDocument",
                  data={
                      "chat_id": TG_CHAT,
                      "caption": (f"📦 Export: {CHOICE}\n"
                                  f"📄 Files: {total}\n"
                                  f"📊 Size: {size_mb:.2f} MB"),
                  },
                  files={"document": f},
                  timeout=180,
              )
          if r.status_code != 200:
              print(f"❌ Telegram failed: {r.text}"); sys.exit(1)
          print("✅ Sent successfully!")
          PYEOF
