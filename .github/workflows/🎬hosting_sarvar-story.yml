name: 🎬hosting_sarvar-story.yml

on:
  workflow_dispatch:

# 🟢 एक साथ दो वीडियो रेंडर न हों, इसलिए लॉक लगाया गया है
concurrency:
  group: original-story-generator
  cancel-in-progress: false

jobs:
  story_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ── 🟢 CORE & API KEYS ──
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      
      # ── ☁️ GOOGLE DRIVE ──
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      
      # ── 🧠 AI MODELS ──
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      
      # ── 🎬 MEDIA & AUDIO ──
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. 📥 Checkout Production Repo (hosting_sarvar)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/hosting_sarvar'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 📦 Install FFmpeg & Fonts
        run: |
          echo "⏳ Installing System Dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v
          echo "✅ FFmpeg and Fonts Installed!"

      - name: 4. 📥 Install Python Packages
        run: |
          echo "⏳ Installing Python Requirements..."
          python -m pip install --upgrade pip
          pip install -r Video_Generator/Story_Generator/requirements.txt
          echo "✅ Packages Installed!"

      - name: 5. 🧪 Verify Folder Structure
        run: |
          echo "🔍 Checking Files..."
          if [ ! -f "Video_Generator/Story_Generator/main.py" ]; then
            echo "❌ ERROR: main.py not found! Check folder structure."
            exit 1
          fi
          echo "✅ main.py found. Ready to render."

      - name: 6. 🎬 Run Video Pipeline
        id: video_run
        run: |
          cd Video_Generator/Story_Generator
          echo "🚀 Starting Original Story Generation..."
          python -u main.py

      - name: 7. 📤 Backup Video (Artifacts)
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: Original-Story-Video-Output
          path: Video_Generator/Story_Generator/temp/Final_Story.mp4
          retention-days: 3
          if-no-files-found: warn

      - name: 8. 🚨 Telegram Error Alert
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_API_REPORT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}" \
            -d "text=❌ <b>Original Story Generator Failed!</b>%0A%0A<b>Repo:</b> hosting_sarvar%0A<b>Action:</b> Check GitHub Logs" \
            -d "parse_mode=HTML" || true

      - name: 9. 🧹 Cleanup Temp Files
        if: always()
        run: |
          echo "🧹 Cleaning up workspace..."
          rm -rf Video_Generator/Story_Generator/temp || true
          echo "✅ Done!"
