name: Make Logo TransparentTelegram

on:
  workflow_dispatch: # Aap ise GitHub Actions tab se manually run kar sakte hain

jobs:
  process-and-send-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install Pillow requests

      - name: Process Logo (Remove Green Background)
        run: |
          python -c "
          from PIL import Image

          # Open original logo
          img = Image.open('logo.png').convert('RGBA')
          datas = img.getdata()

          new_data = []
          for item in datas:
              r, g, b, a = item
              # Green background detection condition (Adjust threshold if needed)
              if g > r + 30 and g > b + 30 and g > 40:
                  new_data.append((255, 255, 255, 0)) # Transparent
              else:
                  new_data.append(item)

          img.putdata(new_data)
          img.save('transparent_logo.png', 'PNG')
          print('Logo background successfully made transparent!')
          "

      - name: Send Transparent PNG to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          python -c "
          import os
          import requests

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          url = f'https://api.telegram.org/bot{token}/sendPhoto'

          with open('transparent_logo.png', 'rb') as photo:
              response = requests.post(
                  url,
                  data={'chat_id': chat_id, 'caption': '✅ Here is your transparent logo.png!'},
                  files={'photo': photo}
              )

          print('Telegram Response:', response.text)
          response.raise_for_status()
          "
