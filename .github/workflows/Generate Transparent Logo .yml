name: Make Logo Transparent and Send to Telegram

on:
  workflow_dispatch: # Aap ise GitHub Actions tab se manually run kar sakte hain

jobs:
  process-and-send-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install Pillow requests

      - name: Process Logo (Remove All Green Shades & Textures)
        run: |
          python -c "
          from PIL import Image

          img = Image.open('logo.png').convert('RGBA')
          data = img.getdata()

          new_data = []
          for item in data:
              r, g, b, a = item
              
              # Convert RGB to HSV to catch all green gradients and textures
              rf, gf, bf = r/255.0, g/255.0, b/255.0
              maxc = max(rf, gf, bf)
              minc = min(rf, gf, bf)
              diff = maxc - minc
              
              if diff == 0:
                  h = 0
              elif maxc == rf:
                  h = (60 * ((gf - bf) / diff) + 360) % 360
              elif maxc == gf:
                  h = (60 * ((bf - rf) / diff) + 120) % 360
              else:
                  h = (60 * ((rf - gf) / diff) + 240) % 360
                  
              s = 0 if maxc == 0 else (diff / maxc)
              v = maxc
              
              # Target all green hues, ignoring white/silver logo text
              if 60 <= h <= 175 and s > 0.15:
                  new_data.append((0, 0, 0, 0)) # Fully transparent
              else:
                  new_data.append(item)

          img.putdata(new_data)
          img.save('transparent_logo.png', 'PNG')
          print('All green background completely removed!')
          "

      - name: Send Transparent PNG to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          python -c "
          import os
          import requests

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          url = f'https://api.telegram.org/bot{token}/sendPhoto'

          with open('transparent_logo.png', 'rb') as photo:
              response = requests.post(
                  url,
                  data={'chat_id': chat_id, 'caption': '✅ Background fully removed and transparent!'},
                  files={'photo': photo}
              )

          print('Telegram Response:', response.text)
          response.raise_for_status()
          "
