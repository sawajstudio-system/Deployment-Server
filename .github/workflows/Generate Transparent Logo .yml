name: Make Logo Transparent and Send to Telegram

on:
  workflow_dispatch: # Aap ise GitHub Actions tab se manually run kar sakte hain

jobs:
  process-and-send-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install opencv-python-headless numpy requests

      - name: Process Logo (Remove Green, Protect White Logo)
        run: |
          python -c "
          import cv2
          import numpy as np

          # Load image with alpha channel
          img = cv2.imread('logo.png', cv2.IMREAD_UNCHANGED)
          if img.shape[2] == 3:
              img = cv2.cvtColor(img, cv2.COLOR_BGR2BGRA)

          b, g, r, a = cv2.split(img)
          bgr = cv2.merge([b, g, r])

          # 1. Detect all green background shades and textures
          hsv = cv2.cvtColor(bgr, cv2.COLOR_BGR2HSV)
          lower_green = np.array([30, 20, 20])
          upper_green = np.array([90, 255, 255])
          green_mask = cv2.inRange(hsv, lower_green, upper_green)

          # Also catch dominant green channel areas
          g_dominant = (g.astype(np.int16) - r.astype(np.int16) > 10) & (g.astype(np.int16) - b.astype(np.int16) > 10)
          bg_mask = cv2.bitwise_or(green_mask, g_dominant.astype(np.uint8) * 255)

          # 2. STRICT PROTECTION FOR WHITE/SILVER LOGO TEXT
          max_channel = np.maximum(np.maximum(r, g), b)
          min_channel = np.minimum(np.minimum(r, g), b)
          color_diff = max_channel.astype(np.int16) - min_channel.astype(np.int16)
          
          # Protect bright white/silver parts of the logo so they never get removed
          is_logo = (max_channel > 120) & (color_diff < 40)
          bg_mask[is_logo] = 0

          # 3. Apply transparency only to the green background
          img[bg_mask == 255] = (0, 0, 0, 0)

          cv2.imwrite('transparent_logo.png', img)
          print('Green background removed successfully, logo fully protected!')
          "

      - name: Send Transparent PNG to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          python -c "
          import os
          import requests

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          url = f'https://api.telegram.org/bot{token}/sendDocument'

          with open('transparent_logo.png', 'rb') as doc:
              response = requests.post(
                  url,
                  data={'chat_id': chat_id, 'caption': '✅ Perfect transparent logo (Error fixed)!'},
                  files={'document': doc}
              )

          print('Telegram Response:', response.text)
          response.raise_for_status()
          "
