name: Make Logo Transparent

on:
  workflow_dispatch: # Aap ise GitHub Actions tab se manually run kar sakte hain

jobs:
  process-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install Pillow

      - name: Process Image (Remove Green Background)
        run: |
          python -c "
          from PIL import Image

          # Image ka path jo photo mein dikh raha hai
          img_path = 'Firent/logo.png'
          
          img = Image.open(img_path).convert('RGBA')
          datas = img.getdata()

          new_data = []
          for item in datas:
              # Green color detection threshold (Aap apne hisab se adjust kar sakte hain)
              # Agar green component zyada hai aur red/blue kam hai, toh use transparent bana do
              r, g, b, a = item
              if g > 100 and r < 100 and b < 100:
                  new_data.append((255, 255, 255, 0)) # Transparent
              else:
                  new_data.append(item)

          img.putdata(new_data)
          # Purani photo ki jagah nayi transparent photo overwrite ho jayegi
          img.save(img_path, 'PNG')
          print('Image processed and background made transparent successfully!')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add Firent/logo.png
          git commit -m "Replace logo with transparent background version"
          git push
