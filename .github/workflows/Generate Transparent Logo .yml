name: Generate Transparent Logo and Commit

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
    - name: Checkout Code
      uses: actions/checkout@v4

    - name: Setup Python 3.10
      uses: actions/setup-python@v5
      with:
        python-version: '3.10'

    - name: Install System Dependencies
      run: |
        sudo apt-get update
        sudo apt-get install -y libcairo2-dev pkg-config

    - name: Install Python Packages
      run: |
        python -m pip install --upgrade pip
        pip install svgwrite cairosvg

    - name: Create Script and Generate Transparent Logo
      run: |
        mkdir -p output
        
        cat << 'PYTHON_SCRIPT' > generate_logo.py
        import svgwrite
        import cairosvg

        def create_sawaj_logo():
            width, height = 800, 800
            accent_color = "#FFFFFF"
            
            # Yahan background rect hata diya hai taaki background transparent rahe
            dwg = svgwrite.Drawing('output/logo.png', size=(width, height)) # Directly transparent PNG ke liye ya SVG
            
            # Agar aap SVG se PNG bana rahe hain toh drawing SVG mein hogi aur background transparent hoga
            dwg = svgwrite.Drawing('output/sawaj_studio_logo.svg', size=(width, height))
            
            # 1. Elliptical Circle Frame (Hollow Outline)
            dwg.add(dwg.ellipse(center=(400, 400), r=(350, 220), fill="none", stroke=accent_color, stroke_width=3))
            dwg.add(dwg.ellipse(center=(400, 400), r=(340, 210), fill="none", stroke=accent_color, stroke_width=1, opacity=0.6))

            # 2. Mukhya Text "Sawaj" (Hollow Outline - Andar se khali)
            dwg.add(dwg.text("Sawaj", insert=(320, 430), font_family="Arial, sans-serif", font_size="120", font_weight="bold", fill="none", stroke="#052E20", stroke_width="6", text_anchor="middle"))
            dwg.add(dwg.text("Sawaj", insert=(310, 420), font_family="Arial, sans-serif", font_size="120", font_weight="bold", fill="none", stroke=accent_color, stroke_width="3", text_anchor="middle"))

            # Sub-text "studio"
            dwg.add(dwg.text("studio", insert=(310, 500), font_family="Arial, sans-serif", font_size="60", font_weight="bold", fill="none", stroke="#052E20", stroke_width="4", text_anchor="middle"))
            dwg.add(dwg.text("studio", insert=(300, 490), font_family="Arial, sans-serif", font_size="60", font_weight="bold", fill="none", stroke=accent_color, stroke_width="2", text_anchor="middle"))

            # 3. Cameraman Silhouette (Hollow Outline)
            dwg.add(dwg.rect(insert=(580, 310), size=(50, 35), fill="none", stroke=accent_color, stroke_width=4, rx=4))
            dwg.add(dwg.circle(center=(555, 327), r=30, fill="none", stroke=accent_color, stroke_width=4))
            dwg.add(dwg.circle(center=(555, 327), r=15, fill="none", stroke=accent_color, stroke_width=2))
            dwg.add(dwg.rect(insert=(590, 295), size=(20, 15), fill="none", stroke=accent_color, stroke_width=3))
            
            dwg.add(dwg.circle(center=(670, 280), r=25, fill="none", stroke=accent_color, stroke_width=4))
            dwg.add(dwg.path(d="M 660 300 C 630 310, 610 320, 600 330", fill="none", stroke=accent_color, stroke_width=4))
            dwg.add(dwg.path(d="M 680 300 C 650 380, 620 450, 670 480 C 720 500, 750 400, 700 360", fill="none", stroke=accent_color, stroke_width=4))

            # 4. Neeche ka Swoosh
            dwg.add(dwg.path(d="M 150 480 Q 300 550, 450 520", fill="none", stroke=accent_color, stroke_width=3))

            dwg.save()
            # CairoSVG transparent background ke sath PNG generate karega kyunki SVG mein koi background rect nahi hai
            cairosvg.svg2png(url='output/sawaj_studio_logo.svg', write_to='logo.png')
            print("Transparent Logo generated successfully!")

        if __name__ == "__main__":
            create_sawaj_logo()
        PYTHON_SCRIPT
        
        python generate_logo.py

    - name: Commit and Push Transparent Logo
      run: |
        git config --global user.name 'GitHub Actions Bot'
        git config --global user.email 'actions@github.com'
        git add logo.png
        git diff --quiet && git diff --cached --quiet || git commit -m "Auto-generate transparent background logo [skip ci]"
        git push
