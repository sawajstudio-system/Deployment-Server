name: Make Logo Transparent

on:
  workflow_dispatch:

jobs:
  process-image:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install dependencies
        run: |
          pip install Pillow

      - name: Process Image (Remove Green Background)
        run: |
          python -c "
          from PIL import Image

          # Logo seedhe root folder mein hai, isliye path sirf 'logo.png' rahega
          img_path = 'logo.png'
          
          img = Image.open(img_path).convert('RGBA')
          datas = img.getdata()

          new_data = []
          for item in datas:
              r, g, b, a = item
              # Green color detection aur transparent banane ke liye condition
              if g > 100 and r < 100 and b < 100:
                  new_data.append((255, 255, 255, 0)) # Transparent
              else:
                  new_data.append(item)

          img.putdata(new_data)
          img.save(img_path, 'PNG')
          print('Logo background removed and saved successfully!')
          "

      - name: Commit and push changes
        run: |
          git config --global user.name 'github-actions[bot]'
          git config --global user.email 'github-actions[bot]@users.noreply.github.com'
          git add logo.png
          git commit -m "Replace logo with transparent background version"
          git push
