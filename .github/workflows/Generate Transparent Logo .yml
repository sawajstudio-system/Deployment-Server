name: Make Logo Transparent and Send to Telegram

on:
  workflow_dispatch: # Aap ise GitHub Actions tab se manually run kar sakte hain

jobs:
  process-and-send-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install opencv-python-headless numpy requests

      - name: Process Logo (Clean Corner Flood Fill)
        run: |
          python -c "
          import cv2
          import numpy as np

          # Load image with alpha channel
          img = cv2.imread('logo.png', cv2.IMREAD_UNCHANGED)
          if img.shape[2] == 3:
              img = cv2.cvtColor(img, cv2.COLOR_BGR2BGRA)

          bgr = img[:, :, :3]
          h, w = bgr.shape[:2]

          # Create flood fill mask (2 pixels larger than image)
          mask = np.zeros((h + 2, w + 2), np.uint8)

          # Flood fill from all 4 corners to remove connected green background textures
          corners = [(0, 0), (w - 1, 0), (0, h - 1), (w - 1, h - 1)]
          for corner in corners:
              cv2.floodFill(bgr, mask, corner, (255, 255, 255), loDiff=(45, 45, 45), upDiff=(45, 45, 45), flags=cv2.FLOODFILL_FIXED_RANGE | cv2.FLOODFILL_MASK_ONLY)

          # Extract background mask
          bg_mask = mask[1:h+1, 1:w+1]

          # Make background pixels fully transparent (Alpha = 0)
          img[bg_mask == 1] = (0, 0, 0, 0)

          cv2.imwrite('transparent_logo.png', img)
          print('Green background completely removed and logo preserved!')
          "

      - name: Send Transparent PNG to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          python -c "
          import os
          import requests

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          url = f'https://api.telegram.org/bot{token}/sendDocument'

          with open('transparent_logo.png', 'rb') as doc:
              response = requests.post(
                  url,
                  data={'chat_id': chat_id, 'caption': '✅ Here is your clean transparent logo (High Quality)!'},
                  files={'document': doc}
              )

          print('Telegram Response:', response.text)
          response.raise_for_status()
          "
