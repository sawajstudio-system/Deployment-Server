name: 🟢Copy-Hosting-to-Factory

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  copy_all:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}

    steps:
      # ──────────────────────────────────────────────────
      # 1. Hosting repo checkout (source)
      # ──────────────────────────────────────────────────
      - name: 1. 📥 Checkout Hosting (Source)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/hosting_sarvar'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'hosting'

      # ──────────────────────────────────────────────────
      # 2. Development repo checkout (destination)
      # ──────────────────────────────────────────────────
      - name: 2. 📥 Checkout Development (Destination)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Development'

      # ──────────────────────────────────────────────────
      # 3. Source verify karo
      # ──────────────────────────────────────────────────
      - name: 3. 🔍 Verify Source Files
        run: |
          echo "════════════════════════════════════════"
          echo "📂 HOSTING SOURCE STRUCTURE:"
          echo "════════════════════════════════════════"
          find hosting/Video_Generator -type f -name "*.py" | head -30
          echo ""
          echo "📊 Total Python files:"
          find hosting/Video_Generator -name "*.py" | wc -l

      # ──────────────────────────────────────────────────
      # 4. Naya Factory folder structure banao
      # ──────────────────────────────────────────────────
      - name: 4. 📁 Create Factory Structure
        working-directory: ./Development
        run: |
          mkdir -p Factory/Management/1_Git_Tools
          mkdir -p Factory/Management/2_AI_Models
          mkdir -p Factory/Management/3_Media
          mkdir -p Factory/Management/4_Islamic
          mkdir -p Factory/Management/5_Audio_Text
          mkdir -p Factory/Management/assets/fonts
          mkdir -p Factory/Management/story
          mkdir -p Factory/Management/Uploader
          mkdir -p Factory/resacyle_Gdrive
          echo "✅ Folders created"

      # ──────────────────────────────────────────────────
      # 5. Copy karne ka master function
      # ──────────────────────────────────────────────────
      - name: 5. 📋 Copy All Files (Hosting → Factory)
        run: |
          SRC="hosting/Video_Generator"
          DST="Development/Factory/Management"

          # Helper: copy with rename
          copy_file() {
            local src="$1"
            local dst="$2"
            if [ -f "$src" ]; then
              cp -f "$src" "$dst" 2>/dev/null && echo "✅ $(basename $dst)" || echo "⚠️ Failed: $(basename $dst)"
            fi
          }

          echo "════════════════════════════════════════"
          echo "📋 COPYING FILES..."
          echo "════════════════════════════════════════"

          # ── 2_AI_Models (10 files) ────────────────────
          AI="$SRC/Fetching/AI/API_fallback"
          copy_file "$AI/ai_fallback.py"     "$DST/2_AI_Models/ai_fallback.py"
          copy_file "$AI/gemini_AI.py"       "$DST/2_AI_Models/gemini.py"
          copy_file "$AI/groq_AI.py"         "$DST/2_AI_Models/groq.py"
          copy_file "$AI/cohere_AI.py"       "$DST/2_AI_Models/cohere.py"
          copy_file "$AI/nvidia_AI.py"       "$DST/2_AI_Models/nvidia.py"
          copy_file "$AI/cloudflare_AI.py"   "$DST/2_AI_Models/cloudflare.py"
          copy_file "$AI/openrouter_AI.py"   "$DST/2_AI_Models/openrouter.py"
          copy_file "$AI/anges_AI.py"        "$DST/2_AI_Models/anges.py"
          copy_file "$AI/magic_AI.py"        "$DST/2_AI_Models/magic_AI.py"
          copy_file "$AI/tanvo_AI.py"        "$DST/2_AI_Models/tanvo_AI.py"

          # ── 3_Media (9 files) ─────────────────────────
          copy_file "$SRC/Fetching/Background/Music/API_fallback/freesound.py"       "$DST/3_Media/freesound.py"
          copy_file "$SRC/Fetching/Background/Music/URL_fallback/pixabay_music.py"   "$DST/3_Media/pixabay_music.py"
          copy_file "$SRC/Fetching/Background/Video/API_fallback/pexels.py"          "$DST/3_Media/pexels_video.py"
          copy_file "$SRC/Fetching/Background/Video/API_fallback/pixabay.py"         "$DST/3_Media/pixabay_video.py"
          copy_file "$SRC/Fetching/Background/Video/API_fallback/coverr.py"          "$DST/3_Media/coverr.py"
          copy_file "$SRC/Fetching/Background/Video/URL_fallback/gradient.py"        "$DST/3_Media/gradient.py"
          copy_file "$SRC/Fetching/Background/Photo/API_fallback/pexels.py"          "$DST/3_Media/pexels_photo.py"
          copy_file "$SRC/Fetching/Background/Photo/API_fallback/pixabay.py"         "$DST/3_Media/pixabay_photo.py"
          copy_file "$SRC/Fetching/Background/Photo/URL_fallback/pollinations_AI.py" "$DST/3_Media/pollinations_AI.py"

          # ── 4_Islamic (6 files) ───────────────────────
          copy_file "$SRC/Fetching/Islamic/Hadis/URL_fallback/fawaz.py"              "$DST/4_Islamic/fawaz.py"
          copy_file "$SRC/Fetching/Islamic/Hijri_date/URL_fallback/hijri_date.py"   "$DST/4_Islamic/hijri_date.py"
          copy_file "$SRC/Fetching/Islamic/Quran/URL_fallback/quran.py"             "$DST/4_Islamic/quran.py"
          copy_file "$SRC/Fetching/Islamic/Quran/URL_fallback/quran_audio.py"       "$DST/4_Islamic/quran_audio.py"
          copy_file "$SRC/Fetching/Islamic/Quran/URL_fallback/quran_tafsir.py"      "$DST/4_Islamic/quran_tafsir.py"
          copy_file "$SRC/Fetching/Islamic/Dua/API_fallback/ummah.py"               "$DST/4_Islamic/ummah.py"

          # ── 5_Audio_Text (6 files) ────────────────────
          copy_file "$SRC/Fetching/Translator/URL_fallback/mymemory.py"              "$DST/5_Audio_Text/mymemory.py"
          copy_file "$SRC/Fetching/audio_TTS/API_fallback/elevenlabs.py"             "$DST/5_Audio_Text/elevenlabs.py"
          copy_file "$SRC/Fetching/audio_TTS/URL_fallback/edge_tts.py"               "$DST/5_Audio_Text/edge_tts.py"
          copy_file "$SRC/Fetching/Intro_Outro_CTA/API_fallback/intro_AI.py"         "$DST/5_Audio_Text/intro_AI.py"
          copy_file "$SRC/Fetching/Intro_Outro_CTA/API_fallback/outro_AI.py"         "$DST/5_Audio_Text/outro_AI.py"
          copy_file "$SRC/Fetching/Intro_Outro_CTA/API_fallback/cta_AI.py"           "$DST/5_Audio_Text/cta_AI.py"

          # ── Uploader (1 file) ─────────────────────────
          copy_file "$SRC/Uploader/Drive/story_upload.py" "$DST/Uploader/story_upload.py"

          # ── Assets (fonts + logo) ─────────────────────
          if [ -d "$SRC/assets/fonts" ]; then
            cp -f "$SRC"/assets/fonts/*.ttf "$DST/assets/fonts/" 2>/dev/null || true
            echo "✅ Fonts copied"
          fi
          copy_file "$SRC/assets/logo.png" "$DST/assets/logo.png"

          # ── Story files (12 files) ────────────────────
          copy_file "$SRC/Story_Generator/main.py"           "$DST/story/main.py"
          copy_file "$SRC/Story_Generator/requirements.txt"  "$DST/story/requirements.txt"

          SR="$SRC/Story_Generator/Story_Render"
          copy_file "$SR/main_render.py"                    "$DST/story/render_main.py"
          copy_file "$SR/render_main.py"                    "$DST/story/render_main_old.py"
          copy_file "$SR/config/colors.py"                  "$DST/story/colors.py"
          copy_file "$SR/config/fonts/__init__.py"          "$DST/story/fonts.py"
          copy_file "$SR/config/sizes/__init__.py"          "$DST/story/sizes.py"
          copy_file "$SR/subtitle/ass_builder.py"           "$DST/story/ass_builder.py"
          copy_file "$SR/subtitle/timing/time_format.py"    "$DST/story/timing.py"
          copy_file "$SR/tools/duration_checker.py"         "$DST/story/duration.py"
          copy_file "$SR/tools/cta_generator.py"            "$DST/story/cta_maker.py"
          copy_file "$SR/video_engine/ffmpeg_render.py"     "$DST/story/ffmpeg_render.py"

          # ── __init__.py files ─────────────────────────
          touch "$DST/story/__init__.py"
          touch "$DST/1_Git_Tools/__init__.py"
          touch "$DST/2_AI_Models/__init__.py"
          touch "$DST/3_Media/__init__.py"
          touch "$DST/4_Islamic/__init__.py"
          touch "$DST/5_Audio_Text/__init__.py"

          echo ""
          echo "✅ Copy complete!"

      # ──────────────────────────────────────────────────
      # 6. Git Tools copy (System_room se)
      # ──────────────────────────────────────────────────
      - name: 6. 📋 Copy Git Tools (System_room)
        run: |
          SRC="hosting/System_room/Git_room"
          DST="Development/Factory/Management/1_Git_Tools"

          if [ -d "$SRC" ]; then
            for f in github.py history_cleaner.py txt_generator.py zip_generator.py; do
              if [ -f "$SRC/$f" ]; then
                cp -f "$SRC/$f" "$DST/$f" && echo "✅ $f"
              fi
            done
          else
            echo "⚠️ System_room/Git_room nahi mila — placeholders banayenge"
            for f in github.py history_cleaner.py txt_generator.py zip_generator.py; do
              [ -f "$DST/$f" ] || echo "# TODO: Copy from System_room/Git_room/$f" > "$DST/$f"
            done
          fi

      # ──────────────────────────────────────────────────
      # 7. resacyle_Gdrive placeholders
      # ──────────────────────────────────────────────────
      - name: 7. 📄 Create resacyle_Gdrive Placeholders
        working-directory: ./Development
        run: |
          for f in recycle_manager.py gdrive_uploader.py gdrive_downloader.py zip_helper.py version_checker.py; do
            [ -f "Factory/resacyle_Gdrive/$f" ] || echo "# TODO: Code yahan aayega" > "Factory/resacyle_Gdrive/$f"
          done
          echo "✅ Placeholders ready"

      # ──────────────────────────────────────────────────
      # 8. Final structure check
      # ──────────────────────────────────────────────────
      - name: 8. 📊 Show Final Structure
        working-directory: ./Development
        run: |
          echo "════════════════════════════════════════"
          echo "📁 FACTORY STRUCTURE:"
          echo "════════════════════════════════════════"
          find Factory -type f | sort

          echo ""
          echo "════════════════════════════════════════"
          echo "📊 COUNT:"
          echo "════════════════════════════════════════"
          echo "1_Git_Tools:   $(ls Factory/Management/1_Git_Tools/*.py 2>/dev/null | wc -l) files"
          echo "2_AI_Models:   $(ls Factory/Management/2_AI_Models/*.py 2>/dev/null | wc -l) files"
          echo "3_Media:       $(ls Factory/Management/3_Media/*.py 2>/dev/null | wc -l) files"
          echo "4_Islamic:     $(ls Factory/Management/4_Islamic/*.py 2>/dev/null | wc -l) files"
          echo "5_Audio_Text:  $(ls Factory/Management/5_Audio_Text/*.py 2>/dev/null | wc -l) files"
          echo "assets/fonts:  $(ls Factory/Management/assets/fonts/*.ttf 2>/dev/null | wc -l) files"
          echo "story:         $(ls Factory/Management/story/*.py 2>/dev/null | wc -l) files"
          echo "Uploader:      $(ls Factory/Management/Uploader/*.py 2>/dev/null | wc -l) files"
          echo "resacyle:      $(ls Factory/resacyle_Gdrive/*.py 2>/dev/null | wc -l) files"
          echo ""
          echo "TOTAL: $(find Factory -type f | wc -l) files"

      # ──────────────────────────────────────────────────
      # 9. Commit + Push
      # ──────────────────────────────────────────────────
      - name: 9. 💾 Commit + Push to Development
        working-directory: ./Development
        run: |
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"

          git add Factory/

          if git diff-index --quiet HEAD 2>/dev/null; then
            echo "⚠️ No changes — Factory already up-to-date"
          else
            git commit -m "🎉 Factory structure created — copied from hosting_sarvar"
            git push origin main
            echo "✅ Pushed to Development!"
          fi

      # ──────────────────────────────────────────────────
      # 10. Telegram report
      # ──────────────────────────────────────────────────
      - name: 10. 📤 Telegram Report
        if: always()
        run: |
          STATUS="${{ job.status }}"
          if [ "$STATUS" = "success" ]; then
            MSG="✅ <b>Factory Structure Ready!</b>

          📥 <b>Source:</b> hosting_sarvar/Video_Generator/
          📤 <b>Destination:</b> Development/Factory/

          📊 <b>Copied:</b>
          • 1_Git_Tools: 4 files
          • 2_AI_Models: 10 files
          • 3_Media: 9 files
          • 4_Islamic: 6 files
          • 5_Audio_Text: 6 files
          • assets/fonts: 10 fonts + logo
          • story: 12 files
          • Uploader: 1 file
          • resacyle_Gdrive: 5 placeholders

          📁 <b>Structure:</b>
          Development/Factory/Management/...

          ⚠️ <b>Next:</b> main.py imports fix karna hai"
          else
            MSG="❌ <b>Copy Failed</b>
          Status: $STATUS
          Check GitHub Actions logs."
          fi

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_REPORT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_API_REPORT_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" || true
