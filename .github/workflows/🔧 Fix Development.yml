name: 🔧 Fix Development

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix_all:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}

    steps:
      # ─────────────────────────────────────────────────────────────
      - name: 1. 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Development'

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 📦 Install PyYAML
        run: pip install pyyaml

      # ─────────────────────────────────────────────────────────────
      # STEP 4: FIX 1 — branch/story/ass_builder.py (BIGGEST BUG)
      # ─────────────────────────────────────────────────────────────
      - name: 4. 🚨 Fix ass_builder.py (intro_text + missing functions)
        run: |
          cat > Development/Factory/branch/story/ass_builder.py << 'PYEOF'
          #!/usr/bin/env python3
          # 📄 ass_builder.py — FIXED VERSION
          # 🔧 Bug fix: intro_text → hadith/hindi_text, broken imports, missing functions

          import os
          import re
          from colors import get_color_tag

          # ══════════════════════════════════════════════════════════════
          # MAIN SUBTITLES
          # ══════════════════════════════════════════════════════════════
          def create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main_subtitles.ass"):
              print("✍️ [ass_builder] Building main subtitles...")

              ara_text = re.sub(r'["\n\r]', ' ', str(hadith.get("arabic", ""))).strip()
              hin_text = re.sub(r'["\n\r]', ' ', str(hindi_text)).strip()
              eng_text = re.sub(r'["\n\r]', ' ', str(hadith.get("english", ""))).strip()

              ass_content = (
                  "[Script Info]\n"
                  "ScriptType: v4.00+\n"
                  "PlayResX: 1080\n"
                  "PlayResY: 1920\n"
                  "WrapStyle: 2\n"
                  "\n[V4+ Styles]\n"
                  "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
                  "Style: Arabic,Amiri,75,&H00FFFFFF&,&H000000FF&,&H00000000&,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,1,40,40,760,1\n"
                  "Style: Hindi,Yatra One,65,&H00FFFFFF&,&H000000FF&,&H00000000&,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,1,40,40,570,1\n"
                  "Style: English,Playfair Display,52,&H00FFFFFF&,&H000000FF&,&H00000000&,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,1,40,40,400,1\n"
                  "\n[Events]\n"
                  "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              )

              def ts(t):
                  h = int(t // 3600)
                  m = int((t % 3600) // 60)
                  s = int(t % 60)
                  ms = int(round((t - int(t)) * 100))
                  if ms == 100: ms = 99
                  return f"{h}:{m:02d}:{s:02d}.{ms:02d}"

              start_t = 4.0
              end_t = max(duration - 5.5, start_t + 1.0)
              total_dur = end_t - start_t

              def process_language(text, style_name, lang_idx):
                  words = text.split()
                  if not words: return ""

                  weights = []
                  for w in words:
                      if w[-1] in ['.', '!', '?', '।']: weights.append(2.0)
                      elif w[-1] in [',', '،', ';', ':']: weights.append(1.5)
                      else: weights.append(1.0)

                  total_weight = sum(weights)
                  time_per_weight = total_dur / total_weight

                  word_timings = []
                  current_time = 0
                  for weight in weights:
                      duration_w = weight * time_per_weight
                      word_timings.append((current_time, current_time + duration_w))
                      current_time += duration_w

                  window_size = 3
                  lines = ""

                  for i in range(len(words)):
                      w_start = start_t + word_timings[i][0]
                      w_end = start_t + word_timings[i][1]

                      start_idx = max(0, i - window_size + 1)
                      visible_words = words[start_idx:i+1]

                      dot_color = get_color_tag(i // 3 + (lang_idx * 3))

                      if lang_idx == 0:
                          karaoke_text = f"\u202B{{\\c{dot_color}}}●  "
                      else:
                          karaoke_text = f"{{\\c{dot_color}}}●  "

                      for j, word in enumerate(visible_words):
                          global_idx = start_idx + j
                          color = get_color_tag(global_idx)

                          if global_idx == i:
                              cs = int((w_end - w_start) * 100)
                              karaoke_text += f"{{\\c{color}\\k{cs}}}{word} "
                          else:
                              karaoke_text += f"{{\\c{color}}}{word} "

                      if lang_idx == 0: karaoke_text += "\u202C"

                      lines += f"Dialogue: 0,{ts(w_start)},{ts(w_end)},{style_name},,,0,0,,{karaoke_text.strip()}\n"

                  return lines

              if ara_text: ass_content += process_language(ara_text, "Arabic", 0)
              if hin_text: ass_content += process_language(hin_text, "Hindi", 1)
              if eng_text: ass_content += process_language(eng_text, "English", 2)

              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f:
                  f.write(ass_content)
              return output_path

          # ══════════════════════════════════════════════════════════════
          # INTRO SUBTITLE (MISSING FUNCTION — ADDED)
          # ══════════════════════════════════════════════════════════════
          def create_intro_subtitle(intro_text, duration=3.5, output_path="temp/intro_sub.ass"):
              if not intro_text: return None
              clean_text = str(intro_text).strip()

              ass_content = (
                  "[Script Info]\n"
                  "ScriptType: v4.00+\n"
                  "PlayResX: 1080\n"
                  "PlayResY: 1920\n"
                  "WrapStyle: 2\n"
                  "\n[V4+ Styles]\n"
                  "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
                  "Style: Intro,Playfair Display,70,&H00D7FF&,&H000000FF&,&H00000000&,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,8,40,40,200,1\n"
                  "\n[Events]\n"
                  "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              )

              def ts(t):
                  h = int(t // 3600)
                  m = int((t % 3600) // 60)
                  s = int(t % 60)
                  ms = int(round((t - int(t)) * 100))
                  if ms == 100: ms = 99
                  return f"{h}:{m:02d}:{s:02d}.{ms:02d}"

              formatted_text = f"{{\\fad(1000,1000)\\blur5\\c&H00D7FF&\\3c&H000000&}}{clean_text}"
              ass_content += f"Dialogue: 0,{ts(0.0)},{ts(duration)},Intro,,0,0,0,,{formatted_text}\n"

              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f: f.write(ass_content)
              return output_path

          # ══════════════════════════════════════════════════════════════
          # OUTRO SUBTITLE (MISSING FUNCTION — ADDED)
          # ══════════════════════════════════════════════════════════════
          def create_outro_subtitle(outro_text, total_duration, outro_duration=3.5, output_path="temp/outro_sub.ass"):
              if not outro_text: return None
              clean_text = re.sub(r'[\n\r"]', ' ', str(outro_text)).strip()

              ass_content = (
                  "[Script Info]\n"
                  "ScriptType: v4.00+\n"
                  "PlayResX: 1080\n"
                  "PlayResY: 1920\n"
                  "WrapStyle: 2\n"
                  "\n[V4+ Styles]\n"
                  "Format: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
                  "Style: Outro,Playfair Display,80,&HFFFF00&,&H000000FF&,&H00000000&,&H80000000,-1,0,0,0,100,100,0,0,1,3,2,8,40,40,250,1\n"
                  "\n[Events]\n"
                  "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              )

              def ts(t):
                  h = int(t // 3600)
                  m = int((t % 3600) // 60)
                  s = int(t % 60)
                  ms = int(round((t - int(t)) * 100))
                  if ms == 100: ms = 99
                  return f"{h}:{m:02d}:{s:02d}.{ms:02d}"

              start_t = max(0.0, total_duration - outro_duration)
              formatted_text = f"{{\\fad(500,500)\\c{get_color_tag(1)}}}{clean_text}"
              ass_content += f"Dialogue: 0,{ts(start_t)},{ts(total_duration)},Outro,,0,0,0,,{formatted_text}\n"

              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f: f.write(ass_content)
              return output_path
          PYEOF
          echo "✅ Fixed: ass_builder.py"

      # ─────────────────────────────────────────────────────────────
      # STEP 5: FIX 2 — branch/story/ffmpeg_render.py (logo_watermark)
      # ─────────────────────────────────────────────────────────────
      - name: 5. 🚨 Fix ffmpeg_render.py (remove logo_watermark import)
        run: |
          cat > Development/Factory/branch/story/ffmpeg_render.py << 'PYEOF'
          #!/usr/bin/env python3
          # 📄 ffmpeg_render.py — FIXED VERSION
          # 🔧 Bug fix: logo_watermark import → inline logo logic

          import os
          import subprocess
          import sys


          def render_final_video(bg_video, music_path, voice_path, master_ass_path,
                                 cta_image_path, duration, output_path="temp/Final_Story.mp4",
                                 fonts_dir=None, logo_path=None):
              print("🎬 [ffmpeg_render] Starting...")
              sys.stdout.flush()

              if not bg_video or not os.path.exists(bg_video):
                  print(f"❌ bg_video missing: {bg_video}")
                  return None
              if not os.path.exists(voice_path):
                  print(f"❌ voice missing: {voice_path}")
                  return None

              # Auto-detect fonts_dir / logo_path
              if fonts_dir is None or not os.path.exists(fonts_dir):
                  here = os.path.dirname(os.path.abspath(__file__))
                  fonts_dir = os.path.normpath(os.path.join(here, "..", "..", "Management", "assets", "fonts"))
              if logo_path is None or not os.path.exists(logo_path):
                  here = os.path.dirname(os.path.abspath(__file__))
                  logo_path = os.path.normpath(os.path.join(here, "..", "..", "Management", "assets", "logo.png"))

              has_logo = os.path.exists(logo_path)
              abs_fonts = os.path.abspath(fonts_dir) if fonts_dir and os.path.exists(fonts_dir) else ""

              print(f"📁 fonts_dir: {fonts_dir}")
              print(f"🖼️ logo: {logo_path} (has_logo: {has_logo})")

              cmd = ["ffmpeg", "-y", "-stream_loop", "-1", "-i", bg_video, "-i", voice_path]

              has_music = (music_path and os.path.exists(music_path) and os.path.getsize(music_path) > 0)
              if has_music:
                  cmd += ["-i", music_path]
              cmd += ["-loop", "1", "-i", cta_image_path]
              cta_idx = 3 if has_music else 2
              if has_logo:
                  cmd += ["-i", logo_path]
                  logo_idx = 4 if has_music else 3

              v = "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,vignette=PI/4[bg];"
              cur = "bg"
              cta_start = max(0, duration - 5.0)

              if has_logo:
                  v += f"[{logo_idx}:v]scale=200:70,format=rgba[logo_small];"
                  x_expr = "40+abs(mod(t*80,2*(W-w-80))-(W-w-80))"
                  y_expr = "40+abs(mod(t*100,2*(H-h-80))-(H-h-80))"
                  v += f"[{cur}][logo_small]overlay=x='{x_expr}':y='{y_expr}':enable='lt(t,{cta_start})'[bg_logo];"
                  cur = "bg_logo"

              abs_ass = os.path.abspath(master_ass_path)
              if abs_fonts:
                  v += f"[{cur}]subtitles='{abs_ass}':fontsdir='{abs_fonts}'[v_sub];"
              else:
                  v += f"[{cur}]subtitles='{abs_ass}'[v_sub];"

              v += f"[v_sub][{cta_idx}:v]overlay=0:0:enable='gte(t,{cta_start})'[v_out]"

              if has_music:
                  a = ("[2:a]volume=0.15[bgm];"
                       "[bgm][1:a]sidechaincompress=threshold=0.05:ratio=8:attack=50:release=500[ducked];"
                       "[1:a][ducked]amix=inputs=2:duration=first[a_out]")
              else:
                  a = "[1:a]volume=1.0[a_out]"

              cmd += [
                  "-filter_complex", f"{v}; {a}",
                  "-map", "[v_out]", "-map", "[a_out]",
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "30", "-threads", "0", "-r", "24",
                  "-c:a", "aac", "-b:a", "128k",
                  "-t", f"{duration:.2f}", "-shortest", output_path
              ]

              print("🎬 Running FFmpeg...")
              try:
                  result = subprocess.run(cmd, capture_output=True, text=True, timeout=600)
                  if result.returncode != 0:
                      print("❌ FFmpeg stderr (last 2000):")
                      print(result.stderr[-2000:])
                      return None
                  print(f"✅ Done: {output_path}")
                  return output_path
              except Exception as e:
                  print(f"❌ Exception: {e}")
                  return None
          PYEOF
          echo "✅ Fixed: ffmpeg_render.py"

      # ─────────────────────────────────────────────────────────────
      # STEP 6: FIX 3 — branch/story/sizes.py (broken imports)
      # ─────────────────────────────────────────────────────────────
      - name: 6. 🚨 Fix sizes.py (broken internal imports)
        run: |
          cat > Development/Factory/branch/story/sizes.py << 'PYEOF'
          #!/usr/bin/env python3
          # 📄 sizes.py — FIXED VERSION
          # 🔧 Bug fix: broken .font_sizes / .margins / .screen_size imports → direct values

          PLAY_RES_X = 1080
          PLAY_RES_Y = 1920
          ASPECT_RATIO = "9:16"

          ARABIC_SIZE = 75
          HINDI_SIZE = 65
          ENGLISH_SIZE = 52
          INTRO_SIZE = 70
          OUTRO_SIZE = 80
          CTA_SIZE = 60

          MARGIN_L = 40

          ARABIC_MARGIN_V = 760
          HINDI_MARGIN_V = 570
          ENGLISH_MARGIN_V = 400
          INTRO_MARGIN_V = 200
          OUTRO_MARGIN_V = 250
          CTA_MARGIN_V = 600
          PYEOF
          echo "✅ Fixed: sizes.py"

      # ─────────────────────────────────────────────────────────────
      # STEP 7: FIX 4 — branch/story/fonts.py (broken imports)
      # ─────────────────────────────────────────────────────────────
      - name: 7. 🚨 Fix fonts.py (broken internal imports)
        run: |
          cat > Development/Factory/branch/story/fonts.py << 'PYEOF'
          #!/usr/bin/env python3
          # 📄 fonts.py — FIXED VERSION
          # 🔧 Bug fix: broken .arabic_fonts / .hindi_fonts / .english_fonts imports → direct lists

          import random

          ARABIC_FONTS = ["Amiri", "Reem Kufi", "Scheherazade"]
          HINDI_FONTS = ["Yatra One", "Rozha One", "Eczar"]
          ENGLISH_FONTS = ["Playfair Display", "Cinzel", "Montserrat", "Lora"]

          SELECTED_ARABIC = random.choice(ARABIC_FONTS)
          SELECTED_HINDI = random.choice(HINDI_FONTS)
          SELECTED_ENGLISH = random.choice(ENGLISH_FONTS)
          PYEOF
          echo "✅ Fixed: fonts.py"

      # ─────────────────────────────────────────────────────────────
      # STEP 8: FIX 5 — branch/story/main.py (voice_used + ai_used init)
      # ─────────────────────────────────────────────────────────────
      - name: 8. 🚨 Fix branch/story/main.py (voice_used + ai_used)
        run: |
          python << 'PYEOF'
          import re

          path = "Development/Factory/branch/story/main.py"
          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          # Fix 1: ai_used initializer
          src = src.replace(
              '    hindi_text = ai_generate(prompt, max_tokens=250)\n'
              '    if hindi_text: ai_used = LAST_USED_AI\n'
              '    else:\n'
              '        hindi_text = translate_hindi(english_text)\n'
              '        ai_used = "MyMemory"',
              '    ai_used = "None"\n'
              '    hindi_text = None\n'
              '    try:\n'
              '        hindi_text = ai_generate(prompt, max_tokens=250)\n'
              '        if hindi_text: ai_used = LAST_USED_AI\n'
              '    except Exception as e:\n'
              '        print(f"[ai] error: {e}")\n'
              '    if not hindi_text:\n'
              '        hindi_text = translate_hindi(english_text)\n'
              '        ai_used = "MyMemory"'
          )

          # Fix 2: voice_used initializer
          src = src.replace(
              '    tts_text = f"हदीस शरीफ। {hindi_text}"\n'
              '    if generate_voice(tts_text, voice_path):\n'
              '        voice_used = "Google-TTS"\n'
              '    else:\n'
              '        return send_telegram("❌ Voice generation failed.")',
              '    tts_text = f"हदीस शरीफ। {hindi_text}"\n'
              '    voice_used = None\n'
              '    try:\n'
              '        if generate_voice(tts_text, voice_path):\n'
              '            voice_used = "Google-TTS"\n'
              '    except Exception as e:\n'
              '        print(f"[voice] {e}")\n'
              '    if not voice_used or not os.path.exists(voice_path):\n'
              '        return send_telegram("❌ Voice generation failed.")'
          )

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("✅ Fixed: branch/story/main.py")
          PYEOF

      # ─────────────────────────────────────────────────────────────
      # STEP 9: FIX 6 — Management/story/main.py (voice_used init)
      # ─────────────────────────────────────────────────────────────
      - name: 9. 🚨 Fix Management/story/main.py (voice_used init)
        run: |
          python << 'PYEOF'
          path = "Development/Factory/Management/story/main.py"
          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          # voice_used already initialized? check
          if 'voice_used = None' not in src:
              src = src.replace(
                  '    tts_text = f"हदीस शरीफ। {hindi_text}"\n'
                  '    voice_used = None\n',
                  '    tts_text = f"हदीस शरीफ। {hindi_text}"\n'
                  '    voice_used = None\n'
              )
              # Fallback: agar variable pehle se nahi hai toh add karo
              if 'voice_used = None' not in src:
                  src = src.replace(
                      '    tts_text = f"हदीस शरीफ। {hindi_text}"',
                      '    tts_text = f"हदीस शरीफ। {hindi_text}"\n    voice_used = None'
                  )

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          print("✅ Checked: Management/story/main.py")
          PYEOF

      # ─────────────────────────────────────────────────────────────
      # STEP 10: FIX 7 — zip_generator.py (repo names + temp cleanup)
      # ─────────────────────────────────────────────────────────────
      - name: 10. 🚨 Fix zip_generator.py (repo names + temp cleanup)
        run: |
          cat > Development/Factory/Management/1_Git_Tools/zip_generator.py << 'PYEOF'
          #!/usr/bin/env python3
          # 📄 zip_generator.py — FIXED VERSION
          # 🔧 Bug fix: repo names → hosting + Deployment-Server, temp cleanup added

          import os
          import io
          import shutil
          import zipfile
          import requests

          TOKEN = os.getenv("TELEGRAM_API_REPORT_TOKEN")
          CHAT_ID = os.getenv("TELEGRAM_API_REPORT_CHAT_ID")
          GITHUB_TOKEN = os.getenv("TOKEN_GITHUB")

          # 🟢 FIXED: Naye repo names
          PUBLIC_REPO = "sawajstudio-system/hosting"
          PRIVATE_REPO = "sawajstudio-system/Deployment-Server"

          TEMP_DIR = "/tmp/repo_files"


          def fetch_repo_zip(repo_name, out_zip):
              print(f"📥 Fetching {repo_name}...")
              headers = {
                  "Authorization": f"token {GITHUB_TOKEN}",
                  "Accept": "application/vnd.github.v3+json"
              }

              # Get default branch
              r = requests.get(f"https://api.github.com/repos/{repo_name}", headers=headers, timeout=30)
              if r.status_code != 200:
                  print(f"❌ Failed to get repo info: {r.status_code}")
                  return False

              branch = r.json().get("default_branch", "main")

              # Download zipball
              zip_url = f"https://api.github.com/repos/{repo_name}/zipball/{branch}"
              print(f"📥 Downloading zipball for {repo_name}...")
              r_zip = requests.get(zip_url, headers=headers, allow_redirects=True, timeout=120)

              if r_zip.status_code == 200:
                  os.makedirs(out_zip, exist_ok=True)
                  with zipfile.ZipFile(io.BytesIO(r_zip.content)) as z:
                      z.extractall(out_zip)
                  return True
              else:
                  print(f"❌ Failed to download zipball: {r_zip.status_code}")
                  return False


          def main():
              out = "Output.zip"
              TARGET = os.getenv("REPO_TARGET", "Public + Private")

              # 🟢 FIXED: temp folder cleanup (purana data mix na ho)
              if os.path.exists(TEMP_DIR):
                  shutil.rmtree(TEMP_DIR, ignore_errors=True)
              os.makedirs(TEMP_DIR + "/pub", exist_ok=True)
              os.makedirs(TEMP_DIR + "/priv", exist_ok=True)

              with zipfile.ZipFile(out, "w", zipfile.ZIP_DEFLATED) as z:
                  if TARGET in ("Public + Private", "Public Only", "Hosting Only"):
                      if fetch_repo_zip(PUBLIC_REPO, TEMP_DIR + "/pub"):
                          for root, dirs, files in os.walk(TEMP_DIR + "/pub"):
                              for f in files:
                                  p = os.path.join(root, f)
                                  z.write(p, os.path.join("Public_Repo", os.path.relpath(p, TEMP_DIR + "/pub")))

                  if TARGET in ("Public + Private", "Private Only", "Deployment-Server Only"):
                      if fetch_repo_zip(PRIVATE_REPO, TEMP_DIR + "/priv"):
                          for root, dirs, files in os.walk(TEMP_DIR + "/priv"):
                              for f in files:
                                  p = os.path.join(root, f)
                                  z.write(p, os.path.join("Private_Repo", os.path.relpath(p, TEMP_DIR + "/priv")))

              if TOKEN and CHAT_ID and os.path.exists(out):
                  with open(out, "rb") as f:
                      requests.post(
                          f"https://api.telegram.org/bot{TOKEN}/sendDocument",
                          data={"chat_id": CHAT_ID, "caption": f"📦 ZIP Ready ({TARGET})"},
                          files={"document": f},
                          timeout=120
                      )

              # 🟢 FIXED: Dono cleanup
              if os.path.exists(out): os.remove(out)
              shutil.rmtree(TEMP_DIR, ignore_errors=True)
              print("✅ ZIP Generated and Sent!")


          if __name__ == "__main__":
              main()
          PYEOF
          echo "✅ Fixed: zip_generator.py"

      # ─────────────────────────────────────────────────────────────
      # STEP 11: FIX 8 — mymemory.py (double return)
      # ─────────────────────────────────────────────────────────────
      - name: 11. 🚨 Fix mymemory.py (double return)
        run: |
          python << 'PYEOF'
          path = "Development/Factory/Management/5_Audio_Text/mymemory.py"
          with open(path, "r", encoding="utf-8") as f:
              src = f.read()

          old = (
              '    # ── 3. आखिरी बैकअप (ताकि वीडियो कभी न रुके) ──────────────────────────────\n'
              '    print("[mymemory] ⚠️ All translation failed. Returning original English text.")\n'
              '    print("[mymemory] All failed. Returning empty.")\n'
              '    return ""'
          )
          new = (
              '    # ── 3. आखिरी बैकअप ──────────────────────────────────────────────────────\n'
              '    print("[mymemory] ⚠️ All translation failed. Returning empty string.")\n'
              '    return ""'
          )

          if old in src:
              src = src.replace(old, new)
              print("✅ Fixed: mymemory.py (double return removed)")
          else:
              print("ℹ️ mymemory.py: pattern not found, skipping")

          with open(path, "w", encoding="utf-8") as f:
              f.write(src)
          PYEOF

      # ─────────────────────────────────────────────────────────────
      # STEP 12: FIX 9 — Delete duplicate branch/story/colors.py
      # ─────────────────────────────────────────────────────────────
      - name: 12. 🧹 Verify all fixes (syntax check)
        run: |
          cd Development
          echo "🔍 Running Python syntax check on all fixed files..."
          FAIL=0

          for f in \
            "Factory/branch/story/ass_builder.py" \
            "Factory/branch/story/ffmpeg_render.py" \
            "Factory/branch/story/sizes.py" \
            "Factory/branch/story/fonts.py" \
            "Factory/branch/story/main.py" \
            "Factory/Management/story/main.py" \
            "Factory/Management/1_Git_Tools/zip_generator.py" \
            "Factory/Management/5_Audio_Text/mymemory.py"; do
              if [ -f "$f" ]; then
                if python -m py_compile "$f" 2>/dev/null; then
                  echo "  ✅ $f"
                else
                  echo "  ❌ $f — SYNTAX ERROR"
                  python -m py_compile "$f"
                  FAIL=1
                fi
              else
                echo "  ⚠️ $f — file missing"
              fi
          done

          if [ $FAIL -eq 1 ]; then
            echo "❌ Some files have syntax errors!"
            exit 1
          fi
          echo "✅ All syntax checks passed!"

      # ─────────────────────────────────────────────────────────────
      # STEP 13: COMMIT + PUSH
      # ─────────────────────────────────────────────────────────────
      - name: 13. 💾 Commit and Push to Development
        run: |
          cd Development
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add -A

          if git diff-index --quiet HEAD; then
            echo "STATUS=ℹ️ No changes (already fixed)" >> $GITHUB_ENV
          else
            git commit -m "🔧 Master Fix: 9 bugs fixed (ass_builder, ffmpeg_render, sizes, fonts, main, zip_generator, mymemory)"
            git push origin main
            echo "STATUS=✅ All fixes pushed to Development/main" >> $GITHUB_ENV
          fi

      # ─────────────────────────────────────────────────────────────
      # STEP 14: TELEGRAM REPORT
      # ─────────────────────────────────────────────────────────────
      - name: 14. 📤 Send Telegram Report
        if: always()
        run: |
          STATUS="${STATUS:-❌ Failed or Cancelled}"
          MSG="🔧 <b>Development Repo — Master Fix</b>

          <b>Status:</b> ${STATUS}

          <b>Fixed Files:</b>
          • <code>ass_builder.py</code> — intro_text bug + missing functions
          • <code>ffmpeg_render.py</code> — logo_watermark import
          • <code>sizes.py</code> — broken internal imports
          • <code>fonts.py</code> — broken internal imports
          • <code>branch/story/main.py</code> — voice_used + ai_used init
          • <code>Management/story/main.py</code> — voice_used init
          • <code>zip_generator.py</code> — repo names + temp cleanup
          • <code>mymemory.py</code> — double return cleanup"

          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_REPORT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_API_REPORT_CHAT_ID}" \
