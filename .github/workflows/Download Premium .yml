name: 🔤 Download Premium Fonts (VIP Collection)

on:
  workflow_dispatch: # इसे मैन्युअली रन करें

permissions:
  contents: write

jobs:
  download_fonts:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Workshop Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 📁 Create Fonts Folder
        run: |
          mkdir -p Video_Generator/assets/fonts
          cd Video_Generator/assets/fonts

      - name: 3. 📥 Download Premium Fonts (Arabic, Hindi, English)
        run: |
          cd Video_Generator/assets/fonts
          
          echo "Downloading Arabic Fonts..."
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/amiri/Amiri-Regular.ttf" -O Amiri-Regular.ttf
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/reemkufi/ReemKufi%5Bwght%5D.ttf" -O ReemKufi.ttf
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/scheherazadenew/ScheherazadeNew-Regular.ttf" -O Scheherazade.ttf

          echo "Downloading Hindi Fonts..."
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/yatraone/YatraOne-Regular.ttf" -O YatraOne.ttf
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/rozhaone/RozhaOne-Regular.ttf" -O RozhaOne.ttf
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/eczar/Eczar%5Bwght%5D.ttf" -O Eczar.ttf

          echo "Downloading English Fonts..."
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/playfairdisplay/PlayfairDisplay%5Bwght%5D.ttf" -O PlayfairDisplay.ttf
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/cinzel/Cinzel%5Bwght%5D.ttf" -O Cinzel.ttf
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/montserrat/Montserrat%5Bwght%5D.ttf" -O Montserrat.ttf
          wget -q "https://raw.githubusercontent.com/google/fonts/main/ofl/lora/Lora%5Bwght%5D.ttf" -O Lora.ttf
          
          echo "✅ All 10 Premium Fonts Downloaded!"
          ls -la

      - name: 4. 💾 Commit & Push to Workshop
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add Video_Generator/assets/fonts/
          
          if git diff-index --quiet HEAD; then 
            echo "⚠️ Fonts are already up to date."
          else 
            git commit -m "🔤 Added 10 Premium VIP Fonts (Arabic, Hindi, English)"
            git push
            echo "🎉 Premium Fonts successfully added to Workshop!"
          fi
