name: 🧹 Smart Delete 

on:
  workflow_dispatch:
    inputs:
      target_name:
        description: '📄 File ya Folder ka naam likhein (Khali chhodein to sabhi list dikhenge)'
        required: false
        type: string

jobs:
  delete_task:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🚀 Run Python Script Inside YML
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          TARGET_NAME: ${{ github.event.inputs.target_name }}
        run: |
          # Python script ko yhin `.yml` ke andar se create karke run karenge
          cat << 'EOF' > delete_script.py
          import os
          import requests
          import sys

          token = os.getenv('TOKEN_GITHUB')
          target = (os.getenv('TARGET_NAME') or '').strip()
          repo = 'sawajstudio-system/Backend'
          base_dir = 'System_room/B_URL_room'

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json'
          }

          def get_contents(path):
              url = f'https://api.github.com/repos/{repo}/contents/{path}'
              res = requests.get(url, headers=headers)
              if res.status_code == 200:
                  return res.json()
              return None

          def delete_item(item_path, sha):
              url = f'https://api.github.com/repos/{repo}/contents/{item_path}'
              res = requests.delete(url, headers=headers, json={
                  'message': f'Delete {item_path} via Smart Delete YML',
                  'sha': sha
              })
              return res.status_code == 200

          print(f"🔍 '{repo}' ke path '{base_dir}' se Public & Private files/folders fetch kiye ja rahe hain...\n")
          items = get_contents(base_dir)

          if not isinstance(items, list):
              print("❌ Path access karne mein error aaya ya path galat hai.")
              sys.exit(1)

          # Agar user ne kuch nahi dala, toh sabhi ki list dikha do
          if not target:
              print("📋 Sabhi Public & Private Files aur Folders ki List:\n" + "-"*40)
              for item in items:
                  if item['type'] == 'dir':
                      print(f"  📁 Folder: {item['name']}")
                  else:
                      print(f"  📄 File:   {item['name']}")
              print("-"*40)
              print("💡 Inme se kisi ko delete karna ho, toh dobara run karein aur uska naam input box mein likhein.")
              sys.exit(0)

          # Agar user ne naam diya hai, toh dhoondho aur delete karo
          found = False
          for item in items:
              if item['name'].lower() == target.lower():
                  found = True
                  item_path = item['path']
                  
                  if item['type'] == 'dir':
                      print(f"📁 Folder mila: {target}. Andar ki files delete ki ja rahi hain...")
                      sub_items = get_contents(item_path)
                      if sub_items and isinstance(sub_items, list):
                          for sub in sub_items:
                              if sub['type'] == 'file':
                                  if delete_item(sub['path'], sub['sha']):
                                      print(f"  ✅ Deleted: {sub['name']}")
                          print(f"🎉 Folder '{target}' ki saari files delete ho gayi!")
                  else:
                      if delete_item(item_path, item['sha']):
                          print(f"✅ File '{target}' successfully delete ho gayi!")
                      else:
                          print(f"❌ File delete nahi ho payi.")
                  break

          if not found:
              print(f"❌ '{target}' naam ka koi file ya folder '{base_dir}' mein nahi mila!")

          EOF

          python delete_script.py
