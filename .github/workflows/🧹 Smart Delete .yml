name: 🧹 Smart Delete (Separate Boxes)

on:
  workflow_dispatch:
    inputs:
      file_to_delete:
        description: '📄 File ka naam likhein (Agar file delete nahi karni toh khali chhodein)'
        required: false
        type: string
      folder_to_delete:
        description: '📁 Folder ka naam likhein (Agar folder delete nahi karna toh khali chhodein)'
        required: false
        type: string

jobs:
  delete_task:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🗑️ Run Deleter Script
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          FILE_TARGET: ${{ github.event.inputs.file_to_delete }}
          FOLDER_TARGET: ${{ github.event.inputs.folder_to_delete }}
        run: |
          cat << 'EOF' > delete_script.py
          import os, requests, sys

          token = os.getenv('TOKEN_GITHUB')
          file_target = (os.getenv('FILE_TARGET') or '').strip()
          folder_target = (os.getenv('FOLDER_TARGET') or '').strip()
          repo = 'sawajstudio-system/Backend'
          base_dir = 'System_room/B_URL_room'

          headers = {
              'Authorization': f'token {token}',
              'Accept': 'application/vnd.github+json'
          }

          def get_contents(path):
              url = f'https://api.github.com/repos/{repo}/contents/{path}'
              res = requests.get(url, headers=headers)
              if res.status_code == 200:
                  return res.json()
              return None

          def delete_item(item_path, sha):
              url = f'https://api.github.com/repos/{repo}/contents/{item_path}'
              res = requests.delete(url, headers=headers, json={
                  'message': f'Delete {item_path} via Smart Delete',
                  'sha': sha
              })
              return res.status_code == 200

          # RULE 1: Agar dono boxes khali hain, toh kuch bhi delete nahi hona chahiye
          if not file_target and not folder_target:
              print('⚠️ Warning: Aapne dono boxes khali chhod diye hain. Isliye kuch bhi delete nahi kiya gaya!')
              print('🔍 System_room/B_URL_room ke andar ki Public & Private files aur folders ki list yeh rahi:\n')
              items = get_contents(base_dir)
              if isinstance(items, list):
                  for item in items:
                      if item['type'] == 'dir':
                          print(f'  📁 Folder: {item["name"]}')
                      else:
                          print(f'  📄 File:   {item["name"]}')
              sys.exit(0)

          # RULE 2: Agar File ka naam dala hai, toh file delete karein
          if file_target:
              print(f'🔍 File delete karne ki koshish ki ja rahi hai: {file_target}')
              full_path = file_target if file_target.startswith('System_room/') else f'{base_dir}/{file_target}'
              
              url = f'https://api.github.com/repos/{repo}/contents/{full_path}'
              r = requests.get(url, headers=headers)
              
              if r.status_code == 200:
                  data = r.json()
                  if isinstance(data, list):
                      print(f'❌ Error: {file_target} ek folder hai, file nahi. File box mein file ka naam likhein.')
                  else:
                      if delete_item(data['path'], data['sha']):
                          print(f'✅ File "{file_target}" successfully delete ho gayi!')
                      else:
                          print('❌ File delete nahi ho payi.')
              else:
                  print('❌ File nahi mili ya path galat hai.')

          # RULE 3: Agar Folder ka naam dala hai, toh folder delete karein
          if folder_target:
              print(f'🔍 Folder delete karne ki koshish ki ja rahi hai: {folder_target}')
              full_path = folder_target if folder_target.startswith('System_room/') else f'{base_dir}/{folder_target}'
              
              url = f'https://api.github.com/repos/{repo}/contents/{full_path}'
              r = requests.get(url, headers=headers)
              
              if r.status_code == 200:
                  data = r.json()
                  if isinstance(data, list):
                      print(f'📁 Folder mila: {folder_target}. Andar ki files delete ki ja rahi hain...')
                      for file in data:
                          if delete_item(file['path'], file['sha']):
                              print(f'  ✅ Deleted: {file["name"]}')
                      print(f'🎉 Folder "{folder_target}" ki saari files delete ho gayi!')
                  else:
                      print(f'❌ Error: {folder_target} ek file hai, folder nahi. Folder box mein folder ka naam likhein.')
              else:
                  print('❌ Folder nahi mila ya path galat hai.')

          EOF
          python delete_script.py
