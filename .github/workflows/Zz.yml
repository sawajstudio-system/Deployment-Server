# ══════════════════════════════════════════════════════════════════════════════
# 📁 FILE: .github/workflows/migrate.yml
# 🎯 ONE-TIME MIGRATION:
#    - test_yml/ folder banata hai
#    - .github/workflows/ se SAARI yml utha ke test_yml/ me daalta hai
#    - Commit + push kar deta hai
# ⚠️ Ek baar chalao, phir delete kar dena (ya run_all.yml se replace)
# ══════════════════════════════════════════════════════════════════════════════
name: 📦 Migrate All YAMLs → test_yml/🔴

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  migrate:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. 📥 Checkout repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      - name: 2. ⚙️ Configure git
        run: |
          git config user.name  "github-actions[bot]"
          git config user.email "github-actions[bot]@users.noreply.github.com"

      - name: 3. 📁 Create test_yml/ and move all YAMLs (except migrate.yml)
        run: |
          set -e

          mkdir -p test_yml

          echo "════════ BEFORE ════════"
          ls -1 .github/workflows/ || true

          moved=0
          skipped=0

          for f in .github/workflows/*.yml .github/workflows/*.yaml; do
            [ -e "$f" ] || continue

            name=$(basename "$f")

            # Khud ko chhod do (migration file)
            if [ "$name" = "migrate.yml" ]; then
              echo "⏭️  Skipping self: $name"
              skipped=$((skipped + 1))
              continue
            fi

            git mv "$f" "test_yml/$name"
            echo "📦 Moved: $name"
            moved=$((moved + 1))
          done

          echo ""
          echo "════════ AFTER (workflows/) ════════"
          ls -1 .github/workflows/ || true

          echo ""
          echo "════════ AFTER (test_yml/) ════════"
          ls -1 test_yml/ || true

          echo ""
          echo "✅ Moved: $moved file(s)"
          echo "⏭️  Skipped: $skipped file(s)"

      - name: 4. 💾 Commit & Push
        run: |
          if git diff --cached --quiet && git diff --quiet; then
            echo "ℹ️ Nothing to commit — maybe already migrated."
            exit 0
          fi

          git add -A
          git commit -m "📦 Migrate: move all legacy YAMLs from .github/workflows/ to test_yml/"
          git push

          echo "✅ Pushed to main."

      - name: 5. 📊 Summary
        if: always()
        run: |
          echo "════════════════════════════════════════"
          echo "🎯 Migration Complete"
          echo "════════════════════════════════════════"
          echo ".github/workflows/ :"
          ls -1 .github/workflows/ 2>/dev/null || echo "  (empty)"
          echo ""
          echo "test_yml/          :"
          ls -1 test_yml/ 2>/dev/null || echo "  (empty)"
          echo "════════════════════════════════════════"
