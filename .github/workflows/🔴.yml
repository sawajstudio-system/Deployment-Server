name: 🚀 Auto-Fetch System Room Folder Only

on:
  workflow_dispatch: # Manual run karne ke liye button

permissions:
  contents: write # Repo me file save karne ki permission

jobs:
  fetch-only:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Admin Repo Checkout (Jahan aap abhi hain)
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      # 2. Hosting Server Repo se sirf System_room folder download karna (Using PAT Token)
      - name: 2. 📦 Fetch System_room from hosting_sarvar
        run: |
          echo "⏳ Downloading System_room folder from hosting_sarvar..."
          
          # Clone using Personal Access Token for private repo access
          git clone --filter=blob:none --no-checkout https://x-access-token:${{ secrets.PAT_TOKEN }}@github.com/sawajstudio-system/hosting_sarvar.git temp_hosting
          
          cd temp_hosting
          git sparse-checkout init --cone
          git sparse-checkout set System_room
          git checkout
          cd ..
          
          echo "🚚 Moving folder to admin repo..."
          rm -rf System_room || true
          mv temp_hosting/System_room ./System_room
          rm -rf temp_hosting
          
          echo "✅ Folder successfully fetched with all files!"

      # 3. Admin Repo me folder ko save (Commit) karna
      - name: 3. 💾 Save Folder to Admin Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add System_room
          
          # Check if there are staged changes to commit
          if git diff --cached --quiet; then
            echo "ℹ️ Folder pehle se admin repo me hai, koi change nahi."
          else
            git commit -m "🤖 Auto-Added System_room folder (Files Only, No Run)"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Folder aur uski saari files admin repo me save ho gayi!"
          fi
