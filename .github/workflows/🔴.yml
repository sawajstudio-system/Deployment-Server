name: 🚀 Auto-Fetch API service Folder Only

on:
  workflow_dispatch: # Manual run karne ke liye button

permissions:
  contents: write # Repo me file save karne ki permission

jobs:
  fetch-api-service:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Admin Repo Checkout (Jahan aap abhi hain)
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      # 2. Hosting Server Repo se sirf API service folder download karna
      - name: 2. 📦 Fetch API service from hosting_sarvar
        uses: actions/checkout@v4
        with:
          repository: sawajstudio-system/hosting_sarvar
          token: ${{ secrets.PAT_TOKEN }}
          path: temp_hosting
          sparse-checkout: |
            API service

      # 3. Move folder to root directory & clean up
      - name: 3. 🚚 Move Folder to Admin Repo
        run: |
          echo "🚚 Moving API service folder to admin repo..."
          rm -rf "API service" || true
          mv "temp_hosting/API service" "./API service"
          rm -rf temp_hosting
          echo "✅ Folder successfully fetched with all files!"

      # 4. Admin Repo me folder ko save (Commit) karna
      - name: 4. 💾 Save Folder to Admin Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add "API service"
          
          # Check if there are staged changes to commit
          if git diff --cached --quiet; then
            echo "ℹ️ Folder pehle se admin repo me hai, koi change nahi."
          else
            git commit -m "🤖 Auto-Added API service folder (Files Only, No Run)"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Folder aur uski saari files admin repo me save ho gayi!"
          fi
