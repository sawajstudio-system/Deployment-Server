name: 🚀 Auto-Fetch API service & System_room

on:
  workflow_dispatch: # Manual run karne ke liye button

permissions:
  contents: write # Repo me file save karne ki permission

jobs:
  fetch-folders:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Admin Repo Checkout (Jahan aap abhi hain)
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      # 2. Hosting Server Repo se dono folders download karna
      - name: 2. 📦 Fetch Folders from hosting_sarvar
        uses: actions/checkout@v4
        with:
          repository: sawajstudio-system/hosting_sarvar
          token: ${{ secrets.TOKEN_GITHUB }} # 🟢 Yahan TOKEN_GITHUB use kiya gaya hai
          path: temp_hosting
          sparse-checkout: |
            API service
            System_room

      # 3. Move folders to root directory & clean up
      - name: 3. 🚚 Move Folders to Admin Repo
        run: |
          echo "🚚 Moving folders to admin repo..."
          rm -rf "API service" System_room || true
          mv "temp_hosting/API service" "./API service"
          mv "temp_hosting/System_room" "./System_room"
          rm -rf temp_hosting
          echo "✅ Folders successfully fetched!"

      # 4. Admin Repo me folders ko save (Commit) karna
      - name: 4. 💾 Save Folders to Admin Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add "API service" System_room
          
          # Check if there are staged changes to commit
          if git diff --cached --quiet; then
            echo "ℹ️ Folders pehle se admin repo me hain, koi change nahi."
          else
            git commit -m "🤖 Auto-Added API service & System_room folders"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Folders aur unki saari files admin repo me save ho gayi!"
          fi
