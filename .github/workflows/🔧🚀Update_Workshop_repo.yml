name: 🚀Update_Workshop_repo

on:
  workflow_dispatch:

jobs:
  update_workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Checkout Backend Repo (Source)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      - name: 2. 📥 Checkout Workshop Repo (Destination)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 3. 🔄 Sync Backend code to Workshop (with Delete)
        run: |
          echo "📦 Syncing Backend code to Workshop..."
          rsync -av --delete --exclude='.git' Backend/ Workshop/
          echo "✅ Sync complete!"

      - name: 4. 💾 Commit & Push to Workshop
        run: |
          cd Workshop
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          if git diff-index --quiet HEAD; then 
            echo "⚠️ Workshop is already up to date."
          else 
            git commit -m "🚀 System Upgrade: Synced from Backend"
            git push
            echo "🎉 Workshop successfully upgraded!"
          fi
