name: 👑 Ultimate God-Level Video Upgrade

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  ultimate_upgrade:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      # ═══════════════════════════════════════════════════════════════
      # 1. CREATE NEW FOLDERS & FILES
      # ═══════════════════════════════════════════════════════════════
      - name: 2. 🆕 Create New Files (Gradients & Effects)
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render
          
          # New File 1: Netflix VIP Colors
          cat > config/colors/gradient_colors.py << 'EOF'
          VIP_GRADIENTS = {
              "netflix_red": "&H0000FF&",
              "prime_blue": "&HFF9100&",
              "hollywood_gold": "&H00D7FF&",
              "deep_space": "&H2B1B17&",
              "luxury_purple": "&H8B00FF&",
          }
          def get_vip_color(name): return VIP_GRADIENTS.get(name, "&HFFFFFF&")
          EOF
          
          # New File 2: Hollywood Effects
          cat > tools/cinematic_effects.py << 'EOF'
          def get_letterbox_effect():
              return "drawbox=y=0:color=black@0.95:width=iw:height=110:t=fill,drawbox=y=ih-110:color=black@0.95:width=iw:height=110:t=fill"
          EOF
          echo "✅ New Files Created"

      # ═══════════════════════════════════════════════════════════════
      # 2. UPDATE VIDEO ENGINE (Camera, Light, Grain, Audio)
      # ═══════════════════════════════════════════════════════════════
      - name: 3. 🎥 Upgrade Video Engine (4K Cinematic)
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/video_engine
          
          # Video Filter (Camera Zoom + Film Grain + Letterbox)
          cat > video_filter.py << 'EOF'
          from .logo_processor import get_logo_filter
          from .logo_placer import get_moving_logo_expr, get_fixed_logo_pos
          from ..tools.cinematic_effects import get_letterbox_effect

          def build_video_filter(has_logo, li, ci, cs):
              f = (
                  "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "zoompan=z='min(zoom+0.0005,1.1)':d=1:s=1080x1920:fps=24,"
                  "colorbalance=rs=.15:gs=-.05:bs=.1:rm=.05:gm=.02:bm=-.05:rh=-.05:gh=.02:bh=.05,"
                  "eq=saturation=1.4:contrast=1.2:brightness=0.02,"
                  "noise=alls=8:allf=t+u,"
                  "vignette=PI/3.5,"
                  f"{get_letterbox_effect()}[bg];"
              )
              cur = "bg"
              if has_logo and li != -1:
                  lm = get_logo_filter(400, 160)
                  lf = get_logo_filter(600, 240)
                  f += f"[{li}:v]split[lm][lf];[lm]{lm}[lms];[lf]{lf}[lfs];"
                  x, y = get_moving_logo_expr()
                  f += f"[{cur}][lms]overlay=x='{x}':y='{y}':enable='lt(t,{cs})'[bg1];"
                  fx, fy = get_fixed_logo_pos()
                  f += f"[bg1][lfs]overlay=x='{fx}':y='{fy}':enable='gte(t,{cs})'[bg2];"
                  cur = "bg2"
              return f, cur
          EOF

          # Audio Mixer (Echo + Bass)
          cat > audio_mixer.py << 'EOF'
          def build_audio_filter(has_music):
              voice = "[1:a]bass=g=5:f=110:w=0.6,aecho=0.8:0.9:1000:0.3[v_cinematic]"
              if has_music:
                  return f"{voice};[2:a]volume=0.10[bgm];[bgm][v_cinematic]sidechaincompress=threshold=0.05:ratio=8:attack=50:release=500[db];[v_cinematic][db]amix=inputs=2:duration=first[a_out]"
              return f"{voice};[v_cinematic]volume=1.0[a_out]"
          EOF

          # Logo Watermark
          cat > logo_processor.py << 'EOF'
          def get_logo_filter(w=400, h=160):
              return f"scale={w}:{h},format=rgba,colorchannelmixer=rr=0.9:gg=0.7:bb=0.1:aa=0.8,split[lg][sh];[sh]colorchannelmixer=rr=0:gg=0:bb=0:aa=0.9,boxblur=12:2[sb];[sb][lg]overlay=6:6"
          def get_logo_filter_fixed(w=600, h=240):
              return f"scale={w}:{h},format=rgba,split[lg][sh];[sh]colorchannelmixer=rr=0:gg=0:bb=0:aa=0.9,boxblur=15:2[sb];[sb][lg]overlay=8:8"
          EOF
          echo "✅ Video & Audio Engine Upgraded"

      # ═══════════════════════════════════════════════════════════════
      # 3. UPDATE SUBTITLES (Intro, Outro, Main, CTA)
      # ═══════════════════════════════════════════════════════════════
      - name: 4. ✨ Upgrade Subtitles & Text
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render
          
          # Intro
          cat > subtitle/builders/intro_sub_builder.py << 'EOF'
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts
          def create_intro_subtitle(intro_text, duration=4.0, output_path="temp/intro_sub.ass"):
              if not intro_text: return None
              clean_text = str(intro_text).upper()
              content = get_ass_header() + "\n[V4+ Styles]\n" + get_all_styles() + "\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              animated = f"{{\\an5\\pos(540,960)\\fad(2000,1000)\\t(0,3000,\\fscx105\\fscy105)\\fs100\\b1\\c&H00D7FF&\\3c&H000000&\\bord3\\shad6\\blur2}}{clean_text}"
              content += f"Dialogue: 0,{ts(0.0)},{ts(duration)},Intro,,0,0,0,,{animated}\n"
              sub = f"{{\\an5\\pos(540,1080)\\fad(2500,1000)\\fs45\\c&HAAAAAA&\\bord1\\fsp8}}P R E S E N T S"
              content += f"Dialogue: 0,{ts(1.5)},{ts(duration)},Intro,,0,0,0,,{sub}\n"
              return save_ass(content, output_path)
          EOF

          # Main
          cat > subtitle/builders/main_sub_builder.py << 'EOF'
          import re
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts, compute_word_timings
          from ...config.colors import get_color_tag
          def create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main_subtitles.ass"):
              ara = re.sub(r'[\n\r"]', ' ', str(hadith.get("arabic", ""))).strip()
              hin = re.sub(r'[\n\r"]', ' ', str(hindi_text)).strip()
              eng = re.sub(r'[\n\r"]', ' ', str(hadith.get("english", ""))).strip()
              content = get_ass_header() + "\n[V4+ Styles]\n" + get_all_styles() + "\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              st = 4.0; et = max(duration - 6.0, st + 1.0); total = et - st
              def process(text, style, lang):
                  words = text.split()
                  if not words: return ""
                  timings = compute_word_timings(words, total)
                  lines = ""
                  for i in range(len(words)):
                      ws, we = st + timings[i][0], st + timings[i][1]
                      vis = words[max(0, i-3):i+1]
                      dot_c = get_color_tag(i // 3 + lang * 3)
                      k = f"\u202B{{\\c{dot_c}}}●  " if lang == 0 else f"{{\\c{dot_c}}}●  "
                      for j, w in enumerate(vis):
                          gi = max(0, i-3) + j; c = get_color_tag(gi)
                          k += f"{{\\c{c}\\k{int((we-ws)*100)}\\b1}}{w} " if gi == i else f"{{\\c{c}\\b0}}{w} "
                      if lang == 0: k += "\u202C"
                      lines += f"Dialogue: 0,{ts(ws)},{ts(we)},{style},,,0,0,,{k.strip()}\n"
                  return lines
              if ara: content += process(ara, "Arabic", 0)
              if hin: content += process(hin, "Hindi", 1)
              if eng: content += process(eng, "English", 2)
              return save_ass(content, output_path)
          EOF
          echo "✅ Subtitles Upgraded"

      # ═══════════════════════════════════════════════════════════════
      # 4. UPDATE TOOLS (Premium CTA)
      # ═══════════════════════════════════════════════════════════════
      - name: 5. 💎 Upgrade CTA Buttons
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/tools
          cat > cta_text_placer.py << 'EOF'
          import os, random
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          def place_cta_text(base_png, output_path="temp/cta_image.png"):
              img = Image.open(base_png).convert("RGBA")
              draw = ImageDraw.Draw(img)
              try:
                  f_top = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 65)
                  f_btn = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 80)
                  f_bot = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 50)
              except IOError: f_top = f_btn = f_bot = ImageFont.load_default()
              colors = ["#FFD700", "#00FFFF", "#FF007F", "#39FF14", "#FFBF00", "#9D00FF", "#00FF7F", "#FF4500"]
              glow = Image.new("RGBA", img.size, (0,0,0,0)); gdraw = ImageDraw.Draw(glow)
              headers = ["💎 Join Our VIP Community 💎", "✨ Like • Share • Follow ✨", "🌟 Support Our Channel 🌟", "👑 Become a Premium Member 👑"]
              ht = random.choice(headers)
              gdraw.text((540, 1230), ht, font=f_top, fill=colors[0], anchor="mm", stroke_width=3, stroke_fill="#000")
              btns = [["👍 LIKE", "🔔 SUBSCRIBE", "💬 COMMENT", "📤 SHARE"], ["👑 FOLLOW", "🎁 SHARE", "❤️ LIKE", "🔔 SUBSCRIBE"], ["🔔 SUBSCRIBE", "👍 LIKE", "👑 FOLLOW", "💬 COMMENT"]]
              chosen = random.choice(btns); ys = [1330, 1440, 1550, 1660]
              for i, (text, y) in enumerate(zip(chosen, ys)):
                  gdraw.rounded_rectangle([295, y-3, 785, y+93], radius=18, outline=colors[i+1], width=10)
                  draw.rounded_rectangle([305, y, 775, y+90], radius=15, fill=(20, 20, 20, 200), outline=colors[i+1], width=6)
                  gdraw.text((540, y+45), text, font=f_btn, fill=colors[i+1], anchor="mm", stroke_width=3, stroke_fill="#000")
              glow = glow.filter(ImageFilter.GaussianBlur(12))
              img = Image.alpha_composite(img, glow); draw = ImageDraw.Draw(img)
              draw.text((540, 1230), ht, font=f_top, fill=colors[0], anchor="mm", stroke_width=3, stroke_fill="#000")
              for i, (text, y) in enumerate(zip(chosen, ys)):
                  draw.rounded_rectangle([305, y, 775, y+90], radius=15, fill=(20, 20, 20, 200), outline=colors[i+1], width=6)
                  draw.text((540, y+45), text, font=f_btn, fill=colors[i+1], anchor="mm", stroke_width=3, stroke_fill="#000")
              draw.text((540, 1820), "👑 SAWAJ STUDIO 👑", font=f_bot, fill="#FFD700", anchor="mm", stroke_width=3, stroke_fill="#000")
              os.makedirs(os.path.dirname(output_path), exist_ok=True); img.save(output_path, "PNG")
              return output_path
          def generate_cta_image(output_path="temp/cta_image.png"):
              from .cta_img_drawer import draw_cta_base
              return place_cta_text(draw_cta_base("temp/cta_base.png"), output_path)
          EOF
          echo "✅ Premium CTA Upgraded"

      # ═══════════════════════════════════════════════════════════════
      # 5. COMMIT & PUSH
      # ═══════════════════════════════════════════════════════════════
      - name: 6. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Video_Generator/
          git commit -m "👑 God-Level Upgrade: Full Cinematic, Audio, & VIP Subtitles" || echo "No changes"
          git push origin main || echo "Push failed"
