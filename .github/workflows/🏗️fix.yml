name: 🔧 Fix arabic_render.py

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 🔍 पहले देखो
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/languages
          echo "════════════════════════════════════════"
          echo "🔍 पुरानी फाइल:"
          echo "════════════════════════════════════════"
          cat arabic_render.py

      - name: 3. 🔧 fix करो
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/languages
          cat > arabic_render.py << 'EOF'
          # ══════════════════════════════════════════════════════════════════════════════
          # 📁 FILE: Story_Render/subtitle/languages/arabic_render.py
          # 🎯 PURPOSE: अरबी टेक्स्ट को RTL (Right-to-Left) फॉर्मेट में तैयार करना
          # ✅ FIX: f-string में backslash वाला error हटाया गया
          # ══════════════════════════════════════════════════════════════════════════════
          import re


          def build_arabic_text(text):
              """
              अरबी टेक्स्ट को साफ करके RTL मार्क के साथ लौटाता है।
              """
              if not text:
                  return ""

              # 1. साफ-सफाई (Extra spaces/newlines हटाना)
              clean_text = re.sub(r'\s+', ' ', str(text)).strip()

              # 2. RTL + PDF मार्क लगाना
              # ⚠️ f-string के बाहर \u202B और \u202C रखे हैं
              RTL_MARK = "\u202B"
              PDF_MARK = "\u202C"

              return RTL_MARK + clean_text + PDF_MARK
          EOF
          echo "✅ arabic_render.py fix"

      - name: 4. 🔍 Syntax जाँच
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/languages
          echo "════════════════════════════════════════"
          echo "🔍 Syntax check:"
          echo "════════════════════════════════════════"
          if python -c "import ast; ast.parse(open('arabic_render.py').read())" 2>/dev/null; then
            echo "✅ arabic_render.py का syntax ठीक है"
          else
            echo "❌ अभी भी error है"
            python -c "import ast; ast.parse(open('arabic_render.py').read())"
          fi

      - name: 5. 🔍 नया content
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/languages
          echo "════════════════════════════════════════"
          echo "🔍 नई फाइल:"
          echo "════════════════════════════════════════"
          cat arabic_render.py

      - name: 6. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add -A
          git commit -m "🔧 Fix arabic_render.py — f-string backslash error" || echo "No changes"
          git push origin main || echo "Push failed"
