name: 📱 Telegram Bot Test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🔍 Debug — Env Check
        run: |
          echo "TELEGRAM_BOT_TOKEN set: ${{ secrets.TELEGRAM_BOT_TOKEN != '' }}"
          echo "TOKEN_GITHUB set:       ${{ secrets.TOKEN_GITHUB != '' }}"

      - name: 4. 🪶 Fetch Telegram Test
        run: |
          echo "📥 Downloading telegram.py..."
          set +e
          curl -sSL -f \
            -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/A_API_room/03_integrations/telegram.py" \
            -o /tmp/telegram.py
          
          if [ -f /tmp/telegram.py ] && [ -s /tmp/telegram.py ]; then
            echo "✅ Downloaded: $(wc -c < /tmp/telegram.py) bytes"
          else
            echo "❌ Download FAILED"
            exit 1
          fi

      - name: 5. 🧪 Run Telegram Test
        continue-on-error: true
        run: python /tmp/telegram.py

      - name: 6. 💨 Vanished
        if: always()
        run: |
          rm -f /tmp/telegram.py
          echo "✅ Hawa mein hi ud gaya!"
