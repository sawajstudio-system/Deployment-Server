name: 🚀 Auto Generate Project Structure

on:
  workflow_dispatch:

jobs:
  generate_project:
    runs-on: ubuntu-latest
    
    steps:
      - name: 1. 📥 Checkout Repo
        uses: actions/checkout@v4
        
      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 3. 🏗️ Run Generator Script
        run: python build_project.py
        
      - name: 4. 💾 Commit and Push Changes
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          git commit -m "✨ Generated modular project structure" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} || echo "No changes"
