name: 🛡️Reverse System (Backend to Workshop)

on:
  workflow_dispatch:
    inputs:
      confirm_delete:
        description: '⚠️ WARNING: Workshop ka pura code delete hokar Backend ka code aayega. Kya aap sure hain?'
        type: choice
        default: 'No'
        options:
          - 'No'
          - 'Yes, Delete Workshop & Copy Backend'

permissions:
  contents: write

jobs:
  reverse_workshop_from_backend:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}

    steps:
      - name: 1. 📥 Checkout Workshop (जिसे पूरी तरह साफ करना है)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 📥 Checkout Backend (जिसका कोड वापस लाना है)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      - name: 3. 🚨 WIPE & REPLACE (Workshop को खाली करके Backend का कोड डालना)
        if: ${{ inputs.confirm_delete == 'Yes, Delete Workshop & Copy Backend' }}
        run: |
          echo "🚨 WARNING: Deleting all files inside Workshop/Video_Generator/..."
          
          # चरण 1: Workshop के Video_Generator फोल्डर को पूरी तरह खाली (Delete) कर दो
          rm -rf Workshop/Video_Generator/*
          
          echo "✅ Workshop/Video_Generator/ is now empty."
          echo "🚀 Copying fresh code from Backend..."

          # चरण 2: Backend के Video_Generator का सारा कोड Workshop में कॉपी करो
          # हमने --delete नहीं लगाया क्योंकि हमने पहले ही rm -rf से सब डिलीट कर दिया है
          rsync -av --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='temp/' Backend/Video_Generator/ Workshop/Video_Generator/
          
          echo "✅ Replacement Complete."

      - name: 4. 💾 Commit & Force Push to Workshop
        if: ${{ inputs.confirm_delete == 'Yes, Delete Workshop & Copy Backend' }}
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          
          git add Video_Generator/
          
          if git diff-index --quiet HEAD; then
            echo "⚠️ No changes to restore. Workshop is already identical to Backend."
            echo "REVERSE_STATUS=No Changes Needed" >> $GITHUB_ENV
          else
            # जब हम बहुत सारी फाइलें डिलीट करते हैं, तो एक बड़ा कमिट बनता है
            git commit -m "🛡️ Total Reverse: Workshop Video_Generator wiped and replaced with Backend code"
            git push origin main
            echo "REVERSE_STATUS=Success (Workshop Overwritten)" >> $GITHUB_ENV
          fi

      - name: 5. 📤 Send Telegram Report
        if: always()
        run: |
          if [ "${{ inputs.confirm_delete }}" = "No" ]; then
            MSG="🛡️ Reverse Cancelled. No changes made to Workshop."
          else
            STATUS="${REVERSE_STATUS:-Failed}"
            MSG="🛡️ REVERSE SYSTEM COMPLETED
            📁 Action: Deleted all files in Workshop/Video_Generator
            📥 Action: Copied all files from Backend
            📊 Status: $STATUS"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_REPORT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_API_REPORT_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true
