name: 🟢Fix-AI-Free-Models

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. 📥 Checkout Development
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 📝 Fix Gemini (new model)
        run: |
          cat > Factory/Management/2_AI_Models/gemini.py << 'EOF'
          import os, requests, random

          def generate(prompt, max_tokens=500):
              api_key = os.getenv("GEMINI_API_KEY")
              if not api_key: return None

              styles = ["emotional", "motivational", "calm", "storytelling", "philosophical"]
              style = random.choice(styles)
              enhanced = f"Write in a {style} tone. Make it unique.\n\n{prompt}"

              print(f"[gemini] 🧠 Generating ({style})...")
              # ✅ NAYA MODEL: gemini-3.5-flash-lite (free tier)
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-3.5-flash-lite:generateContent?key={api_key}"

              payload = {
                  "contents": [{"parts": [{"text": enhanced}]}],
                  "generationConfig": {"maxOutputTokens": max_tokens, "temperature": 0.9}
              }

              try:
                  r = requests.post(url, json=payload, timeout=30)
                  if r.status_code == 200:
                      return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
                  print(f"[gemini] ❌ HTTP {r.status_code}")
                  return None
              except Exception as e:
                  print(f"[gemini] ❌ {e}")
                  return None
          EOF
          echo "✅ gemini.py"

      - name: 3. 📝 Fix Groq (new model)
        run: |
          cat > Factory/Management/2_AI_Models/groq.py << 'EOF'
          import os, requests, random

          def generate(prompt, max_tokens=500):
              api_key = os.getenv("GROQ_API_KEY")
              if not api_key: return None

              styles = ["emotional", "motivational", "calm", "storytelling", "philosophical"]
              style = random.choice(styles)
              enhanced = f"Write in a {style} tone. Make it unique.\n\n{prompt}"

              print(f"[groq] 🧠 Generating ({style})...")
              url = "https://api.groq.com/openai/v1/chat/completions"

              headers = {"Authorization": f"Bearer {api_key}", "Content-Type": "application/json"}

              # ✅ NAYA MODEL: openai/gpt-oss-120b (free, 30 req/min)
              payload = {
                  "model": "openai/gpt-oss-120b",
                  "messages": [{"role": "user", "content": enhanced}],
                  "max_tokens": max_tokens,
                  "temperature": 0.9
              }

              try:
                  r = requests.post(url, headers=headers, json=payload, timeout=30)
                  if r.status_code == 200:
                      return r.json()["choices"][0]["message"]["content"].strip()
                  print(f"[groq] ❌ HTTP {r.status_code}")
                  return None
              except Exception as e:
                  print(f"[groq] ❌ {e}")
                  return None
          EOF
          echo "✅ groq.py"

      - name: 4. 📝 Remove OpenRouter (402 issue)
        run: |
          # OpenRouter ko chain se hatao
          if [ -f "Factory/Management/2_AI_Models/ai_fallback.py" ]; then
            sed -i '/import openrouter/d' Factory/Management/2_AI_Models/ai_fallback.py
            sed -i '/openrouter_AI/d' Factory/Management/2_AI_Models/ai_fallback.py
            sed -i '/OpenRouter/d' Factory/Management/2_AI_Models/ai_fallback.py
            echo "✅ OpenRouter removed from chain"
          fi

      - name: 5. 📝 Remove Anges (404)
        run: |
          if [ -f "Factory/Management/2_AI_Models/ai_fallback.py" ]; then
            sed -i '/import anges/d' Factory/Management/2_AI_Models/ai_fallback.py
            sed -i '/anges_AI/d' Factory/Management/2_AI_Models/ai_fallback.py
            sed -i '/Anges AI/d' Factory/Management/2_AI_Models/ai_fallback.py
            echo "✅ Anges removed from chain"
          fi

      - name: 6. 🔍 Verify Chain
        run: |
          echo "📄 ai_fallback.py chain:"
          grep -E "import |LAST_USED_AI =|FAILED_AIS" Factory/Management/2_AI_Models/ai_fallback.py || true
          echo ""
          echo "✅ Working models:"
          ls Factory/Management/2_AI_Models/*.py | xargs -n1 basename

      - name: 7. 💾 Commit + Push
        run: |
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Factory/Management/2_AI_Models/

          if git diff-index --quiet HEAD 2>/dev/null; then
            echo "⚠️ No changes"
          else
            git commit -m "🔧 AI models fixed — only free working models"
            git push origin main
            echo "✅ Pushed!"
          fi

      - name: 8. 📤 Telegram
        if: always()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_API_REPORT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}" \
            --data-urlencode "text=✅ <b>AI Models Fixed — Free Only</b>

          🔧 <b>Updated:</b>
          • Gemini → gemini-3.5-flash-lite
          • Groq → openai/gpt-oss-120b

          ❌ <b>Removed:</b>
          • OpenRouter (402 — credits needed)
          • Anges (404 — not working)

          ✅ <b>Working chain:</b>
          NVIDIA → Cohere → Cloudflare → Gemini → Groq" \
            -d "parse_mode=HTML" || true
