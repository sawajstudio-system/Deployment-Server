name: 🟢Fix-Voice-Final

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    steps:
      - name: 1. 📥 Checkout Development
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 📝 Fix requirements (Edge-TTS force)
        run: |
          cat > Factory/Management/story/requirements.txt << 'EOF'
          requests
          edge-tts==6.1.9
          google-api-python-client
          google-auth-httplib2
          google-auth-oauthlib
          Pillow
          mutagen
          EOF
          echo "✅ requirements.txt fixed"

      - name: 3. 📝 Fix edge_tts.py (3 voices fallback)
        run: |
          cat > Factory/Management/5_Audio_Text/edge_tts.py << 'EOF'
          import os, subprocess

          VOICES = ["hi-IN-MadhurNeural", "hi-IN-SwaraNeural", "en-US-GuyNeural"]

          def generate(text, output_path="temp/voice_edge.mp3"):
              print(f"[edge_tts] 🎙️ Generating for {len(text)} chars...")
              text = text[:900]
              tmp_txt = output_path + ".txt"

              try:
                  os.makedirs(os.path.dirname(output_path), exist_ok=True)
                  with open(tmp_txt, "w", encoding="utf-8") as f:
                      f.write(text)

                  for voice in VOICES:
                      cmd = f'edge-tts --file "{tmp_txt}" --write-media "{output_path}" --voice {voice} --rate=-20% --pitch=-2Hz --volume=+8%'
                      print(f"[edge_tts] Trying: {voice}")
                      result = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=180)

                      if result.stderr:
                          print(f"[edge_tts] stderr: {result.stderr[:200]}")

                      if result.returncode == 0 and os.path.exists(output_path) and os.path.getsize(output_path) > 1000:
                          print(f"[edge_tts] ✅ SUCCESS with {voice}")
                          return output_path
                      else:
                          print(f"[edge_tts] ❌ {voice} failed")

                  return None
              except Exception as e:
                  print(f"[edge_tts] ❌ Exception: {e}")
                  return None
              finally:
                  if os.path.exists(tmp_txt):
                      os.remove(tmp_txt)
          EOF
          echo "✅ edge_tts.py fixed"

      - name: 4. 💾 Commit + Push
        run: |
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Factory/Management/story/requirements.txt Factory/Management/5_Audio_Text/edge_tts.py
          git commit -m "🔧 Voice fix — Edge-TTS multi-voice + version lock" || echo "no change"
          git push origin main || echo "no push"
