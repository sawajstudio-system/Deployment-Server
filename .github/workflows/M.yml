name: 🗑️ Delete Old Files

on:
  workflow_dispatch:

jobs:
  cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Workshop Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 🗑️ Delete Old Files
        run: |
          cd Video_Generator/Story_Generator
          python - << 'EOF'
          import os

          FILES_TO_DELETE = [
              "Story_Render/config/fonts.py",
              "Story_Render/config/sizes.py",
              "Story_Render/config/colors.py",
              "Story_Render/subtitle/ass_builder.py",
              "Story_Render/subtitle/ass_header.py",
              "Story_Render/subtitle/ass_saver.py",
              "Story_Render/subtitle/ass_style.py",
              "Story_Render/subtitle/cta_builder.py",
              "Story_Render/subtitle/intro_builder.py",
              "Story_Render/subtitle/outro_builder.py",
              "Story_Render/subtitle/timing.py",
              "Story_Render/video_engine/ffmpeg_render.py",
              "Story_Render/video_engine/logo_watermark.py",
              "Story_Render/subtitle/languages/hindi.py",
              "Story_Render/subtitle/languages/arabic.py",
              "Story_Render/subtitle/languages/english.py",
              "Story_Render/tools/audio_helper.py",
              "Story_Render/tools/cta_generator.py",
          ]

          print("🗑️ Starting cleanup of old files...")
          for f in FILES_TO_DELETE:
              if os.path.exists(f):
                  os.remove(f)
                  print(f"✅ Deleted: {f}")
          print("🎉 Done!")
          EOF

      - name: 4. 💾 Commit and Push
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          git commit -m "🗑️ Deleted old duplicate files" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} || echo "No changes"
