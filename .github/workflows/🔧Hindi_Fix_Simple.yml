name: 🧹Clean_Dead_Files

on:
  workflow_dispatch:
    inputs:
      dry_run:
        description: 'Dry Run? (true = sirf check karo, delete mat karo)'
        type: boolean
        default: true

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      DRY_RUN: ${{ inputs.dry_run }}

    steps:
      - name: 1. 📥 Checkout Workshop Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 🔍 Verify & Delete Dead Files
        run: |
          cd Workshop
          python3 - << 'PYEOF'
          import os
          import sys

          DEAD_FILES = [
              "Video_Generator/Story_Generator/Story_Render/config/styles.py",
              "Video_Generator/Story_Generator/Story_Render/config/fonts/font_sizes.py",
              "Video_Generator/Story_Generator/Story_Render/config/fonts/margins.py",
              "Video_Generator/Story_Generator/Story_Render/video_engine/logo_placer.py",
              "Video_Generator/Story_Generator/Story_Render/video_engine/logo_processor.py",
          ]

          # Har dead file ka module name (import check ke liye)
          def get_module_name(path):
              base = os.path.basename(path).replace(".py", "")
              return base

          def get_import_patterns(path):
              """
              Possible import strings jo kisi bhi file mein ho sakti hain.
              Example: styles.py ke liye:
                - from .styles import
                - from . import styles
                - import styles
                - from config.styles import
              """
              base = os.path.basename(path).replace(".py", "")
              return [
                  f"import {base}",
                  f"from .{base} import",
                  f"from . import {base}",
                  f"from .. import {base}",
                  f"from ... import {base}",
                  f".{base} import",
                  f"{base} import",
              ]

          def is_file_used(dead_file_path):
              """
              Poore Workshop repo mein search karo ki koi file is dead file ko import karti hai ya nahi.
              """
              patterns = get_import_patterns(dead_file_path)
              dead_file_abs = os.path.abspath(dead_file_path)

              for root, dirs, files in os.walk("."):
                  # .git folder skip karo
                  if ".git" in root:
                      continue
                  for fname in files:
                      if not fname.endswith(".py"):
                          continue
                      fpath = os.path.join(root, fname)
                      if os.path.abspath(fpath) == dead_file_abs:
                          continue  # khud ko check mat karo

                      try:
                          with open(fpath, "r", encoding="utf-8", errors="ignore") as f:
                              content = f.read()
                      except Exception:
                          continue

                      for pattern in patterns:
                          if pattern in content:
                              return True, fpath, pattern
              return False, None, None

          def find_in_init(dead_file_path):
              """
              Check karo ki parent folder ke __init__.py mein yeh file import hoti hai ya nahi.
              """
              parent_dir = os.path.dirname(dead_file_path)
              init_path = os.path.join(parent_dir, "__init__.py")
              if not os.path.exists(init_path):
                  return False, None

              base = os.path.basename(dead_file_path).replace(".py", "")
              with open(init_path, "r", encoding="utf-8") as f:
                  content = f.read()

              patterns = [f"from .{base} import", f"import {base}"]
              for pattern in patterns:
                  if pattern in content:
                      return True, init_path
              return False, None

          print("═" * 60)
          print("🔍 DEAD FILE VERIFICATION")
          print("═" * 60)

          safe_to_delete = []
          blocked = []

          for dead in DEAD_FILES:
              if not os.path.exists(dead):
                  print(f"⚠️  NOT FOUND (already deleted?): {dead}")
                  continue

              # 1. Parent __init__.py check
              used_in_init, init_path = find_in_init(dead)
              if used_in_init:
                  print(f"🚫 BLOCKED (imported in __init__): {dead}")
                  print(f"    → Found in: {init_path}")
                  blocked.append((dead, f"imported in {init_path}"))
                  continue

              # 2. Poore repo mein search
              used, usage_path, pattern = is_file_used(dead)
              if used:
                  print(f"🚫 BLOCKED (used in {usage_path}): {dead}")
                  print(f"    → Pattern: '{pattern}'")
                  blocked.append((dead, f"used in {usage_path}"))
                  continue

              print(f"✅ SAFE TO DELETE: {dead}")
              safe_to_delete.append(dead)

          print("\n" + "═" * 60)
          print(f"SUMMARY: {len(safe_to_delete)} safe, {len(blocked)} blocked")
          print("═" * 60)

          # Telegram report
          import requests
          token = os.environ.get("TELEGRAM_API_REPORT_TOKEN")
          chat = os.environ.get("TELEGRAM_API_REPORT_CHAT_ID")
          dry_run = os.environ.get("DRY_RUN", "true").lower() == "true"

          def tg(msg):
              if not token or not chat: return
              try:
                  requests.post(f"https://api.telegram.org/bot{token}/sendMessage",
                                json={"chat_id": chat, "text": msg[:4000]}, timeout=10)
              except Exception: pass

          report = "🧹 <b>DEAD FILE CLEANUP</b>\n\n"
          report += f"✅ Safe: {len(safe_to_delete)}\n"
          report += f"🚫 Blocked: {len(blocked)}\n\n"

          if safe_to_delete:
              report += "<b>Safe to delete:</b>\n"
              for f in safe_to_delete:
                  report += f"• <code>{f.split('/')[-1]}</code>\n"

          if blocked:
              report += "\n<b>🚫 Blocked (imported):</b>\n"
              for f, reason in blocked:
                  report += f"• <code>{f.split('/')[-1]}</code> — {reason}\n"

          if dry_run:
              report += "\n\n⚠️ <b>DRY RUN</b> — kuch delete nahi hua."
          else:
              report += "\n\n🗑️ <b>Deleting now...</b>"

          tg(report)

          # 3. Delete only if NOT dry_run
          if dry_run:
              print("\n⚠️ DRY RUN — No files deleted.")
              sys.exit(0)

          deleted = 0
          for f in safe_to_delete:
              try:
                  os.remove(f)
                  print(f"🗑️ Deleted: {f}")
                  deleted += 1
              except Exception as e:
                  print(f"❌ Failed to delete {f}: {e}")

          print(f"\n✅ Deleted {deleted} files.")
          PYEOF

      - name: 4. 💾 Commit & Push (if not dry_run)
        if: ${{ inputs.dry_run == false }}
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "⚠️ No changes to commit."
          else
            git commit -m "🧹 Cleanup: Removed dead files (styles.py, duplicate fonts/margins, logo duplicates)"
            git push origin main
            echo "🎉 Cleanup pushed to Workshop main!"
          fi

      - name: 5. 📢 Final Telegram Report
        if: always()
        run: |
          if [ -z "$TELEGRAM_API_REPORT_TOKEN" ]; then exit 0; fi
          STATUS="${{ job.status }}"
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_REPORT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_API_REPORT_CHAT_ID}" \
            -d "text=🧹 Cleanup finished: ${STATUS}" \
            || true
