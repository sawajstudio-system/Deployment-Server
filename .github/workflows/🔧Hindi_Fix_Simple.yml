name: 🔧Hindi_Fix_Simple

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2b. Install Pillow
        run: pip install Pillow

      - name: 3. Patch ffmpeg_builder.py (Safely add fonts_dir)
        run: |
          cd Backend/Video_Generator/Story_Generator
          python3 - <<'PYEOF'
          p = "Story_Render/video_engine/ffmpeg_builder.py"
          src = open(p, encoding="utf-8").read()

          # Check if we already fixed it previously
          if 'os.path.dirname(__file__)' in src and 'assets", "fonts"' in src:
              print("ALREADY FIXED — skipping")
          else:
              # Safely inject fonts_dir right before the subtitles filter
              OLD = "subtitles='{abs_ass_path}'"
              NEW = "subtitles='{abs_ass_path}':fontsdir='{fonts_dir}'"
              
              if OLD in src:
                  src = src.replace(OLD, NEW, 1)
                  # Add the fonts_dir variable definition right before v_filters or subtitle usage
                  # We will add it right above the subtitle block
                  inject_var = 'fonts_dir = os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..", "..", "assets", "fonts"))\n'
                  src = src.replace("abs_ass_path = os.path.abspath(master_ass_path)", "abs_ass_path = os.path.abspath(master_ass_path)\n" + inject_var, 1)
                  
                  open(p, "w", encoding="utf-8").write(src)
                  print("✅ ffmpeg_builder.py safely patched")
              else:
                  print("⚠️ Could not find subtitle string. File might be heavily modified. No changes made.")
          PYEOF

      - name: 4. Fix font_sizes.py
        run: |
          cd Backend/Video_Generator/Story_Generator
          cat > Story_Render/config/sizes/font_sizes.py <<'EOF'
          ARABIC_SIZE  = 75
          HINDI_SIZE   = 65
          ENGLISH_SIZE = 52
          INTRO_SIZE   = 70
          OUTRO_SIZE   = 80
          CTA_SIZE     = 60
          EOF
          echo "✅ font_sizes.py"

      - name: 5. Fix margins.py
        run: |
          cd Backend/Video_Generator/Story_Generator
          cat > Story_Render/config/sizes/margins.py <<'EOF'
          MARGIN_L = 150

          ARABIC_MARGIN_V  = 760
          HINDI_MARGIN_V   = 570
          ENGLISH_MARGIN_V = 400

          INTRO_MARGIN_V = 200
          OUTRO_MARGIN_V = 250
          CTA_MARGIN_V   = 600
          EOF
          echo "✅ margins.py"

      - name: 6. Fix mymemory.py (return empty on fail)
        run: |
          cd Backend/Video_Generator
          python3 - <<'PYEOF'
          p = "Fetching/Translator/URL_fallback/mymemory.py"
          src = open(p, encoding="utf-8").read()

          if 'Returning empty' in src:
              print("ALREADY FIXED — skipping")
          else:
              idx = src.rfind("    return text")
              if idx == -1:
                  print("⚠️ fallback not found — file already different")
              else:
                  src = src[:idx] + '    print("[mymemory] All failed. Returning empty.")\n    return ""' + src[idx + len("    return text"):]
                  open(p, "w", encoding="utf-8").write(src)
                  print("✅ mymemory.py fixed")
          PYEOF

      - name: 7. Fix edge_tts.py (safer rate + timeout)
        run: |
          cd Backend/Video_Generator
          cat > Fetching/audio_TTS/URL_fallback/edge_tts.py <<'EOF'
          import os
          import subprocess


          def generate(text, output_path="temp/voice_edge.mp3"):
              print(f"[edge_tts] Generating voice for {len(text)} chars...")
              text = text[:900]
              tmp_txt = output_path + ".txt"

              try:
                  os.makedirs(os.path.dirname(output_path), exist_ok=True)
                  with open(tmp_txt, "w", encoding="utf-8") as f:
                      f.write(text)

                  cmd = (
                      f'edge-tts --file "{tmp_txt}" --write-media "{output_path}" '
                      f'--voice hi-IN-MadhurNeural --rate=-20% --pitch=-2Hz --volume=+8%'
                  )
                  result = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=180)

                  if result.returncode == 0 and os.path.exists(output_path) and os.path.getsize(output_path) > 1000:
                      print(f"[edge_tts] ✅ {output_path}")
                      return output_path
                  print(f"[edge_tts] ❌ rc={result.returncode}")
                  return None
              except Exception as e:
                  print(f"[edge_tts] ❌ {e}")
                  return None
              finally:
                  if os.path.exists(tmp_txt):
                      os.remove(tmp_txt)
          EOF
          echo "✅ edge_tts.py"

      - name: 8. Fix main.py (Devanagari check)
        run: |
          cd Backend/Video_Generator/Story_Generator
          python3 - <<'PYEOF'
          p = "main.py"
          src = open(p, encoding="utf-8").read()

          if 'Devanagari script check' in src:
              print("ALREADY FIXED — skipping")
          else:
              OLD = (
                  '    if not hindi_text:\n'
                  '        send_telegram("❌ Hindi translation failed completely.")\n'
                  '        return\n'
              )
              NEW = (
                  '    # Devanagari script check\n'
                  '    if not hindi_text or not any(\'\\u0900\' <= ch <= \'\\u097F\' for ch in hindi_text):\n'
                  '        send_telegram(f"❌ Hindi failed: {(hindi_text or \'\')[:60]!r}")\n'
                  '        return\n'
              )
              if OLD not in src:
                  print("⚠️ block not found — file already different, no change")
              else:
                  src = src.replace(OLD, NEW, 1)
                  open(p, "w", encoding="utf-8").write(src)
                  print("✅ main.py fixed")
          PYEOF

      - name: 9. Commit & Push to Backend
        run: |
          cd Backend
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "⚠️ No changes — already fixed"
          else
            git commit -m "🔧 Safely patch Hindi fix (fonts_dir, sizes, margins, TTS, Devanagari check)"
            git push origin main
            echo "🎉 Successfully pushed to Backend main!"
          fi
