name: 🔧Hindi_Fix_Simple

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    timeout-minutes: 12

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. Fix ffmpeg_builder.py (fonts_dir)
        run: |
          cd Video_Generator/Story_Generator
          python3 - <<'PYEOF'
          p = "Story_Render/video_engine/ffmpeg_builder.py"
          src = open(p, encoding="utf-8").read()

          OLD = 'fonts_dir = os.path.abspath("Video_Generator/assets/fonts")'
          NEW = ('fonts_dir = os.path.abspath(os.path.join(\n'
                 '        os.path.dirname(__file__), "..", "..", "..", "assets", "fonts"\n'
                 '    ))')

          if OLD not in src:
              print("ALREADY FIXED or line changed — skipping")
          else:
              src = src.replace(OLD, NEW, 1)
              open(p, "w", encoding="utf-8").write(src)
              print("✅ ffmpeg_builder.py fixed")
          PYEOF

      - name: 4. Fix font_sizes.py
        run: |
          cd Video_Generator/Story_Generator
          cat > Story_Render/config/sizes/font_sizes.py <<'EOF'
          ARABIC_SIZE  = 75
          HINDI_SIZE   = 65
          ENGLISH_SIZE = 52
          INTRO_SIZE   = 70
          OUTRO_SIZE   = 80
          CTA_SIZE     = 60
          EOF
          echo "✅ font_sizes.py"

      - name: 5. Fix margins.py
        run: |
          cd Video_Generator/Story_Generator
          cat > Story_Render/config/sizes/margins.py <<'EOF'
          MARGIN_L = 150

          ARABIC_MARGIN_V  = 760
          HINDI_MARGIN_V   = 570
          ENGLISH_MARGIN_V = 400

          INTRO_MARGIN_V = 200
          OUTRO_MARGIN_V = 250
          CTA_MARGIN_V   = 600
          EOF
          echo "✅ margins.py"

      - name: 6. Fix mymemory.py (return empty on fail)
        run: |
          cd Video_Generator
          python3 - <<'PYEOF'
          p = "Fetching/Translator/URL_fallback/mymemory.py"
          src = open(p, encoding="utf-8").read()

          if 'Returning empty string' in src:
              print("ALREADY FIXED — skipping")
          else:
              idx = src.rfind("    return text")
              if idx == -1:
                  print("⚠️ fallback not found — file already different")
              else:
                  src = src[:idx] + '    print("[mymemory] All failed. Returning empty.")\n    return ""' + src[idx + len("    return text"):]
                  open(p, "w", encoding="utf-8").write(src)
                  print("✅ mymemory.py fixed")
          PYEOF

      - name: 7. Fix edge_tts.py (safer rate + timeout)
        run: |
          cd Video_Generator
          cat > Fetching/audio_TTS/URL_fallback/edge_tts.py <<'EOF'
          import os
          import subprocess


          def generate(text, output_path="temp/voice_edge.mp3"):
              print(f"[edge_tts] Generating voice for {len(text)} chars...")
              text = text[:900]
              tmp_txt = output_path + ".txt"

              try:
                  os.makedirs(os.path.dirname(output_path), exist_ok=True)
                  with open(tmp_txt, "w", encoding="utf-8") as f:
                      f.write(text)

                  cmd = (
                      f'edge-tts --file "{tmp_txt}" --write-media "{output_path}" '
                      f'--voice hi-IN-MadhurNeural --rate=-20% --pitch=-2Hz --volume=+8%'
                  )
                  result = subprocess.run(cmd, shell=True, capture_output=True, text=True, timeout=180)

                  if result.returncode == 0 and os.path.exists(output_path) and os.path.getsize(output_path) > 1000:
                      print(f"[edge_tts] ✅ {output_path}")
                      return output_path
                  print(f"[edge_tts] ❌ rc={result.returncode}")
                  return None
              except Exception as e:
                  print(f"[edge_tts] ❌ {e}")
                  return None
              finally:
                  if os.path.exists(tmp_txt):
                      os.remove(tmp_txt)
          EOF
          echo "✅ edge_tts.py"

      - name: 8. Fix main.py (Devanagari check)
        run: |
          cd Video_Generator/Story_Generator
          python3 - <<'PYEOF'
          p = "main.py"
          src = open(p, encoding="utf-8").read()

          if 'Devanagari script' in src:
              print("ALREADY FIXED — skipping")
          else:
              OLD = (
                  '    if not hindi_text:\n'
                  '        send_telegram("❌ Hindi translation failed completely.")\n'
                  '        return\n'
              )
              NEW = (
                  '    # Devanagari script check\n'
                  '    if not hindi_text or not any(\'\\u0900\' <= ch <= \'\\u097F\' for ch in hindi_text):\n'
                  '        send_telegram(f"❌ Hindi failed: {(hindi_text or \'\')[:60]!r}")\n'
                  '        return\n'
              )
              if OLD not in src:
                  print("⚠️ block not found — file already different, no change")
              else:
                  src = src.replace(OLD, NEW, 1)
                  open(p, "w", encoding="utf-8").write(src)
                  print("✅ main.py fixed")
          PYEOF

      - name: 9. Verify (compile + import)
        run: |
          cd Video_Generator/Story_Generator
          find . -name "__pycache__" -type d -exec rm -rf {} + 2>/dev/null || true
          python -m compileall -q . ../Fetching/Translator ../Fetching/audio_TTS

          python3 - <<'PYEOF'
          import sys, os
          sys.path.insert(0, os.getcwd())
          from Story_Render import build_and_render_story
          from Story_Render.subtitle import create_main_subtitles
          from Story_Render.subtitle.languages import build_hindi_text
          from Story_Render.config import HINDI_SIZE, HINDI_MARGIN_V
          assert HINDI_SIZE == 65, f"HINDI_SIZE={HINDI_SIZE}"
          assert HINDI_MARGIN_V == 570, f"HINDI_MARGIN_V={HINDI_MARGIN_V}"
          h = build_hindi_text('टेस्ट "quote"\nline2')
          assert '"' not in h and '\n' not in h
          print(f"✅ All OK: HINDI_SIZE={HINDI_SIZE}, HINDI_MARGIN_V={HINDI_MARGIN_V}")
          PYEOF

      - name: 10. Commit & Push (main only)
        run: |
          cd ../..
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add -A
          if git diff-index --quiet HEAD; then
            echo "⚠️ No changes — already fixed"
          else
            git commit -m "🔧 Hindi fix: fonts_dir, sizes, margins, TTS, Devanagari check"
            git push origin main
            echo "🎉 Pushed to main"
          fi

      - name: 11. Telegram notify
        if: always()
        run: |
          if [ -z "$TELEGRAM_API_REPORT_TOKEN" ] || [ -z "$TELEGRAM_API_REPORT_CHAT_ID" ]; then exit 0; fi
          if [ "${{ job.status }}" = "success" ]; then
            MSG="✅ Hindi fix complete. Main branch updated. Kuch delete nahi hua."
          else
            MSG="❌ Hindi fix failed. Check Actions log."
          fi
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_REPORT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_API_REPORT_CHAT_ID}" -d "text=${MSG}" || true
