name: 🟢update_rivers

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Action (क्या करना है?)'
        type: choice
        default: 'Backend Update'
        options:
          - 'Backend Update'         # Workshop ➡️ Backend
          - 'Workshop Reverse'       # Backend ➡️ Workshop

permissions:
  contents: write

jobs:
  sync_process:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # STEP 1: CHECKOUT (दोनों रेपोज को लोड करना)
      # ─────────────────────────────────────────────────────────────
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 📥 Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      # ─────────────────────────────────────────────────────────────
      # STEP 3A: BACKEND UPDATE (Workshop ➡️ Backend)
      # ─────────────────────────────────────────────────────────────
      - name: 3A. 🚀 Update Backend (Workshop ➡️ Backend)
        if: ${{ inputs.action == 'Backend Update' }}
        run: |
          echo "🚀 Syncing Workshop code to Backend..."
          # Workshop का सारा सही कोड Backend में डालना और एक्स्ट्रा डिलीट करना
          rsync -av --delete --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='temp/' Workshop/Video_Generator/ Backend/Video_Generator/
          
          cd Backend
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          
          if git diff-index --quiet HEAD && [ -z "$(git ls-files --others --exclude-standard)" ]; then
            echo "STATUS=No Changes (Already in sync)" >> $GITHUB_ENV
          else
            git add Video_Generator/
            git commit -m "🚀 Production Update: Synced from Workshop"
            git push origin main
            echo "STATUS=Success! Backend Updated." >> $GITHUB_ENV
          fi

      # ─────────────────────────────────────────────────────────────
      # STEP 3B: WORKSHOP REVERSE (Backend ➡️ Workshop)
      # ─────────────────────────────────────────────────────────────
      - name: 3B. 🛡️ Reverse Workshop (Backend ➡️ Workshop)
        if: ${{ inputs.action == 'Workshop Reverse' }}
        run: |
          echo "🚨 Deleting all files inside Workshop/Video_Generator/..."
          # Workshop का सारा कोड पूरी तरह साफ (Wipe) करना
          rm -rf Workshop/Video_Generator/*
          
          echo "🚀 Copying fresh code from Backend..."
          # Backend से नया कोड वापस लाना
          rsync -av --exclude='.git' --exclude='__pycache__' --exclude='*.pyc' --exclude='temp/' Backend/Video_Generator/ Workshop/Video_Generator/
          
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          
          git add Video_Generator/
          
          if git diff-index --quiet HEAD; then
            echo "STATUS=No Changes (Workshop already identical to Backend)" >> $GITHUB_ENV
          else
            git commit -m "🛡️ Workshop Restored: Wiped & Replaced with Backend code"
            git push origin main
            echo "STATUS=Success! Workshop Restored from Backend." >> $GITHUB_ENV
          fi

      # ─────────────────────────────────────────────────────────────
      # STEP 4: TELEGRAM REPORT
      # ─────────────────────────────────────────────────────────────
      - name: 4. 📤 Send Telegram Report
        if: always()
        run: |
          ACTION="${{ inputs.action }}"
          STATUS="${STATUS:-Failed or Cancelled}"
          
          if [ "$ACTION" = "Backend Update" ]; then
            MSG="🚀 Backend Update Process Completed
            📁 Folder: Video_Generator
            📊 Status: ${STATUS}"
          else
            MSG="🛡️ Workshop Reverse Process Completed
            🗑️ Action: Workshop code deleted
            📥 Action: Backend code copied
            📊 Status: ${STATUS}"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_REPORT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_API_REPORT_CHAT_ID}" \
            --data-urlencode "text=${MSG}" || true
