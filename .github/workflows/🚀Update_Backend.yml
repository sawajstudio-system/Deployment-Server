name: 🚀Update_Backend

on:
  workflow_dispatch:        # जब भी मन करे, मैन्युअली रन करें

jobs:
  update_backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Checkout Workshop Repo (Source)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 📥 Checkout Backend Repo (Destination)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      - name: 3. 🔄 Sync ALL New Files & Folders to Backend
        run: |
          echo "📦 Syncing entire Workshop to Backend..."
          
          # 🟢 rsync का जादू: 
          # -a (archive): सारी फाइलें और फोल्डर कॉपी करेगा
          # --exclude='.git' : GitHub का इंटरनल फोल्डर कॉपी नहीं करेगा (वरना एरर आएगा)
          # Workshop/ (सोर्स) से Backend/ (डेस्टिनेशन) में सब कुछ सिंक कर देगा।
          
          rsync -av --exclude='.git' Workshop/ Backend/
          
          echo "✅ All new and updated files have been synced to Backend!"

      - name: 4. 💾 Commit & Push to Backend
        run: |
          cd Backend
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          
          if git diff-index --quiet HEAD; then 
            echo "⚠️ Backend is already up to date. No changes to push."
          else 
            git commit -m "🚀 System Upgrade: Synced new files/folders from Workshop"
            git push
            echo "🎉 Backend has been successfully upgraded!"
          fi
