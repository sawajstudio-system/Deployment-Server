name: 🚀Update_Backend

on:
  workflow_dispatch:

jobs:
  update_backend:
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Checkout Workshop Repo (Source)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 📥 Checkout Backend Repo (Destination)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      - name: 3. 🔄 Sync Updated Files to Backend
        run: |
          echo "📦 Syncing Workshop code to Backend..."
          # rsync सिर्फ बदली हुई फाइलों को अपडेट करेगा और नई फाइलें जोड़ेगा
          rsync -av --exclude='.git' Workshop/ Backend/
          echo "✅ Sync complete!"

      - name: 4. 💾 Commit & Push to Backend
        run: |
          cd Backend
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          if git diff-index --quiet HEAD; then 
            echo "⚠️ Backend is already up to date."
          else 
            git commit -m "🚀 System Upgrade: Synced from Workshop"
            git push
            echo "🎉 Backend successfully upgraded!"
          fi
