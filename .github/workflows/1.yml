name: 📦 Auto Move to API service

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto_move:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Server Repo Checkout
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/hosting_sarvar'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'workspace/ServerRepo'

      - name: 2. 📥 Admin Repo Checkout
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/admin'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'workspace/AdminRepo'

      - name: 3. 🚚 Folder Move & Rename
        run: |
          # Dono repos ek hi workspace folder me hain
          cd workspace/AdminRepo
          
          # Pehle se koi folder ho toh delete karo
          rm -rf "System_room" "Service room" "API service"
          
          # Server se utha kar Admin me copy karo
          echo "🚚 Utha rahe hain ServerRepo/System_room ko..."
          cp -r ../ServerRepo/System_room "API service"
          
          echo "✅ Folder successfully copy ho gaya as 'API service'"

      - name: 4. 💾 Save (Commit & Push)
        run: |
          cd workspace/AdminRepo
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "ℹ️ Kuch naya nahi mila."
          else
            git commit -m "📦 Auto: System_room moved and renamed to API service"
            git push origin main
            echo "✅ Admin repo me save ho gaya!"
          fi
