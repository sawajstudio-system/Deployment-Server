name: 👍update🔗rivers

on:
  workflow_dispatch:
    inputs:
      action:
        description: 'Select Action (क्या करना है?)'
        type: choice
        default: 'Hosting Update'
        options:
          - 'Hosting Update'              # Development ➡️ hosting_sarvar
          - 'Diploment Reverse'           # hosting_sarvar ➡️ Development
          - 'Restore from Recycle'        # ♻️ recycle/vX ➡️ Main Repo
      version:
        description: 'Version (जैसे v3) — खाली छोड़ने पर LATEST अपने आप restore होगा'
        type: string
        required: false
        default: ''

permissions:
  contents: write

jobs:
  sync_process:
    runs-on: ubuntu-latest
    timeout-minutes: 20

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_RECYCLE_ID: ${{ secrets.GDRIVE_F_RECYCLE_ID }}

    steps:
      # ─────────────────────────────────────────────────────────────
      # STEP 1: CHECKOUT (Dono Repos Download)
      # ─────────────────────────────────────────────────────────────
      - name: 1. 📥 Checkout Development
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Development'

      - name: 2. 📥 Checkout hosting_sarvar
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/hosting_sarvar'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'hosting_sarvar'

      # ─────────────────────────────────────────────────────────────
      # STEP 3A: HOSTING UPDATE (Auto-Sync Full Repo)
      # ─────────────────────────────────────────────────────────────
      - name: 3A. 🚀 Auto Update hosting_sarvar + Recycle
        if: ${{ inputs.action == 'Hosting Update' }}
        run: |
          mkdir -p hosting_sarvar/recycle
          
          # Version Number Nikalo
          LAST_NUM=$(ls -d hosting_sarvar/recycle/v* 2>/dev/null | sed 's#.*/v##' | grep -E '^[0-9]+$' | sort -n | tail -1)
          NEXT_NUM=$(( ${LAST_NUM:-0} + 1 ))
          VERSION="v${NEXT_NUM}"
          BACKUP_DIR="hosting_sarvar/recycle/$VERSION"
          
          # Purane Code ka Backup (Git aur Recycle ko chhod kar)
          mkdir -p "$BACKUP_DIR"
          rsync -a --exclude='.git' --exclude='recycle' --exclude='.github' hosting_sarvar/ "$BACKUP_DIR/"
          
          # GDrive ke liye Zip
          zip -r "${VERSION}_backup.zip" "$BACKUP_DIR" > /dev/null
          
          # Info file
          echo -e "Version: $VERSION\nDate: $(date)\nAction: Full Repo Sync" > "$BACKUP_DIR/info.txt"
          
          # Naya Code Copy karo (Purane files ko delete karke sync karega)
          rsync -a --delete --exclude='.git' --exclude='recycle' --exclude='.github' Development/ hosting_sarvar/
          
          cd hosting_sarvar
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "STATUS=No Changes" >> $GITHUB_ENV
          else
            git commit -m "🚀 Auto Update: Full Sync (Backup: ${VERSION})"
            git push origin main
            echo "STATUS=Success! Full Repo Synced. Backup: ${VERSION}" >> $GITHUB_ENV
          fi
          echo "BACKUP_VERSION=$VERSION" >> $GITHUB_ENV
          echo "ZIP_TO_UPLOAD=${VERSION}_backup.zip" >> $GITHUB_ENV

      - name: 3A.1 ☁️ Upload to GDrive
        if: ${{ inputs.action == 'Hosting Update' && env.ZIP_TO_UPLOAD != '' }}
        run: |
          pip install google-api-python-client google-auth-httplib2 google-auth-oauthlib > /dev/null
          python << 'PYEOF'
          import os
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          cid, csec, rtok, folder_id = os.getenv("GDRIVE_CLIENT_ID"), os.getenv("GDRIVE_CLIENT_SECRET"), os.getenv("GDRIVE_REFRESH_TOKEN"), os.getenv("GDRIVE_F_RECYCLE_ID")
          zip_file = os.getenv("ZIP_TO_UPLOAD")
          if not all([cid, csec, rtok, folder_id]) or not os.path.exists(zip_file): exit(0)
          creds = Credentials(None, refresh_token=rtok, client_id=cid, client_secret=csec, token_uri="https://oauth2.googleapis.com/token")
          service = build('drive', 'v3', credentials=creds)
          media = MediaFileUpload(zip_file, mimetype='application/zip', resumable=True)
          file = service.files().create(body={'name': os.path.basename(zip_file), 'parents': [folder_id]}, media_body=media, fields='webViewLink').execute()
          print(f"✅ Uploaded: {file.get('webViewLink')}")
          PYEOF

      # ─────────────────────────────────────────────────────────────
      # STEP 3B: DIPLOMENT REVERSE (Auto-Sync Full Repo)
      # ─────────────────────────────────────────────────────────────
      - name: 3B. 🛡️ Reverse to Development
        if: ${{ inputs.action == 'Diploment Reverse' }}
        run: |
          rsync -a --delete --exclude='.git' --exclude='recycle' --exclude='.github' hosting_sarvar/ Development/
          cd Development
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add .
          if git diff-index --quiet HEAD; then
            echo "STATUS=No Changes" >> $GITHUB_ENV
          else
            git commit -m "🛡️ Auto Reverse: Full Sync from hosting_sarvar"
            git push origin main
            echo "STATUS=Success! Development Restored from hosting_sarvar." >> $GITHUB_ENV
          fi

      # ─────────────────────────────────────────────────────────────
      # STEP 3C: RESTORE FROM RECYCLE (Auto-Sync Full Repo)
      # ─────────────────────────────────────────────────────────────
      - name: 3C. ♻️ Restore from Recycle
        if: ${{ inputs.action == 'Restore from Recycle' }}
        run: |
          INPUT_VERSION="${{ inputs.version }}"
          AVAILABLE=$(ls -d hosting_sarvar/recycle/v* 2>/dev/null | sed 's#.*/v##' | grep -E '^[0-9]+$' | sort -n)
          
          if [ -z "$AVAILABLE" ]; then echo "STATUS=❌ Failed: No versions" >> $GITHUB_ENV; exit 1; fi
          
          if [ -n "$INPUT_VERSION" ]; then
            VERSION="v${INPUT_VERSION#v}" # v hata kar add kar dega taaki format same rahe
            RESTORE_MODE="Manual"
          else
            VERSION="v$(echo "$AVAILABLE" | tail -1)"
            RESTORE_MODE="Auto (latest)"
          fi
          
          RESTORE_FROM="hosting_sarvar/recycle/${VERSION}"
          if [ ! -d "$RESTORE_FROM" ]; then echo "STATUS=❌ Failed: ${VERSION} missing" >> $GITHUB_ENV; exit 1; fi
          
          # Current code ko broken backup me dalo
          TIMESTAMP=$(date +"%Y-%m-%d_%H-%M-%S")
          mkdir -p "hosting_sarvar/recycle/broken_${TIMESTAMP}"
          rsync -a --exclude='.git' --exclude='recycle' hosting_sarvar/ "hosting_sarvar/recycle/broken_${TIMESTAMP}/"
          
          # Restore karo
          rsync -a --delete --exclude='.git' --exclude='recycle' --exclude='.github' "$RESTORE_FROM/" hosting_sarvar/
          
          cd hosting_sarvar
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add .
          if git diff-index --quiet HEAD; then
            echo "STATUS=No Changes" >> $GITHUB_ENV
          else
            git commit -m "♻️ Restore: ${VERSION}"
            git push origin main
            echo "STATUS=✅ Success! Restored ${VERSION}" >> $GITHUB_ENV
          fi
          echo "RESTORED_VERSION=$VERSION" >> $GITHUB_ENV
          echo "RESTORE_MODE=$RESTORE_MODE" >> $GITHUB_ENV

      # ─────────────────────────────────────────────────────────────
      # STEP 4: TELEGRAM REPORT
      # ─────────────────────────────────────────────────────────────
      - name: 4. 📤 Send Telegram Report
        if: always()
        run: |
          ACTION="${{ inputs.action }}"
          STATUS="${STATUS:-Failed or Cancelled}"
          
          if [ "$ACTION" = "Hosting Update" ]; then
            MSG="🚀 <b>Auto Update Completed</b>
            📥 <b>From:</b> Development
            📤 <b>To:</b> hosting_sarvar
            📁 <b>Folder:</b> Full Repo
            ♻️ <b>Backup:</b> recycle/${BACKUP_VERSION:-?}
            📊 <b>Status:</b> ${STATUS}"
          elif [ "$ACTION" = "Diploment Reverse" ]; then
            MSG="🛡️ <b>Auto Reverse Completed</b>
            📥 <b>From:</b> hosting_sarvar
            📤 <b>To:</b> Development
            📁 <b>Folder:</b> Full Repo
            📊 <b>Status:</b> ${STATUS}"
          elif [ "$ACTION" = "Restore from Recycle" ]; then
            MSG="♻️ <b>Auto Restore Completed</b>
            🎯 <b>Version:</b> ${RESTORED_VERSION:-?}
            📊 <b>Status:</b> ${STATUS}"
          else
            MSG="ℹ️ <b>Unknown Action</b>
            📊 <b>Status:</b> ${STATUS}"
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_API_REPORT_TOKEN}/sendMessage" \
            -d "chat_id=${TELEGRAM_API_REPORT_CHAT_ID}" \
            --data-urlencode "text=${MSG}" \
            -d "parse_mode=HTML" || true
