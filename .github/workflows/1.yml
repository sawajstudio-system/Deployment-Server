name: 🚀 Admin System Room Runner

on:
  workflow_dispatch: # Manual run ke liye
  push:
    branches:
      - main

jobs:
  run-system-room:
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      # 1. Repo Checkout
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      # 2. Python Setup
      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      # 3. System_room folder check
      - name: 3. 🔍 Verify System_room Folder
        run: |
          if [ ! -d "System_room" ]; then
            echo "❌ ERROR: System_room folder admin repo me nahi mila!"
            echo "Kripya pehle hosting_sarvar se System_room folder yahan copy karein."
            exit 1
          fi
          echo "✅ System_room folder mil gaya."

      # 4. Dependencies Install (Agar requirements.txt ho toh)
      - name: 4. 📦 Install Dependencies
        run: |
          python -m pip install --upgrade pip
          if [ -f "System_room/requirements.txt" ]; then
            pip install -r System_room/requirements.txt
          else
            echo "ℹ️ requirements.txt nahi mila, skip."
          fi

      # 5. Script Run with Secret Token
      - name: 5. 🚀 Run txt_generator.py
        env:
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }} 
          # Agar aapko aur bhi secrets chahiye (jaise TELEGRAM), toh yahan add karein
        run: |
          cd System_room
          echo "▶️ Starting txt_generator.py..."
          python txt_generator.py
