name: 📦 Auto Move to API service

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  auto_move:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Server Repo Checkout
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/hosting_sarvar'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'ServerRepo'

      - name: 2. 📥 Admin Repo Checkout
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/admin'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'AdminRepo'

      - name: 3. 🚚 Move Folder to Admin
        run: |
          # Server repo se folder utha kar Admin repo me daal rahe hain
          mv ServerRepo/System_room AdminRepo/
          
          # Ab Admin repo ke andar jaakar folder ka naam badal rahe hain
          cd AdminRepo
          mv System_room "API service"
          
          echo "✅ Folder move aur rename ho gaya!"

      - name: 4. 💾 Save (Commit & Push)
        run: |
          cd AdminRepo
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "ℹ️ Kuch naya nahi mila."
          else
            git commit -m "📦 Auto: System_room moved and renamed to API service"
            git push origin main
            echo "✅ Admin repo me save ho gaya!"
          fi
