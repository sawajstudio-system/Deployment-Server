name: 🚑 Recover API Service from History

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  recover-folder:
    runs-on: ubuntu-latest

    steps:
      # 1. Pura History Checkout karein
      - name: 1. 📥 Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      # 2. History mein API service folder dhundhein
      - name: 2. 🔍 Find and Restore API Service
        run: |
          echo "🔍 API service folder ki history check kar rahe hain..."
          
          # Pichle 100 commits mein dhundho jahan API service folder tha
          GOOD_COMMIT=$(git log --all --format="%H" -- "API service" | head -n 1)
          
          if [ -z "$GOOD_COMMIT" ]; then
            echo "❌ Direct history nahi mili, poore repo ki sabse badi commit dhundh rahe hain..."
            GOOD_COMMIT=$(git rev-list --all --max-count=50 --objects | grep -i "api service" | head -n 1 | awk '{print $1}')
          fi

          # Agar phir bhi na mile toh sabse purani commit uthao
          if [ -z "$GOOD_COMMIT" ]; then
            GOOD_COMMIT=$(git log --all --format="%H" | tail -n 1)
          fi
          
          echo "✅ Target Commit: $GOOD_COMMIT"
          echo "📂 Restoring files from this commit..."
          
          # Saari files wapas laao (Overwrite safe mode)
          git checkout $GOOD_COMMIT -- .
          
          # Check karo ki API service aa gaya ya nahi
          if [ -d "API service" ]; then
            echo "🎉 BINGO! 'API service' folder successfully recovered!"
          else
            echo "⚠️ Direct 'API service' nahi mila, par baaki files restore ho gayi hain."
          fi

      # 3. Wapas GitHub par push karein
      - name: 3. 🚀 Save and Force Push
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Naye files add karo
          git add . -f
          
          if git diff --cached --quiet; then
            echo "ℹ️ Files pehle se hi theek hain."
          else
            git commit -m "🚑 RECOVERY: Restored deleted files from history"
            git push origin HEAD:${{ github.ref_name }} --force
            echo "✅ Successfully pushed to Admin Repo!"
          fi
