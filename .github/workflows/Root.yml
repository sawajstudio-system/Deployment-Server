name: 🚀 Recover & Setup Folders

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  fetch-folders:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Admin Repo Checkout
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      # 2. Hosting Server Repo Download
      - name: 2. 📦 Fetch from hosting_sarvar
        uses: actions/checkout@v4
        with:
          repository: sawajstudio-system/hosting_sarvar
          token: ${{ secrets.TOKEN_GITHUB }}
          path: temp_hosting

      # 3. Copy Folders (No Delete)
      - name: 3. 🚚 Recover & Setup Folders
        run: |
          echo "📂 1. Copying fresh folders from hosting_sarvar..."
          
          # Forcefully copy folders
          if [ -d "temp_hosting/API service" ]; then
            cp -rf "temp_hosting/API service" "./API service"
            echo "✅ API service recovered to root."
          fi
          
          if [ -d "temp_hosting/Video_Generator" ]; then
            cp -rf "temp_hosting/Video_Generator" "./Video_Generator"
            echo "✅ Video_Generator recovered to root."
          fi
          
          echo "🚚 2. Extracting Git_room to root..."
          # Copy Git_room out of API service instead of moving
          if [ -d "API service/Git_room" ]; then
            cp -rf "API service/Git_room" "./Git_room"
            echo "✅ Git_room successfully copied to root!"
          fi
          
          rm -rf temp_hosting
          echo "✅ Recovery complete!"

      # 4. Commit and Push
      - name: 4. 💾 Save to Admin Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Sirf new/modified files add karo (deletes ignore karo)
          git add .
          
          if git diff --cached --quiet; then
            echo "ℹ️ Koi change nahi mila."
          else
            git commit -m "🔄 Recovered folders: API service, Video_Generator, Git_room"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully recovered to Admin Repo!"
          fi
