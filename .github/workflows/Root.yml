name: 🚑 Direct Target Restore

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  direct-restore:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🔍 Restore from Exact Safe Commit
        run: |
          echo "🎯 Targeting the safe commit: 0bbeb86"
          
          # Direct us safe commit se saari files nikaal lo
          git checkout 0bbeb86 -- .
          
          echo "✅ Files restored from 0bbeb86!"
          
          # Check karo ki folder aa gaya ya nahi
          ls -la | grep "API"

      - name: 3. 🚀 Force Push to Save
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Force add aur commit
          git add . -f
          
          if git diff --cached --quiet; then
            echo "ℹ️ No changes."
          else
            git commit -m "🚑 Restored files from safe commit 0bbeb86"
            git push origin HEAD:${{ github.ref_name }} --force
            echo "✅ Successfully pushed back to GitHub!"
          fi
