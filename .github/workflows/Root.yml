name: 🚚 Move Git Folder to Root

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  move-git-folder:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      - name: 2. 🚚 Move Git Folder from API service to Root
        run: |
          echo "🔍 Checking for Git folder inside API service..."
          
          # Check karo ki Git_room exist karta hai ya Git
          if [ -d "API service/Git_room" ]; then
            echo "🚚 Found Git_room. Moving to root as 'Git'..."
            mv "API service/Git_room" "./Git"
            echo "✅ Git folder moved to root."
            
          elif [ -d "API service/Git" ]; then
            echo "🚚 Found Git. Moving to root..."
            mv "API service/Git" "./Git"
            echo "✅ Git folder moved to root."
            
          else
            echo "⚠️ Git folder API service ke andar nahi mila."
          fi

      - name: 3. 💾 Save to Admin Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Saare changes add karo (Git automatically move ko detect kar lega)
          git add .
          
          if git diff --cached --quiet; then
            echo "ℹ️ Kuch change nahi hua. Git folder shayad pehle se root mein hai."
          else
            git commit -m "🚚 Moved Git folder from API service to root (Safe Move)"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully moved to root!"
          fi
