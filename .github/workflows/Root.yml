name: 🧹 Final Cleanup (Rename A_API)

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  final-cleanup:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      - name: 2. 🧹 Cleanup Names & Ensure Git is in Root
        run: |
          echo "🧹 1. Renaming 'A_API' to 'AAPI'..."
          # Agar API service ke andar A_API folder hai, toh uska naam AAPI kar do
          if [ -d "API service/A_API" ]; then
            mv "API service/A_API" "API service/AAPI"
            echo "✅ Renamed A_API to AAPI."
          fi

          # (Agar URL folder bhi galat hai toh usko URL hi rakhne do, jo screenshot me sahi hai)
          
          echo "🚚 2. Double-checking Git folder..."
          # Agar Git folder galti se wapas API service ke andar chala gaya ho, toh usko root me le aao
          if [ -d "API service/Git_room" ]; then
            mv "API service/Git_room" "./Git"
            echo "✅ Git_room moved to root as Git."
          elif [ -d "API service/Git" ]; then
            mv "API service/Git" "./Git"
            echo "✅ Git moved to root."
          fi
          
          echo "✅ Cleanup done!"

      - name: 3. 💾 Save Changes
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Saare changes add karo
          git add -A
          
          if git diff --cached --quiet; then
            echo "ℹ️ Kuch change nahi mila."
          else
            git commit -m "🧹 Cleaned up folder names (Removed extra underscore)"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully saved to GitHub!"
          fi
