name: 🚑 Final Exact Folder Restore

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  exact-restore:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🔍 Find Exact Commit & Restore API service
        run: |
          echo "🔍 Searching history for the exact 'API service' folder..."
          
          # Yeh command history ki gehraayi mein jaakar exact 'API service' folder wala commit dhundhegi
          GOOD_COMMIT=$(git log --all --format="%H" -- "API service" | head -n 1)
          
          if [ -z "$GOOD_COMMIT" ]; then
            echo "❌ Direct path nahi mila. History ke 50 commits mein dhundh rahe hain..."
            # Agar folder ka naam thoda alag tha, toh purane commits check karo
            GOOD_COMMIT=$(git log --all --format="%H" | head -n 50 | while read commit; do 
              if git ls-tree -r --name-only $commit | grep -qi "A_API_room"; then 
                echo $commit; break; 
              fi; 
            done)
          fi

          if [ -z "$GOOD_COMMIT" ]; then
             echo "⚠️ Purani history mein folder nahi mila. Sabse purana commit utha rahe hain."
             GOOD_COMMIT=$(git log --all --format="%H" | tail -n 1)
          fi
          
          echo "✅ Found exact commit: $GOOD_COMMIT"
          echo "📂 Restoring ALL files from this commit..."
          
          # Saari files wapas laao
          git checkout $GOOD_COMMIT -- .
          
          # Confirm karo ki file aa gayi hai
          if [ -d "API service" ]; then
            echo "🎉 SUCCESS: API service folder is back!"
          elif [ -d "A_API_room" ]; then
            echo "🎉 SUCCESS: A_API_room folder is back!"
          else
            echo "⚠️ Files toh aayi hain, par folder name alag ho sakta hai."
            ls -la
          fi

      - name: 3. 🚀 Force Push to Save
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          git add . -f
          
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "🚑 EXACT RESTORE: Brought back the actual API service folder"
            git push origin HEAD:${{ github.ref_name }} --force
            echo "✅ Successfully restored!"
          fi
