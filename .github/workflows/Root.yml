name: 🚑 Force Restore Folders

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  force-restore:
    runs-on: ubuntu-latest

    steps:
      # 1. Admin Repo Checkout
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4
        with:
          token: ${{ secrets.TOKEN_GITHUB }}
          fetch-depth: 0

      # 2. Hosting Repo se Files Lao
      - name: 2. 📦 Fetch from hosting_sarvar
        uses: actions/checkout@v4
        with:
          repository: sawajstudio-system/hosting_sarvar
          token: ${{ secrets.TOKEN_GITHUB }}
          path: temp_hosting

      # 3. Folders Copy karo aur Git_room bahar nikalo
      - name: 3. 🚚 Move Folders & Setup
        run: |
          echo "📂 Copying folders..."
          
          # API service folder ko lao (with quotes for space)
          if [ -d "temp_hosting/API service" ]; then
            cp -rf "temp_hosting/API service" "./API service"
            echo "✅ API service copied."
          fi
          
          # Video_Generator lao
          if [ -d "temp_hosting/Video_Generator" ]; then
            cp -rf "temp_hosting/Video_Generator" "./Video_Generator"
            echo "✅ Video_Generator copied."
          fi
          
          # Git_room ko bahar nikalo
          if [ -d "API service/Git_room" ]; then
            cp -rf "API service/Git_room" "./Git_room"
            echo "✅ Git_room moved to root."
          fi
          
          rm -rf temp_hosting
          echo "✅ Folders ready!"

      # 4. Commit aur Force Push
      - name: 4. 🚀 Force Push to Admin Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Sab kuch force add karo
          git add -A -f
          
          git commit -m "🚑 Force Restored: Brought API service & Git_room from hosting_sarvar" || echo "No changes"
          
          # 🟢 Force push taaki purani khaali history override ho jaye
          git push origin HEAD:${{ github.ref_name }} --force
          echo "✅ Successfully force-pushed to Admin Repo!"
