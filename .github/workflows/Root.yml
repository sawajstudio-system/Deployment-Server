name: 🚀 Fetch API service & Extract Git_room

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  fetch-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Admin Repo Checkout
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      # 2. Hosting Server Repo se download (Bina sparse-checkout ke, taaki pura structure mile)
      - name: 2. 📦 Fetch from hosting_sarvar
        uses: actions/checkout@v4
        with:
          repository: sawajstudio-system/hosting_sarvar
          token: ${{ secrets.TOKEN_GITHUB }}
          path: temp_hosting

      # 3. Smart Cleanup & Move
      - name: 3. 🚚 Clean Root & Move Folders
        run: |
          echo "🧹 Deleting wrong folders from Root..."
          rm -rf "A_API_room" "URL_room" "Git_room" "Video_Generator" "System_room" "API service" "API_service" || true
          
          echo "🔍 Searching for 'API service' folder..."
          
          # 🟢 SMART SEARCH: Exact naam na mile toh dhundh lega
          API_FOLDER=$(find temp_hosting -maxdepth 2 -type d -iname "*api*service*" | head -n 1)
          
          if [ -z "$API_FOLDER" ]; then
            echo "❌ ERROR: 'API service' folder nahi mila temp_hosting ke andar!"
            echo "Yahan kya kya hai:"
            ls -la temp_hosting/
            exit 1
          fi
          
          echo "✅ Found API folder at: $API_FOLDER"
          
          # Folder ko API service naam se root me move karo
          mv "$API_FOLDER" "./API service"
          
          echo "🚚 Extracting Git_room to root..."
          if [ -d "API service/Git_room" ]; then
            mv "API service/Git_room" "./Git_room"
            echo "✅ Git_room moved to root."
          else
            echo "⚠️ Git_room nahi mila API service ke andar."
          fi
          
          rm -rf temp_hosting
          echo "✅ Master Cleanup Done!"

      # 4. Commit and Push
      - name: 4. 💾 Save to Admin Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add -A
          
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "🧹 Master Cleanup: Root folders fixed smartly"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Admin Repo root is now perfectly clean!"
          fi
