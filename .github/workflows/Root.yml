name: 🚑 100% Full Repo Recovery

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  restore-everything:
    runs-on: ubuntu-latest

    steps:
      # 1. Pura History checkout karein
      - name: 1. 📥 Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      # 2. History se sabse purani files wapas laayein
      - name: 2. 🚑 Force Restore First Commit
        run: |
          echo "🔍 Finding the VERY FIRST commit of this repo..."
          
          # Sabse pehla commit dhundho (jahan saari files safe thi)
          FIRST_COMMIT=$(git log --all --format="%H" | tail -n 1)
          
          echo "✅ Found First Commit: $FIRST_COMMIT"
          echo "📂 Forcefully restoring ALL files from the first commit..."
          
          # Us commit se saari files wapas laao
          git checkout $FIRST_COMMIT -- .
          
          echo "✅ All files successfully restored to workspace!"

      # 3. Wapas GitHub par save karein
      - name: 3. 💾 Save Restored Files
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Sab kuch add karein
          git add .
          
          if git diff --cached --quiet; then
            echo "ℹ️ Files pehle se hi sahi hain."
          else
            git commit -m "🚑 FULL EMERGENCY RESTORE: Recovered all files from the very first commit"
            git push origin HEAD:${{ github.ref_name }} --force
            echo "✅ Successfully recovered ALL files to Admin Repo!"
          fi
