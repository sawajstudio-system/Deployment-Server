name: 🚀 Fetch API service & Extract Git_room

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  fetch-and-fix:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      # 1. Admin Repo Checkout
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      # 2. Hosting Server Repo se sirf API service folder download karna
      - name: 2. 📦 Fetch API service from hosting_sarvar
        uses: actions/checkout@v4
        with:
          repository: sawajstudio-system/hosting_sarvar
          token: ${{ secrets.TOKEN_GITHUB }}
          path: temp_hosting
          sparse-checkout: |
            API service

      # 3. Fix Structure & Extract Git_room
      - name: 3. 🚚 Fix Folders & Move Git_room
        run: |
          echo "🧹 Cleaning up wrong root folders..."
          # Pichli galti ke folders ko root se delete karo
          rm -rf A_API_room URL_room Git_room || true
          
          echo "📂 Creating fresh API service folder..."
          rm -rf "API service" || true
          mv "temp_hosting/API service" "./API service"
          
          echo "🚚 Extracting Git_room to root..."
          # Ab sirf Git_room ko API service ke andar se bahar nikalo
          if [ -d "API service/Git_room" ]; then
            mv "API service/Git_room" "./Git_room"
            echo "✅ Git_room moved to root."
          fi
          
          rm -rf temp_hosting
          echo "✅ Structure fixed successfully!"

      # 4. Commit and Push
      - name: 4. 💾 Save to Admin Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          
          if git diff --cached --quiet; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "🔧 Fix: Restored API service structure and extracted Git_room to root"
            git push origin HEAD:${{ git_ref_name || github.ref_name }}
            echo "✅ Changes pushed successfully!"
          fi
