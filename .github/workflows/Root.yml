name: 🚑 Emergency Restore Repo

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  restore-repo:
    runs-on: ubuntu-latest

    steps:
      # 1. Pura History checkout karein (Fetch Depth 0 matlab saari purani history)
      - name: 1. 📥 Checkout Full History
        uses: actions/checkout@v4
        with:
          fetch-depth: 0
          token: ${{ secrets.TOKEN_GITHUB }}

      # 2. History se purani files wapas laayein
      - name: 2. 🚑 Restore Deleted Files
        run: |
          echo "🔍 Finding the last commit where files existed..."
          
          # Pichle 10 commits mein se dhundho jahan API service ya System_room folder tha
          # (Aapke screenshot ke anusar files pichle kisi commit me thi)
          GOOD_COMMIT=$(git log --all --format="%H" -- "API service" "System_room" "Video_Generator" | head -n 1)
          
          if [ -z "$GOOD_COMMIT" ]; then
            echo "⚠️ Direct folder nahi mila, thoda aur peeche check kar rahe hain..."
            # Agar naam alag tha, toh sabse purana commit utha lo
            GOOD_COMMIT=$(git log --all --format="%H" | head -n 10 | tail -n 1)
          fi
          
          echo "✅ Found commit: $GOOD_COMMIT"
          echo "📂 Restoring all files from this commit..."
          
          # Us commit se saari files wapas laao (delete kiye bina)
          git checkout $GOOD_COMMIT -- .
          
          echo "✅ Files successfully restored from history!"

      # 3. Wapas GitHub par save karein
      - name: 3. 💾 Save Restored Files
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Changes add karein
          git add .
          
          if git diff --cached --quiet; then
            echo "ℹ️ Files pehle se hi sahi hain."
          else
            git commit -m "🚑 EMERGENCY RESTORE: Recovered all files from git history"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully recovered to Admin Repo!"
          fi
