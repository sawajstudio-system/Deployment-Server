name: ✏️ Safe Rename _room Folders

on:
  workflow_dispatch: 

permissions:
  contents: write 

jobs:
  rename-rooms:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      - name: 2. ✏️ Rename Folders (No Delete)
        run: |
          echo "🔍 Finding folders ending with '_room'..."
          
          # Folder dhundho aur rename karo
          find . -type d -name "*_room" -not -path "./.git/*" | while read folder; do
            # Purana naam se '_room' hata kar naya naam banao
            new_name=$(echo "$folder" | sed 's/_room//g')
            
            echo "🔄 Renaming: $folder  -->  $new_name"
            mv "$folder" "$new_name"
          done
          
          echo "✅ All folders renamed safely!"

      - name: 3. 💾 Save Changes to GitHub
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          
          # Changes add karo
          git add -A
          
          if git diff --cached --quiet; then
            echo "ℹ️ Koi '_room' folder nahi mila rename karne ke liye."
          else
            git commit -m "✏️ Renamed all *_room folders (Removed '_room' from name)"
            git push origin HEAD:${{ github.ref_name }}
            echo "✅ Successfully renamed!"
          fi
