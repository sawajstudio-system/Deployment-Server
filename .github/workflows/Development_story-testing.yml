name: 🎬 Connect-Story-Pipeline

on:
  workflow_dispatch:

concurrency:
  group: story-pipeline
  cancel-in-progress: false

jobs:
  run_video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ── 🟢 CORE & API KEYS ──
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      
      # ── ☁️ GOOGLE DRIVE ──
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      
      # ── 🧠 AI MODELS ──
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      
      # ── 🎬 MEDIA & AUDIO ──
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. 📥 Checkout Development Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 📦 Install FFmpeg & Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v

      - name: 4. 📥 Install Python Packages
        run: |
          python -m pip install --upgrade pip
          pip install -r Factory/branch/story/requirements.txt

      - name: 5. 🔍 Verify Structure
        run: |
          echo "📂 Story files:"
          ls -la Factory/branch/story/
          echo ""
          echo "📂 Assets:"
          ls Factory/Management/assets/

      # 🟢 STEP 6: Yahan hum Story ko connect kar rahe hain
      - name: 6. 🎬 Run Story Pipeline
        working-directory: Factory/branch/story
        env:
          PYTHONPATH: "${{ github.workspace }}/Factory/branch/story:${{ github.workspace }}/Factory/Management/2_AI_Models:${{ github.workspace }}/Factory/Management/3_Media:${{ github.workspace }}/Factory/Management/4_Islamic:${{ github.workspace }}/Factory/Management/5_Audio_Text:${{ github.workspace }}/Factory/Management/Uploader"
        run: |
          echo "🚀 Connecting Story Pipeline..."
          python -u main.py

      - name: 7. 📤 Check Output
        if: always()
        run: |
          VIDEO="Factory/branch/story/temp/Final_Story.mp4"
          if [ -f "$VIDEO" ]; then
            echo "✅ VIDEO BANA!"
            du -h "$VIDEO"
          else
            echo "❌ Video nahi bana"
            ls -la Factory/branch/story/temp/ 2>/dev/null || echo "temp nahi mila"
          fi

      - name: 8. 🧹 Cleanup
        if: always()
        run: rm -rf Factory/branch/story/temp 2>/dev/null || true
