name: 🎬 Development_story

on:
  workflow_dispatch:

concurrency:
  group: video-test-factory
  cancel-in-progress: false

jobs:
  video:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. 📥 Checkout Development
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      - name: 3. 📦 FFmpeg + Fonts
        run: |
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v

      - name: 4. 📥 Install Python packages
        run: |
          python -m pip install --upgrade pip
          pip install -r Factory/Management/story/requirements.txt

      - name: 5. 🔍 Verify structure
        run: |
          echo "📂 Factory/Management tree:"
          find Factory/Management -maxdepth 2 -type d | sort
          echo ""
          echo "📄 story files:"
          ls -la Factory/Management/story/
          echo ""
          echo "📂 assets:"
          ls Factory/Management/assets/ 2>/dev/null
          ls Factory/Management/assets/fonts/ 2>/dev/null

      - name: 6. 🎬 Run Video Pipeline
        working-directory: Factory/Management/story
        env:
          PYTHONPATH: >-
            ${{ github.workspace }}/Factory/Management/story:
            ${{ github.workspace }}/Factory/Management/1_Git_Tools:
            ${{ github.workspace }}/Factory/Management/2_AI_Models:
            ${{ github.workspace }}/Factory/Management/3_Media:
            ${{ github.workspace }}/Factory/Management/4_Islamic:
            ${{ github.workspace }}/Factory/Management/5_Audio_Text:
            ${{ github.workspace }}/Factory/Management/Uploader
        run: |
          echo "🐍 PYTHONPATH: $PYTHONPATH"
          echo "📂 Working dir: $(pwd)"
          echo ""
          echo "🚀 Running main.py..."
          python -u main.py

      - name: 7. 📤 Check Output
        if: always()
        run: |
          VIDEO="Factory/Management/story/temp/Final_Story.mp4"
          if [ -f "$VIDEO" ]; then
            echo "✅ VIDEO BANA!"
            du -h "$VIDEO"
            echo "VIDEO_READY=true" >> $GITHUB_ENV
          else
            echo "❌ Video nahi bana"
            echo "📂 temp contents:"
            ls -la Factory/Management/story/temp/ 2>/dev/null || echo "temp nahi mila"
          fi

      - name: 8. 📤 Upload Artifact
        if: env.VIDEO_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Factory-Video
          path: Factory/Management/story/temp/Final_Story.mp4
          retention-days: 3

      - name: 9. 🚨 Telegram Error
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_API_REPORT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}" \
            -d "text=❌ <b>Factory Video Failed</b>%0A<b>Check GitHub Logs</b>" \
            -d "parse_mode=HTML" || true

      - name: 10. 🧹 Cleanup
        if: always()
        run: rm -rf Factory/Management/story/temp 2>/dev/null || true
