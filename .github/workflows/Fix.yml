name: 🎨 Fix Fonts & Transparent Logo

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 🖼️ Remove Green Background from Logo
        run: |
          cd Workshop/Video_Generator/assets
          pip install Pillow numpy
          
          # लोगो का हरा बैकग्राउंड हटाने की स्क्रिप्ट
          python - << 'EOF'
          from PIL import Image
          import numpy as np
          import os

          if os.path.exists('logo.png'):
              img = Image.open('logo.png').convert('RGBA')
              data = np.array(img)
              r, g, b, a = data[:,:,0], data[:,:,1], data[:,:,2], data[:,:,3]

              # हरे रंग की पहचान करना
              mask = (g.astype(int) > r.astype(int) + 15) & (g.astype(int) > b.astype(int) + 15) & (g > 50)
              data[mask, 3] = 0 # हरे हिस्से को ट्रांसपेरेंट करना

              transparent_img = Image.fromarray(data)
              transparent_img.save('logo.png')
              print('✅ Logo transparent हो गया!')
          else:
              print('❌ Logo नहीं मिला')
          EOF

      - name: 3. 🔤 Download Color Emoji Font
        run: |
          cd Workshop/Video_Generator/assets/fonts
          # Noto Color Emoji फॉन्ट डाउनलोड करना
          wget -q https://github.com/googlefonts/noto-emoji/raw/main/fonts/NotoColorEmoji.ttf || echo "⚠️ Emoji font download failed, but continuing..."

      - name: 4. 🔧 Update Font Fallbacks in Config
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/config/fonts
          # अरबी फॉन्ट के लिए Noto Naskh Arabic जोड़ना
          cat > arabic_fonts.py << 'EOF'
          import random
          # अरबी फॉन्ट्स (Noto Naskh Arabic जोड़ा गया)
          ARABIC_FONTS = ["Noto Naskh Arabic", "Amiri", "Reem Kufi", "Scheherazade"]
          SELECTED_ARABIC = random.choice(ARABIC_FONTS)
          EOF
          echo "✅ अरबी फॉन्ट्स अपडेट हो गए"

      - name: 5. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Video_Generator/assets/ Video_Generator/Story_Generator/Story_Render/config/fonts/
          git commit -m "🎨 Fixed Logo background & Added Color Emoji/Arabic fonts" || echo "No changes"
          git push origin main || echo "Push failed"
