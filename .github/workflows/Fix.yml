name: 🟢Direct-Copy-Magic

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  magic_copy:
    runs-on: ubuntu-latest
    timeout-minutes: 15

    steps:
      - name: 1. 📥 Checkout Hosting (Sahi Code)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/hosting_sarvar'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'hosting'

      - name: 2. 📥 Checkout Development (Jahan Dalna Hai)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Development'

      - name: 3. 🔍 Hosting Ki Files Padho (Scan)
        run: |
          echo "Hosting Story Files:"
          ls -la hosting/Video_Generator/Story_Generator/Story_Render/
          echo "Hosting AI Files:"
          ls -la hosting/Video_Generator/Fetching/AI/API_fallback/

      - name: 4. 📋 Copy Story Files
        run: |
          SRC="hosting/Video_Generator/Story_Generator"
          DST="Development/Factory/branch/story"
          mkdir -p $DST

          # Main files copy
          cp -f "$SRC/main.py" "$DST/main.py" 2>/dev/null || true
          cp -f "$SRC/requirements.txt" "$DST/requirements.txt" 2>/dev/null || true

          # Story_Render files copy (naam badal kar)
          SR="$SRC/Story_Render"
          cp -f "$SR/main_render.py" "$DST/render_main.py" 2>/dev/null || true
          cp -f "$SR/config/colors.py" "$DST/colors.py" 2>/dev/null || true
          cp -f "$SR/subtitle/ass_builder.py" "$DST/ass_builder.py" 2>/dev/null || true
          cp -f "$SR/subtitle/timing/time_format.py" "$DST/timing.py" 2>/dev/null || true
          cp -f "$SR/tools/duration_checker.py" "$DST/duration.py" 2>/dev/null || true
          cp -f "$SR/tools/cta_generator.py" "$DST/cta_maker.py" 2>/dev/null || true
          cp -f "$SR/video_engine/ffmpeg_render.py" "$DST/ffmpeg_render.py" 2>/dev/null || true
          
          # fonts.py aur sizes.py banane ke liye
          cp -f "$SR/config/fonts/__init__.py" "$DST/fonts.py" 2>/dev/null || true
          cp -f "$SR/config/sizes/__init__.py" "$DST/sizes.py" 2>/dev/null || true

          echo "✅ Story Files Copied!"

      - name: 5. 📋 Copy Management (APIs)
        run: |
          SRC="hosting/Video_Generator"
          DST="Development/Factory/Management"
          mkdir -p $DST/2_AI_Models $DST/3_Media $DST/4_Islamic $DST/5_Audio_Text $DST/Uploader $DST/assets

          # AI Models
          AI="$SRC/Fetching/AI/API_fallback"
          cp -f "$AI/"*.py "$DST/2_AI_Models/" 2>/dev/null || true

          # Audio & Text
          cp -f "$SRC/Fetching/audio_TTS/API_fallback/"*.py "$DST/5_Audio_Text/" 2>/dev/null || true
          cp -f "$SRC/Fetching/audio_TTS/URL_fallback/"*.py "$DST/5_Audio_Text/" 2>/dev/null || true
          cp -f "$SRC/Fetching/Translator/URL_fallback/"*.py "$DST/5_Audio_Text/" 2>/dev/null || true
          cp -f "$SRC/Fetching/Intro_Outro_CTA/API_fallback/"*.py "$DST/5_Audio_Text/" 2>/dev/null || true

          # Media, Islamic, Uploader
          cp -f "$SRC/Fetching/Background/Video/API_fallback/"*.py "$DST/3_Media/" 2>/dev/null || true
          cp -f "$SRC/Fetching/Background/Video/URL_fallback/"*.py "$DST/3_Media/" 2>/dev/null || true
          cp -f "$SRC/Fetching/Background/Music/API_fallback/"*.py "$DST/3_Media/" 2>/dev/null || true
          cp -f "$SRC/Fetching/Background/Music/URL_fallback/"*.py "$DST/3_Media/" 2>/dev/null || true
          cp -f "$SRC/Fetching/Islamic/Hadis/URL_fallback/"*.py "$DST/4_Islamic/" 2>/dev/null || true
          cp -f "$SRC/Uploader/Drive/"*.py "$DST/Uploader/" 2>/dev/null || true
          cp -rf "$SRC/assets/"* "$DST/assets/" 2>/dev/null || true

          echo "✅ APIs Copied!"

      - name: 6. 🔧 Automatic Path Fixer
        run: |
          STORY="Development/Factory/branch/story"
          
          # Story main.py ka path fix
          sed -i 's|MGMT = os.path.dirname(CURRENT_DIR)|MGMT = os.path.dirname(os.path.dirname(CURRENT_DIR))|g' "$STORY/main.py" 2>/dev/null || true
          sed -i 's|MGMT = os.path.dirname(CURRENT_DIR)|MGMT = os.path.dirname(os.path.dirname(CURRENT_DIR))|g' "$STORY/render_main.py" 2>/dev/null || true
          sed -i 's|os.path.join(here, "..", "assets")|os.path.join(here, "..", "..", "Management", "assets")|g' "$STORY/ffmpeg_render.py" 2>/dev/null || true

          # Agar ass_builder.py mein backslash error hai to usko fix karo
          sed -i 's|re.sub(r.\[\\n\\r"\].*|re.sub(r"["\\n\\r]", " ", str(intro_text)).strip()|g' "$STORY/ass_builder.py" 2>/dev/null || true

          # AI Models ke naam fix (gemini_AI.py -> gemini.py)
          for f in Development/Factory/Management/2_AI_Models/*_AI.py; do
            if [ -f "$f" ]; then
              newname=$(echo "$f" | sed 's/_AI\.py/\.py/')
              mv "$f" "$newname"
            fi
          done
          
          # ai_fallback.py ke andar imports fix karo
          sed -i 's/import gemini_AI/import gemini as gemini_AI/g' Development/Factory/Management/2_AI_Models/ai_fallback.py 2>/dev/null || true
          sed -i 's/import groq_AI/import groq as groq_AI/g' Development/Factory/Management/2_AI_Models/ai_fallback.py 2>/dev/null || true
          sed -i 's/import cohere_AI/import cohere as cohere_AI/g' Development/Factory/Management/2_AI_Models/ai_fallback.py 2>/dev/null || true
          sed -i 's/import nvidia_AI/import nvidia as nvidia_AI/g' Development/Factory/Management/2_AI_Models/ai_fallback.py 2>/dev/null || true
          sed -i 's/import cloudflare_AI/import cloudflare as cloudflare_AI/g' Development/Factory/Management/2_AI_Models/ai_fallback.py 2>/dev/null || true

          echo "✅ Paths Fixed!"

      - name: 7. 💾 Commit & Push
        working-directory: ./Development
        run: |
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Factory/
          git commit -m "🚀 Magic Copy: Hosting files synced perfectly" || echo "No changes"
          git push origin main || echo "Push failed"
