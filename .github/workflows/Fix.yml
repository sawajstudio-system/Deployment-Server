name: 🎬 Fix FFmpeg Audio Error

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      # ═══════════════════════════════════════════════════════════════
      # 1. FIX AUDIO MIXER (सबसे बड़ी गड़बड़ी यहीं थी)
      # ═══════════════════════════════════════════════════════════════
      - name: 2. 🎙️ Fix audio_mixer.py
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/video_engine
          cat > audio_mixer.py << 'EOF'
          def build_audio_filter(has_music):
              # ✅ सबसे सिंपल और सेफ ऑडियो फिल्टर
              if has_music:
                  # Voice और Music को मिक्स करो
                  return "[1:a]volume=1.0[a_voice];[2:a]volume=0.15[a_music];[a_voice][a_music]amix=inputs=2:duration=first[a_out]"
              else:
                  # सिर्फ Voice चलाओ
                  return "[1:a]volume=1.0[a_out]"
          EOF
          echo "✅ audio_mixer.py fixed"

      # ═══════════════════════════════════════════════════════════════
      # 2. FIX FFMPEG BUILDER (नाम की गड़बड़ी हटाना)
      # ═══════════════════════════════════════════════════════════════
      - name: 3. 🎥 Fix ffmpeg_builder.py
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/video_engine
          cat > ffmpeg_builder.py << 'EOF'
          import os
          from .video_filter import build_video_filter
          from .audio_mixer import build_audio_filter

          def build_ffmpeg_cmd(bg, voice, music, cta, logo, ass, dur, out):
              hm = os.path.exists(music) and os.path.getsize(music) > 0
              hl = os.path.exists(logo)
              c = ["ffmpeg","-y","-stream_loop","-1","-i",bg,"-i",voice]
              
              if hm: c += ["-i", music]
              c += ["-loop","1","-i",cta]
              ci = 3 if hm else 2
              
              li = -1
              if hl:
                  c += ["-i", logo]
                  li = 4 if hm else 3
                  
              cst = max(0, dur - 5.0)
              vf, cur = build_video_filter(hl, li, ci, cst)
              aa = os.path.abspath(ass)
              fo = os.path.abspath(os.path.join(os.path.dirname(__file__),"..","..","..","assets","fonts"))
              
              # वीडियो फिल्टर में सबटाइटल और CTA जोड़ो
              vf += f"[{cur}]subtitles='{aa}':fontsdir='{fo}'[vs];"
              vf += f"[vs][{ci}:v]overlay=0:0:enable='gte(t,{cst})'[v_out]"
              
              # ऑडियो फिल्टर लोड करो
              af = build_audio_filter(hm)
              
              # फाइनल कमांड
              c += ["-filter_complex", f"{vf}; {af}", "-map","[v_out]","-map","[a_out]","-c:v","libx264","-preset","ultrafast","-crf","30","-r","24","-c:a","aac","-b:a","128k","-t",f"{dur:.2f}","-shortest",out]
              return c
          EOF
          echo "✅ ffmpeg_builder.py fixed"

      - name: 4. 🔍 Syntax जाँच
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/video_engine
          python -c "import ast; ast.parse(open('audio_mixer.py').read())"
          python -c "import ast; ast.parse(open('ffmpeg_builder.py').read())"
          echo "✅ दोनों फाइलों का सिंटैक्स सही है"

      - name: 5. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Video_Generator/
          git commit -m "🎬 Fix FFmpeg audio stream error" || echo "No changes"
          git push origin main || echo "Push failed"
