name: 🛠️ Fix ALL Files (Final Master Fix)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix_all:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      # ═══════════════════════════════════════════════════════════════
      # 1. MAIN RENDER (Logo Path Fix)
      # ═══════════════════════════════════════════════════════════════
      - name: 2. 🔧 Fix main_render.py (Logo Path)
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render
          cat > main_render.py << 'EOF'
          import os
          from .tools.duration_checker import get_audio_duration
          from .tools.cta_generator import generate_cta_image
          from .subtitle.builders import create_main_subtitles, create_intro_subtitle, create_outro_subtitle
          from .video_engine import build_ffmpeg_cmd, run_ffmpeg
          from .config import generate_ass_style_string, ARABIC_STYLE, HINDI_STYLE, ENGLISH_STYLE, INTRO_STYLE, OUTRO_STYLE

          def merge(paths, out):
              h = "[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
              for n, s in [("Arabic",ARABIC_STYLE),("Hindi",HINDI_STYLE),("English",ENGLISH_STYLE),("Intro",INTRO_STYLE),("Outro",OUTRO_STYLE)]: h += generate_ass_style_string(n, s) + "\n"
              h += "[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              os.makedirs(os.path.dirname(out), exist_ok=True)
              with open(out, "w", encoding="utf-8") as f:
                  f.write(h)
                  for p in paths:
                      if p and os.path.exists(p):
                          with open(p, "r", encoding="utf-8") as fp:
                              for l in fp:
                                  if l.startswith("Dialogue:"): f.write(l)
              return out

          def build_and_render_story(bg_video, music_path, voice_path, hadith, hindi_text, intro_text, outro_text, cta_text, output_path="temp/Final_Story.mp4"):
              os.makedirs("temp", exist_ok=True)
              d = get_audio_duration(voice_path)
              ia = create_intro_subtitle(intro_text, duration=2.5, output_path="temp/intro.ass")
              ma = create_main_subtitles(hadith, hindi_text, d, output_path="temp/main.ass")
              oa = create_outro_subtitle(outro_text, d, outro_duration=3.5, output_path="temp/outro.ass")
              cta = generate_cta_image(output_path="temp/cta.png")
              mas = merge([ia,ma,oa], "temp/master.ass")
              
              # ✅ सही Logo Path (3 dirname)
              logo = os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__)))), "assets", "logo.png")
              
              cmd = build_ffmpeg_cmd(bg_video, voice_path, music_path, cta, logo, mas, d, output_path)
              return output_path if run_ffmpeg(cmd) else None
          EOF
          echo "✅ main_render.py fixed"

      # ═══════════════════════════════════════════════════════════════
      # 2. VIDEO FILTER (Safe, Error-Free Cinematic)
      # ═══════════════════════════════════════════════════════════════
      - name: 3. 🎥 Fix video_filter.py (Safe Cinematic)
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/video_engine
          cat > video_filter.py << 'EOF'
          from .logo_processor import get_logo_filter
          from .logo_placer import get_moving_logo_expr, get_fixed_logo_pos

          def build_video_filter(has_logo, li, ci, cs):
              # ✅ सिर्फ काम करने वाले इफेक्ट्स (noise और zoompan हटा दिए ताकि क्रैश न हो)
              f = (
                  "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,"
                  "crop=1080:1920,"
                  "eq=saturation=1.2:contrast=1.1:brightness=0.02,"
                  "vignette=PI/4,"
                  "drawbox=y=0:color=black@0.95:width=iw:height=100:t=fill,"
                  "drawbox=y=ih-100:color=black@0.95:width=iw:height=100:t=fill[bg];"
              )
              cur = "bg"
              if has_logo and li != -1:
                  lm = get_logo_filter(400, 160)
                  lf = get_logo_filter(600, 240)
                  f += f"[{li}:v]split[lm][lf];[lm]{lm}[lms];[lf]{lf}[lfs];"
                  x, y = get_moving_logo_expr()
                  f += f"[{cur}][lms]overlay=x='{x}':y='{y}':enable='lt(t,{cs})'[bg1];"
                  fx, fy = get_fixed_logo_pos()
                  f += f"[bg1][lfs]overlay=x='{fx}':y='{fy}':enable='gte(t,{cs})'[bg2];"
                  cur = "bg2"
              return f, cur
          EOF
          echo "✅ video_filter.py fixed"

      # ═══════════════════════════════════════════════════════════════
      # 3. AUDIO MIXER (No Echo, Safe)
      # ═══════════════════════════════════════════════════════════════
      - name: 4. 🎙️ Fix audio_mixer.py (No Echo)
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/video_engine
          cat > audio_mixer.py << 'EOF'
          def build_audio_filter(has_music):
              # ✅ Echo हटा दिया (Safe)
              voice = "[1:a]volume=1.0[voice_cinematic]"
              if has_music:
                  return f"{voice};[2:a]volume=0.15[bgm];[bgm][voice_cinematic]sidechaincompress=threshold=0.05:ratio=8:attack=50:release=500[db];[voice_cinematic][db]amix=inputs=2:duration=first[a_out]"
              return f"{voice};[voice_cinematic]anull[a_out]"
          EOF
          echo "✅ audio_mixer.py fixed"

      # ═══════════════════════════════════════════════════════════════
      # 4. SUBTITLE BUILDERS (Fix Typo & Ensure Stability)
      # ═══════════════════════════════════════════════════════════════
      - name: 5. ✨ Fix Subtitle Builders
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          
          # Fix Intro
          cat > intro_sub_builder.py << 'EOF'
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts
          def create_intro_subtitle(intro_text, duration=3.5, output_path="temp/intro_sub.ass"):
              if not intro_text: return None
              clean_text = str(intro_text).upper()
              content = get_ass_header() + "\n[V4+ Styles]\n" + get_all_styles() + "\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              animated = f"{{\\an5\\pos(540,960)\\fad(1000,1000)\\t(0,2000,\\fscx110\\fscy110)\\fs80\\b1\\c&H00D7FF&\\3c&H000000&\\bord2\\shad4}}{clean_text}"
              content += f"Dialogue: 0,{ts(0.0)},{ts(duration)},Intro,,0,0,0,,{animated}\n"
              return save_ass(content, output_path)
          EOF

          # Fix Main
          cat > main_sub_builder.py << 'EOF'
          import re
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts, compute_word_timings
          from ...config.colors import get_color_tag
          def create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main_subtitles.ass"):
              ara = re.sub(r'[\n\r"]', ' ', str(hadith.get("arabic", ""))).strip()
              hin = re.sub(r'[\n\r"]', ' ', str(hindi_text)).strip()
              eng = re.sub(r'[\n\r"]', ' ', str(hadith.get("english", ""))).strip()
              content = get_ass_header() + "\n[V4+ Styles]\n" + get_all_styles() + "\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              st = 4.0; et = max(duration - 5.5, st + 1.0); total = et - st
              def process(text, style, lang):
                  words = text.split()
                  if not words: return ""
                  timings = compute_word_timings(words, total)
                  lines = ""
                  for i in range(len(words)):
                      ws, we = st + timings[i][0], st + timings[i][1]
                      vis = words[max(0, i-3):i+1]
                      dot_c = get_color_tag(i // 3 + lang * 3)
                      k = f"\u202B{{\\c{dot_c}}}●  " if lang == 0 else f"{{\\c{dot_c}}}●  "
                      for j, w in enumerate(vis):
                          gi = max(0, i-3) + j; c = get_color_tag(gi)
                          k += f"{{\\c{c}\\k{int((we-ws)*100)}\\b1}}{w} " if gi == i else f"{{\\c{c}\\b0}}{w} "
                      if lang == 0: k += "\u202C"
                      lines += f"Dialogue: 0,{ts(ws)},{ts(we)},{style},,,0,0,,{k.strip()}\n"
                  return lines
              if ara: content += process(ara, "Arabic", 0)
              if hin: content += process(hin, "Hindi", 1)
              if eng: content += process(eng, "English", 2)
              return save_ass(content, output_path)
          EOF

          # Fix Outro
          cat > outro_sub_builder.py << 'EOF'
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts
          def create_outro_subtitle(outro_text, total_duration, outro_duration=3.5, output_path="temp/outro_sub.ass"):
              if not outro_text: return None
              clean_text = str(outro_text).strip()
              content = get_ass_header() + "\n[V4+ Styles]\n" + get_all_styles() + "\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              st = max(0.0, total_duration - outro_duration)
              animated = f"{{\\an5\\pos(540,960)\\fad(500,500)\\c&H00D7FF&\\fs60\\b1}}{clean_text}"
              content += f"Dialogue: 0,{ts(st)},{ts(total_duration)},Outro,,0,0,0,,{animated}\n"
              return save_ass(content, output_path)
          EOF

          echo "✅ Subtitles fixed"

      # ═══════════════════════════════════════════════════════════════
      # 5. TOOLS (Safe CTA)
      # ═══════════════════════════════════════════════════════════════
      - name: 6. 💎 Fix CTA Tools
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/tools
          cat > cta_text_placer.py << 'EOF'
          import os, random
          from PIL import Image, ImageDraw, ImageFont, ImageFilter
          def place_cta_text(base_png, output_path="temp/cta_image.png"):
              img = Image.open(base_png).convert("RGBA")
              draw = ImageDraw.Draw(img)
              try:
                  f_top = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 60)
                  f_btn = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 75)
                  f_bot = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 45)
              except IOError: f_top = f_btn = f_bot = ImageFont.load_default()
              colors = ["#FFD700", "#00FFFF", "#FF007F", "#39FF14", "#FFBF00", "#9D00FF", "#00FF7F", "#FF4500"]
              headers = ["💎 Join Our VIP Community 💎", "✨ Like • Share • Follow ✨", "🌟 Support Our Channel 🌟", "👑 Become a Premium Member 👑"]
              ht = random.choice(headers)
              draw.text((540, 1230), ht, font=f_top, fill=colors[0], anchor="mm", stroke_width=3, stroke_fill="#000")
              btns = [["👍 LIKE", "🔔 SUBSCRIBE", "💬 COMMENT", "📤 SHARE"], ["👑 FOLLOW", "🎁 SHARE", "❤️ LIKE", "🔔 SUBSCRIBE"], ["🔔 SUBSCRIBE", "👍 LIKE", "👑 FOLLOW", "💬 COMMENT"]]
              chosen = random.choice(btns); ys = [1330, 1440, 1550, 1660]
              for i, (text, y) in enumerate(zip(chosen, ys)):
                  draw.rounded_rectangle([305, y, 775, y+90], radius=15, fill=(20, 20, 20, 200), outline=colors[i+1], width=6)
                  draw.text((540, y+45), text, font=f_btn, fill=colors[i+1], anchor="mm", stroke_width=3, stroke_fill="#000")
              draw.text((540, 1820), "👑 SAWAJ STUDIO 👑", font=f_bot, fill="#FFD700", anchor="mm", stroke_width=3, stroke_fill="#000")
              os.makedirs(os.path.dirname(output_path), exist_ok=True); img.save(output_path, "PNG")
              return output_path
          def generate_cta_image(output_path="temp/cta_image.png"):
              from .cta_img_drawer import draw_cta_base
              return place_cta_text(draw_cta_base("temp/cta_base.png"), output_path)
          EOF
          echo "✅ CTA Tools fixed"

      # ═══════════════════════════════════════════════════════════════
      # 6. COMMIT & PUSH
      # ═══════════════════════════════════════════════════════════════
      - name: 7. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Video_Generator/
          git commit -m "🛠️ Master Fix: Fixed all files (Logo Path, Video, Audio, Subtitles, CTA)" || echo "No changes"
          git push origin main || echo "Push failed"
