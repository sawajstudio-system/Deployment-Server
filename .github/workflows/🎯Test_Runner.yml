# ══════════════════════════════════════════════════════════════════════════════
# 📁 FILE: .github/workflows/Test_Runner.yml
# 🎯 PURPOSE: Master Test Runner (All-in-One with Exact UI)
# ══════════════════════════════════════════════════════════════════════════════
name: 🎯 Test_Runner

on:
  workflow_dispatch:
    inputs:
      test_name:
        description: 'Kaunsa test chalana hai?'
        required: true
        type: choice
        default: '☁️ Cloudflare'
        options:
          - '🚀 ALL Tests (Sab chalao)'
          - '☁️ Cloudflare'
          - '🅰️ Anges'
          - '🔑 Gemini'
          - '🔑 Groq'
          - '🔑 UMMAH'
          - '🧠 Cohere'
          - '🟢 NVIDIA'
          - '🌐 OpenRouter'
          - '🪄 Magic'
          - '🎨 Tanvo'
          - '🌐 Quran'
          - '🌐 Quran Audio'
          - '🌐 Quran Tafsir'
          - '🌐 Quran Foundation'
          - '🌐 Hadees'
          - '🌐 Zesyn Hadees'
          - '🌐 Hijri Date'
          - '🎬 Pexels'
          - '🖼️ Pixabay'
          - '🎬 Coverr'
          - '🌐 AI Image'
          - '🌐 Natural Sound'
          - '🎙️ ElevenLabs'
          - '📸 Cloudinary'
          - '🌐 Jokes'
          - '🌐 Quotes'
          - '🌐 Translator'
          - '📱 Telegram'
          - '🐙 GitHub'
          - '🧹 History Cleaner'
          - '📄 TXT Generator'
          - '📦 ZIP Generator'
          - '🧪 Test All GDrive'
          - '🔴 Story Video Generator'

      repo_target:
        description: 'TXT/ZIP ke liye (baaki tests ignore karte hain)'
        required: false
        type: choice
        default: 'Public + Private'
        options:
          - 'Public + Private'
          - 'Public Only'
          - 'Private Only'

      dry_run:
        description: 'TXT Generator ke liye dry run?'
        required: false
        type: boolean
        default: false

      stop_on_first_fail:
        description: 'Pehli fail pe ruk jao?'
        required: false
        type: boolean
        default: false

# ══════════════════════════════════════════════════════════════════════════════
jobs:

  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 1: SINGLE TEST (Dropdown se koi ek)
  # ═══════════════════════════════════════════════════════════════════════════
  run_single:
    if: |
      inputs.test_name != '🔴 Story Video Generator' &&
      inputs.test_name != '🚀 ALL Tests (Sab chalao)'
    runs-on: ubuntu-latest
    timeout-minutes: 30

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      UMMAH_API_KEY: ${{ secrets.UMMAH_API_KEY }}
      QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
      QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
      QF_ENV: ${{ secrets.QF_ENV }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_SHORT_ID: ${{ secrets.GDRIVE_F_SHORT_ID }}
      GDRIVE_F_LONG_ID: ${{ secrets.GDRIVE_F_LONG_ID }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      REPO_TARGET: ${{ inputs.repo_target }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🚀 Fetch & Run
        env:
          TEST_NAME: ${{ inputs.test_name }}
        run: |
          python << 'PYEOF'
          import os, sys, subprocess, requests, time

          TEST  = os.environ["TEST_NAME"]
          TOKEN = os.environ["TOKEN_GITHUB"]

          MAP = {
              "☁️ Cloudflare":        "A_API_room/01_ai_models/cloudflare.py",
              "🅰️ Anges":             "A_API_room/01_ai_models/anges.py",
              "🔑 Gemini":            "A_API_room/01_ai_models/gemini.py",
              "🔑 Groq":              "A_API_room/01_ai_models/groq.py",
              "🔑 UMMAH":             "A_API_room/Islamic/UMMAH.py",
              "🧠 Cohere":            "A_API_room/01_ai_models/cohere.py",
              "🟢 NVIDIA":            "A_API_room/01_ai_models/nvidia.py",
              "🌐 OpenRouter":        "A_API_room/01_ai_models/openrouter.py",
              "🪄 Magic":             "A_API_room/01_ai_models/magic.py",
              "🎨 Tanvo":             "A_API_room/02_audio_media/tanvo.py",
              "🌐 Quran":             "URL_room/Islamic/quran.py",
              "🌐 Quran Audio":       "URL_room/Islamic/quran_audio.py",
              "🌐 Quran Tafsir":      "URL_room/Islamic/quran_tafsir.py",
              "🌐 Quran Foundation":  "A_API_room/Islamic/quran_foundation.py",
              "🌐 Hadees":            "URL_room/Islamic/hadees.py",
              "🌐 Zesyn Hadees":      "URL_room/Islamic/zesyn_hadees.py",
              "🌐 Hijri Date":        "URL_room/Islamic/hijri_date.py",
              "🎬 Pexels":            "A_API_room/05_video_services/pexels.py",
              "🖼️ Pixabay":           "A_API_room/05_video_services/pixabay.py",
              "🎬 Coverr":            "A_API_room/05_video_services/coverr.py",
              "🌐 AI Image":          "URL_room/AI/ai_image.py",
              "🌐 Natural Sound":     "A_API_room/02_audio_media/natural_sound.py",
              "🎙️ ElevenLabs":       "A_API_room/02_audio_media/elevenlabs_test.py",
              "📸 Cloudinary":        "A_API_room/02_audio_media/cloudinary.py",
              "🌐 Jokes":             "URL_room/Other/jokes.py",
              "🌐 Quotes":            "URL_room/Other/quotes.py",
              "🌐 Translator":        "URL_room/Other/translator.py",
              "📱 Telegram":          "A_API_room/03_integrations/telegram.py",
              "🐙 GitHub":            "Git_room/github.py",
              "🧹 History Cleaner":   "Git_room/history_cleaner.py",
              "📄 TXT Generator":     "Git_room/txt_generator.py",
              "📦 ZIP Generator":     "Git_room/zip_generator.py",
              "🧪 Test All GDrive":   "A_API_room/02_audio_media/test_gdrive_all.py",
          }

          if TEST not in MAP:
              print(f"❌ Unknown test: {TEST}")
              sys.exit(1)

          rel = MAP[TEST]
          url = f"https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/{rel}"

          print(f"📥 Fetching: System_room/{rel}")

          content = None
          for attempt in range(1, 4):
              try:
                  r = requests.get(url, headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.raw"}, timeout=30)
                  if r.status_code == 200:
                      content = r.content
                      print(f"✅ Downloaded: {len(content)} bytes")
                      break
                  elif r.status_code == 404:
                      print(f"⏭️ File not found (404): {rel}")
                      sys.exit(3) 
                  elif r.status_code == 403:
                      print(f"⏳ Rate limited. Waiting 60s...")
                      time.sleep(60)
                  else:
                      print(f"⚠️ HTTP {r.status_code}, retrying...")
                      time.sleep(2 ** attempt)
              except Exception as e:
                  print(f"⚠️ Attempt {attempt} failed: {e}")
                  time.sleep(2 ** attempt)

          if content is None:
              print("❌ Fetch failed after 3 attempts")
              sys.exit(1)

          if len(content) < 10:
              print(f"⚠️ File too small ({len(content)} bytes) — likely empty")
              sys.exit(3)

          with open("/tmp/run_me.py", "wb") as f:
              f.write(content)

          sys.stdout.flush()
          rc = subprocess.run([sys.executable, "/tmp/run_me.py"]).returncode
          sys.exit(rc)
          PYEOF

      - name: 4. 💨 Cleanup
        if: always()
        run: rm -f /tmp/run_me.py


  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 2: ALL TESTS (Sequential with Stop-on-Fail support)
  # ═══════════════════════════════════════════════════════════════════════════
  run_all:
    if: inputs.test_name == '🚀 ALL Tests (Sab chalao)'
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      UMMAH_API_KEY: ${{ secrets.UMMAH_API_KEY }}
      QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
      QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
      QF_ENV: ${{ secrets.QF_ENV }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_SHORT_ID: ${{ secrets.GDRIVE_F_SHORT_ID }}
      GDRIVE_F_LONG_ID: ${{ secrets.GDRIVE_F_LONG_ID }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      REPO_TARGET: ${{ inputs.repo_target }}
      DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
      STOP_ON_FAIL: ${{ inputs.stop_on_first_fail && '1' || '0' }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🚀 Run all 33 tests
        run: |
          python << 'PYEOF'
          import os, sys, subprocess, requests, time

          TOKEN       = os.environ["TOKEN_GITHUB"]
          TG_TOKEN    = os.environ.get("TELEGRAM_API_REPORT_TOKEN")
          TG_CHAT     = os.environ.get("TELEGRAM_API_REPORT_CHAT_ID")
          STOP_ON_FAIL = os.environ.get("STOP_ON_FAIL", "0") == "1"
          SUMMARY_FILE = os.environ.get("GITHUB_STEP_SUMMARY", "/tmp/summary.md")

          MAP = {
              "☁️ Cloudflare":        "A_API_room/01_ai_models/cloudflare.py",
              "🅰️ Anges":             "A_API_room/01_ai_models/anges.py",
              "🔑 Gemini":            "A_API_room/01_ai_models/gemini.py",
              "🔑 Groq":              "A_API_room/01_ai_models/groq.py",
              "🔑 UMMAH":             "A_API_room/Islamic/UMMAH.py",
              "🧠 Cohere":            "A_API_room/01_ai_models/cohere.py",
              "🟢 NVIDIA":            "A_API_room/01_ai_models/nvidia.py",
              "🌐 OpenRouter":        "A_API_room/01_ai_models/openrouter.py",
              "🪄 Magic":             "A_API_room/01_ai_models/magic.py",
              "🎨 Tanvo":             "A_API_room/02_audio_media/tanvo.py",
              "🌐 Quran":             "URL_room/Islamic/quran.py",
              "🌐 Quran Audio":       "URL_room/Islamic/quran_audio.py",
              "🌐 Quran Tafsir":      "URL_room/Islamic/quran_tafsir.py",
              "🌐 Quran Foundation":  "A_API_room/Islamic/quran_foundation.py",
              "🌐 Hadees":            "URL_room/Islamic/hadees.py",
              "🌐 Zesyn Hadees":      "URL_room/Islamic/zesyn_hadees.py",
              "🌐 Hijri Date":        "URL_room/Islamic/hijri_date.py",
              "🎬 Pexels":            "A_API_room/05_video_services/pexels.py",
              "🖼️ Pixabay":           "A_API_room/05_video_services/pixabay.py",
              "🎬 Coverr":            "A_API_room/05_video_services/coverr.py",
              "🌐 AI Image":          "URL_room/AI/ai_image.py",
              "🌐 Natural Sound":     "A_API_room/02_audio_media/natural_sound.py",
              "🎙️ ElevenLabs":       "A_API_room/02_audio_media/elevenlabs_test.py",
              "📸 Cloudinary":        "A_API_room/02_audio_media/cloudinary.py",
              "🌐 Jokes":             "URL_room/Other/jokes.py",
              "🌐 Quotes":            "URL_room/Other/quotes.py",
              "🌐 Translator":        "URL_room/Other/translator.py",
              "📱 Telegram":          "A_API_room/03_integrations/telegram.py",
              "🐙 GitHub":            "Git_room/github.py",
              "🧹 History Cleaner":   "Git_room/history_cleaner.py",
              "📄 TXT Generator":     "Git_room/txt_generator.py",
              "📦 ZIP Generator":     "Git_room/zip_generator.py",
              "🧪 Test All GDrive":   "A_API_room/02_audio_media/test_gdrive_all.py",
          }

          def tg(msg):
              if not TG_TOKEN or not TG_CHAT: return
              try:
                  requests.post(f"https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/{rel}", json={"chat_id": TG_CHAT, "text": msg[:4000]}, timeout=10)
              except Exception: pass

          def fetch_file(rel, retries=3):
              url = f"https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/{rel}"
              for attempt in range(1, retries + 1):
                  try:
                      r = requests.get(url, headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.raw"}, timeout=30)
                      if r.status_code == 200: return ("OK", r.content)
                      if r.status_code == 404: return ("SKIP_404", None)
                      if r.status_code == 403:
                          time.sleep(60)
                          continue
                  except Exception as e: print(f"   ⚠️ Retry {attempt}: {e}")
                  time.sleep(2 ** attempt)
              return ("FAIL_FETCH", None)

          total = len(MAP)
          tg(f"🚀 <b>ALL Tests Started</b>\nTotal: {total} tests")
          results = []
          start_all = time.time()
          aborted = False

          for idx, (name, rel) in enumerate(MAP.items(), 1):
              print(f"\n[{idx}/{total}] {name}")
              t0 = time.time()
              status, duration, reason = None, 0, ""

              fetch_status, content = fetch_file(rel)
              if fetch_status == "SKIP_404":
                  status, reason = "SKIP", "file not found (404)"
              elif fetch_status == "FAIL_FETCH":
                  status, reason = "FAIL", "fetch failed"
              elif content and len(content) < 10:
                  status, reason = "SKIP", "empty file"
              else:
                  with open("/tmp/run_me.py", "wb") as f:
                      f.write(content)
                  sys.stdout.flush()
                  try:
                      rc = subprocess.run([sys.executable, "/tmp/run_me.py"], timeout=180).returncode
                      status = "PASS" if rc == 0 else "FAIL"
                  except subprocess.TimeoutExpired:
                      status = "TIMEOUT"
                  except Exception as e:
                      status, reason = "FAIL", str(e)[:60]
                  finally:
                      if os.path.exists("/tmp/run_me.py"): os.remove("/tmp/run_me.py")

              duration = time.time() - t0
              results.append((name, status, duration, reason))
              icon = {"PASS":"✅","FAIL":"❌","SKIP":"⏭️","TIMEOUT":"⏰"}.get(status,"❓")
              print(f"{icon} {name}: {status} ({duration:.1f}s)")

              if idx % 5 == 0 or idx == total:
                  p = sum(1 for _, s, *_ in results if s == "PASS")
                  f = sum(1 for _, s, *_ in results if s == "FAIL")
                  tg(f"📊 Progress {idx}/{total}\n✅ {p}  ❌ {f}")

              if STOP_ON_FAIL and status == "FAIL":
                  print(f"\n⛔ STOP_ON_FAIL at {name}")
                  aborted = True
                  break

          passed  = sum(1 for _, s, *_ in results if s == "PASS")
          failed  = sum(1 for _, s, *_ in results if s == "FAIL")
          skipped = sum(1 for _, s, *_ in results if s == "SKIP")
          timeout = sum(1 for _, s, *_ in results if s == "TIMEOUT")
          total_time = time.time() - start_all

          print(f"\nSUMMARY: ✅ {passed}  ❌ {failed}  ⏭️ {skipped}  ⏰ {timeout} | {total_time:.0f}s")

          try:
              with open(SUMMARY_FILE, "w", encoding="utf-8") as sf:
                  sf.write(f"# 🎯 Test Summary\n\n**Total time:** {total_time:.0f}s\n\n")
                  sf.write(f"| ✅ Pass | ❌ Fail | ⏭️ Skip | ⏰ Timeout |\n|---|---|---|---|\n")
                  sf.write(f"| {passed} | {failed} | {skipped} | {timeout} |\n\n## Details\n\n")
                  sf.write(f"| Test | Status | Duration | Reason |\n|---|---|---|---|\n")
                  for n, s, d, r in results:
                      ic = {"PASS":"✅","FAIL":"❌","SKIP":"⏭️","TIMEOUT":"⏰"}.get(s,"❓")
                      sf.write(f"| {n} | {ic} {s} | {d:.0f}s | {r or '—'} |\n")
          except Exception: pass

          lines = [f"🏁 <b>ALL Tests Done</b>", f"✅ Pass: {passed}", f"❌ Fail: {failed}", f"⏭️ Skip: {skipped}", f"⏰ Timeout: {timeout}", f"⏱️ Total: {total_time:.0f}s"]
          if aborted:
              lines.append("\n⛔ Aborted (stop_on_first_fail)")
          tg("\n".join(lines))

          if failed + timeout > 0: sys.exit(1)
          PYEOF

      - name: 4. 💨 Cleanup
        if: always()
        run: rm -f /tmp/run_me.py


  # ═══════════════════════════════════════════════════════════════════════════
  # JOB 3: STORY VIDEO GENERATOR (Special Setup)
  # ═══════════════════════════════════════════════════════════════════════════
  story:
    if: inputs.test_name == '🔴 Story Video Generator'
    runs-on: ubuntu-latest
    timeout-minutes: 60

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      - name: 1. 📥 Checkout Backend
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 📦 Install FFmpeg & Fonts
        run: |
          sudo apt-get update -q
          sudo apt-get install -y -q ffmpeg fonts-noto fonts-noto-color-emoji fontconfig

      - name: 4. 📥 Install Python packages
        run: pip install -r Video_Generator/Story_Generator/requirements.txt

      - name: 5. 🧪 Run Story Pipeline
        run: |
          cd Video_Generator/Story_Generator
          python main.py

      - name: 6. 💨 Cleanup
        if: always()
        run: echo "✅ Story pipeline done."
