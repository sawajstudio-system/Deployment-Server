name: 🧹 Delete Duplicates (One-Time)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  cleanup:
    runs-on: ubuntu-latest
    steps:
      - name: 📥 Checkout Development Repo
        uses: actions/checkout@v4

      - name: 🗑️ Deleting Duplicates
        run: |
          echo "Deleting Duplicate Story Folder..."
          rm -rf Factory/Management/story
          
          echo "Deleting Duplicate Media Files..."
          rm -f Factory/Management/3_Media/pexels.py
          rm -f Factory/Management/3_Media/pixabay.py
          
          echo "✅ Duplicates Removed!"

      - name: 💾 Commit and Push Changes
        run: |
          git config user.name "Cleanup Bot"
          git config user.email "bot@sawajstudio.com"
          git add .
          git commit -m "🧹 Cleanup: Removed duplicate story folder and unused media files" || echo "No changes"
          git push origin main
