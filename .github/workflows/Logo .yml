name:  Logo.Transparent

on:
  workflow_dispatch: # Manual button se run karne ke liye
  push:
    paths:
      - 'logo.png' # Jaise hi nayi logo.png upload/update hogi, ye khud-b-khud chal padega

permissions:
  contents: write # GitHub repo mein file auto-commit karne ki permission ke liye

jobs:
  process-and-send-logo:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Dependencies
        run: |
          pip install opencv-python-headless numpy requests

      - name: Process Logo (Ultra Clean, Smooth & Protected)
        run: |
          python -c "
          import cv2
          import numpy as np

          # Load image with alpha channel
          img = cv2.imread('logo.png', cv2.IMREAD_UNCHANGED)
          if img.shape[2] == 3:
              img = cv2.cvtColor(img, cv2.COLOR_BGR2BGRA)

          b, g, r, a = cv2.split(img)
          bgr = cv2.merge([b, g, r])

          # 1. Advanced green background detection
          hsv = cv2.cvtColor(bgr, cv2.COLOR_BGR2HSV)
          lower_green = np.array([25, 15, 15])
          upper_green = np.array([95, 255, 255])
          green_mask = cv2.inRange(hsv, lower_green, upper_green)

          # Catch dominant green channel areas
          g_dominant = (g.astype(np.int16) - r.astype(np.int16) > 8) & (g.astype(np.int16) - b.astype(np.int16) > 8)
          bg_mask = cv2.bitwise_or(green_mask, g_dominant.astype(np.uint8) * 255)

          # 2. Strict protection for white/silver logo text
          max_channel = np.maximum(np.maximum(r, g), b)
          min_channel = np.minimum(np.minimum(r, g), b)
          color_diff = max_channel.astype(np.int16) - min_channel.astype(np.int16)
          
          is_logo = (max_channel > 110) & (color_diff < 45)
          bg_mask[is_logo] = 0

          # 3. Morphological cleaning to smooth edges and remove stray dots
          kernel = np.ones((2, 2), np.uint8)
          bg_mask = cv2.morphologyEx(bg_mask, cv2.MORPH_OPEN, kernel)
          bg_mask = cv2.morphologyEx(bg_mask, cv2.MORPH_CLOSE, kernel)

          # Apply transparency
          img[bg_mask == 255] = (0, 0, 0, 0)

          cv2.imwrite('transparent_logo.png', img)
          print('Logo edges cleaned, smoothed, and fully protected!')
          "

      - name: Upload Artifact (Download from GitHub)
        uses: actions/upload-artifact@v4
        with:
          name: transparent-logo-file
          path: transparent_logo.png

      - name: Commit Transparent Logo Back to Repo
        run: |
          git config --global user.name 'GitHub Actions Bot'
          git config --global user.email 'bot@users.noreply.github.com'
          git add transparent_logo.png
          git commit -m 'Auto-generate transparent logo [skip ci]' || echo "No changes to commit"
          git push || echo "No changes to push"

      - name: Send Transparent PNG to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          python -c "
          import os
          import requests

          token = os.environ['TELEGRAM_BOT_TOKEN']
          chat_id = os.environ['TELEGRAM_CHAT_ID']
          url = f'https://api.telegram.org/bot{token}/sendDocument'

          with open('transparent_logo.png', 'rb') as doc:
              response = requests.post(
                  url,
                  data={'chat_id': chat_id, 'caption': '🚀 All-in-one: Ultra-clean transparent logo generated, saved & sent!'},
                  files={'document': doc}
              )

          print('Telegram Response:', response.text)
          response.raise_for_status()
          "
