name: 📦 ZIP Generator

on:
  workflow_dispatch:
    inputs:
      repo_target:
        description: 'Kaunsa repo ka code ZIP me daalna hai?'
        required: true
        type: choice
        default: 'Public + Private'
        options:
          - 'Public + Private'
          - 'Public Only'
          - 'Private Only'

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      REPO_TARGET: ${{ github.event.inputs.repo_target }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🔒 Clone Private Backend
        run: |
          git clone https://${{ secrets.TOKEN_GITHUB }}@github.com/sawajstudio-system/Backend.git ${{ runner.temp }}/private_repo

      - name: 4. 🪶 Fetch & Run ZIP Generator
        run: |
          set +e
          curl -sSL -f -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/Git_room/zip_generator.py" \
            -o /tmp/zip_generator.py
          if [ -s /tmp/zip_generator.py ]; then python /tmp/zip_generator.py; else echo "❌ Download FAILED"; fi
          rm -f /tmp/zip_generator.py

      - name: 5. 💨 Cleanup
        if: always()
        run: rm -rf ${{ runner.temp }}/private_repo
