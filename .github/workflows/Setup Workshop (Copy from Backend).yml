name: 🏗️ Setup New Workshop Repo

on:
  workflow_dispatch:        # मैन्युअली रन करने के लिए

jobs:
  setup_workshop:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Checkout Workshop Repo (New)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 📥 Checkout Backend Repo (Original)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      - name: 3. 📦 Copy Video_Generator to Workshop
        run: |
          echo "📁 Copying Video_Generator from Backend to Workshop..."
          
          # 🟢 यह 'cp' कमांड है, जो सिर्फ कॉपी करता है। Backend से कुछ भी डिलीट नहीं होगा।
          cp -r Backend/Video_Generator Workshop/
          
          echo "✅ Copy complete! Backend is 100% safe and untouched."

      - name: 4. 🚀 Commit & Push to Workshop Repo
        run: |
          cd Workshop
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          
          if git diff-index --quiet HEAD; then 
            echo "⚠️ No changes needed. Workshop is already up to date."
          else 
            git commit -m "🏗️ Initial Setup: Copied Video_Generator from Backend"
            git push
            echo "🎉 Workshop Repo successfully populated with Backend Code!"
          fi
