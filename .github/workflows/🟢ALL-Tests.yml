name: 🟢ALL-Tests (Debug Mode)

on:
  workflow_dispatch:
    inputs:
      api_test:
        description: 'API Test (Kaunsi API chalani hai?)'
        type: choice
        default: 'ALL Tests (Sab)'
        options:
          - 'ALL Tests (Sab)'
          - 'Cloudflare'
          - 'GitHub'

jobs:
  run_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🚀 Execute Tests (With Debug)
        env:
          API_TEST: ${{ inputs.api_test }}
        run: |
          python << 'PYEOF'
          import os, sys, subprocess, requests, time

          TOKEN       = os.environ.get("TOKEN_GITHUB")
          API_TEST = os.environ.get("API_TEST", "None")

          BASE_URL = "https://api.github.com/repos/sawajstudio-system/hosting_sarvar/contents/API%20service/"

          ALL_MAP = {
              "Cloudflare":  "A_API_room/01_ai_models/cloudflare.py",
              "GitHub":      "Git_room/github.py",
          }

          def fetch_file(rel):
              url = f"{BASE_URL}{rel}"
              print(f"🔍 URL: {url}")
              try:
                  r = requests.get(url, headers={"Authorization": f"token {TOKEN}", "Accept": "application/vnd.github.raw"}, timeout=30)
                  
                  if r.status_code == 200:
                      print(f"✅ Fetched: {rel}")
                      return ("OK", r.content)
                  elif r.status_code == 404:
                      print(f"❌ ERROR 404: File not found. Path is wrong OR TOKEN is invalid/expired.")
                      return ("SKIP_404", None)
                  elif r.status_code == 403:
                      print(f"❌ ERROR 403: Forbidden. API Rate limit exceeded or Token has no access.")
                      return ("FAIL_FETCH", None)
                  else:
                      print(f"❌ HTTP {r.status_code}: {r.text[:200]}")
                      return ("FAIL_FETCH", None)
              except Exception as e:
                  print(f"❌ Exception: {e}")
                  return ("FAIL_FETCH", None)

          selected_tests = list(ALL_MAP.keys()) if API_TEST == "ALL Tests (Sab)" else [API_TEST]

          for idx, name in enumerate(selected_tests, 1):
              print(f"\n[{idx}/{len(selected_tests)}] Processing: {name}")
              rel = ALL_MAP[name]
              fetch_status, content = fetch_file(rel)

              if fetch_status == "SKIP_404":
                  print(f"⚠️ {name}: SKIP (404 Error)")
              elif fetch_status == "FAIL_FETCH":
                  print(f"⚠️ {name}: SKIP (Fetch Failed)")
              else:
                  # Save file and run it
                  with open("/tmp/run_me.py", "wb") as f:
                      f.write(content)
                  
                  print(f"🚀 Running {name}...")
                  rc = subprocess.run([sys.executable, "/tmp/run_me.py"], timeout=60).returncode
                  
                  if rc == 0:
                      print(f"✅ {name}: PASS")
                  else:
                      print(f"❌ {name}: FAIL (Exit code: {rc})")
                  
                  if os.path.exists("/tmp/run_me.py"): 
                      os.remove("/tmp/run_me.py")

          PYEOF
