name: Move Files and Delete Testing Folder

on:
  workflow_dispatch:

jobs:
  move-and-delete:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Move files and delete testing folder
        run: |
          SOURCE_FOLDER="test_yml"
          TARGET_FOLDER=".github"
          
          # Target folder create karein agar nahi hai
          mkdir -p "$TARGET_FOLDER"
          
          if [ -d "$SOURCE_FOLDER" ]; then
            echo "Moving files from $SOURCE_FOLDER to $TARGET_FOLDER..."
            cp -av "$SOURCE_FOLDER"/* "$TARGET_FOLDER"/
            
            echo "Deleting testing folder: $SOURCE_FOLDER"
            rm -rf "$SOURCE_FOLDER"
          else
            echo "Error: Folder '$SOURCE_FOLDER' nahi mila!"
            exit 1
          fi

      - name: Commit and Push changes
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"
          git add -A
          
          if git diff --staged --quiet; then
            echo "Koi change commit karne ke liye nahi hai."
          else
            git commit -m "Move files to .github and delete test_yml folder"
            git push
            echo "Successfully moved files and deleted folder!"
          fi
