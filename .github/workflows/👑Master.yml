name: 👑 Master Test Runner (Run All)

on:
  workflow_dispatch:

jobs:
  run_all_apis:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger All API Tests
        run: |
          echo "Triggering API Tests..."
          gh workflow run "☁️ Cloudflare API Test"
          gh workflow run "🅰️ Anges API Test"
          gh workflow run "🌐 OpenRouter API Test"
          gh workflow run "🎨 Tanvo API Test"
          gh workflow run "🎬 Coverr API Test"
          gh workflow run "🎬 Pexels API Test"
          gh workflow run "🖼️ Pixabay API Test"
          gh workflow run "🔑 Gemini API Test"
          gh workflow run "⚡ Groq API Test"
          gh workflow run "🟢 NVIDIA API Test"
          gh workflow run "🧠 Cohere API Test"
          gh workflow run "🪄 Magic API Test"
          gh workflow run "📱 Telegram Bot Test"
          gh workflow run "📸 Cloudinary API Test"
          gh workflow run "🌐 UMMAH API Test"
          gh workflow run "🌐 Quran Foundation Test"
          gh workflow run "🌐 Natural Sound URL Test"
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}

  run_all_urls:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger All URL Tests
        run: |
          echo "Triggering URL Tests..."
          gh workflow run "🌐 AI Image URL Test"
          gh workflow run "🌐 Hadees URL Test"
          gh workflow run "🌐 Hijri Date URL Test"
          gh workflow run "🌐 Jokes URL Test"
          gh workflow run "🌐 Quotes URL Test"
          gh workflow run "🌐 Quran URL Test"
          gh workflow run "🌐 Quran Audio URL Test"
          gh workflow run "🌐 Quran Tafsir URL Test"
          gh workflow run "🌐 Translator URL Test"
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}

  run_other_tools:
    runs-on: ubuntu-latest
    steps:
      - name: 🚀 Trigger Other Tools (Git, GDrive, Cleaner)
        run: |
          echo "Triggering Other Tools..."
          gh workflow run "🐙 GitHub API Test"
          gh workflow run "📄 TXT Generator (Air Mode)"
          gh workflow run "📦ZIP_Generator (Air Mode)"
          gh workflow run "🧹 History Cleaner (Air Mode)"
          gh workflow run "🧪 Test All GDrive Folders"
          gh workflow run "🧪 GDrive Test"
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
