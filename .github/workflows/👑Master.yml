# ══════════════════════════════════════════════════════════════════════════════
# 📁 SAVE THIS FILE AT:
#    Firent/.github/workflows/👑Master.yml
# ══════════════════════════════════════════════════════════════════════════════
name: 👑 Master Runner (All YML)

on:
  workflow_dispatch:

jobs:
  run_all:
    runs-on: ubuntu-latest

    steps:
      - name: 🚀 Trigger All Workflows
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "🔍 Fetching all workflows..."
          
          # GitHub API se saari workflows ki list nikaal rahe hain
          WORKFLOWS=$(gh api repos/sawajstudio-system/Firent/actions/workflows --paginate --jq '.workflows[].path')
          
          echo "📋 Found the following workflows:"
          echo "$WORKFLOWS"
          
          echo "======================================"
          
          # Ek-ek karke saari workflows ko trigger karenge (khud ko chhod kar)
          for wf in $WORKFLOWS; do
            if [[ "$wf" != *"👑Master.yml"* ]]; then
              echo "🚀 Triggering: $wf"
              gh workflow run "$wf" || echo "⚠️ Could not trigger $wf"
            else
              echo "⏭️ Skipping Master workflow (khud ko trigger nahi karna)"
            fi
          done
          
          echo "✅ All workflows triggered!"
