name: 👑 Master Runner (All At Once)

on:
  workflow_dispatch:

jobs:
  run_all:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Trigger All Workflows Together
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "🔍 Fetching all workflows..."
          
          # Saari workflows ki ID nikaal rahe hain
          gh api repos/sawajstudio-system/Firent/actions/workflows --paginate > /tmp/workflows.json
          
          # Sirf unko filter kar rahe hain jo Master nahi hain
          jq -r '.workflows[] | select(.name | contains("Master Runner") | not) | "\(.id)|\(.name)"' /tmp/workflows.json > /tmp/wf_list.txt
          
          echo "======================================"
          
          while IFS='|' read -r id name; do
            echo "🚀 Triggering: $name (ID: $id)"
            
            # Ek ke baad ek trigger kar rahe hain, par wait nahi kar rahe
            gh workflow run $id
            
            # 1 second ka gap taaki API limit na lage
            sleep 1
          done < /tmp/wf_list.txt
          
          echo "✅ All workflows triggered successfully!"
