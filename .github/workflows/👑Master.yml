name: 👑 Master Runner (All At Once + Cleaner Last)

on:
  workflow_dispatch:

jobs:
  run_all:
    runs-on: ubuntu-latest

    steps:
      - name: 📥 Checkout Repository
        uses: actions/checkout@v4

      - name: 🚀 Trigger All Active Workflows (Except Master & Cleaner)
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "🔍 Fetching all workflows for ${{ github.repository }}..."
          gh api repos/${{ github.repository }}/actions/workflows --paginate > /tmp/workflows.json
          
          # Sirf active (enabled) workflows ko lo, jo Master aur Cleaner na hon
          jq -r '.workflows[] | select(.state == "active") | select(.name | contains("Master Runner") | not) | select(.name | contains("History Cleaner") | not) | "\(.id)|\(.name)"' /tmp/workflows.json > /tmp/wf_list.txt
          
          echo "======================================"
          while IFS='|' read -r id name; do
            echo "🚀 Triggering: $name (ID: $id)"
            gh workflow run $id || echo "⚠️ Failed to trigger $name"
            sleep 1
          done < /tmp/wf_list.txt
          
          echo "✅ All main workflows triggered!"
          
      - name: ⏳ Wait for 2 Minutes (Taaki baaki workflows chal sakein)
        run: sleep 120
        
      - name: 🧹 Run History Cleaner Last
        env:
          GH_TOKEN: ${{ secrets.TOKEN_GITHUB }}
        run: |
          echo "🔍 Finding History Cleaner..."
          CLEANER_ID=$(gh api repos/${{ github.repository }}/actions/workflows --paginate --jq '.workflows[] | select(.name | contains("History Cleaner")) | .id')
          
          if [[ -n "$CLEANER_ID" ]]; then
            echo "🧹 Triggering History Cleaner (ID: $CLEANER_ID) at the end..."
            gh workflow run $CLEANER_ID
          else
            echo "❌ History Cleaner workflow not found!"
          fi
