name: 📦 Move & Rename System_room

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move_and_rename:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Checkout Hosting (Source)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/hosting_sarvar'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Hosting'

      - name: 2. 📥 Checkout Admin (Destination)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/admin'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Admin'

      - name: 3. 🚚 Move & Rename Folder
        run: |
          echo "🚚 Copying folder from Hosting to Admin..."
          
          # Agar Admin me pehle se 'API service' folder hai toh hatao
          rm -rf "Admin/API service"
          
          # Hosting se copy karo aur naya naam de do
          cp -r "Hosting/System_room" "Admin/API service"
          
          echo "✅ Folder moved and renamed to 'API service'!"

      - name: 4. 💾 Commit and Push to Admin
        run: |
          cd Admin
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          
          # Folder ko add karo (space ki wajah se quotes zaroori hain)
          git add "API service/"
          
          # Agar koi change nahi hai toh skip karo
          if git diff-index --quiet HEAD; then
            echo "ℹ️ No changes to commit."
          else
            git commit -m "📦 Added System_room as 'API service' from hosting_sarvar"
            git push origin main
            echo "✅ Successfully pushed to Admin repo!"
          fi
