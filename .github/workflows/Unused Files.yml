name: 🧹 Delete Old Unused Files

on:
  workflow_dispatch: # Isse aap manually run kar sakte hain

jobs:
  delete_files:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Workshop Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 🗑️ Delete Unused Files
        run: |
          echo "Deleting old files from Workshop repo..."
          
          # Yahan un files ke raste (paths) hain jo delete karni hain
          cd Workshop/Video_Generator/Story_Generator/Story_Render/video_engine
          
          rm -f audio_mixer.py
          rm -f video_filter.py
          
          echo "✅ Unused files deleted successfully!"

      - name: 3. 💾 Commit and Push Changes
        run: |
          cd Workshop
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          
          if git diff-index --quiet HEAD; then 
            echo "⚠️ No changes to commit (files might already be deleted)."
          else 
            git commit -m "🧹 Cleaned up old unused video_engine files"
            git push
            echo "🎉 Successfully deleted old files from Workshop!"
          fi
