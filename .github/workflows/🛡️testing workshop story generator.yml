name: 🛡️testing workshop story generator

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  setup_guard:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      # ═══════════════════════════════════════════════════════════════
      # 1. CREATE MASTER GUARD FILE
      # ═══════════════════════════════════════════════════════════════
      - name: 2. 🧠 Create master_guard.py
        run: |
          cd Workshop/Video_Generator/Management/errors
          
          # नई फाइल: master_guard.py
          cat > master_guard.py << 'EOF'
          import sys
          import traceback
          import os

          class MasterErrorGuard:
              """
              🧠 Master Error Guard Controller
              यह एक AI जैसा Controller है जो सिस्टम की हर गतिविधि पर नज़र रखता है।
              इसे पहले से नहीं बताना पड़ता कि कौन सी फाइल फेल होगी। 
              जब भी कोई Exception आता है, यह खुद पहचान लेता है कि गलती किस फाइल में और किस लाइन पर हुई।
              """
              def __init__(self, telegram, logger):
                  self.tg = telegram
                  self.logger = logger

              def monitor(self, step_name, func, *args, **kwargs):
                  """
                  किसी भी फंक्शन को रैप (Wrap) करके चलाता है।
                  अगर फंक्शन में एरर आया, तो यह खुद पकड़ लेगा और ट्रेसबैक (Traceback) निकालेगा।
                  """
                  try:
                      # फंक्शन को रन करो
                      return func(*args, **kwargs)
                  except Exception as e:
                      # 🚨 एरर आया! अब जाँचो कि कहाँ आया
                      tb = traceback.extract_tb(sys.exc_info()[2])
                      
                      # ट्रेसबैक में सबसे आखिरी फाइल (जहाँ असली एरर है) ढूंढो
                      last_frame = tb[-1]
                      failed_file = os.path.basename(last_frame.filename)
                      line_no = last_frame.lineno
                      line_code = last_frame.line
                      error_msg = str(e)

                      # लॉगर में सेव करो
                      self.logger.error(f"[{step_name}] {failed_file} (Line {line_no}): {error_msg}")

                      # 📱 Telegram पर साफ-साफ रिपोर्ट भेजो
                      msg = f"🚨 <b>System Crash Detected!</b>\n\n"
                      msg += f"📍 <b>Step:</b> {step_name}\n"
                      msg += f"📂 <b>File:</b> <code>{failed_file}</code>\n"
                      msg += f"🔢 <b>Line:</b> {line_no}\n"
                      msg += f"💻 <b>Code:</b> <code>{line_code}</code>\n\n"
                      msg += f"❌ <b>Error:</b> {error_msg[:300]}\n\n"

                      # अगर FFmpeg का एरर है तो थोड़ा और डिटेल दो
                      if "FFmpeg" in error_msg or "render" in step_name.lower():
                          msg += f"<pre>{error_msg[:1000]}</pre>"

                      self.tg.send(msg)

                      # एरर को आगे बढ़ा दो ताकि स्टेप फेल हो जाए
                      raise e
          EOF
          echo "✅ master_guard.py created"

      # ═══════════════════════════════════════════════════════════════
      # 2. VERIFY STRUCTURE
      # ═══════════════════════════════════════════════════════════════
      - name: 3. 🔍 Verify Files
        run: |
          cd Workshop/Video_Generator/Management/errors
          echo "📂 Files in Management/errors/:"
          ls -la

      # ═══════════════════════════════════════════════════════════════
      # 3. COMMIT & PUSH
      # ═══════════════════════════════════════════════════════════════
      - name: 4. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Video_Generator/Management/errors/master_guard.py
          git commit -m "🛡️ Added Master Error Guard Controller" || echo "No changes"
          git push origin main || echo "Push failed"
