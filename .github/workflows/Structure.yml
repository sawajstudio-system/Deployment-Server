name: 🛠️ Auto Create Full Folder Structure

on:
  workflow_dispatch: # इसे तुम मैन्युअली (एक बार) रन करोगे

jobs:
  setup_structure:
    runs-on: ubuntu-latest
    permissions:
      contents: write # Repo में फाइलें/फोल्डर्स बनाने की परमिशन

    steps:
      - name: 📥 Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend' # तुम्हारा Private Repo
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 🚀 Create Folders & Empty Files
        run: |
          python - << 'PYEOF'
          import os

          # 📂 1. सारे फोल्डर्स की लिस्ट
          folders = [
              "Video_Generator/assets/fonts",
              "Video_Generator/Uploader/Drive",
              
              "Video_Generator/Fetching/Background/Video/API",
              "Video_Generator/Fetching/Background/Video/URL",
              "Video_Generator/Fetching/Background/Photo/API",
              "Video_Generator/Fetching/Background/Photo/URL",
              "Video_Generator/Fetching/Background/Music/API",
              "Video_Generator/Fetching/Background/Music/URL",
              
              "Video_Generator/Fetching/AI/API",
              "Video_Generator/Fetching/AI/URL",
              
              "Video_Generator/Fetching/audio_TTS/API",
              "Video_Generator/Fetching/audio_TTS/URL",
              
              "Video_Generator/Fetching/Translator/API",
              "Video_Generator/Fetching/Translator/URL",
              
              "Video_Generator/Fetching/Islamic/Hadis/API",
              "Video_Generator/Fetching/Islamic/Hadis/URL",
              "Video_Generator/Fetching/Islamic/Quran/API",
              "Video_Generator/Fetching/Islamic/Quran/URL",
              "Video_Generator/Fetching/Islamic/Dua/API",
              "Video_Generator/Fetching/Islamic/Dua/URL",
              "Video_Generator/Fetching/Islamic/Hijri_date/API",
              "Video_Generator/Fetching/Islamic/Hijri_date/URL",
              
              "Video_Generator/Fetching/Intro_Outro_CTA",
              
              "Video_Generator/Story_Generator/temp",
              "Video_Generator/Short_Generator/temp",
              "Video_Generator/Long_Generator/temp"
          ]

          # 📄 2. सारी खाली .py और .txt फाइलों की लिस्ट (ताकि स्ट्रक्चर पूरा दिखे)
          files = [
              "Video_Generator/Uploader/Drive/story_upload.py",
              
              "Video_Generator/Fetching/Background/Video/API/pexels.py",
              "Video_Generator/Fetching/Background/Video/API/pixabay.py",
              "Video_Generator/Fetching/Background/Video/API/coverr.py",
              "Video_Generator/Fetching/Background/Photo/API/pexels.py",
              "Video_Generator/Fetching/Background/Photo/API/pixabay.py",
              "Video_Generator/Fetching/Background/Photo/URL/pollinations_AI.py",
              "Video_Generator/Fetching/Background/Music/API/freesound.py",
              "Video_Generator/Fetching/Background/Music/URL/pixabay_music.py",
              
              "Video_Generator/Fetching/AI/API/openrouter_AI.py",
              "Video_Generator/Fetching/AI/API/gemini_AI.py",
              "Video_Generator/Fetching/AI/API/groq_AI.py",
              "Video_Generator/Fetching/AI/API/cohere_AI.py",
              "Video_Generator/Fetching/AI/API/nvidia_AI.py",
              "Video_Generator/Fetching/AI/API/cloudflare_AI.py",
              "Video_Generator/Fetching/AI/API/magic_AI.py",
              "Video_Generator/Fetching/AI/API/anges_AI.py",
              "Video_Generator/Fetching/AI/API/tanvo_AI.py",
              
              "Video_Generator/Fetching/audio_TTS/API/elevenlabs.py",
              "Video_Generator/Fetching/audio_TTS/URL/edge_tts.py",
              
              "Video_Generator/Fetching/Translator/URL/mymemory.py",
              
              "Video_Generator/Fetching/Islamic/Hadis/URL/fawaz.py",
              "Video_Generator/Fetching/Islamic/Quran/API/quran_foundation.py",
              "Video_Generator/Fetching/Islamic/Quran/URL/quran.py",
              "Video_Generator/Fetching/Islamic/Quran/URL/quran_audio.py",
              "Video_Generator/Fetching/Islamic/Quran/URL/quran_tafsir.py",
              "Video_Generator/Fetching/Islamic/Dua/API/ummah.py",
              "Video_Generator/Fetching/Islamic/Hijri_date/URL/hijri_date.py",
              
              "Video_Generator/Fetching/Intro_Outro_CTA/intro_AI.py",
              "Video_Generator/Fetching/Intro_Outro_CTA/outro_AI.py",
              "Video_Generator/Fetching/Intro_Outro_CTA/cta_AI.py",
              
              "Video_Generator/Story_Generator/main.py",
              "Video_Generator/Story_Generator/Story_Render.py",
              "Video_Generator/Story_Generator/requirements.txt",
              "Video_Generator/Story_Generator/.gitignore",
              
              "Video_Generator/Short_Generator/main.py",
              "Video_Generator/Short_Generator/Short_Render.py",
              "Video_Generator/Short_Generator/requirements.txt",
              "Video_Generator/Short_Generator/.gitignore",
              
              "Video_Generator/Long_Generator/main.py",
              "Video_Generator/Long_Generator/Long_Render.py",
              "Video_Generator/Long_Generator/requirements.txt",
              "Video_Generator/Long_Generator/.gitignore"
          ]

          # 1. फोल्डर्स बनाओ
          for folder in folders:
              os.makedirs(folder, exist_ok=True)
              # Git में खाली फोल्डर ट्रैक करने के लिए .gitkeep
              open(os.path.join(folder, ".gitkeep"), "a").close()

          # 2. फाइलें बनाओ
          for file in files:
              os.makedirs(os.path.dirname(file), exist_ok=True)
              open(file, "a").close()

          print("✅ सारा फोल्डर स्ट्रक्चर और खाली फाइलें तैयार हो गईं भाई!")
          PYEOF

      - name: 📤 Commit & Push changes
        run: |
          git config --global user.name "SawajStudio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          git commit -m "🚀 One-time Auto-generated folder structure for Video_Generator" || echo "No changes to commit"
          git push
