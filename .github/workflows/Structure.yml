name: 🛠️ Auto Create Folder Structure

on:
  workflow_dispatch: # तुम जब चाहो बटन दबाकर चला सकते हो

jobs:
  create_structure:
    runs-on: ubuntu-latest
    permissions:
      contents: write # यह ज़रूरी है ताकि YAML तुम्हारे रेपो में फाइलें बना सके

    steps:
      - name: 📥 Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend' # तुम्हारा Private Repo
          token: ${{ secrets.TOKEN_GITHUB }}

      - name: 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 🚀 Create Folders & Empty Files
        run: |
          python - << 'PYEOF'
          import os

          # 📂 तुम्हारा पूरा स्ट्रक्चर
          folders = [
              "Video_Generator/assets/fonts",
              "Video_Generator/Uploader/Drive",
              
              "Video_Generator/Fetching/Background_Video/API",
              "Video_Generator/Fetching/Background_Video/URL",
              "Video_Generator/Fetching/Background_Video/API_fallback",
              "Video_Generator/Fetching/Background_Video/URL_fallback",
              
              "Video_Generator/Fetching/Background_Photo/API",
              "Video_Generator/Fetching/Background_Photo/URL",
              "Video_Generator/Fetching/Background_Photo/API_fallback",
              "Video_Generator/Fetching/Background_Photo/URL_fallback",
              
              "Video_Generator/Fetching/Background_Music/API",
              "Video_Generator/Fetching/Background_Music/URL",
              "Video_Generator/Fetching/Background_Music/API_fallback",
              "Video_Generator/Fetching/Background_Music/URL_fallback",
              
              "Video_Generator/Fetching/Hadith/API",
              "Video_Generator/Fetching/Hadith/URL",
              "Video_Generator/Fetching/Hadith/API_fallback",
              "Video_Generator/Fetching/Hadith/URL_fallback",
              
              "Video_Generator/Fetching/AI/API",
              "Video_Generator/Fetching/AI/URL",
              "Video_Generator/Fetching/AI/API_fallback",
              "Video_Generator/Fetching/AI/URL_fallback",
              
              "Video_Generator/Fetching/audio_TTS/API",
              "Video_Generator/Fetching/audio_TTS/URL",
              "Video_Generator/Fetching/audio_TTS/API_fallback",
              "Video_Generator/Fetching/audio_TTS/URL_fallback",
              
              "Video_Generator/Fetching/Translator/API",
              "Video_Generator/Fetching/Translator/URL",
              "Video_Generator/Fetching/Translator/API_fallback",
              "Video_Generator/Fetching/Translator/URL_fallback",
              
              "Video_Generator/Fetching/Islamic/API",
              "Video_Generator/Fetching/Islamic/URL",
              "Video_Generator/Fetching/Islamic/API_fallback",
              "Video_Generator/Fetching/Islamic/URL_fallback",
              
              "Video_Generator/Fetching/Intro_Outro_CTA",
              
              "Video_Generator/Story_Generator/temp",
              "Video_Generator/Short_Generator/temp",
              "Video_Generator/Long_Generator/temp"
          ]

          # फोल्डर और __init__.py बनाओ
          for folder in folders:
              os.makedirs(folder, exist_ok=True)
              # हर फोल्डर में __init__.py डालो (temp और assets को छोड़कर)
              if not folder.endswith("temp") and not folder.startswith("Video_Generator/assets"):
                  open(os.path.join(folder, "__init__.py"), "a").close()
              # temp फोल्डर में .gitkeep डालो
              if folder.endswith("temp"):
                  open(os.path.join(folder, ".gitkeep"), "a").close()

          # मुख्य फाइलें बनाओ
          main_files = [
              "Video_Generator/Story_Generator/main.py",
              "Video_Generator/Story_Generator/Story_Render.py",
              "Video_Generator/Story_Generator/requirements.txt",
              "Video_Generator/Story_Generator/.gitignore",
              
              "Video_Generator/Short_Generator/main.py",
              "Video_Generator/Short_Generator/Short_Render.py",
              "Video_Generator/Short_Generator/requirements.txt",
              "Video_Generator/Short_Generator/.gitignore",
              
              "Video_Generator/Long_Generator/main.py",
              "Video_Generator/Long_Generator/Long_Render.py",
              "Video_Generator/Long_Generator/requirements.txt",
              "Video_Generator/Long_Generator/.gitignore"
          ]
          
          for file in main_files:
              open(file, "a").close()

          print("✅ सारा फोल्डर स्ट्रक्चर बन गया भाई!")
          PYEOF

      - name: 📤 Commit & Push changes
        run: |
          git config --global user.name "SawajStudio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          git commit -m "🚀 Auto-generated folder structure" || echo "No changes to commit"
          git push
