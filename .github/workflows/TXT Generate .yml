name: 📄 TXT Generator (3 Repos Dump)

on:
  workflow_dispatch:
    inputs:
      repo_target:
        description: "Which repos to dump?"
        required: true
        default: "All 3 Repos"
        type: choice
        options:
          - "All 3 Repos"
          - "Live-hosting_sarvar"
          - "Development-workshop"
          - "deployment-run"
          - "Live-hosting_sarvar + Development-workshop"
          - "Live-hosting_sarvar + deployment-run"
          - "Development-workshop + deployment-run"
      dry_run:
        description: "Dry run (no Telegram upload)?"
        required: false
        default: false
        type: boolean
  schedule:
    - cron: "30 2 * * *" # Roz subah 8:00 IST (2:30 UTC)

concurrency:
  group: txt-generator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-txt:
    name: 🚀 Generate Combined TXT
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 📝 Generate Python Script
        run: |
          cat << 'EOF' > txt_generator_run.py
          import os
          import sys
          import time
          import base64
          import logging
          import requests
          import zipfile
          from datetime import datetime, timezone

          # ── CONFIG ──────────────────────────────────────────────────────────────────
          TELEGRAM_TOKEN   = os.getenv("TELEGRAM_API_REPORT_TOKEN")
          TELEGRAM_CHAT_ID = os.getenv("TELEGRAM_API_REPORT_CHAT_ID")
          GITHUB_TOKEN     = os.getenv("TOKEN_GITHUB")

          # असली रिपॉजिटरी के नाम
          REPO_HOSTING     = "sawajstudio-system/Live-hosting_sarvar"
          REPO_DEPLOYMENT  = "sawajstudio-system/Development-workshop"
          REPO_DEVELOPMENT = "sawajstudio-system/deployment-run"

          TARGET       = os.getenv("REPO_TARGET", "All 3 Repos").strip()
          DRY_RUN      = os.getenv("DRY_RUN", "0") == "1"
          OUTPUT_FILE  = "Combined.txt"
          ZIP_FILE     = "Combined.zip"
          
          TELEGRAM_MAX_BYTES = 49 * 1024 * 1024 

          SKIP_SEGMENTS = {
              ".git", ".github", "node_modules", ".venv", "venv", "env",
              "__pycache__", ".pytest_cache", ".mypy_cache", ".tox", ".idea", ".vscode",
              "dist", "build", "target", "bin", "obj", "site-packages", ".next", ".nuxt",
              ".terraform", ".cache", "recycle"
          }

          BINARY_EXTS = {
              ".png", ".jpg", ".jpeg", ".gif", ".bmp", ".ico", ".webp", ".svg",
              ".pdf", ".zip", ".tar", ".gz", ".rar", ".7z", ".jar", ".war",
              ".exe", ".dll", ".so", ".dylib", ".bin", ".dat",
              ".mp3", ".mp4", ".wav", ".avi", ".mov", ".mkv", ".webm", ".flac",
              ".woff", ".woff2", ".ttf", ".otf", ".eot",
              ".pyc", ".pyo", ".class", ".o", ".a", ".db", ".sqlite", ".sqlite3", ".lock",
          }

          logging.basicConfig(
              level=logging.INFO,
              format="%(asctime)s │ %(levelname)-7s │ %(message)s",
              datefmt="%H:%M:%S",
          )
          log = logging.getLogger("txtgen")

          def gh_headers():
              if not GITHUB_TOKEN:
                  raise RuntimeError("TOKEN_GITHUB missing!")
              return {
                  "Authorization": f"Bearer {GITHUB_TOKEN}",
                  "Accept": "application/vnd.github.v3+json",
                  "User-Agent": "txt-generator-full/3.0",
              }

          def gh_get(url, params=None, retries=4, timeout=60):
              for attempt in range(1, retries + 1):
                  try:
                      r = requests.get(url, headers=gh_headers(), params=params, timeout=timeout)
                      if r.status_code in (403, 429):
                          reset = r.headers.get("X-RateLimit-Reset")
                          wait = max(0, int(reset) - int(time.time())) + 2 if reset else min(int(r.headers.get("Retry-After", "30")), 300)
                          log.warning(f"⏳ Rate limited ({r.status_code}). Sleep {wait}s...")
                          time.sleep(wait)
                          continue
                      return r
                  except requests.exceptions.RequestException as e:
                      if attempt == retries:
                          log.error(f"❌ Request failed after {retries} tries: {e}")
                          return None
                      backoff = 2 ** attempt
                      log.warning(f"⚠️ Retry {attempt}/{retries} in {backoff}s: {e}")
                      time.sleep(backoff)
              return None

          def should_skip(path):
              parts = path.replace("\\", "/").split("/")
              return any(seg in SKIP_SEGMENTS for seg in parts)

          def is_binary(path):
              lower = path.lower()
              return any(lower.endswith(ext) for ext in BINARY_EXTS)

          def safe_decode(b64_content):
              try:
                  raw = base64.b64decode(b64_content)
              except Exception:
                  return None
              for enc in ("utf-8", "latin-1", "cp1252"):
                  try:
                      return raw.decode(enc)
                  except UnicodeDecodeError:
                      continue
              return None

          def human_size(n):
              for unit in ("B", "KB", "MB", "GB"):
                  if n < 1024:
                      return f"{n:.1f}{unit}"
                  n /= 1024
              return f"{n:.1f}TB"

          def get_repo_info(repo):
              r = gh_get(f"https://api.github.com/repos/{repo}")
              if not r or r.status_code != 200:
                  log.error(f"❌ Repo info failed for {repo}: {r.status_code if r else 'no-response'}")
                  return None
              return r.json()

          def get_tree(repo, branch):
              log.info(f"🌳 Fetching tree for {repo}@{branch}...")
              url = f"https://api.github.com/repos/{repo}/git/trees/{branch}"
              r = gh_get(url, params={"recursive": "1"})
              if not r or r.status_code != 200:
                  log.error(f"❌ Tree fetch failed for {repo}")
                  return []
              data = r.json()
              tree = data.get("tree", [])
              return [item["path"] for item in tree if item.get("type") == "blob"]

          def fetch_file(repo, path, ref):
              url = f"https://api.github.com/repos/{repo}/contents/{path}"
              r = gh_get(url, params={"ref": ref})
              if not r or r.status_code != 200:
                  return ("fail", None)
              data = r.json()
              if data.get("type") != "file" or data.get("encoding") != "base64":
                  return ("fail", None)
              content = safe_decode(data.get("content", ""))
              if content is None:
                  return ("binary", None)
              if not content.strip():
                  return ("empty", None)
              return ("text", content)

          def write_repo_section(fo, repo):
              stats = {"text": 0, "binary": 0, "empty": 0, "fail": 0}
              info = get_repo_info(repo)
              if not info:
                  return stats

              branch = info.get("default_branch", "main")
              pushed = (info.get("pushed_at") or "")[:19].replace("T", " ")
              desc   = info.get("description") or "—"

              fo.write(f"\n\n{'#'*70}\n")
              fo.write(f"# REPO: {repo}\n")
              fo.write(f"# URL    : https://github.com/{repo}\n")
              fo.write(f"# Branch : {branch}\n")
              fo.write(f"# Pushed : {pushed}\n")
              fo.write(f"# Desc   : {desc}\n")
              fo.write(f"{'#'*70}\n\n")

              files = get_tree(repo, branch)
              log.info(f"📋 {repo}: {len(files)} total blobs found")
              selected = [f for f in files if not should_skip(f)]
              log.info(f"🎯 {repo}: {len(selected)} after skip filters")

              binary_paths = []
              for idx, path in enumerate(selected, 1):
                  if DRY_RUN:
                      fo.write(f"\n\n{'='*60}\nFILE: {repo}/{path}\n{'='*60}\n[DRY RUN]\n")
                      stats["text"] += 1
                      continue

                  if is_binary(path):
                      binary_paths.append(path)
                      stats["binary"] += 1
                      continue

                  status, content = fetch_file(repo, path, branch)
                  if status == "text":
                      fo.write(f"\n\n{'='*60}\nFILE: {repo}/{path}\n{'='*60}\n")
                      fo.write(content)
                      stats["text"] += 1
                  elif status == "binary":
                      binary_paths.append(path)
                      stats["binary"] += 1
                  elif status == "empty":
                      stats["empty"] += 1
                  else:
                      stats["fail"] += 1

                  if idx % 25 == 0 or idx == len(selected):
                      log.info(f"  {idx}/{len(selected)} (text: {stats['text']}, binary: {stats['binary']}, fail: {stats['fail']})")

              if binary_paths:
                  fo.write(f"\n\n{'─'*60}\n# BINARY FILES IN {repo}\n{'─'*60}\n")
                  for bp in binary_paths:
                      fo.write(f"#   [BINARY] {bp}\n")

              return stats

          def send_to_telegram(file_path, caption):
              if not TELEGRAM_TOKEN or not TELEGRAM_CHAT_ID:
                  log.warning("⚠️ Telegram not configured. Skipping upload.")
                  return
                  
              size = os.path.getsize(file_path)
              if size > TELEGRAM_MAX_BYTES:
                  log.error(f"❌ File {human_size(size)} exceeds Telegram limit of {human_size(TELEGRAM_MAX_BYTES)}.")
                  return

              log.info(f"📤 Uploading {os.path.basename(file_path)} ({human_size(size)}) to Telegram...")
              try:
                  with open(file_path, "rb") as f:
                      r = requests.post(
                          f"https://api.telegram.org/bot{TELEGRAM_TOKEN}/sendDocument",
                          data={"chat_id": TELEGRAM_CHAT_ID, "caption": caption[:1024]},
                          files={"document": (os.path.basename(file_path), f)},
                          timeout=300,
                      )
                  if r.status_code == 200:
                      log.info(f"✅ Telegram upload successful")
                  else:
                      log.error(f"❌ Telegram upload failed. Response: {r.text}")
              except Exception as e:
                  log.error(f"❌ Telegram network error: {e}")

          def main():
              start = time.time()
              log.info("═" * 60)
              log.info(f"📄 TXT Generator — Target: {TARGET}")
              log.info(f"🧪 Dry run mode: {DRY_RUN}")
              log.info("═" * 60)

              if not GITHUB_TOKEN:
                  log.error("❌ TOKEN_GITHUB missing!")
                  sys.exit(1)

              stats = {
                  REPO_HOSTING:     {"text": 0, "binary": 0, "empty": 0, "fail": 0},
                  REPO_DEPLOYMENT:  {"text": 0, "binary": 0, "empty": 0, "fail": 0},
                  REPO_DEVELOPMENT: {"text": 0, "binary": 0, "empty": 0, "fail": 0},
              }

              try:
                  with open(OUTPUT_FILE, "w", encoding="utf-8") as fo:
                      now = datetime.now(timezone.utc).strftime("%Y-%m-%d %H:%M:%S UTC")
                      fo.write("╔" + "═" * 68 + "╗\n")
                      fo.write(f"║  COMBINED CODE EXPORT (3 REPOS){' ' * 37}║\n")
                      fo.write("╚" + "═" * 68 + "╝\n")
                      fo.write(f"Generated : {now}\n")
                      fo.write(f"Target    : {TARGET}\n")
                      fo.write("═" * 70 + "\n")

                      # Check if the Real Name is in the target string
                      if TARGET == "All 3 Repos" or "Live-hosting_sarvar" in TARGET:
                          log.info(f"▶️  Processing {REPO_HOSTING}...")
                          stats[REPO_HOSTING] = write_repo_section(fo, REPO_HOSTING)

                      if TARGET == "All 3 Repos" or "Development-workshop" in TARGET:
                          log.info(f"▶️  Processing {REPO_DEPLOYMENT}...")
                          stats[REPO_DEPLOYMENT] = write_repo_section(fo, REPO_DEPLOYMENT)

                      if TARGET == "All 3 Repos" or "deployment-run" in TARGET:
                          log.info(f"▶️  Processing {REPO_DEVELOPMENT}...")
                          stats[REPO_DEVELOPMENT] = write_repo_section(fo, REPO_DEVELOPMENT)

                      fo.write(f"\n\n{'#'*70}\n# EXPORT SUMMARY\n{'#'*70}\n")
                      for repo_name, s in stats.items():
                          fo.write(
                              f"# {repo_name:40s} → text: {s['text']:4d}  "
                              f"binary: {s['binary']:4d}  "
                              f"empty: {s['empty']:4d}  "
                              f"fail: {s['fail']:4d}\n"
                          )
                      fo.write(f"# Total time: {time.time() - start:.1f}s\n")
                      fo.write(f"{'#'*70}\n")

              except Exception as e:
                  log.error(f"❌ Write failed: {e}")
                  sys.exit(1)

              if os.path.exists(OUTPUT_FILE) and os.path.getsize(OUTPUT_FILE) > 0:
                  txt_size = os.path.getsize(OUTPUT_FILE)
                  log.info(f"✅ Combined.txt ready: {human_size(txt_size)}")

                  log.info("🤐 Compressing to ZIP...")
                  with zipfile.ZipFile(ZIP_FILE, 'w', zipfile.ZIP_DEFLATED) as zipf:
                      zipf.write(OUTPUT_FILE, arcname="Combined.txt")
                  
                  zip_size = os.path.getsize(ZIP_FILE)
                  log.info(f"✅ ZIP ready: {human_size(zip_size)}")

                  if not DRY_RUN:
                      caption = (
                          f"📄 FULL DUMP ({TARGET})\n"
                          f"📦 Raw Size: {human_size(txt_size)} | Zipped: {human_size(zip_size)}\n"
                          f"📊 {REPO_HOSTING}: {stats[REPO_HOSTING]['text']} txt\n"
                          f"📊 {REPO_DEPLOYMENT}: {stats[REPO_DEPLOYMENT]['text']} txt\n"
                          f"📊 {REPO_DEVELOPMENT}: {stats[REPO_DEVELOPMENT]['text']} txt"
                      )
                      send_to_telegram(ZIP_FILE, caption)
                  else:
                      log.info("🧪 Dry run enabled. Skipping Telegram upload.")

                  os.remove(OUTPUT_FILE)
                  os.remove(ZIP_FILE)
                  log.info("🧹 Temp files removed")

              else:
                  log.warning("⚠️ Generated file is empty or missing. Nothing to send.")

              log.info(f"🏁 Done in {time.time() - start:.1f}s")
              return 0

          if __name__ == "__main__":
              sys.exit(main())
          EOF

      - name: 🚀 Run TXT Generator
        env:
          TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          REPO_TARGET: ${{ inputs.repo_target || 'All 3 Repos' }}
          DRY_RUN: ${{ inputs.dry_run == true && '1' || '0' }}
        run: |
          echo "🎯 Target: $REPO_TARGET"
          echo "🧪 Dry run: $DRY_RUN"
          python txt_generator_run.py

      - name: 🧹 Cleanup temp files
        if: always()
        run: |
          rm -f Combined.txt Combined.zip txt_generator_run.py || true
          echo "✅ Cleanup done"

      - name: 📊 Summary
        if: always()
        run: |
          echo "### 📄 TXT Generator Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** \`${{ inputs.repo_target || 'All 3 Repos' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** \`${{ inputs.dry_run || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
