name: 🎬Video-Test-Factory

on:
  workflow_dispatch:

# Ek saath 2 videos na chalein
concurrency:
  group: video-test-factory
  cancel-in-progress: false

jobs:
  video_pipeline:
    runs-on: ubuntu-latest
    timeout-minutes: 90

    env:
      # ── 🟢 CORE ──
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

      # ── ☁️ GOOGLE DRIVE ──
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}

      # ── 🧠 AI MODELS ──
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}

      # ── 🎬 MEDIA & AUDIO ──
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}

    steps:
      # ═══════════════════════════════════════════════════════════════
      # 1. Development repo checkout
      # ═══════════════════════════════════════════════════════════════
      - name: 1. 📥 Checkout Development (Factory)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}

      # ═══════════════════════════════════════════════════════════════
      # 2. Python setup
      # ═══════════════════════════════════════════════════════════════
      - name: 2. 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          cache: 'pip'

      # ═══════════════════════════════════════════════════════════════
      # 3. FFmpeg + Fonts
      # ═══════════════════════════════════════════════════════════════
      - name: 3. 📦 Install FFmpeg & Fonts
        run: |
          echo "⏳ Installing System Dependencies..."
          sudo apt-get update -qq
          sudo apt-get install -y -qq ffmpeg fonts-noto fonts-noto-color-emoji fontconfig
          sudo fc-cache -f -v
          echo "✅ FFmpeg and Fonts installed!"

      # ═══════════════════════════════════════════════════════════════
      # 4. Python packages
      # ═══════════════════════════════════════════════════════════════
      - name: 4. 📥 Install Python Packages
        run: |
          echo "⏳ Installing Python Requirements..."
          python -m pip install --upgrade pip
          pip install -r Factory/Management/story/requirements.txt
          echo "✅ Packages installed!"

      # ═══════════════════════════════════════════════════════════════
      # 5. Verify structure
      # ═══════════════════════════════════════════════════════════════
      - name: 5. 🧪 Verify Factory Structure
        run: |
          echo "════════════════════════════════════════"
          echo "🔍 Checking Factory Structure:"
          echo "════════════════════════════════════════"
          if [ ! -f "Factory/Management/story/main.py" ]; then
            echo "❌ ERROR: main.py not found!"
            exit 1
          fi
          echo "✅ main.py found"
          echo ""
          echo "📁 Structure:"
          find Factory/Management -maxdepth 2 -type d | sort

      # ═══════════════════════════════════════════════════════════════
      # 6. Run video pipeline
      # ═══════════════════════════════════════════════════════════════
      - name: 6. 🎬 Run Video Pipeline
        id: video_run
        working-directory: Factory/Management/story
        run: |
          echo "🚀 Starting Video Generation..."
          python -u main.py

      # ═══════════════════════════════════════════════════════════════
      # 7. Check output
      # ═══════════════════════════════════════════════════════════════
      - name: 7. 📤 Check Output Video
        if: always()
        run: |
          VIDEO_PATH="Factory/Management/story/temp/Final_Story.mp4"
          if [ -f "$VIDEO_PATH" ]; then
            echo "✅ Video bana!"
            du -h "$VIDEO_PATH"
            echo "VIDEO_READY=true" >> $GITHUB_ENV
          else
            echo "❌ Video nahi bana"
            echo "VIDEO_READY=false" >> $GITHUB_ENV
            echo ""
            echo "📂 temp/ folder check:"
            ls -la Factory/Management/story/temp/ 2>/dev/null || echo "temp/ folder nahi mila"
          fi

      # ═══════════════════════════════════════════════════════════════
      # 8. Upload to Artifacts (backup)
      # ═══════════════════════════════════════════════════════════════
      - name: 8. 📤 Upload Video Artifact
        if: env.VIDEO_READY == 'true'
        uses: actions/upload-artifact@v4
        with:
          name: Factory-Video-Output
          path: Factory/Management/story/temp/Final_Story.mp4
          retention-days: 3

      # ═══════════════════════════════════════════════════════════════
      # 9. Telegram Error Alert
      # ═══════════════════════════════════════════════════════════════
      - name: 9. 🚨 Telegram Error Alert
        if: failure()
        run: |
          curl -s -X POST "https://api.telegram.org/bot${{ secrets.TELEGRAM_API_REPORT_TOKEN }}/sendMessage" \
            -d "chat_id=${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}" \
            -d "text=❌ <b>Factory Video Failed!</b>%0A%0A<b>Repo:</b> Development%0A<b>Path:</b> Factory/Management/story/%0A<b>Action:</b> Check GitHub Logs" \
            -d "parse_mode=HTML" || true

      # ═══════════════════════════════════════════════════════════════
      # 10. Cleanup
      # ═══════════════════════════════════════════════════════════════
      - name: 10. 🧹 Cleanup
        if: always()
        run: |
          rm -rf Factory/Management/story/temp 2>/dev/null || true
          echo "✅ Cleanup done"
