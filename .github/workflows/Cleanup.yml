name: 🔄 Emergency Restore Project
on:
  workflow_dispatch:
permissions:
  contents: write
jobs:
  restore:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Development
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Development'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Development'
          fetch-depth: 10
      - name: Restore Factory
        run: |
          cd Development
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          # Yeh pichle commit (jisme project tha) se sari files wapas le aayega
          git checkout HEAD~1 -- .
          git add .
          git commit -m "🔄 Restore: Pura project wapas laaya gaya"
          git push origin main
