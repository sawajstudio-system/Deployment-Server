name: 📄 TXT Generator (3 Repos Dump)

on:
  workflow_dispatch:
    inputs:
      repo_target:
        description: "Which repos to dump?"
        required: true
        default: "All 3 Repos"
        type: choice
        options:
          - "All 3 Repos"
          - "Hosting Only"
          - "Deployment-Server Only"
          - "Development Only"
          - "Hosting + Deployment-Server"
          - "Hosting + Development"
          - "Deployment-Server + Development"
      dry_run:
        description: "Dry run (no Telegram upload)?"
        required: false
        default: false
        type: boolean
  schedule:
    # Har roz raat 2 baje UTC (subah 7:30 IST) auto-run
    - cron: "30 2 * * *"

concurrency:
  group: txt-generator
  cancel-in-progress: false

permissions:
  contents: read

jobs:
  generate-txt:
    name: 🚀 Generate Combined TXT
    runs-on: ubuntu-latest
    timeout-minutes: 45

    env:
      TZ: Asia/Kolkata
      PYTHONUNBUFFERED: "1"

    steps:
      - name: 📥 Checkout repository
        uses: actions/checkout@v4

      - name: 🐍 Setup Python 3.11
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"
          cache: "pip"

      - name: 📦 Install dependencies
        run: |
          python -m pip install --upgrade pip
          pip install requests

      - name: 🔍 Verify script exists
        run: |
          if [ ! -f "System_room/Git_room/txt_generator.py" ]; then
            echo "❌ Script not found at System_room/Git_room/txt_generator.py"
            exit 1
          fi
          echo "✅ Script found"

      - name: 🚀 Run TXT Generator
        env:
          TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
          TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
          REPO_TARGET: ${{ inputs.repo_target || 'All 3 Repos' }}
          DRY_RUN: ${{ inputs.dry_run && '1' || '0' }}
        run: |
          echo "🎯 Target: $REPO_TARGET"
          echo "🧪 Dry run: $DRY_RUN"
          python System_room/Git_room/txt_generator.py

      - name: 🧹 Cleanup temp files
        if: always()
        run: |
          rm -f Combined.txt /tmp/part_*.txt || true
          echo "✅ Cleanup done"

      - name: 📊 Summary
        if: always()
        run: |
          echo "### 📄 TXT Generator Run" >> $GITHUB_STEP_SUMMARY
          echo "" >> $GITHUB_STEP_SUMMARY
          echo "- **Target:** \`${{ inputs.repo_target || 'All 3 Repos' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Dry Run:** \`${{ inputs.dry_run || 'false' }}\`" >> $GITHUB_STEP_SUMMARY
          echo "- **Status:** ${{ job.status }}" >> $GITHUB_STEP_SUMMARY
          echo "- **Time (UTC):** $(date -u '+%Y-%m-%d %H:%M:%S')" >> $GITHUB_STEP_SUMMARY
