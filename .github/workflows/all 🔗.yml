name: all🔗

on:
  workflow_dispatch:
    inputs:
      api_test:
        description: 'API Test (Kaunsi API chalani hai?)'
        type: choice
        default: 'None'
        options:
          - 'None'
          - 'ALL Tests (Sab)'
          - 'Background Remover'  # 🟢 NAYA OPTION ADDED
          - 'Cloudflare'
          - 'Anges'
          - 'Gemini'
          - 'Groq'
          - 'UMMAH'
          - 'Cohere'
          - 'NVIDIA'
          - 'OpenRouter'
          - 'Magic'
          - 'Tanvo'
          - 'Quran'
          - 'Quran Audio'
          - 'Quran Tafsir'
          - 'Quran Foundation'
          - 'Hadees'
          - 'Hijri Date'
          - 'Pexels'
          - 'Pixabay'
          - 'Coverr'
          - 'AI Image'
          - 'Natural Sound'
          - 'ElevenLabs'
          - 'Cloudinary'
          - 'Jokes'
          - 'Quotes'
          - 'Translator'
          - 'Telegram'
          - 'GitHub'
          - 'History Cleaner'
          - 'Test All GDrive'

      zip_file:
        description: 'ZIP File (Kis repo ka ZIP chahiye?)'
        type: choice
        default: 'None'
        options:
          - 'None'
          - 'All 3 Repos'
          - 'Hosting Only'
          - 'Deployment-Server Only'
          - 'Development Only'
          - 'Hosting + Development'

      txt_file:
        description: 'TXT File (Kis repo ka TXT chahiye?)'
        type: choice
        default: 'None'
        options:
          - 'None'
          - 'All 3 Repos'
          - 'Hosting Only'
          - 'Deployment-Server Only'
          - 'Development Only'
          - 'Hosting + Development'

jobs:
  run_tests:
    runs-on: ubuntu-latest
    timeout-minutes: 120

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      ANGES_API_KEY: ${{ secrets.ANGES_API_KEY }}
      OPENROUTER_API_KEY: ${{ secrets.OPENROUTER_API_KEY }}
      GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
      GEMINI_API_KEY: ${{ secrets.GEMINI_API_KEY }}
      COHERE_API_KEY: ${{ secrets.COHERE_API_KEY }}
      NVIDIA_API_KEY: ${{ secrets.NVIDIA_API_KEY }}
      MAGICHOUR_API_KEY: ${{ secrets.MAGICHOUR_API_KEY }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}
      ELEVENLABS_API_KEY: ${{ secrets.ELEVENLABS_API_KEY }}
      PEXELS_API_KEY: ${{ secrets.PEXELS_API_KEY }}
      PIXABAY_API_KEY: ${{ secrets.PIXABAY_API_KEY }}
      COVERR_API_KEY: ${{ secrets.COVERR_API_KEY }}
      CLOUDINARY_CLOUD_NAME: ${{ secrets.CLOUDINARY_CLOUD_NAME }}
      CLOUDINARY_API_KEY: ${{ secrets.CLOUDINARY_API_KEY }}
      CLOUDINARY_API_SECRET: ${{ secrets.CLOUDINARY_API_SECRET }}
      UMMAH_API_KEY: ${{ secrets.UMMAH_API_KEY }}
      QF_CLIENT_ID: ${{ secrets.QF_CLIENT_ID }}
      QF_CLIENT_SECRET: ${{ secrets.QF_CLIENT_SECRET }}
      QF_ENV: ${{ secrets.QF_ENV }}
      GDRIVE_CLIENT_ID: ${{ secrets.GDRIVE_CLIENT_ID }}
      GDRIVE_CLIENT_SECRET: ${{ secrets.GDRIVE_CLIENT_SECRET }}
      GDRIVE_REFRESH_TOKEN: ${{ secrets.GDRIVE_REFRESH_TOKEN }}
      GDRIVE_F_SHORT_ID: ${{ secrets.GDRIVE_F_SHORT_ID }}
      GDRIVE_F_LONG_ID: ${{ secrets.GDRIVE_F_LONG_ID }}
      GDRIVE_F_STORY_ID: ${{ secrets.GDRIVE_F_STORY_ID }}

    steps:
      # 🟢 1. Admin Repo Checkout
      - name: 1. 📥 Checkout Admin Repo
        uses: actions/checkout@v4

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 📦 Install Requirements
        run: |
          pip install requests
          pip install Pillow numpy

      # 🟢 NAYA STEP: Background Remover (Directly from your old YML)
      - name: 4. 🪄 Background Remover (Only if selected)
        if: ${{ inputs.api_test == 'Background Remover' }}
        run: |
          python - << 'EOF'
          from PIL import Image
          import numpy as np
          import os

          input_file = 'logo.png'
          output_file = 'transparent_logo.png'

          if not os.path.exists(input_file):
              print('⚠️ logo.png nahi mila root folder mein. Skip kar rahe hain.')
              exit(0)

          img = Image.open(input_file).convert('RGBA')
          data = np.array(img)

          r, g, b, a = data[:,:,0], data[:,:,1], data[:,:,2], data[:,:,3]

          # 🎯 Advanced Green Background Mask
          mask = (g.astype(int) > r.astype(int) + 15) & (g.astype(int) > b.astype(int) + 15) & (g > 50)
          data[mask, 3] = 0

          # 🪄 Spill Suppression
          spill_mask = (~mask) & (g.astype(int) > (r.astype(int) + b.astype(int)) / 2)
          data[spill_mask, 1] = np.minimum(data[spill_mask, 0], data[spill_mask, 2])

          transparent_img = Image.fromarray(data)
          transparent_img.save(output_file)
          print('✅ Green background removed cleanly without any logo damage!')
          EOF

      - name: 5. 🚀 Send Transparent Logo to Telegram
        if: ${{ inputs.api_test == 'Background Remover' && hashFiles('transparent_logo.png') != '' }}
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@transparent_logo.png" \
            -F "caption=⚡ Perfect! Green background saaf hat gaya aur logo bilkul safe hai." \
            || true

      - name: 6. 💾 Commit Transparent Logo to Repo
        if: ${{ inputs.api_test == 'Background Remover' && hashFiles('transparent_logo.png') != '' }}
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add transparent_logo.png
          git commit -m "⚡ Cleaned green background without damaging logo" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} || echo "No changes"

      # 🟢 Aapka purana test execution logic yahan se shuru hota hai
      - name: 7. 🚀 Execute Tests (Local File Paths)
        # Ye tabhi chalega jab Background Remover select NAHI kiya ho
        if: ${{ inputs.api_test != 'Background Remover' || inputs.zip_file != 'None' || inputs.txt_file != 'None' }}
        env:
          API_TEST: ${{ inputs.api_test }}
          ZIP_FILE: ${{ inputs.zip_file }}
          TXT_FILE: ${{ inputs.txt_file }}
        run: |
          python << 'PYEOF'
          import os, sys, subprocess, requests, time

          TG_TOKEN    = os.environ.get("TELEGRAM_API_REPORT_TOKEN")
          TG_CHAT     = os.environ.get("TELEGRAM_API_REPORT_CHAT_ID")
          
          API_TEST = os.environ.get("API_TEST", "None")
          ZIP_FILE = os.environ.get("ZIP_FILE", "None")
          TXT_FILE = os.environ.get("TXT_FILE", "None")

          BASE_DIR = os.getcwd() 

          # 🟢 FIXED PATHS
          ALL_MAP = {
              "Cloudflare":        "API service/AAPI/01_ai_models/cloudflare.py",
              "Anges":             "API service/AAPI/01_ai_models/anges.py",
              "Gemini":            "API service/AAPI/01_ai_models/gemini.py",
              "Groq":              "API service/AAPI/01_ai_models/groq.py",
              "UMMAH":             "API service/AAPI/Islamic/UMMAH.py",
              "Cohere":            "API service/AAPI/01_ai_models/cohere.py",
              "NVIDIA":            "API service/AAPI/01_ai_models/nvidia.py",
              "OpenRouter":        "API service/AAPI/01_ai_models/openrouter.py",
              "Magic":             "API service/AAPI/01_ai_models/magic.py",
              "Tanvo":             "API service/AAPI/02_audio_media/tanvo.py",
              "Quran":             "API service/URL/Islamic/quran.py",
              "Quran Audio":       "API service/URL/Islamic/quran_audio.py",
              "Quran Tafsir":      "API service/URL/Islamic/quran_tafsir.py",
              "Quran Foundation":  "API service/AAPI/Islamic/quran_foundation.py",
              "Hadees":            "API service/URL/Islamic/hadees.py",
              "Hijri Date":        "API service/URL/Islamic/hijri_date.py",
              "Pexels":            "API service/AAPI/05_video_services/pexels.py",
              "Pixabay":           "API service/AAPI/05_video_services/pixabay.py",
              "Coverr":            "API service/AAPI/05_video_services/coverr.py",
              "AI Image":          "API service/URL/AI/ai_image.py",
              "Natural Sound":     "API service/AAPI/02_audio_media/natural_sound.py",
              "ElevenLabs":        "API service/AAPI/02_audio_media/elevenlabs_test.py",
              "Cloudinary":        "API service/AAPI/02_audio_media/cloudinary.py",
              "Jokes":             "API service/URL/Other/jokes.py",
              "Quotes":            "API service/URL/Other/quotes.py",
              "Translator":        "API service/URL/Other/translator.py",
              "Telegram":          "API service/AAPI/03_integrations/telegram.py",
              "GitHub":            "Git/github.py",
              "History Cleaner":   "Git/history_cleaner.py",
              "Test All GDrive":   "API service/AAPI/02_audio_media/test_gdrive_all.py",
          }

          selected_tests = []

          if API_TEST != "None" and API_TEST != "Background Remover":
              if API_TEST == "ALL Tests (Sab)":
                  for name in ALL_MAP.keys():
                      selected_tests.append(name)
              elif API_TEST in ALL_MAP:
                  selected_tests.append(API_TEST)

          if ZIP_FILE != "None":
              selected_tests.append("ZIP Generator")
          if TXT_FILE != "None":
              selected_tests.append("TXT Generator")

          selected_tests = list(dict.fromkeys(selected_tests))

          if not selected_tests:
              print("⚠️ Koi API test ya ZIP/TXT option select nahi kiya gaya.")
              sys.exit(0)

          def tg(msg):
              if not TG_TOKEN or not TG_CHAT: return
              try:
                  requests.post(f"https://api.telegram.org/bot{TG_TOKEN}/sendMessage",
                                json={"chat_id": TG_CHAT, "text": msg[:4000]}, timeout=10)
              except Exception: pass

          total = len(selected_tests)
          tg(f"🚀 Started (Local Mode)\nSelected Tests: {total}")
          results = []
          start_all = time.time()

          for idx, name in enumerate(selected_tests, 1):
              print(f"\n[{idx}/{total}] Processing: {name}")
              
              if name == "ZIP Generator":
                  os.environ["REPO_TARGET"] = ZIP_FILE
                  file_path = os.path.join(BASE_DIR, "Git", "zip_generator.py")
              elif name == "TXT Generator":
                  os.environ["REPO_TARGET"] = TXT_FILE
                  file_path = os.path.join(BASE_DIR, "Git", "txt_generator.py")
              else:
                  os.environ["REPO_TARGET"] = "All 3 Repos" 
                  rel_path = ALL_MAP[name]
                  file_path = os.path.join(BASE_DIR, rel_path)

              t0 = time.time()
              status, duration, reason = None, 0, ""

              if not os.path.exists(file_path):
                  status, reason = "SKIP", f"file not found: {file_path}"
                  print(f"❌ {reason}")
              else:
                  with open(file_path, "rb") as f:
                      content = f.read()
                  
                  if len(content) < 10:
                      status, reason = "SKIP", "empty file"
                  else:
                      with open("/tmp/run_me.py", "wb") as f:
                          f.write(content)
                      sys.stdout.flush()
                      try:
                          timeout_sec = 300 if name in ["ZIP Generator", "TXT Generator"] else 180
                          rc = subprocess.run([sys.executable, "/tmp/run_me.py"], timeout=timeout_sec).returncode
                          status = "PASS" if rc == 0 else "FAIL"
                      except subprocess.TimeoutExpired:
                          status = "TIMEOUT"
                      except Exception as e:
                          status, reason = "FAIL", str(e)[:60]
                      finally:
                          if os.path.exists("/tmp/run_me.py"): os.remove("/tmp/run_me.py")

              duration = time.time() - t0
              results.append((name, status, duration, reason))
              print(f"{name}: {status} ({duration:.1f}s) {reason if reason else ''}")

          passed  = sum(1 for _, s, *_ in results if s == "PASS")
          failed  = sum(1 for _, s, *_ in results if s == "FAIL")
          skipped = sum(1 for _, s, *_ in results if s == "SKIP")
          timeout = sum(1 for _, s, *_ in results if s == "TIMEOUT")
          total_time = time.time() - start_all

          print(f"\nSUMMARY: Pass: {passed} | Fail: {failed} | Skip: {skipped} | Timeout: {timeout} | {total_time:.0f}s")
          tg(f"🏁 All Tests Completed\n✅ Pass: {passed}\n❌ Fail: {failed}\n⏭️ Skip: {skipped}\n⏰ Timeout: {timeout}")
          PYEOF

      - name: 8. 🧹 Cleanup
        if: always()
        run: rm -f /tmp/run_me.py
