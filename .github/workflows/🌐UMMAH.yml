name: 🌐 UMMAH API Test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      UMMAH_API_KEY: ${{ secrets.UMMAH_API_KEY }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 2. 📦 Install requests
        run: pip install requests
        
      - name: 3. 🪶 Fetch & Run UMMAH Test
        run: |
          echo "📥 Downloading UMMAH.py from Islamic folder..."
          set +e
          # Path exactly Islamic folder ka hai
          curl -sSL -f -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/URL_room/Islamic/UMMAH.py" \
            -o /tmp/UMMAH.py
          
          if [ -s /tmp/UMMAH.py ]; then
            echo "✅ File mil gayi!"
            python /tmp/UMMAH.py
          else
            echo "❌ File download fail ho gaya."
            exit 1
          fi
          
          rm -f /tmp/UMMAH.py
