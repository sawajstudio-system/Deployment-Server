name: 🛠️ Dono Repo Bug Fix

on:
  workflow_dispatch:        # मैन्युअली रन करने के लिए

jobs:
  auto_fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 🐛 Fix Bugs and Push Changes
        run: |
          cd Backend/Video_Generator/Story_Generator
          
          # 1. पुरानी फाइल डिलीट करें
          rm -f Story_Render.py
          
          # 2. render_main.py में इम्पोर्ट्स फिक्स करें (Bina file delete kiye, sirf lines badlein)
          sed -i 's/from tools\./from .tools./g' Story_Render/render_main.py
          sed -i 's/from subtitle\./from .subtitle./g' Story_Render/render_main.py
          sed -i 's/from video_engine\./from .video_engine./g' Story_Render/render_main.py
          sed -i 's/from config\./from .config./g' Story_Render/render_main.py
          
          # 3. बाकी सब-फाइल्स में इम्पोर्ट्स फिक्स करें
          sed -i 's/from config\./from ..config./g' Story_Render/subtitle/intro_builder.py
          sed -i 's/from config\./from ..config./g' Story_Render/subtitle/outro_builder.py
          sed -i 's/from config\./from ..config./g' Story_Render/subtitle/cta_builder.py
          sed -i 's/from config\./from ..config./g' Story_Render/subtitle/ass_builder.py
          
          # 4. जलभुल (Overlap) वाला +0.2 हटाएं
          sed -i 's/w_end = start_t + ((i + 1) \* t_per_word) + 0.2/w_end = start_t + ((i + 1) * t_per_word)/g' Story_Render/subtitle/ass_builder.py
          
          # 5. ffmpeg_render.py का इम्पोर्ट फिक्स करें
          sed -i 's/from video_engine\./from ./g' Story_Render/video_engine/ffmpeg_render.py

          # अब इन बदलावों को GitHub पर सेव (Commit & Push) करें
          cd ../..
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          
          if git diff-index --quiet HEAD; then
            echo "⚠️ No changes needed, already fixed."
          else
            git commit -m "🛠️ Auto-Fixed Module Imports and Jumbled Text Bug"
            git push
            echo "🎉 Fixes successfully pushed to Backend Repo!"
          fi
