name: 🛠️(Auto-Repair)

on:
  workflow_dispatch:        # मैन्युअली रन करने के लिए

jobs:
  auto_fix:
    runs-on: ubuntu-latest
    timeout-minutes: 10

    env:
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 📥 Checkout Backend Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Backend'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Backend'

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 3. 🔧 Overwrite Backend Files (Speed & AI Fixes)
        run: |
          cd Backend/Video_Generator/Story_Generator
          
          # 1. पुरानी गलत फाइलों को डिलीट करें
          rm -f Story_Render.py
          
          # 2. main.py (3 वीडियो + पैरेलल डाउनलोड + AI Script)
          cat << 'EOF' > main.py
          #!/usr/bin/env python3
          import os, sys, requests, subprocess
          from concurrent.futures import ThreadPoolExecutor
          BASE_DIR = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
          sys.path.insert(0, BASE_DIR)
          from Fetching.Islamic.Hadis.URL_fallback import fawaz
          from Fetching.Translator.URL_fallback import mymemory
          from Fetching.Intro_Outro_CTA.API_fallback import intro_AI, outro_AI, cta_AI
          from Fetching.audio_TTS.API_fallback import elevenlabs
          from Fetching.audio_TTS.URL_fallback import edge_tts
          from Fetching.Background.Video.API_fallback import pexels, pixabay, coverr
          from Fetching.Background.Video.URL_fallback import gradient
          from Fetching.Background.Music.API_fallback import freesound
          from Fetching.Background.Music.URL_fallback import pixabay_music
          from Uploader.Drive.story_upload import upload_to_drive
          from Story_Render import build_and_render_story
          from Story_Render.tools.audio_helper import get_audio_duration
          from Fetching.AI.API_fallback import ai_fallback 

          def send_telegram(message):
              token = os.getenv("TELEGRAM_API_REPORT_TOKEN")
              chat_id = os.getenv("TELEGRAM_API_REPORT_CHAT_ID")
              if not token or not chat_id: return
              try:
                  url = f"https://api.telegram.org/bot{token}/sendMessage"
                  requests.post(url, json={"chat_id": chat_id, "text": message, "parse_mode": "HTML"}, timeout=10)
              except Exception: pass

          def download_single_video(args):
              i, query, clip_duration, clip_path = args
              print(f"📥 Fetching Video {i+1} for: {query}")
              success = pexels.fetch(query=query, duration=clip_duration, output_path=clip_path)
              if not success: success = pixabay.fetch(query=query, duration=clip_duration, output_path=clip_path)
              if not success: success = coverr.fetch(query=query, duration=clip_duration, output_path=clip_path)
              if not success: success = gradient.fetch(duration=clip_duration, output_path=clip_path)
              return success

          def run_pipeline():
              print("═" * 60)
              print("🎬 STARTING STORY VIDEO PIPELINE (FAST MODE)")
              send_telegram("🚀 <b>Story Video Pipeline Started!</b>")
              os.makedirs("temp", exist_ok=True)

              hadith = fawaz.fetch()
              if not hadith: return
              english_text = hadith.get("english", "")

              # 🟢 AI से 40-55 सेकंड की स्क्रिप्ट (100-130 words)
              prompt = f"Translate to Hindi and add a short moral lesson. Total 100-130 words. Only Hindi text.\n\nHadith: {english_text}"
              hindi_text = ai_fallback.generate_text(prompt, max_tokens=350)
              if not hindi_text: hindi_text = mymemory.translate(english_text)

              intro_text = intro_AI.generate_intro()
              outro_text = outro_AI.generate_outro()
              cta_text = cta_AI.generate_cta()

              send_telegram("4. Voice (आवाज़) बन रही है...")
              voice_path = "temp/voice.mp3"
              tts_text = f"हदीस शरीफ। {hindi_text}"
              success = elevenlabs.generate(tts_text, voice_path)
              if not success: success = edge_tts.generate(tts_text, voice_path)
              if not success: return
              duration = get_audio_duration(voice_path)
              
              send_telegram("5. 3 अलग-अलग Islamic Videos डाउनलोड हो रहे हैं...")
              final_bg_video = "temp/bg_video.mp4"
              concat_list = "temp/concat_list.txt"
              
              queries = ["islamic mosque architecture", "holy quran book pages", "islamic calligraphy nature"]
              clip_duration = (duration + 2) / 3 
              
              download_tasks = [(i, q, clip_duration, f"temp/bg_clip_{i}.mp4") for i, q in enumerate(queries)]
              clip_paths = []
              
              with ThreadPoolExecutor(max_workers=3) as executor:
                  results = list(executor.map(download_single_video, download_tasks))
                  
              with open(concat_list, "w") as f:
                  for i, res in enumerate(results):
                      if res:
                          clip_path = f"temp/bg_clip_{i}.mp4"
                          clip_paths.append(clip_path)
                          f.write(f"file '{os.path.abspath(clip_path)}'\n")

              if clip_paths:
                  print("🔗 Merging videos (Ultrafast)...")
                  # 🟢 सुपरफास्ट मर्जिंग
                  merge_cmd = f'ffmpeg -y -f concat -safe 0 -i "{concat_list}" -c:v libx264 -preset ultrafast -crf 30 -threads 0 "{final_bg_video}"'
                  subprocess.run(merge_cmd, shell=True, capture_output=True)
              else:
                  final_bg_video = None

              send_telegram("6. Background Music लाया जा रहा है...")
              music_path = "temp/music.mp3"
              success_music = freesound.fetch(duration=duration, output_path=music_path)
              if not success_music: pixabay_music.fetch(duration=duration, output_path=music_path)

              send_telegram("7. Final Video Render हो रही है...")
              final_video_path = "temp/Final_Story.mp4"
              
              render_success = build_and_render_story(
                  bg_video=final_bg_video, music_path=music_path, voice_path=voice_path,
                  hadith=hadith, hindi_text=hindi_text, intro_text=intro_text,
                  outro_text=outro_text, cta_text=cta_text, output_path=final_video_path
              )
              if not render_success: return

              send_telegram("8. Google Drive पर Upload हो रही है...")
              drive_link = upload_to_drive(final_video_path)
              if drive_link:
                  send_telegram(f"🎉 <b>Video Ready!</b>\n📥 <a href='{drive_link}'>Click here to view</a>")

              try:
                  for file in os.listdir("temp"):
                      file_path = os.path.join("temp", file)
                      if os.path.isfile(file_path): os.remove(file_path)
              except Exception: pass

          if __name__ == "__main__":
              run_pipeline()
          EOF

          # 3. ffmpeg_render.py (Superfast render + Threads + 24fps)
          cat << 'EOF' > Story_Render/video_engine/ffmpeg_render.py
          import os, subprocess, sys
          from .logo_watermark import get_logo_filter

          def render_final_video(bg_video, music_path, voice_path, master_ass_path, cta_image_path, duration, output_path="temp/Final_Story.mp4"):
              print("🎬 [ffmpeg_render] Starting Fast Render...")
              sys.stdout.flush()
              if not bg_video or not os.path.exists(bg_video) or not os.path.exists(voice_path): return None
              logo_scale_filter, logo_path = get_logo_filter()
              cmd_list = ["ffmpeg", "-y", "-stream_loop", "-1", "-i", bg_video, "-i", voice_path]
              has_music = os.path.exists(music_path) and os.path.getsize(music_path) > 0
              if has_music: cmd_list.extend(["-i", music_path])
              cmd_list.extend(["-loop", "1", "-i", cta_image_path])
              cta_idx = 3 if has_music else 2
              has_logo = bool(logo_scale_filter)
              if has_logo:
                  cmd_list.extend(["-i", logo_path])
                  logo_idx = 4 if has_music else 3
              v_filters = "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920[bg];"
              current_v_out = "bg"
              if has_logo:
                  v_filters += f"[{logo_idx}:v]{logo_scale_filter}[logo];"
                  v_filters += f"[{current_v_out}][logo]overlay=W-w-40:40[bg_with_logo];"
                  current_v_out = "bg_with_logo"
              abs_ass_path = os.path.abspath(master_ass_path)
              v_filters += f"[{current_v_out}]subtitles='{abs_ass_path}':force_style='Fontname=Noto Sans Devanagari'[v_sub];"
              cta_start_time = max(0, duration - 4.5)
              v_filters += f"[v_sub][{cta_idx}:v]overlay=0:0:enable='gte(t,{cta_start_time})'[v_out];"
              a_filters = "[1:a]volume=1.0[a1]; [2:a]volume=0.2[a2]; [a1][a2]amix=inputs=2:duration=first[a_out]" if has_music else "[1:a]volume=1.0[a_out]"
              
              cmd_list.extend([
                  "-filter_complex", f"{v_filters} {a_filters}", 
                  "-map", "[v_out]", "-map", "[a_out]", 
                  # 🟢 SUPERFAST RENDERING MAGIC
                  "-c:v", "libx264", "-preset", "ultrafast", "-crf", "30", 
                  "-threads", "0", "-r", "24",
                  "-c:a", "aac", "-b:a", "128k", 
                  "-t", f"{duration:.2f}", "-shortest", output_path
              ])
              try:
                  result = subprocess.run(cmd_list, capture_output=True, text=True)
                  return output_path if result.returncode == 0 else None
              except Exception: return None
          EOF

          # 4. logo_watermark.py (Transparent)
          cat << 'EOF' > Story_Render/video_engine/logo_watermark.py
          import os
          def get_logo_filter(logo_path="assets/logo.png", logo_width=150, opacity=0.8, margin=40):
              if not os.path.exists(logo_path): return "", ""
              return f"scale={logo_width}:-1,format=rgba,colorchannelmixer=aa={opacity}", logo_path
          EOF

          # 5. cta_generator.py (Button Image)
          cat << 'EOF' > Story_Render/tools/cta_generator.py
          import os
          from PIL import Image, ImageDraw, ImageFont
          def generate_cta_image(output_path="temp/cta_image.png"):
              img = Image.new('RGBA', (1080, 1920), (0, 0, 0, 0))
              draw = ImageDraw.Draw(img)
              try:
                  font_top = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 55)
                  font_btn = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 75)
                  font_bottom = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Regular.ttf", 45)
              except IOError:
                  font_top = font_btn = font_bottom = ImageFont.load_default()
              draw.text((540, 650), "Like • Subscribe • Comment • Follow", font=font_top, fill="white", anchor="mm", stroke_width=3, stroke_fill="black")
              buttons = [{"text": "LIKE", "color": "#00FF00", "y": 800}, {"text": "SUBSCRIBE", "color": "#FF0000", "y": 930}, {"text": "COMMENT", "color": "#00BFFF", "y": 1060}, {"text": "FOLLOW", "color": "#FFD700", "y": 1190}]
              for btn in buttons:
                  draw.rectangle([310, btn["y"], 770, btn["y"] + 90], outline=btn["color"], width=6)
                  draw.text((540, btn["y"] + 45), btn["text"], font=font_btn, fill=btn["color"], anchor="mm", stroke_width=3, stroke_fill="black")
              draw.text((540, 1750), "Sawajstudio", font=font_bottom, fill="white", anchor="mm", stroke_width=3, stroke_fill="black")
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              img.save(output_path, "PNG")
              return output_path
          EOF

          # 6. render_main.py (Imports cta_generator)
          cat << 'EOF' > Story_Render/render_main.py
          import os
          from .tools.audio_helper import get_audio_duration
          from .tools.cta_generator import generate_cta_image
          from .subtitle.ass_builder import create_main_subtitles
          from .subtitle.intro_builder import create_intro_subtitle
          from .subtitle.outro_builder import create_outro_subtitle
          from .video_engine.ffmpeg_render import render_final_video
          from .config.styles import generate_ass_style_string, ARABIC_STYLE, HINDI_STYLE, ENGLISH_STYLE, INTRO_STYLE, OUTRO_STYLE
          def merge_ass_files(file_paths, output_path):
              master_header = f"""[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n{generate_ass_style_string("Arabic", ARABIC_STYLE)}\n{generate_ass_style_string("Hindi", HINDI_STYLE)}\n{generate_ass_style_string("English", ENGLISH_STYLE)}\n{generate_ass_style_string("Intro", INTRO_STYLE)}\n{generate_ass_style_string("Outro", OUTRO_STYLE)}\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"""
              with open(output_path, "w", encoding="utf-8") as master_file:
                  master_file.write(master_header)
                  for path in file_paths:
                      if path and os.path.exists(path):
                          with open(path, "r", encoding="utf-8") as f:
                              for line in f:
                                  if line.startswith("Dialogue:"): master_file.write(line)
              return output_path
          def build_and_render_story(bg_video, music_path, voice_path, hadith, hindi_text, intro_text, outro_text, cta_text, output_path="temp/Final_Story.mp4"):
              os.makedirs("temp", exist_ok=True)
              duration = get_audio_duration(voice_path)
              intro_ass = create_intro_subtitle(intro_text, duration=2.5, output_path="temp/part_intro.ass")
              main_ass = create_main_subtitles(hadith, hindi_text, duration, output_path="temp/part_main.ass")
              outro_ass = create_outro_subtitle(outro_text, duration, outro_duration=3.5, output_path="temp/part_outro.ass")
              cta_image = generate_cta_image(output_path="temp/cta_image.png")
              master_ass = merge_ass_files([intro_ass, main_ass, outro_ass], output_path="temp/master_subtitles.ass")
              return render_final_video(bg_video=bg_video, music_path=music_path, voice_path=voice_path, master_ass_path=master_ass, cta_image_path=cta_image, duration=duration, output_path=output_path)
          EOF

          # 7. AI Model Fixes
          sed -i 's/gemini-1.5-flash/gemini-2.0-flash/g' ../Fetching/AI/API_fallback/gemini_AI.py
          sed -i 's/llama-3.3-70b-versatile/llama-3.1-70b-versatile/g' ../Fetching/AI/API_fallback/groq_AI.py
          
          # 8. Pexels 1080p Fix
          cat << 'EOF' > ../Fetching/Background/Video/API_fallback/pexels.py
          import os, requests
          def fetch(query="islamic mosque night", duration=60, output_path="temp/bg_video.mp4"):
              api_key = os.getenv("PEXELS_API_KEY")
              if not api_key: return None
              headers = {"Authorization": api_key}
              url = f"https://api.pexels.com/videos/search?query={query}&orientation=portrait&per_page=5"
              try:
                  r = requests.get(url, headers=headers, timeout=15)
                  if r.status_code == 200:
                      videos = r.json().get("videos", [])
                      if videos:
                          video_files = sorted(videos[0].get("video_files", []), key=lambda x: x.get("width", 0), reverse=True)
                          if not video_files: return None
                          best_file = video_files[0]
                          for vf in video_files:
                              if 1000 <= vf.get("width", 0) <= 1400: best_file = vf; break
                          vid_data = requests.get(best_file["link"], timeout=30).content
                          os.makedirs(os.path.dirname(output_path), exist_ok=True)
                          with open(output_path, "wb") as f: f.write(vid_data)
                          return output_path
                  return None
              except Exception: return None
          EOF

          # 9. Commit & Push Backend
          cd ../..
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          if git diff-index --quiet HEAD; then echo "⚠️ No changes in Backend."; else git commit -m "🛠️ Full Auto-Fix: Speed Optimized (Ultrafast, Threads, AI Script)"; git push; fi

      - name: 4. 📥 Checkout Public Repo (Firent)
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Firent'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Firent'

      - name: 5. 🔧 Overwrite Firent YML (Timeout Fix)
        run: |
          cd Firent/.github/workflows
          
          # मुख्य YML को अपडेट करें (Timeout 120 करें)
          sed -i 's/timeout-minutes: 60/timeout-minutes: 120/g' 🎬Story_Video-Generator.yml
          
          # Commit & Push Public
          cd ../..
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add .
          if git diff-index --quiet HEAD; then echo "⚠️ No changes in Firent."; else git commit -m "🛠️ Auto-Fix: Increased Timeout to 120 mins"; git push; fi
