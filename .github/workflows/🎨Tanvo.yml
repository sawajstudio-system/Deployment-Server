# ══════════════════════════════════════════════════════════════════════════════
# 📁 SAVE THIS FILE AT:
#    Firent/.github/workflows/🎨Tanvo.yml
# 🧠 SMART PATH FINDER: 02_audio_media ya 01_ai_models dono check karega
# ══════════════════════════════════════════════════════════════════════════════
name: 🎨 Tanvo API Test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TANVO_API_KEY: ${{ secrets.TANVO_API_KEY }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🔍 Smart Finder — Check File Path
        id: find_file
        run: |
          echo "🔍 Searching for tanvo.py..."
          set +e
          
          # Path 1: 02_audio_media
          HTTP_1=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/A_API_room/02_audio_media/tanvo.py")
            
          # Path 2: 01_ai_models
          HTTP_2=$(curl -sS -o /dev/null -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/A_API_room/01_ai_models/tanvo.py")

          if [ "$HTTP_1" = "200" ]; then
            echo "✅ Found in 02_audio_media!"
            echo "FILE_PATH=02_audio_media/tanvo.py" >> $GITHUB_OUTPUT
          elif [ "$HTTP_2" = "200" ]; then
            echo "✅ Found in 01_ai_models!"
            echo "FILE_PATH=01_ai_models/tanvo.py" >> $GITHUB_OUTPUT
          else
            echo "❌ File not found in either folder (404)."
            echo "FILE_PATH=NOT_FOUND" >> $GITHUB_OUTPUT
          fi

      - name: 4. 🪶 Fetch Tanvo Test
        if: steps.find_file.outputs.FILE_PATH != 'NOT_FOUND'
        run: |
          echo "📥 Downloading from ${{ steps.find_file.outputs.FILE_PATH }}..."
          set +e
          curl -sSL -f \
            -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/A_API_room/${{ steps.find_file.outputs.FILE_PATH }}" \
            -o /tmp/tanvo.py
          
          if [ -f /tmp/tanvo.py ] && [ -s /tmp/tanvo.py ]; then
            echo "✅ Downloaded: $(wc -c < /tmp/tanvo.py) bytes"
          else
            echo "❌ Download FAILED"
            exit 1
          fi

      - name: 5. 🧪 Run Tanvo Test
        if: steps.find_file.outputs.FILE_PATH != 'NOT_FOUND'
        continue-on-error: true
        run: python /tmp/tanvo.py

      - name: 6. 💨 Vanished
        if: always()
        run: |
          rm -f /tmp/tanvo.py
          echo "✅ Hawa mein hi ud gaya!"
