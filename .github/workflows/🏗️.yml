          import re
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts, compute_word_timings
          from ...config.colors import get_color_tag

          def create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main.ass"):
              ara = re.sub(r'[\n\r"]', ' ', str(hadith.get("arabic", ""))).strip()
              hin = re.sub(r'[\n\r"]', ' ', str(hindi_text)).strip()
              eng = re.sub(r'[\n\r"]', ' ', str(hadith.get("english", ""))).strip()
              content = get_ass_header() + "\n[V4+ Styles]\n" + get_all_styles() + "\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              start_t = 4.0
              end_t = max(duration - 5.5, start_t + 1.0)
              total = end_t - start_t

              def process(text, style, lang):
                  words = text.split()
                  if not words: return ""
                  timings = compute_word_timings(words, total)
                  out = ""
                  for i in range(len(words)):
                      ws = start_t + timings[i][0]
                      we = start_t + timings[i][1]
                      vis = words[max(0, i - 2):i + 1]
                      dot_c = get_color_tag(i // 3 + lang * 3)
                      line = f"\u202B" if lang == 0 else ""
                      line += f"{{\\c{dot_c}}}●  "
                      for j, w in enumerate(vis):
                          gi = max(0, i - 2) + j
                          c = get_color_tag(gi)
                          line += f"{{\\c{c}\\k{int((we-ws)*100)}}}{w} " if gi == i else f"{{\\c{c}}}{w} "
                      if lang == 0: line += "\u202C"
                      out += f"Dialogue: 0,{ts(ws)},{ts(we)},{style},,,0,0,,{line.strip()}\n"
                  return out

              if ara: content += process(ara, "Arabic", 0)
              if hin: content += process(hin, "Hindi", 1)
              if eng: content += process(eng, "English", 2)
              return save_ass(content, output_path)
          EOF

