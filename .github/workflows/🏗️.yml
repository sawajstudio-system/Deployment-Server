          cat > timing/time_format.py << 'EOF'
          def ts(t):
              h, m, s = int(t // 3600), int((t % 3600) // 60), int(t % 60)
              ms = int(round((t - int(t)) * 100))
              if ms == 100: ms = 99
              return f"{h}:{m:02d}:{s:02d}.{ms:02d}"
          EOF
          cat > timing/word_weight.py << 'EOF'
          def compute_word_timings(words, total):
              if not words: return []
              weights = [2.0 if w[-1] in '.!?।' else 1.5 if w[-1] in ',،;:' else 1.0 for w in words]
              tw = sum(weights) or 1.0
              tpp = total / tw
              out, cur = [], 0.0
              for w in weights:
                  d = w * tpp
                  out.append((cur, cur + d))
                  cur += d
              return out
          EOF

