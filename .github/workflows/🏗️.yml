          cat > main.py << 'EOF'
          #!/usr/bin/env python3
          import os, sys
          B = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
          sys.path.insert(0, B)
          from Management import (Settings, Chains, Logger, Telegram, ErrorHandler, StateTracker, Cleaner, AIFallback, VideoFallback, MusicFallback, TTSFallback, UploadManager)
          from Management.fetching.Islamic.Hadis.URL_fallback import fawaz
          from Management.fetching.Intro_Outro_CTA.API_fallback import intro_AI, outro_AI, cta_AI
          from Story_Generator.Story_Render import build_and_render_story
          def run():
              s = Settings(); log = Logger(s.LOG_FILE); tg = Telegram(); st = StateTracker(s.STEPS); cl = Cleaner(s.TEMP_DIR)
              er = ErrorHandler(log, tg, st); ai = AIFallback(); v = VideoFallback(); m = MusicFallback(); t = TTSFallback(); up = UploadManager()
              try:
                  tg.send("🚀 Pipeline Started")
                  st.start("hadith")
                  h = fawaz.fetch()
                  if not h: raise RuntimeError("No hadith")
                  st.done("hadith")
                  st.start("script")
                  p = f"Translate to Hindi, 70-80 words, add moral lesson.\n\n{h['english']}"
                  hi = ai.generate(p)
                  if not hi: raise RuntimeError("No Hindi")
                  st.done("script")
                  st.start("intro_outro_cta")
                  i = intro_AI.generate_intro(); o = outro_AI.generate_outro(); c = cta_AI.generate_cta()
                  st.done("intro_outro_cta")
                  st.start("tts")
                  voice = t.generate(f"हदीस शरीफ। {hi}")
                  if not voice: raise RuntimeError("No voice")
                  st.done("tts")
                  st.start("background")
                  bg = v.fetch("islamic mosque")
                  if not bg: raise RuntimeError("No bg")
                  st.done("background")
                  st.start("music")
                  mu = m.fetch("islamic peaceful")
                  st.done("music")
                  st.start("render")
                  final = build_and_render_story(bg_video=bg, music_path=mu, voice_path=voice, hadith=h, hindi_text=hi, intro_text=i, outro_text=o, cta_text=c, output_path="temp/Final_Story.mp4")
                  if not final: raise RuntimeError("Render failed")
                  st.done("render")
                  st.start("upload")
                  link = up.upload(final)
                  st.done("upload")
                  tg.send(f"✅ Done\n{link}")
              except Exception as e:
                  er.catch("pipeline", e)
              finally:
                  cl.clean_all()
          if __name__ == "__main__":
              run()
          EOF
