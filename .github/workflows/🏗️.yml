          cat > main_render.py << 'EOF'
          import os
          from .tools.duration_checker import get_audio_duration
          from .tools.cta_generator import generate_cta_image
          from .subtitle.builders import create_main_subtitles, create_intro_subtitle, create_outro_subtitle
          from .video_engine import build_ffmpeg_cmd, run_ffmpeg
          from .config import generate_ass_style_string, ARABIC_STYLE, HINDI_STYLE, ENGLISH_STYLE, INTRO_STYLE, OUTRO_STYLE
          def merge(paths, out):
              h = "[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
              for n, s in [("Arabic",ARABIC_STYLE),("Hindi",HINDI_STYLE),("English",ENGLISH_STYLE),("Intro",INTRO_STYLE),("Outro",OUTRO_STYLE)]: h += generate_ass_style_string(n, s) + "\n"
              h += "[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              os.makedirs(os.path.dirname(out), exist_ok=True)
              with open(out, "w", encoding="utf-8") as f:
                  f.write(h)
                  for p in paths:
                      if p and os.path.exists(p):
                          with open(p, "r", encoding="utf-8") as fp:
                              for l in fp:
                                  if l.startswith("Dialogue:"): f.write(l)
              return out
          def build_and_render_story(bg_video, music_path, voice_path, hadith, hindi_text, intro_text, outro_text, cta_text, output_path="temp/Final_Story.mp4"):
              os.makedirs("temp", exist_ok=True)
              d = get_audio_duration(voice_path)
              ia = create_intro_subtitle(intro_text, duration=2.5, output_path="temp/intro.ass")
              ma = create_main_subtitles(hadith, hindi_text, d, output_path="temp/main.ass")
              oa = create_outro_subtitle(outro_text, d, outro_duration=3.5, output_path="temp/outro.ass")
              cta = generate_cta_image(output_path="temp/cta.png")
              mas = merge([ia,ma,oa], "temp/master.ass")
              logo = os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))), "assets", "logo.png")
              cmd = build_ffmpeg_cmd(bg_video, voice_path, music_path, cta, logo, mas, d, output_path)
              return output_path if run_ffmpeg(cmd) else None
          EOF
