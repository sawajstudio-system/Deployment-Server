          def build_video_filter(has_logo, logo_idx, cta_idx, cta_start):
              filters = "[0:v]scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,vignette=PI/4[bg];"
              cur = "bg"
              if has_logo and logo_idx != -1:
                  lm = get_logo_filter(400, 160)
                  lf = get_logo_filter(600, 240)
                  filters += f"[{logo_idx}:v]split[lm][lf];[lm]{lm}[lms];[lf]{lf}[lfs];"
                  x, y = get_moving_logo_expr()
                  filters += f"[{cur}][lms]overlay=x='{x}':y='{y}':enable='lt(t,{cta_start})'[bg1];"
                  fx, fy = get_fixed_logo_pos()
                  filters += f"[bg1][lfs]overlay=x='{fx}':y='{fy}':enable='gte(t,{cta_start})'[bg2];"
                  cur = "bg2"
              return filters, cur
          EOF

          cat > video_engine/logo_processor.py << 'EOF'
          def get_logo_filter(w=400, h=160):
              return f"scale={w}:{h},format=rgba,colorchannelmixer=rr=0.094:gg=0.466:bb=0.949:aa=1.0,split[lg][sh];[sh]colorchannelmixer=rr=0:gg=0:bb=0:aa=0.9,boxblur=10:2[sb];[sb][lg]overlay=6:6"
          EOF

          cat > video_engine/logo_placer.py << 'EOF'
          def get_moving_logo_expr():
              return "40+abs(mod(t*150, 2*(W-w-80)) - (W-w-80))", "40+abs(mod(t*200, 2*(H-h-80)) - (H-h-80))"
          def get_fixed_logo_pos(): return "(W-w)/2", "850"
          EOF

          cat > video_engine/logo_watermark.py << 'EOF'
          from .logo_processor import get_logo_filter
          __all__ = ["get_logo_filter"]
          EOF

          cat > video_engine/audio_mixer.py << 'EOF'
          def build_audio_filter(has_music):
              if has_music:
                  return "[2:a]volume=0.15[bgm];[bgm][1:a]sidechaincompress=threshold=0.05:ratio=8:attack=50:release=500[db];[1:a][db]amix=inputs=2:duration=first[a_out]"
              return "[1:a]volume=1.0[a_out]"
          EOF

          cat > video_engine/ffmpeg_builder.py << 'EOF'
          import os
          from .video_filter import build_video_filter
          from .audio_mixer import build_audio_filter

          def build_ffmpeg_cmd(bg_video, voice_path, music_path, cta_image_path, logo_path, master_ass_path, duration, output_path):
              has_music = os.path.exists(music_path) and os.path.getsize(music_path) > 0
              has_logo = os.path.exists(logo_path)
              cmd = ["ffmpeg", "-y", "-stream_loop", "-1", "-i", bg_video, "-i", voice_path]
              if has_music: cmd += ["-i", music_path]
              cmd += ["-loop", "1", "-i", cta_image_path]
              cta_idx = 3 if has_music else 2
              logo_idx = -1
              if has_logo:
                  cmd += ["-i", logo_path]
                  logo_idx = 4 if has_music else 3
              cta_start = max(0, duration - 5.0)
              vf, cur = build_video_filter(has_logo, logo_idx, cta_idx, cta_start)
              abs_ass = os.path.abspath(master_ass_path)
              fonts = os.path.abspath(os.path.join(os.path.dirname(__file__), "..", "..", "..", "assets", "fonts"))
              vf += f"[{cur}]subtitles='{abs_ass}':fontsdir='{fonts}'[vs];"
              vf += f"[vs][{cta_idx}:v]overlay=0:0:enable='gte(t,{cta_start})'[v_out]"
              af = build_audio_filter(has_music)
              cmd += ["-filter_complex", f"{vf}; {af}", "-map", "[v_out]", "-map", "[a_out]", "-c:v", "libx264", "-preset", "ultrafast", "-crf", "30", "-r", "24", "-c:a", "aac", "-b:a", "128k", "-t", f"{duration:.2f}", "-shortest", output_path]
              return cmd
          EOF

          cat > video_engine/ffmpeg_runner.py << 'EOF'
          import subprocess
          def run_ffmpeg(cmd, timeout=300):
              try:
                  r = subprocess.run(cmd, capture_output=True, text=True, timeout=timeout)
                  return r.returncode == 0
              except: return False
          EOF

          cat > video_engine/ffmpeg_render.py << 'EOF'
          from .ffmpeg_builder import build_ffmpeg_cmd
          from .ffmpeg_runner import run_ffmpeg
          def render_final_video(bg_video, music_path, voice_path, master_ass_path, cta_image_path, duration, output_path="temp/Final.mp4"):
              logo = "../assets/logo.png"
              cmd = build_ffmpeg_cmd(bg_video, voice_path, music_path, cta_image_path, logo, master_ass_path, duration, output_path)
              return output_path if run_ffmpeg(cmd) else None
          EOF

      - name: 20. 📝 Create .gitkeep files
        run: |
          find Video_Generator -type d -empty -exec touch {}/.gitkeep \;

      - name: 21. 💾 Commit and Push
        run: |
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add Video_Generator/
          git commit -m "🏗️ Full Video_Generator structure with all code" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} || echo "Push failed"
