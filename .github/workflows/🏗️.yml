name: 🎬 Update main.py to use Management

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 💾 पुराना main.py बैकअप करो
        run: |
          cd Workshop/Video_Generator/Story_Generator
          if [ -f "main.py" ]; then
            cp main.py main_backup.py
            echo "✅ पुराना main.py → main_backup.py"
            echo ""
            echo "पुराने main.py के पहले 40 lines:"
            head -40 main.py
          else
            echo "❌ main.py नहीं मिला"
            exit 1
          fi

      - name: 3. 🎬 नया main.py लिखो (Management का इस्तेमाल करेगा)
        run: |
          cd Workshop/Video_Generator/Story_Generator
          cat > main.py << 'PYEOF'
          #!/usr/bin/env python3
          # ══════════════════════════════════════════════════════════════════════════════
          # 📁 FOLDER: Story_Generator/
          # 📄 FILE  : main.py
          # 🎯 PURPOSE: यह पूरे वीडियो का मैनेजर है।
          #            पहले सब कुछ इनलाइन था — अब Management/ से आता है।
          #            असली काम पुरानी फाइलें ही करती हैं (fallback/ उन्हें लपेटता है)।
          # ══════════════════════════════════════════════════════════════════════════════
          import os, sys, requests, subprocess, random, shutil, traceback
          from concurrent.futures import ThreadPoolExecutor

          BASE_DIR = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
          sys.path.insert(0, BASE_DIR)

          # ── Management से सारे managers ──────────────────────────────────────
          from Management import (
              Settings, Chains, Logger, Telegram, ErrorHandler,
              StateTracker, Cleaner,
              AIFallback, VideoFallback, MusicFallback, TTSFallback,
              UploadManager,
          )

          # ── पुरानी फाइलें (जो अब Management/fetching/ में हैं) ───────────────
          from Management.fetching.Islamic.Hadis.URL_fallback import fawaz
          from Management.fetching.Translator.URL_fallback import mymemory
          from Management.fetching.Intro_Outro_CTA.API_fallback import intro_AI, outro_AI, cta_AI
          from Management.fetching.Background.Video.API_fallback import pexels, pixabay, coverr
          from Management.fetching.Background.Video.URL_fallback import gradient
          from Management.fetching.Background.Music.API_fallback import freesound
          from Management.fetching.Background.Music.URL_fallback import pixabay_music
          from Management.fetching.audio_TTS.API_fallback import elevenlabs
          from Management.fetching.audio_TTS.URL_fallback import edge_tts

          # ── Story_Render (जैसा था) ───────────────────────────────────────────
          from Story_Render import build_and_render_story


          # ══════════════════════════════════════════════════════════════════════════════
          # 🎬 MAIN PIPELINE
          # ══════════════════════════════════════════════════════════════════════════════
          def run_pipeline():
              print("═" * 60)
              print("🎬 STARTING PREMIUM STORY PIPELINE (with Management)")
              print("═" * 60)

              # ── Managers तैयार ─────────────────────────────────────────────────
              settings = Settings()
              logger = Logger(settings.LOG_FILE)
              tg = Telegram()
              state = StateTracker(settings.STEPS)
              cleaner = Cleaner(settings.TEMP_DIR)
              errors = ErrorHandler(logger, tg, state)
              ai_fb = AIFallback()
              video_fb = VideoFallback()
              music_fb = MusicFallback()
              tts_fb = TTSFallback()
              uploader = UploadManager()

              tg.send("🚀 <b>Video Generation Started!</b>")
              os.makedirs("temp", exist_ok=True)

              try:
                  # ── Step 1: हदीस ─────────────────────────────────────────────
                  state.start("hadith")
                  logger.info("1. 📖 हदीस ला रहे हैं...")
                  tg.send("1. 📖 हदीस ला रहे हैं...")

                  hadith = fawaz.fetch()
                  if not hadith:
                      raise RuntimeError("Hadith fetch failed")
                  english_text = hadith.get("english", "")
                  state.done("hadith")

                  # ── Step 2: AI से स्क्रिप्ट ─────────────────────────────────
                  state.start("script")
                  logger.info("2. 🧠 AI स्क्रिप्ट बना रहा है...")
                  tg.send("2. 🧠 AI स्क्रिप्ट बना रहा है...")

                  prompt = f"Translate to Hindi and add a short moral lesson. Total 70-80 words. Only Hindi text.\n\nHadith: {english_text}"
                  hindi_text = ai_fb.generate(prompt, max_tokens=250)

                  if hindi_text:
                      ai_used = ai_fb.used
                  else:
                      logger.warning("AI fail — MyMemory fallback")
                      hindi_text = mymemory.translate(english_text)
                      ai_used = "MyMemory (AI failed)"

                  # Devanagari check
                  if not hindi_text or not any('\u0900' <= ch <= '\u097F' for ch in hindi_text):
                      raise RuntimeError(f"Hindi failed: {(hindi_text or '')[:60]!r}")

                  ai_failed = ", ".join(ai_fb.failed) if ai_fb.failed else "None"
                  state.done("script")

                  # ── Step 3: Intro / Outro / CTA ─────────────────────────────
                  state.start("intro_outro_cta")
                  logger.info("3. ✨ Intro/Outro/CTA बन रहे हैं...")
                  tg.send("3. ✨ Intro/Outro/CTA बन रहे हैं...")

                  base_intro = intro_AI.generate_intro()
                  book_name = hadith.get("collection", "Hadith")
                  hadith_num = hadith.get("number", "")
                  intro_text = f"{base_intro}\\N{book_name} - Hadith #{hadith_num}"
                  outro_text = outro_AI.generate_outro()
                  cta_text = cta_AI.generate_cta()
                  state.done("intro_outro_cta")

                  # ── Step 4: TTS (आवाज़) ─────────────────────────────────────
                  state.start("tts")
                  logger.info("4. 🎙️ आवाज़ बन रही है...")
                  tg.send("4. 🎙️ आवाज़ बन रही है...")

                  voice_path = "temp/voice.mp3"
                  tts_text = f"हदीस शरीफ। {hindi_text}"
                  voice = tts_fb.generate(tts_text, voice_path)
                  if not voice:
                      raise RuntimeError("Voice generation failed")
                  state.done("tts")

                  # ── Step 5: Background वीडियो ───────────────────────────────
                  state.start("background")
                  logger.info("5. 🎥 वीडियो डाउनलोड हो रहे हैं...")
                  tg.send("5. 🎥 वीडियो डाउनलोड हो रहे हैं...")

                  final_bg_video = "temp/bg_video.mp4"
                  concat_list = "temp/concat_list.txt"

                  all_queries = [
                      "islamic mosque architecture", "holy quran book pages", "islamic calligraphy nature",
                      "stars night sky", "ocean waves sunset", "desert sand dunes", "green mountains waterfall",
                      "candle light warm", "rain on window", "clouds moving sky", "forest trees sunlight",
                      "peaceful garden flowers", "old mosque minaret", "kaaba mecca", "madina green dome",
                      "birds flying sky", "river flowing rocks", "snow falling winter", "lightning storm clouds",
                      "lantern light dark", "prayer beads tasbih", "dates fruit bowl", "arabic tea coffee",
                      "sunrise golden hour", "moon crescent night", "beautiful sunset landscape", "foggy morning forest"
                  ]
                  random.shuffle(all_queries)
                  queries = all_queries[:3]
                  clip_duration = 20.0

                  def download_and_normalize(args):
                      i, query, dur, clip_path = args
                      temp_raw = f"temp/raw_clip_{i}.mp4"
                      api_used = "Failed"
                      try:
                          if pexels.fetch(query=query, duration=dur, output_path=temp_raw):
                              api_used = "Pexels"
                          elif pixabay.fetch(query=query, duration=dur, output_path=temp_raw):
                              api_used = "Pixabay"
                          elif coverr.fetch(query=query, duration=dur, output_path=temp_raw):
                              api_used = "Coverr"
                          elif gradient.fetch(duration=dur, output_path=temp_raw):
                              api_used = "Gradient"
                      except Exception:
                          pass

                      if not os.path.exists(temp_raw):
                          return (False, "Failed")

                      norm_cmd = (
                          f'ffmpeg -y -i "{temp_raw}" '
                          f'-vf "scale=1080:1920:force_original_aspect_ratio=increase,crop=1080:1920,fps=24,setsar=1" '
                          f'-an -c:v libx264 -preset ultrafast -crf 30 -threads 0 "{clip_path}"'
                      )
                      try:
                          subprocess.run(norm_cmd, shell=True, capture_output=True, timeout=180)
                      except Exception:
                          pass
                      if os.path.exists(temp_raw):
                          os.remove(temp_raw)
                      ok = os.path.exists(clip_path) and os.path.getsize(clip_path) > 10000
                      return (ok, api_used)

                  download_tasks = [(i, q, clip_duration, f"temp/clip_{i}.mp4") for i, q in enumerate(queries)]
                  with ThreadPoolExecutor(max_workers=3) as ex:
                      results = list(ex.map(download_and_normalize, download_tasks))

                  valid_clips = []
                  video_apis_used = set()
                  with open(concat_list, "w") as f:
                      for i, (res, api) in enumerate(results):
                          clip_path = f"temp/clip_{i}.mp4"
                          if res and os.path.exists(clip_path):
                              valid_clips.append(clip_path)
                              video_apis_used.add(api)
                              f.write(f"file '{os.path.abspath(clip_path)}'\n")

                  video_api_str = ", ".join(video_apis_used) if video_apis_used else "None"

                  if valid_clips:
                      merge_cmd = f'ffmpeg -y -f concat -safe 0 -i "{concat_list}" -c copy "{final_bg_video}"'
                      try:
                          subprocess.run(merge_cmd, shell=True, capture_output=True, timeout=60)
                      except Exception:
                          pass

                  if not os.path.exists(final_bg_video) or os.path.getsize(final_bg_video) < 10000:
                      if valid_clips:
                          final_bg_video = valid_clips[0]
                      else:
                          raise RuntimeError("All background video sources failed")
                  state.done("background")

                  # ── Step 6: म्यूजिक + Nature ─────────────────────────────────
                  state.start("music")
                  logger.info("6. 🎵 म्यूजिक मिक्स हो रहा है...")
                  tg.send("6. 🎵 म्यूजिक मिक्स हो रहा है...")

                  music_path = "temp/music.mp3"
                  nature_path = "temp/nature.mp3"
                  final_audio_path = "temp/final_bg_audio.mp3"

                  if freesound.fetch(query="soft ambient meditation islamic peaceful", duration=60, output_path=music_path):
                      music_used = "Freesound"
                  elif pixabay_music.fetch(duration=60, output_path=music_path):
                      music_used = "Pixabay"
                  else:
                      music_used = "None (silent)"
                      music_path = ""

                  success_nature = freesound.fetch(query="rain soft ambience", duration=60, output_path=nature_path)

                  if music_path and success_nature:
                      mix_cmd = (
                          f'ffmpeg -y -i "{music_path}" -i "{nature_path}" '
                          f'-filter_complex "[0:a]volume=0.15[m];[1:a]volume=0.10[n];[m][n]amix=inputs=2:duration=first[out]" '
                          f'-map "[out]" "{final_audio_path}"'
                      )
                      try:
                          subprocess.run(mix_cmd, shell=True, capture_output=True, timeout=120)
                          if not (os.path.exists(final_audio_path) and os.path.getsize(final_audio_path) > 1000):
                              final_audio_path = music_path
                      except Exception:
                          final_audio_path = music_path
                  elif music_path:
                      final_audio_path = music_path
                  else:
                      final_audio_path = ""
                  state.done("music")

                  # ── Step 7: Final Render ────────────────────────────────────
                  state.start("render")
                  logger.info("7. 🎬 Final Render हो रहा है...")
                  tg.send("7. 🎬 Final Video Render हो रही है...")

                  final_video_path = "temp/Final_Story.mp4"
                  try:
                      import io, contextlib
                      buf = io.StringIO()
                      with contextlib.redirect_stdout(buf):
                          render_success = build_and_render_story(
                              bg_video=final_bg_video,
                              music_path=final_audio_path,
                              voice_path=voice_path,
                              hadith=hadith,
                              hindi_text=hindi_text,
                              intro_text=intro_text,
                              outro_text=outro_text,
                              cta_text=cta_text,
                              output_path=final_video_path,
                          )
                      log_out = buf.getvalue()
                      if "❌ === FFMPEG ERROR START ===" in log_out:
                          err = log_out.split("❌ === FFMPEG ERROR START ===")[1].split("❌ === FFMPEG ERROR END ===")[0]
                          raise RuntimeError(f"FFmpeg: {err[:500]}")
                  except Exception as e:
                      raise RuntimeError(f"Render failed: {e}")

                  if not render_success or not os.path.exists(final_video_path):
                      raise RuntimeError("Render unknown failure")
                  state.done("render")

                  # ── Step 8: Google Drive Upload ─────────────────────────────
                  state.start("upload")
                  logger.info("8. ☁️ Drive पर Upload...")
                  tg.send("8. ☁️ Google Drive पर Upload हो रही है...")

                  drive_link = uploader.upload(final_video_path)
                  state.done("upload")

                  # ── Step 9: Final Report ────────────────────────────────────
                  report = "🎉 <b>Video Ready!</b>\n\n"
                  report += f"📜 <b>Hadith:</b> {book_name} #{hadith_num}\n"
                  report += f"🧠 <b>AI Script:</b> {ai_used} <i>(Failed: {ai_failed})</i>\n"
                  report += f"🎙️ <b>Voice:</b> TTS Fallback\n"
                  report += f"🎥 <b>Video:</b> {video_api_str}\n"
                  report += f"🎵 <b>Music:</b> {music_used}\n"
                  if drive_link:
                      report += f"\n📥 <a href='{drive_link}'>Click here to view</a>"
                  else:
                      report += "\n❌ Google Drive Upload Failed."

                  tg.send(report)
                  logger.info("🎉 Pipeline complete")

              except Exception as e:
                  errors.catch("pipeline", e)
                  logger.error(f"Pipeline crashed: {e}")
              finally:
                  cleaner.clean_all()
                  logger.info("🧹 Cleanup done")


          if __name__ == "__main__":
              try:
                  run_pipeline()
              except Exception as e:
                  tb = traceback.format_exc()
                  print(tb)
                  tg = Telegram()
                  tg.send(f"💥 <b>Pipeline crashed!</b>\n<pre>{tb[-1500:]}</pre>")
                  raise
          PYEOF
          echo "✅ नया main.py लिख दिया"

      - name: 4. 🔍 Syntax जाँच
        run: |
          cd Workshop/Video_Generator/Story_Generator
          pip install requests -q
          echo "════════════════════════════════════════"
          echo "🔍 main.py syntax check:"
          echo "════════════════════════════════════════"
          if python -c "import ast; ast.parse(open('main.py').read())"; then
            echo "✅ main.py का syntax ठीक है"
          else
            echo "❌ main.py में syntax error है"
            exit 1
          fi

      - name: 5. 🔍 imports जाँच (जो फाइलें मौजूद होनी चाहिए)
        run: |
          cd Workshop/Video_Generator
          echo "════════════════════════════════════════"
          echo "🔍 ज़रूरी फाइलें मौजूद हैं?"
          echo "════════════════════════════════════════"
          MISSING=0
          for f in \
            "Management/__init__.py" \
            "Management/config/settings.py" \
            "Management/auth/api_keys.py" \
            "Management/fallback/ai.py" \
            "Management/reporting/telegram.py" \
            "Management/errors/handler.py" \
            "Management/state/tracker.py" \
            "Management/cleanup/cleaner.py" \
            "Management/uploader/upload_manager.py" \
            "Management/fetching/AI/API_fallback/ai_fallback.py" \
            "Management/fetching/Islamic/Hadis/URL_fallback/fawaz.py" \
            "Story_Generator/Story_Render/__init__.py" \
          ; do
            if [ -f "$f" ]; then
              echo "✅ $f"
            else
              echo "❌ $f — मौजूद नहीं"
              MISSING=$((MISSING+1))
            fi
          done
          echo ""
          if [ $MISSING -eq 0 ]; then
            echo "🎉 सब कुछ जगह पर है"
          else
            echo "⚠️ $MISSING फाइलें missing हैं"
          fi

      - name: 6. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add -A
          git commit -m "🎬 Update main.py to use Management + keep main_backup.py" || echo "No changes"
          git push origin main || echo "Push failed"
