          def build_audio_filter(has_music):
              if has_music: return "[2:a]volume=0.15[bgm];[bgm][1:a]sidechaincompress=threshold=0.05:ratio=8:attack=50:release=500[db];[1:a][db]amix=inputs=2:duration=first[a_out]"
              return "[1:a]volume=1.0[a_out]"
          EOF
          cat > video_engine/ffmpeg_builder.py << 'EOF'
          import os
          from .video_filter import build_video_filter
          from .audio_mixer import build_audio_filter
          def build_ffmpeg_cmd(bg, voice, music, cta, logo, ass, dur, out):
              hm = os.path.exists(music) and os.path.getsize(music) > 0
              hl = os.path.exists(logo)
              c = ["ffmpeg","-y","-stream_loop","-1","-i",bg,"-i",voice]
              if hm: c += ["-i", music]
              c += ["-loop","1","-i",cta]
              ci = 3 if hm else 2
              li = -1
              if hl:
                  c += ["-i", logo]
                  li = 4 if hm else 3
              cst = max(0, dur - 5.0)
              vf, cur = build_video_filter(hl, li, ci, cst)
              aa = os.path.abspath(ass)
              fo = os.path.abspath(os.path.join(os.path.dirname(__file__),"..","..","..","assets","fonts"))
              vf += f"[{cur}]subtitles='{aa}':fontsdir='{fo}'[vs];"
              vf += f"[vs][{ci}:v]overlay=0:0:enable='gte(t,{cst})'[v_out]"
