          import os, random
          from PIL import Image, ImageDraw, ImageFont
          def place_cta_text(b, p="temp/cta.png"):
              img = Image.open(b).convert("RGBA")
              d = ImageDraw.Draw(img)
              try: f = ImageFont.truetype("/usr/share/fonts/truetype/noto/NotoSans-Bold.ttf", 65)
              except: f = ImageFont.load_default()
              colors = ["#FFD700","#00FFFF","#FF007F","#39FF14"]
              random.shuffle(colors)
              d.text((540,1250), random.choice(["Like • Share • Follow","Support the Channel"]), font=f, fill=colors[0], anchor="mm")
              for i, (t, y) in enumerate(zip(["LIKE","SUBSCRIBE","COMMENT","SHARE"],[1340,1445,1550,1655])):
                  d.rounded_rectangle([300,y,780,y+90], radius=15, outline=colors[i%len(colors)], width=6)
                  d.text((540,y+45), t, font=f, fill=colors[i%len(colors)], anchor="mm")
              os.makedirs(os.path.dirname(p), exist_ok=True)
              img.save(p, "PNG")
              return p
          def generate_cta_image(p="temp/cta.png"):
