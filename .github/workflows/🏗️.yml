name: 🔄 Move & Fix Imports (Workshop)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  move:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 📂 पहले से क्या है — जाँचो
        run: |
          cd Workshop
          echo "════════════════════════════════════════"
          echo "📁 Video_Generator का पुराना स्ट्रक्चर:"
          echo "════════════════════════════════════════"
          find Video_Generator -maxdepth 2 -type d 2>/dev/null || echo "❌ Video_Generator नहीं है"
          echo ""
          echo "════════════════════════════════════════"
          echo "📄 Fetching में कितनी फाइलें:"
          find Video_Generator/Fetching -type f -name "*.py" 2>/dev/null | wc -l
          echo ""
          echo "📄 Story_Generator में कितनी फाइलें:"
          find Video_Generator/Story_Generator -type f -name "*.py" 2>/dev/null | wc -l
          echo ""
          echo "📄 Uploader में कितनी फाइलें:"
          find Video_Generator/Uploader -type f -name "*.py" 2>/dev/null | wc -l

      - name: 3. 🏗️ नई जगह के फोल्डर बनाओ
        run: |
          cd Workshop/Video_Generator
          mkdir -p Management/fetching
          mkdir -p Management/uploader
          mkdir -p Management/config
          mkdir -p Management/auth
          mkdir -p Management/fallback
          mkdir -p Management/reporting
          mkdir -p Management/errors
          mkdir -p Management/state
          mkdir -p Management/cleanup
          echo "✅ नई जगह बनी"

      - name: 4. 🚚 Fetching को Management/fetching में ले जाओ (कोड वैसा ही)
        run: |
          cd Workshop/Video_Generator
          if [ -d "Fetching" ]; then
            echo "📦 Fetching → Management/fetching"
            cp -r Fetching/* Management/fetching/
            rm -rf Fetching
            echo "✅ Fetching move हो गया"
          else
            echo "⚠️ Fetching पहले से नहीं है"
          fi
          echo "अब Management/fetching में:"
          find Management/fetching -type f -name "*.py" | wc -l

      - name: 5. 🚚 Uploader/Drive को Management/uploader में ले जाओ
        run: |
          cd Workshop/Video_Generator
          if [ -f "Uploader/Drive/story_upload.py" ]; then
            echo "📦 Uploader/Drive/story_upload.py → Management/uploader/drive.py"
            cp Uploader/Drive/story_upload.py Management/uploader/drive.py
            rm -rf Uploader
            echo "✅ Uploader move हो गया"
          else
            echo "⚠️ Uploader/Drive/story_upload.py नहीं मिला"
          fi
          ls -la Management/uploader/

      - name: 6. 🔧 import में सिर्फ 'Fetching' → 'Management.fetching' बदलो
        run: |
          cd Workshop/Video_Generator
          echo "════════════════════════════════════════"
          echo "🔧 सिर्फ import line बदल रहे हैं"
          echo "════════════════════════════════════════"

          # सारी Python फाइलों में जहाँ "from Fetching." है, उसे "from Management.fetching." कर दो
          find Management/fetching -type f -name "*.py" -exec sed -i 's/from Fetching\./from Management.fetching./g' {} +
          find Management/fetching -type f -name "*.py" -exec sed -i 's/import Fetching\./import Management.fetching./g' {} +
          find Management/uploader -type f -name "*.py" -exec sed -i 's/from Uploader\./from Management.uploader./g' {} +

          echo "✅ import बदल गए"
          echo ""
          echo "🔍 जाँच — कहीं 'from Fetching.' बचा है?"
          grep -rn "from Fetching\." Management/ 2>/dev/null || echo "✅ कोई पुराना import नहीं बचा"

      - name: 7. 🔧 Story_Generator के अंदर import में बदलाव
        run: |
          cd Workshop/Video_Generator
          if [ -d "Story_Generator" ]; then
            echo "📦 Story_Generator अंदर import बदल रहे हैं"
            # main.py में जो 'from Fetching.' है
            if [ -f "Story_Generator/main.py" ]; then
              sed -i 's/from Fetching\./from Management.fetching./g' Story_Generator/main.py
              sed -i 's/from Uploader\./from Management.uploader./g' Story_Generator/main.py
              echo "✅ main.py में import बदल गए"
              echo ""
              echo "🔍 main.py के पहले 30 lines:"
              head -30 Story_Generator/main.py
            fi
          else
            echo "⚠️ Story_Generator नहीं है"
          fi

      - name: 8. 📋 पूरा नया स्ट्रक्चर दिखाओ
        run: |
          cd Workshop/Video_Generator
          echo "════════════════════════════════════════"
          echo "📁 नया स्ट्रक्चर:"
          echo "════════════════════════════════════════"
          find . -type d | sort

      - name: 9. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add -A
          git commit -m "🔄 Move Fetching/Uploader to Management/ + fix imports (no code change)" || echo "No changes"
          git push origin main || echo "Push failed"
