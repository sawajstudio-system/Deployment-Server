          from .outro_sub_builder import create_outro_subtitle
          from .cta_sub_builder import create_cta_subtitle
          __all__ = ["create_main_subtitles","create_intro_subtitle","create_outro_subtitle","create_cta_subtitle"]
          EOF
          cat > builders/main_sub_builder.py << 'EOF'
          import re
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts, compute_word_timings
          from ...config.colors import get_color_tag
          def create_main_subtitles(h, hi, d, o="temp/main.ass"):
              ara = re.sub(r'[\n\r"]',' ',str(h.get("arabic",""))).strip()
              hin = re.sub(r'[\n\r"]',' ',str(hi)).strip()
              eng = re.sub(r'[\n\r"]',' ',str(h.get("english",""))).strip()
              c = get_ass_header() + "\n[V4+ Styles]\n" + get_all_styles() + "\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              st = 4.0
              et = max(d - 5.5, st + 1.0)
              total = et - st
              def p(text, style, lang):
                  w = text.split()
                  if not w: return ""
                  t = compute_word_timings(w, total)
                  out = ""
                  for i in range(len(w)):
                      ws = st + t[i][0]; we = st + t[i][1]
                      vis = w[max(0,i-2):i+1]
                      dc = get_color_tag(i // 3 + lang * 3)
                      line = "\u202B" if lang == 0 else ""
                      line += f"{{\\c{dc}}}●  "
                      for j, ww in enumerate(vis):
                          gi = max(0,i-2) + j
                          co = get_color_tag(gi)
                          line += f"{{\\c{co}\\k{int((we-ws)*100)}}}{ww} " if gi == i else f"{{\\c{co}}}{ww} "
                      if lang == 0: line += "\u202C"
                      out += f"Dialogue: 0,{ts(ws)},{ts(we)},{style},,,0,0,,{line.strip()}\n"
                  return out
              if ara: c += p(ara, "Arabic", 0)
              if hin: c += p(hin, "Hindi", 1)
              if eng: c += p(eng, "English", 2)
              return save_ass(c, o)
          EOF
          cat > builders/intro_sub_builder.py << 'EOF'
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts
          def create_intro_subtitle(t, d=3.5, o="temp/intro.ass"):
