              s = max(0, total - od)
              c += f"Dialogue: 0,{ts(s)},{ts(total)},Outro,,0,0,0,,{{\\fad(500,500)\\c{get_color_tag(1)}}}{t.strip()}\n"
              return save_ass(c, o)
          EOF
          cat > builders/cta_sub_builder.py << 'EOF'
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts
          from ...config.colors import get_color_tag
          def create_cta_subtitle(t, total, cd=3.5, o="temp/cta.ass"):
              if not t: return None
              c = get_ass_header() + "\n[V4+ Styles]\n" + get_all_styles(include_cta=True) + "\n[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              s = max(0, total - cd)
              c += f"Dialogue: 0,{ts(s)},{ts(total)},CTA,,0,0,0,,{{\\fad(500,500)\\c{get_color_tag(2)}}}● {t.strip()}\n"
              return save_ass(c, o)
          EOF
          cat > languages/__init__.py << 'EOF'
          from .arabic_render import build_arabic_text
          from .hindi_render import build_hindi_text
          from .english_render import build_english_text
          __all__ = ["build_arabic_text","build_hindi_text","build_english_text"]
          EOF
          cat > languages/arabic_render.py << 'EOF'
          import re
          def build_arabic_text(t):
              if not t: return ""
              return f"\u202B{re.sub(r'\\s+',' ',str(t)).strip()}\u202C"
          EOF
          cat > languages/hindi_render.py << 'EOF'
          import re
          def build_hindi_text(t):
              if not t: return ""
              return re.sub(r'\\s+',' ',str(t)).strip()
          EOF
          cat > languages/english_render.py << 'EOF'
          import re
          def build_english_text(t):
              if not t: return ""
              return re.sub(r'\\s+',' ',str(t)).strip()
          EOF
          for f in arabic english hindi; do echo "from .${f}_render import build_${f}_text" > languages/${f}.py; done
          cat > timing/__init__.py << 'EOF'
          from .time_format import ts
          from .word_weight import compute_word_timings
          __all__ = ["ts","compute_word_timings"]
          EOF
          cat > timing/time_format.py << 'EOF'
          def ts(t):
              h = int(t // 3600); m = int((t % 3600) // 60); s = int(t % 60); ms = int(round((t - int(t)) * 100))
              if ms == 100: ms = 99
              return f"{h}:{m:02d}:{s:02d}.{ms:02d}"
          EOF
          cat > timing/word_weight.py << 'EOF'
          def compute_word_timings(words, total):
              if not words: return []
              w = [2.0 if x[-1] in '.!?।' else 1.5 if x[-1] in ',،;:' else 1.0 for x in words]
              tw = sum(w) or 1.0; tpp = total / tw
              out = []; cur = 0.0
              for x in w:
                  d = x * tpp; out.append((cur, cur + d)); cur += d
              return out
          EOF

