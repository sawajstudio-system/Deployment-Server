name: 🏗️ Build Video_Generator Structure

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout
        uses: actions/checkout@v4

      - name: 2. 🏗️ Create Folders
        run: |
          mkdir -p Video_Generator/Management/config
          mkdir -p Video_Generator/Management/auth
          mkdir -p Video_Generator/Management/fetching/AI/API_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Music/API_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Music/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Photo/API_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Photo/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Video/API_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Video/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Intro_Outro_CTA/API_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Dua/API_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Hadis/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Hijri_date/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Quran/API_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Quran/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Translator/URL_fallback
          mkdir -p Video_Generator/Management/fetching/audio_TTS/API_fallback
          mkdir -p Video_Generator/Management/fetching/audio_TTS/URL_fallback
          mkdir -p Video_Generator/Management/fallback
          mkdir -p Video_Generator/Management/reporting
          mkdir -p Video_Generator/Management/errors
          mkdir -p Video_Generator/Management/state
          mkdir -p Video_Generator/Management/cleanup
          mkdir -p Video_Generator/Management/uploader
          mkdir -p Video_Generator/Story_Generator/Story_Render/config/colors
          mkdir -p Video_Generator/Story_Generator/Story_Render/config/fonts
          mkdir -p Video_Generator/Story_Generator/Story_Render/config/sizes
          mkdir -p Video_Generator/Story_Generator/Story_Render/subtitle/assembler
          mkdir -p Video_Generator/Story_Generator/Story_Render/subtitle/builders
          mkdir -p Video_Generator/Story_Generator/Story_Render/subtitle/languages
          mkdir -p Video_Generator/Story_Generator/Story_Render/subtitle/timing
          mkdir -p Video_Generator/Story_Generator/Story_Render/tools
          mkdir -p Video_Generator/Story_Generator/Story_Render/video_engine
          mkdir -p Video_Generator/assets/fonts

      - name: 3. 📝 Write Root Files
        run: |
          cd Video_Generator

          # Management/__init__.py
          cat > Management/__init__.py << 'EOF'
          from .config.settings import Settings
          from .config.paths import Paths
          from .config.chains import Chains
          from .auth.api_keys import APIKeys
          from .auth.env_loader import EnvLoader
          from .fallback.ai import AIFallback
          from .fallback.video import VideoFallback
          from .fallback.music import MusicFallback
          from .fallback.photo import PhotoFallback
          from .fallback.tts import TTSFallback
          from .reporting.telegram import Telegram
          from .reporting.logger import Logger
          from .errors.handler import ErrorHandler
          from .state.tracker import StateTracker
          from .cleanup.cleaner import Cleaner
          from .uploader.drive import DriveUploader
          from .uploader.upload_manager import UploadManager

          __all__ = [
              "Settings", "Paths", "Chains",
              "APIKeys", "EnvLoader",
              "AIFallback", "VideoFallback", "MusicFallback",
              "PhotoFallback", "TTSFallback",
              "Telegram", "Logger",
              "ErrorHandler", "StateTracker", "Cleaner",
              "DriveUploader", "UploadManager",
          ]
          EOF

          # Management/README.md
          cat > Management/README.md << 'EOF'
          # Management — Central Control

          यह फोल्डर पूरे Video_Generator का मस्तिष्क है।

          | फोल्डर | काम |
          |--------|-----|
          | config/ | सेटिंग्स, पाथ, fallback चेन |
          | auth/ | API Keys |
          | fetching/ | डेटा लाना (AI, Islamic, TTS...) |
          | fallback/ | स्मार्ट fallback चेन |
          | reporting/ | Telegram + Logger |
          | errors/ | Error Guard |
          | state/ | पाइपलाइन स्टेटस |
          | cleanup/ | temp सफाई |
          | uploader/ | Google Drive अपलोड |
          EOF

          # Story_Generator/main.py
          cat > Story_Generator/main.py << 'EOF'
          #!/usr/bin/env python3
          import os, sys
          BASE = os.path.dirname(os.path.dirname(os.path.abspath(__file__)))
          sys.path.insert(0, BASE)

          from Management import (
              Settings, Chains, APIKeys, Logger, Telegram,
              ErrorHandler, StateTracker, Cleaner,
              AIFallback, VideoFallback, MusicFallback, TTSFallback,
              UploadManager,
          )
          from Management.fetching.Islamic.Hadis.URL_fallback import fawaz
          from Management.fetching.Intro_Outro_CTA.API_fallback import intro_AI, outro_AI, cta_AI
          from Story_Generator.Story_Render import build_and_render_story

          def run():
              settings = Settings()
              logger = Logger(settings.LOG_FILE)
              tg = Telegram()
              state = StateTracker(settings.STEPS)
              cleaner = Cleaner(settings.TEMP_DIR)
              errors = ErrorHandler(logger, tg, state)
              ai_fb = AIFallback()
              video_fb = VideoFallback()
              music_fb = MusicFallback()
              tts_fb = TTSFallback()
              uploader = UploadManager()

              try:
                  tg.send("🚀 Pipeline Started")

                  state.start("hadith")
                  hadith = fawaz.fetch()
                  if not hadith: raise RuntimeError("Hadith not found")
                  state.done("hadith")

                  state.start("script")
                  prompt = f"Translate to Hindi and add moral lesson. 70-80 words.\n\n{hadith['english']}"
                  hindi = ai_fb.generate(prompt)
                  state.done("script")

                  state.start("intro_outro_cta")
                  intro = intro_AI.generate_intro()
                  outro = outro_AI.generate_outro()
                  cta = cta_AI.generate_cta()
                  state.done("intro_outro_cta")

                  state.start("tts")
                  voice = tts_fb.generate(f"हदीस शरीफ। {hindi}")
                  state.done("tts")

                  state.start("background")
                  bg = video_fb.fetch("islamic mosque")
                  state.done("background")

                  state.start("music")
                  music = music_fb.fetch("islamic peaceful")
                  state.done("music")

                  state.start("render")
                  final = build_and_render_story(
                      bg_video=bg, music_path=music, voice_path=voice,
                      hadith=hadith, hindi_text=hindi,
                      intro_text=intro, outro_text=outro, cta_text=cta,
                      output_path="temp/Final_Story.mp4"
                  )
                  state.done("render")

                  state.start("upload")
                  link = uploader.upload(final)
                  state.done("upload")

                  tg.send(f"✅ Done\n{link}")

              except Exception as e:
                  errors.catch("pipeline", e)
              finally:
                  cleaner.clean_all()

          if __name__ == "__main__":
              run()
          EOF

          # Story_Generator/main_backup.py
          cat > Story_Generator/main_backup.py << 'EOF'
          # Backup of original main.py — preserve old logic
          EOF

          # Story_Generator/requirements.txt
          cat > Story_Generator/requirements.txt << 'EOF'
          requests
          edge-tts
          google-api-python-client
          google-auth-httplib2
          google-auth-oauthlib
          Pillow
          mutagen
          EOF

      - name: 4. 📝 Write Management/config Files
        run: |
          cd Video_Generator/Management/config

          cat > __init__.py << 'EOF'
          from .settings import Settings
          from .paths import Paths
          from .chains import Chains
          __all__ = ["Settings", "Paths", "Chains"]
          EOF

          cat > settings.py << 'EOF'
          import os

          class Settings:
              MAX_PIPELINE_TIME = 120 * 60
              MAX_FFMPEG_TIME = 300
              MAX_DOWNLOAD_TIME = 180
              MIN_VIDEO_SIZE = 10000
              MIN_AUDIO_SIZE = 1000
              MIN_IMAGE_SIZE = 5000
              TEMP_DIR = "temp"
              OUTPUT_FILE = "temp/Final_Story.mp4"
              LOG_FILE = "logs/pipeline.log"
              STEPS = [
                  "hadith", "script", "intro_outro_cta",
                  "tts", "background", "music", "render", "upload"
              ]
          EOF

          cat > paths.py << 'EOF'
          import os

          class Paths:
              ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
              ASSETS = os.path.join(ROOT, "assets")
              FONTS = os.path.join(ASSETS, "fonts")
              LOGO = os.path.join(ASSETS, "logo.png")
              TEMP = os.path.join(ROOT, "temp")
              OUTPUT = os.path.join(TEMP, "Final_Story.mp4")
          EOF

          cat > chains.py << 'EOF'
          class Chains:
              AI = ["gemini", "openrouter", "groq", "cohere", "nvidia", "cloudflare", "anges"]
              VIDEO = ["pexels", "pixabay", "coverr", "gradient"]
              MUSIC = ["freesound", "pixabay_music"]
              PHOTO = ["pexels", "pixabay", "pollinations_AI"]
              TTS = ["elevenlabs", "edge_tts"]
              TRANSLATE = ["mymemory", "ai"]
          EOF

      - name: 5. 📝 Write Management/auth Files
        run: |
          cd Video_Generator/Management/auth

          cat > __init__.py << 'EOF'
          from .api_keys import APIKeys
          from .env_loader import EnvLoader
          __all__ = ["APIKeys", "EnvLoader"]
          EOF

          cat > api_keys.py << 'EOF'
          import os

          class APIKeys:
              KEYS = {
                  "gemini": "GEMINI_API_KEY",
                  "groq": "GROQ_API_KEY",
                  "cohere": "COHERE_API_KEY",
                  "nvidia": "NVIDIA_API_KEY",
                  "cloudflare_id": "CLOUDFLARE_ACCOUNT_ID",
                  "cloudflare_token": "CLOUDFLARE_API_TOKEN",
                  "anges": "ANGES_API_KEY",
                  "openrouter": "OPENROUTER_API_KEY",
                  "elevenlabs": "ELEVENLABS_API_KEY",
                  "pexels": "PEXELS_API_KEY",
                  "pixabay": "PIXABAY_API_KEY",
                  "coverr": "COVERR_API_KEY",
                  "freesound": "FREESOUND_API_KEY",
                  "ummah": "UMMAH_API_KEY",
              }

              @classmethod
              def is_available(cls, name):
                  env = cls.KEYS.get(name)
                  return bool(env and os.getenv(env))

              @classmethod
              def get(cls, name):
                  env = cls.KEYS.get(name)
                  return os.getenv(env) if env else None

              @classmethod
              def get_available(cls):
                  return [k for k in cls.KEYS if cls.is_available(k)]
          EOF

          cat > env_loader.py << 'EOF'
          import os

          class EnvLoader:
              @staticmethod
              def get(key, default=None):
                  return os.getenv(key, default)

              @staticmethod
              def require(key):
                  v = os.getenv(key)
                  if not v: raise EnvironmentError(f"Missing env: {key}")
                  return v

              @staticmethod
              def validate(keys):
                  missing = [k for k in keys if not os.getenv(k)]
                  return missing
          EOF

      - name: 6. 📝 Write Management/fallback Files
        run: |
          cd Video_Generator/Management/fallback

          cat > __init__.py << 'EOF'
          from .ai import AIFallback
          from .video import VideoFallback
          from .music import MusicFallback
          from .photo import PhotoFallback
          from .tts import TTSFallback
          __all__ = ["AIFallback", "VideoFallback", "MusicFallback", "PhotoFallback", "TTSFallback"]
          EOF

          cat > ai.py << 'EOF'
          import sys, os
          BASE = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
          AI_DIR = os.path.join(BASE, "Management", "fetching", "AI", "API_fallback")
          if AI_DIR not in sys.path: sys.path.insert(0, AI_DIR)

          class AIFallback:
              def __init__(self):
                  self.used = None
                  self.failed = []

              def generate(self, prompt, max_tokens=500):
                  try:
                      import ai_fallback
                      res = ai_fallback.generate_text(prompt, max_tokens)
                      if res: self.used = ai_fallback.LAST_USED_AI
                      self.failed = ai_fallback.FAILED_AIS
                      return res
                  except Exception as e:
                      print(f"[AIFallback] {e}")
                      return None
          EOF

          cat > video.py << 'EOF'
          import sys, os
          BASE = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
          V = os.path.join(BASE, "Management", "fetching", "Background", "Video")
          for p in [os.path.join(V, "API_fallback"), os.path.join(V, "URL_fallback")]:
              if p not in sys.path: sys.path.insert(0, p)

          class VideoFallback:
              def fetch(self, query="islamic mosque", duration=60):
                  out = "temp/bg_video.mp4"
                  try:
                      from Management.fetching.Background.Video.API_fallback import pexels, pixabay, coverr
                      from Management.fetching.Background.Video.URL_fallback import gradient
                      for fn in [pexels.fetch, pixabay.fetch, coverr.fetch]:
                          try:
                              if fn(query=query, duration=duration, output_path=out): return out
                          except: pass
                      if gradient.fetch(duration=duration, output_path=out): return out
                  except Exception as e:
                      print(f"[VideoFallback] {e}")
                  return None
          EOF

          cat > music.py << 'EOF'
          import sys, os
          BASE = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
          M = os.path.join(BASE, "Management", "fetching", "Background", "Music")
          for p in [os.path.join(M, "API_fallback"), os.path.join(M, "URL_fallback")]:
              if p not in sys.path: sys.path.insert(0, p)

          class MusicFallback:
              def fetch(self, query="islamic peaceful", duration=60):
                  out = "temp/music.mp3"
                  try:
                      from Management.fetching.Background.Music.API_fallback import freesound
                      from Management.fetching.Background.Music.URL_fallback import pixabay_music
                      if freesound.fetch(query=query, duration=duration, output_path=out): return out
                      if pixabay_music.fetch(duration=duration, output_path=out): return out
                  except Exception as e:
                      print(f"[MusicFallback] {e}")
                  return None
          EOF

          cat > photo.py << 'EOF'
          class PhotoFallback:
              def fetch(self, query="islamic", output_path="temp/bg_photo.jpg"):
                  try:
                      from Management.fetching.Background.Photo.API_fallback import pexels, pixabay
                      from Management.fetching.Background.Photo.URL_fallback import pollinations_AI
                      for fn in [pexels.fetch, pixabay.fetch]:
                          try:
                              if fn(query=query, output_path=output_path): return output_path
                          except: pass
                      if pollinations_AI.fetch(prompt=query, output_path=output_path): return output_path
                  except Exception as e:
                      print(f"[PhotoFallback] {e}")
                  return None
          EOF

          cat > tts.py << 'EOF'
          import sys, os
          BASE = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
          T = os.path.join(BASE, "Management", "fetching", "audio_TTS")
          for p in [os.path.join(T, "API_fallback"), os.path.join(T, "URL_fallback")]:
              if p not in sys.path: sys.path.insert(0, p)

          class TTSFallback:
              def generate(self, text, output_path="temp/voice.mp3"):
                  try:
                      from Management.fetching.audio_TTS.API_fallback import elevenlabs
                      if elevenlabs.generate(text, output_path): return output_path
                  except Exception as e:
                      print(f"[TTS ElevenLabs] {e}")
                  try:
                      from Management.fetching.audio_TTS.URL_fallback import edge_tts
                      if edge_tts.generate(text, output_path): return output_path
                  except Exception as e:
                      print(f"[TTS Edge] {e}")
                  return None
          EOF

      - name: 7. 📝 Write Management/reporting Files
        run: |
          cd Video_Generator/Management/reporting

          cat > __init__.py << 'EOF'
          from .telegram import Telegram
          from .logger import Logger
          __all__ = ["Telegram", "Logger"]
          EOF

          cat > telegram.py << 'EOF'
          import os, requests

          class Telegram:
              def __init__(self):
                  self.token = os.getenv("TELEGRAM_API_REPORT_TOKEN")
                  self.chat = os.getenv("TELEGRAM_API_REPORT_CHAT_ID")

              def send(self, text, parse_mode="HTML"):
                  if not self.token or not self.chat: return
                  try:
                      requests.post(
                          f"https://api.telegram.org/bot{self.token}/sendMessage",
                          json={"chat_id": self.chat, "text": text[:4000], "parse_mode": parse_mode},
                          timeout=10,
                      )
                  except Exception: pass

              def document(self, path, caption=""):
                  if not self.token or not self.chat or not os.path.exists(path): return
                  try:
                      with open(path, "rb") as f:
                          requests.post(
                              f"https://api.telegram.org/bot{self.token}/sendDocument",
                              data={"chat_id": self.chat, "caption": caption[:1024]},
                              files={"document": f}, timeout=300,
                          )
                  except Exception: pass

              def error(self, step, error):
                  self.send(f"❌ <b>Error in {step}</b>\n<pre>{str(error)[:1500]}</pre>")
          EOF

          cat > logger.py << 'EOF'
          import os, logging
          from datetime import datetime

          class Logger:
              def __init__(self, log_file="logs/pipeline.log"):
                  os.makedirs(os.path.dirname(log_file), exist_ok=True)
                  logging.basicConfig(
                      filename=log_file,
                      level=logging.INFO,
                      format="%(asctime)s | %(levelname)s | %(message)s",
                  )
                  self.l = logging.getLogger("pipeline")

              def info(self, m): self.l.info(m); print(f"ℹ️ {m}")
              def warning(self, m): self.l.warning(m); print(f"⚠️ {m}")
              def error(self, m): self.l.error(m); print(f"❌ {m}")
              def step(self, step, status): self.l.info(f"[{step}] {status}")
          EOF

      - name: 8. 📝 Write Management/errors Files
        run: |
          cd Video_Generator/Management/errors

          cat > __init__.py << 'EOF'
          from .handler import ErrorHandler
          __all__ = ["ErrorHandler"]
          EOF

          cat > handler.py << 'EOF'
          class ErrorHandler:
              def __init__(self, logger, telegram, state):
                  self.logger = logger
                  self.tg = telegram
                  self.state = state

              def catch(self, step, error):
                  self.logger.error(f"[{step}] {error}")
                  self.tg.error(step, error)
                  try: self.state.fail(step, str(error))
                  except Exception: pass
          EOF

      - name: 9. 📝 Write Management/state Files
        run: |
          cd Video_Generator/Management/state

          cat > __init__.py << 'EOF'
          from .tracker import StateTracker
          __all__ = ["StateTracker"]
          EOF

          cat > tracker.py << 'EOF'
          class StateTracker:
              def __init__(self, steps):
                  self.steps = {s: "pending" for s in steps}

              def start(self, s):
                  if s in self.steps: self.steps[s] = "running"

              def done(self, s):
                  if s in self.steps: self.steps[s] = "done"

              def fail(self, s, error=""):
                  if s in self.steps: self.steps[s] = f"failed: {error[:100]}"

              def get_report(self):
                  return "\n".join(f"{k}: {v}" for k, v in self.steps.items())
          EOF

      - name: 10. 📝 Write Management/cleanup Files
        run: |
          cd Video_Generator/Management/cleanup

          cat > __init__.py << 'EOF'
          from .cleaner import Cleaner
          __all__ = ["Cleaner"]
          EOF

          cat > cleaner.py << 'EOF'
          import os, shutil

          class Cleaner:
              def __init__(self, temp_dir="temp"):
                  self.temp = temp_dir

              def clean_all(self):
                  if os.path.exists(self.temp):
                      try: shutil.rmtree(self.temp, ignore_errors=True)
                      except Exception: pass

              def clean_file(self, path):
                  if os.path.exists(path):
                      try: os.remove(path)
                      except Exception: pass
          EOF

      - name: 11. 📝 Write Management/uploader Files
        run: |
          cd Video_Generator/Management/uploader

          cat > __init__.py << 'EOF'
          from .drive import DriveUploader
          from .upload_manager import UploadManager
          __all__ = ["DriveUploader", "UploadManager"]
          EOF

          cat > drive.py << 'EOF'
          import os, time
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload

          class DriveUploader:
              def upload(self, file_path, custom_name=None):
                  if not os.path.exists(file_path): return None
                  cid = os.getenv("GDRIVE_CLIENT_ID")
                  csec = os.getenv("GDRIVE_CLIENT_SECRET")
                  rtok = os.getenv("GDRIVE_REFRESH_TOKEN")
                  fid = os.getenv("GDRIVE_F_STORY_ID")
                  if not all([cid, csec, rtok]): return None
                  try:
                      creds = Credentials(
                          None, refresh_token=rtok, client_id=cid,
                          client_secret=csec,
                          token_uri="https://oauth2.googleapis.com/token",
                      )
                      svc = build("drive", "v3", credentials=creds, cache_discovery=False)
                      meta = {"name": custom_name or f"Story_{int(time.time())}.mp4"}
                      if fid: meta["parents"] = [fid]
                      media = MediaFileUpload(file_path, mimetype="video/mp4", resumable=True)
                      f = svc.files().create(body=meta, media_body=media, fields="id, webViewLink").execute()
                      try:
                          svc.permissions().create(
                              fileId=f["id"], body={"type": "anyone", "role": "reader"}
                          ).execute()
                      except Exception: pass
                      return f.get("webViewLink")
                  except Exception as e:
                      print(f"[DriveUploader] {e}")
                      return None
          EOF

          cat > upload_manager.py << 'EOF'
          from .drive import DriveUploader

          class UploadManager:
              def __init__(self):
                  self.driver = DriveUploader()

              def upload(self, file_path, custom_name=None):
                  return self.driver.upload(file_path, custom_name)
          EOF

      - name: 12. 📝 Write Management/fetching AI Files
        run: |
          cd Video_Generator/Management/fetching/AI/API_fallback

          cat > ai_fallback.py << 'EOF'
          import sys, os
          cur = os.path.dirname(os.path.abspath(__file__))
          if cur not in sys.path: sys.path.insert(0, cur)

          gemini_AI = openrouter_AI = groq_AI = cohere_AI = nvidia_AI = cloudflare_AI = anges_AI = None
          try: import gemini_AI
          except ImportError: pass
          try: import openrouter_AI
          except ImportError: pass
          try: import groq_AI
          except ImportError: pass
          try: import cohere_AI
          except ImportError: pass
          try: import nvidia_AI
          except ImportError: pass
          try: import cloudflare_AI
          except ImportError: pass
          try: import anges_AI
          except ImportError: pass

          LAST_USED_AI = "None"
          FAILED_AIS = []

          def generate_text(prompt, max_tokens=500):
              global LAST_USED_AI, FAILED_AIS
              LAST_USED_AI = "None"
              FAILED_AIS = []

              for name, mod in [
                  ("Gemini", gemini_AI), ("OpenRouter", openrouter_AI),
                  ("Groq", groq_AI), ("Cohere", cohere_AI),
                  ("NVIDIA", nvidia_AI), ("Cloudflare", cloudflare_AI),
                  ("Anges", anges_AI),
              ]:
                  if not mod: continue
                  try:
                      res = mod.generate(prompt, max_tokens)
                      if res and res.strip():
                          LAST_USED_AI = name
                          return res.strip()
                  except Exception: pass
                  FAILED_AIS.append(name)
              return None
          EOF

          cat > gemini_AI.py << 'EOF'
          import os, requests, random

          def generate(prompt, max_tokens=500):
              key = os.getenv("GEMINI_API_KEY")
              if not key: return None
              styles = ["emotional", "motivational", "calm", "storytelling", "philosophical"]
              enhanced = f"Write in a {random.choice(styles)} tone.\n\n{prompt}"
              url = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={key}"
