name: 🏗️ Build Video_Generator Structure (Workshop)

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop Repo
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 🏗️ Create Folders
        working-directory: Workshop
        run: |
          mkdir -p Video_Generator/Management/config
          mkdir -p Video_Generator/Management/auth
          mkdir -p Video_Generator/Management/fetching/AI/API_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Music/API_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Music/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Photo/API_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Photo/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Video/API_fallback
          mkdir -p Video_Generator/Management/fetching/Background/Video/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Intro_Outro_CTA/API_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Dua/API_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Hadis/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Hijri_date/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Quran/API_fallback
          mkdir -p Video_Generator/Management/fetching/Islamic/Quran/URL_fallback
          mkdir -p Video_Generator/Management/fetching/Translator/URL_fallback
          mkdir -p Video_Generator/Management/fetching/audio_TTS/API_fallback
          mkdir -p Video_Generator/Management/fetching/audio_TTS/URL_fallback
          mkdir -p Video_Generator/Management/fallback
          mkdir -p Video_Generator/Management/reporting
          mkdir -p Video_Generator/Management/errors
          mkdir -p Video_Generator/Management/state
          mkdir -p Video_Generator/Management/cleanup
          mkdir -p Video_Generator/Management/uploader
          mkdir -p Video_Generator/Story_Generator/Story_Render/config/colors
          mkdir -p Video_Generator/Story_Generator/Story_Render/config/fonts
          mkdir -p Video_Generator/Story_Generator/Story_Render/config/sizes
          mkdir -p Video_Generator/Story_Generator/Story_Render/subtitle/assembler
          mkdir -p Video_Generator/Story_Generator/Story_Render/subtitle/builders
          mkdir -p Video_Generator/Story_Generator/Story_Render/subtitle/languages
          mkdir -p Video_Generator/Story_Generator/Story_Render/subtitle/timing
          mkdir -p Video_Generator/Story_Generator/Story_Render/tools
          mkdir -p Video_Generator/Story_Generator/Story_Render/video_engine
          mkdir -p Video_Generator/assets/fonts

      - name: 3. 📝 Management Root
        working-directory: Workshop/Video_Generator
        run: |
          cat > Management/__init__.py << 'EOF'
          from .config.settings import Settings
          from .config.paths import Paths
          from .config.chains import Chains
          from .auth.api_keys import APIKeys
          from .auth.env_loader import EnvLoader
          from .fallback.ai import AIFallback
          from .fallback.video import VideoFallback
          from .fallback.music import MusicFallback
          from .fallback.photo import PhotoFallback
          from .fallback.tts import TTSFallback
          from .reporting.telegram import Telegram
          from .reporting.logger import Logger
          from .errors.handler import ErrorHandler
          from .state.tracker import StateTracker
          from .cleanup.cleaner import Cleaner
          from .uploader.drive import DriveUploader
          from .uploader.upload_manager import UploadManager
          __all__ = ["Settings","Paths","Chains","APIKeys","EnvLoader","AIFallback","VideoFallback","MusicFallback","PhotoFallback","TTSFallback","Telegram","Logger","ErrorHandler","StateTracker","Cleaner","DriveUploader","UploadManager"]
          EOF

          cat > Management/README.md << 'EOF'
          # Management — Central Control
          यह फोल्डर पूरे Video_Generator का मस्तिष्क है।
          | फोल्डर | काम |
          |--------|-----|
          | config/ | सेटिंग्स, पाथ, चेन |
          | auth/ | API Keys |
          | fetching/ | डेटा लाना |
          | fallback/ | fallback चेन |
          | reporting/ | Telegram + Logger |
          | errors/ | Error Guard |
          | state/ | स्टेटस |
          | cleanup/ | temp सफाई |
          | uploader/ | Drive अपलोड |
          EOF

      - name: 4. 📝 Management/config
        working-directory: Workshop/Video_Generator/Management/config
        run: |
          cat > __init__.py << 'EOF'
          from .settings import Settings
          from .paths import Paths
          from .chains import Chains
          __all__ = ["Settings","Paths","Chains"]
          EOF
          cat > settings.py << 'EOF'
          class Settings:
              MAX_PIPELINE_TIME = 7200
              MAX_FFMPEG_TIME = 300
              MAX_DOWNLOAD_TIME = 180
              MIN_VIDEO_SIZE = 10000
              MIN_AUDIO_SIZE = 1000
              MIN_IMAGE_SIZE = 5000
              TEMP_DIR = "temp"
              OUTPUT_FILE = "temp/Final_Story.mp4"
              LOG_FILE = "logs/pipeline.log"
              STEPS = ["hadith","script","intro_outro_cta","tts","background","music","render","upload"]
          EOF
          cat > paths.py << 'EOF'
          import os
          class Paths:
              ROOT = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
              ASSETS = os.path.join(ROOT, "assets")
              FONTS = os.path.join(ASSETS, "fonts")
              LOGO = os.path.join(ASSETS, "logo.png")
              TEMP = os.path.join(ROOT, "temp")
              OUTPUT = os.path.join(TEMP, "Final_Story.mp4")
          EOF
          cat > chains.py << 'EOF'
          class Chains:
              AI = ["gemini","openrouter","groq","cohere","nvidia","cloudflare","anges"]
              VIDEO = ["pexels","pixabay","coverr","gradient"]
              MUSIC = ["freesound","pixabay_music"]
              PHOTO = ["pexels","pixabay","pollinations_AI"]
              TTS = ["elevenlabs","edge_tts"]
              TRANSLATE = ["mymemory","ai"]
          EOF

      - name: 5. 📝 Management/auth
        working-directory: Workshop/Video_Generator/Management/auth
        run: |
          cat > __init__.py << 'EOF'
          from .api_keys import APIKeys
          from .env_loader import EnvLoader
          __all__ = ["APIKeys","EnvLoader"]
          EOF
          cat > api_keys.py << 'EOF'
          import os
          class APIKeys:
              KEYS = {"gemini":"GEMINI_API_KEY","groq":"GROQ_API_KEY","cohere":"COHERE_API_KEY","nvidia":"NVIDIA_API_KEY","cloudflare_id":"CLOUDFLARE_ACCOUNT_ID","cloudflare_token":"CLOUDFLARE_API_TOKEN","anges":"ANGES_API_KEY","openrouter":"OPENROUTER_API_KEY","elevenlabs":"ELEVENLABS_API_KEY","pexels":"PEXELS_API_KEY","pixabay":"PIXABAY_API_KEY","coverr":"COVERR_API_KEY","freesound":"FREESOUND_API_KEY","ummah":"UMMAH_API_KEY"}
              @classmethod
              def is_available(cls, n):
                  e = cls.KEYS.get(n); return bool(e and os.getenv(e))
              @classmethod
              def get(cls, n):
                  e = cls.KEYS.get(n); return os.getenv(e) if e else None
          EOF
          cat > env_loader.py << 'EOF'
          import os
          class EnvLoader:
              @staticmethod
              def get(k, d=None): return os.getenv(k, d)
              @staticmethod
              def require(k):
                  v = os.getenv(k)
                  if not v: raise EnvironmentError(f"Missing: {k}")
                  return v
          EOF

      - name: 6. 📝 Management/fallback
        working-directory: Workshop/Video_Generator/Management/fallback
        run: |
          cat > __init__.py << 'EOF'
          from .ai import AIFallback
          from .video import VideoFallback
          from .music import MusicFallback
          from .photo import PhotoFallback
          from .tts import TTSFallback
          __all__ = ["AIFallback","VideoFallback","MusicFallback","PhotoFallback","TTSFallback"]
          EOF
          cat > ai.py << 'EOF'
          import sys, os
          B = os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))
          P = os.path.join(B, "Management", "fetching", "AI", "API_fallback")
          if P not in sys.path: sys.path.insert(0, P)
          class AIFallback:
              def __init__(self): self.used = None; self.failed = []
              def generate(self, prompt, max_tokens=500):
                  try:
                      import ai_fallback
                      r = ai_fallback.generate_text(prompt, max_tokens)
                      if r: self.used = ai_fallback.LAST_USED_AI
                      self.failed = ai_fallback.FAILED_AIS
                      return r
                  except Exception as e:
                      print(f"[AIFallback] {e}"); return None
          EOF
          cat > video.py << 'EOF'
          class VideoFallback:
              def fetch(self, query="islamic mosque", duration=60):
                  out = "temp/bg_video.mp4"
                  try:
                      from Management.fetching.Background.Video.API_fallback import pexels, pixabay, coverr
                      from Management.fetching.Background.Video.URL_fallback import gradient
                      for fn in [pexels.fetch, pixabay.fetch, coverr.fetch]:
                          try:
                              if fn(query=query, duration=duration, output_path=out): return out
                          except: pass
                      if gradient.fetch(duration=duration, output_path=out): return out
                  except Exception as e: print(f"[VideoFallback] {e}")
                  return None
          EOF
          cat > music.py << 'EOF'
          class MusicFallback:
              def fetch(self, query="islamic peaceful", duration=60):
                  out = "temp/music.mp3"
                  try:
                      from Management.fetching.Background.Music.API_fallback import freesound
                      from Management.fetching.Background.Music.URL_fallback import pixabay_music
                      if freesound.fetch(query=query, duration=duration, output_path=out): return out
                      if pixabay_music.fetch(duration=duration, output_path=out): return out
                  except Exception as e: print(f"[MusicFallback] {e}")
                  return None
          EOF
          cat > photo.py << 'EOF'
          class PhotoFallback:
              def fetch(self, query="islamic", output_path="temp/bg_photo.jpg"):
                  try:
                      from Management.fetching.Background.Photo.API_fallback import pexels, pixabay
                      from Management.fetching.Background.Photo.URL_fallback import pollinations_AI
                      for fn in [pexels.fetch, pixabay.fetch]:
                          try:
                              if fn(query=query, output_path=output_path): return output_path
                          except: pass
                      if pollinations_AI.fetch(prompt=query, output_path=output_path): return output_path
                  except Exception as e: print(f"[PhotoFallback] {e}")
                  return None
          EOF
          cat > tts.py << 'EOF'
          class TTSFallback:
              def generate(self, text, output_path="temp/voice.mp3"):
                  try:
                      from Management.fetching.audio_TTS.API_fallback import elevenlabs
                      if elevenlabs.generate(text, output_path): return output_path
                  except Exception as e: print(f"[TTS ElevenLabs] {e}")
                  try:
                      from Management.fetching.audio_TTS.URL_fallback import edge_tts
                      if edge_tts.generate(text, output_path): return output_path
                  except Exception as e: print(f"[TTS Edge] {e}")
                  return None
          EOF

      - name: 7. 📝 Management/reporting
        working-directory: Workshop/Video_Generator/Management/reporting
        run: |
          cat > __init__.py << 'EOF'
          from .telegram import Telegram
          from .logger import Logger
          __all__ = ["Telegram","Logger"]
          EOF
          cat > telegram.py << 'EOF'
          import os, requests
          class Telegram:
              def __init__(self):
                  self.t = os.getenv("TELEGRAM_API_REPORT_TOKEN")
                  self.c = os.getenv("TELEGRAM_API_REPORT_CHAT_ID")
              def send(self, text, parse_mode="HTML"):
                  if not self.t or not self.c: return
                  try: requests.post(f"https://api.telegram.org/bot{self.t}/sendMessage", json={"chat_id": self.c, "text": text[:4000], "parse_mode": parse_mode}, timeout=10)
                  except: pass
              def document(self, p, caption=""):
                  if not self.t or not self.c or not os.path.exists(p): return
                  try:
                      with open(p, "rb") as f:
                          requests.post(f"https://api.telegram.org/bot{self.t}/sendDocument", data={"chat_id": self.c, "caption": caption[:1024]}, files={"document": f}, timeout=300)
                  except: pass
              def error(self, step, e): self.send(f"❌ <b>{step}</b>\n<pre>{str(e)[:1500]}</pre>")
          EOF
          cat > logger.py << 'EOF'
          import os, logging
          class Logger:
              def __init__(self, f="logs/pipeline.log"):
                  os.makedirs(os.path.dirname(f), exist_ok=True)
                  logging.basicConfig(filename=f, level=logging.INFO, format="%(asctime)s | %(levelname)s | %(message)s")
                  self.l = logging.getLogger("pipeline")
              def info(self, m): self.l.info(m); print(f"ℹ️ {m}")
              def warning(self, m): self.l.warning(m); print(f"⚠️ {m}")
              def error(self, m): self.l.error(m); print(f"❌ {m}")
          EOF

      - name: 8. 📝 Management/errors + state + cleanup
        working-directory: Workshop/Video_Generator/Management
        run: |
          cat > errors/__init__.py << 'EOF'
          from .handler import ErrorHandler
          __all__ = ["ErrorHandler"]
          EOF
          cat > errors/handler.py << 'EOF'
          class ErrorHandler:
              def __init__(self, logger, telegram, state):
                  self.l = logger; self.t = telegram; self.s = state
              def catch(self, step, e):
                  self.l.error(f"[{step}] {e}")
                  self.t.error(step, e)
                  try: self.s.fail(step, str(e))
                  except: pass
          EOF
          cat > state/__init__.py << 'EOF'
          from .tracker import StateTracker
          __all__ = ["StateTracker"]
          EOF
          cat > state/tracker.py << 'EOF'
          class StateTracker:
              def __init__(self, steps): self.s = {x: "pending" for x in steps}
              def start(self, s):
                  if s in self.s: self.s[s] = "running"
              def done(self, s):
                  if s in self.s: self.s[s] = "done"
              def fail(self, s, e=""):
                  if s in self.s: self.s[s] = f"failed: {e[:100]}"
              def get_report(self): return "\n".join(f"{k}: {v}" for k, v in self.s.items())
          EOF
          cat > cleanup/__init__.py << 'EOF'
          from .cleaner import Cleaner
          __all__ = ["Cleaner"]
          EOF
          cat > cleanup/cleaner.py << 'EOF'
          import os, shutil
          class Cleaner:
              def __init__(self, d="temp"): self.d = d
              def clean_all(self):
                  if os.path.exists(self.d):
                      try: shutil.rmtree(self.d, ignore_errors=True)
                      except: pass
          EOF

      - name: 9. 📝 Management/uploader
        working-directory: Workshop/Video_Generator/Management/uploader
        run: |
          cat > __init__.py << 'EOF'
          from .drive import DriveUploader
          from .upload_manager import UploadManager
          __all__ = ["DriveUploader","UploadManager"]
          EOF
          cat > drive.py << 'EOF'
          import os, time
          from google.oauth2.credentials import Credentials
          from googleapiclient.discovery import build
          from googleapiclient.http import MediaFileUpload
          class DriveUploader:
              def upload(self, path, custom_name=None):
                  if not os.path.exists(path): return None
                  cid = os.getenv("GDRIVE_CLIENT_ID"); cs = os.getenv("GDRIVE_CLIENT_SECRET")
                  rt = os.getenv("GDRIVE_REFRESH_TOKEN"); fid = os.getenv("GDRIVE_F_STORY_ID")
                  if not all([cid, cs, rt]): return None
                  try:
                      cr = Credentials(None, refresh_token=rt, client_id=cid, client_secret=cs, token_uri="https://oauth2.googleapis.com/token")
                      s = build("drive","v3",credentials=cr,cache_discovery=False)
                      m = {"name": custom_name or f"Story_{int(time.time())}.mp4"}
                      if fid: m["parents"] = [fid]
                      media = MediaFileUpload(path, mimetype="video/mp4", resumable=True)
                      f = s.files().create(body=m, media_body=media, fields="id, webViewLink").execute()
                      try: s.permissions().create(fileId=f["id"], body={"type":"anyone","role":"reader"}).execute()
                      except: pass
                      return f.get("webViewLink")
                  except Exception as e:
                      print(f"[Drive] {e}"); return None
          EOF
          cat > upload_manager.py << 'EOF'
          from .drive import DriveUploader
          class UploadManager:
              def __init__(self): self.d = DriveUploader()
              def upload(self, p, n=None): return self.d.upload(p, n)
          EOF

      - name: 10. 📝 Fetching/AI
        working-directory: Workshop/Video_Generator/Management/fetching/AI/API_fallback
        run: |
          cat > ai_fallback.py << 'EOF'
          import sys, os
          C = os.path.dirname(os.path.abspath(__file__))
          if C not in sys.path: sys.path.insert(0, C)
          gemini_AI = openrouter_AI = groq_AI = cohere_AI = nvidia_AI = cloudflare_AI = anges_AI = None
          try: import gemini_AI
          except: pass
          try: import openrouter_AI
          except: pass
          try: import groq_AI
          except: pass
          try: import cohere_AI
          except: pass
          try: import nvidia_AI
          except: pass
          try: import cloudflare_AI
          except: pass
          try: import anges_AI
          except: pass
          LAST_USED_AI = "None"
          FAILED_AIS = []
          def generate_text(prompt, max_tokens=500):
              global LAST_USED_AI, FAILED_AIS
              LAST_USED_AI = "None"; FAILED_AIS = []
              for name, mod in [("Gemini",gemini_AI),("OpenRouter",openrouter_AI),("Groq",groq_AI),("Cohere",cohere_AI),("NVIDIA",nvidia_AI),("Cloudflare",cloudflare_AI),("Anges",anges_AI)]:
                  if not mod: continue
                  try:
                      r = mod.generate(prompt, max_tokens)
                      if r and r.strip(): LAST_USED_AI = name; return r.strip()
                  except: pass
                  FAILED_AIS.append(name)
              return None
          EOF
          cat > gemini_AI.py << 'EOF'
          import os, requests, random
          def generate(p, m=500):
              k = os.getenv("GEMINI_API_KEY")
              if not k: return None
              s = random.choice(["emotional","motivational","calm","storytelling","philosophical"])
              u = f"https://generativelanguage.googleapis.com/v1beta/models/gemini-2.0-flash:generateContent?key={k}"
              try:
                  r = requests.post(u, json={"contents":[{"parts":[{"text":f"Write in {s} tone.\n\n{p}"}]}],"generationConfig":{"maxOutputTokens":m,"temperature":0.9}}, timeout=30)
                  if r.status_code == 200: return r.json()["candidates"][0]["content"]["parts"][0]["text"].strip()
              except: pass
              return None
          EOF
          cat > openrouter_AI.py << 'EOF'
          import os, requests
          def generate(p, m=500):
              k = os.getenv("OPENROUTER_API_KEY")
              if not k: return None
              try:
                  r = requests.post("https://openrouter.ai/api/v1/chat/completions", headers={"Authorization":f"Bearer {k}","Content-Type":"application/json"}, json={"model":"openai/gpt-4o-mini","messages":[{"role":"user","content":p}],"max_tokens":m}, timeout=30)
                  if r.status_code == 200: return r.json()["choices"][0]["message"]["content"].strip()
              except: pass
              return None
          EOF
          cat > groq_AI.py << 'EOF'
          import os, requests
          def generate(p, m=500):
              k = os.getenv("GROQ_API_KEY")
              if not k: return None
              try:
                  r = requests.post("https://api.groq.com/openai/v1/chat/completions", headers={"Authorization":f"Bearer {k}","Content-Type":"application/json"}, json={"model":"llama-3.3-70b-versatile","messages":[{"role":"user","content":p}],"max_tokens":m}, timeout=30)
                  if r.status_code == 200: return r.json()["choices"][0]["message"]["content"].strip()
              except: pass
              return None
          EOF
          cat > cohere_AI.py << 'EOF'
          import os, requests
          def generate(p, m=500):
              k = os.getenv("COHERE_API_KEY")
              if not k: return None
              try:
                  r = requests.post("https://api.cohere.com/v2/chat", headers={"Authorization":f"Bearer {k}","Content-Type":"application/json"}, json={"model":"command-a-03-2025","messages":[{"role":"user","content":p}],"max_tokens":m}, timeout=30)
                  if r.status_code == 200: return r.json()["message"]["content"][0]["text"].strip()
              except: pass
              return None
          EOF
          cat > nvidia_AI.py << 'EOF'
          import os, requests
          def generate(p, m=500):
              k = os.getenv("NVIDIA_API_KEY")
              if not k: return None
              try:
                  r = requests.post("https://integrate.api.nvidia.com/v1/chat/completions", headers={"Authorization":f"Bearer {k}","Content-Type":"application/json"}, json={"model":"nvidia/nemotron-3-ultra-550b-a55b","messages":[{"role":"user","content":p}],"max_tokens":m}, timeout=30)
                  if r.status_code == 200:
                      x = r.json()["choices"][0]["message"]
                      return (x.get("content") or x.get("reasoning_content") or "").strip()
              except: pass
              return None
          EOF
          cat > cloudflare_AI.py << 'EOF'
          import os, requests
          def generate(p, m=500):
              a = os.getenv("CLOUDFLARE_ACCOUNT_ID"); t = os.getenv("CLOUDFLARE_API_TOKEN")
              if not a or not t: return None
              try:
                  u = f"https://api.cloudflare.com/client/v4/accounts/{a}/ai/run/@cf/meta/llama-3.3-70b-instruct-fp8-fast"
                  r = requests.post(u, headers={"Authorization":f"Bearer {t}","Content-Type":"application/json"}, json={"messages":[{"role":"user","content":p}],"max_tokens":m}, timeout=30)
                  if r.status_code == 200: return r.json().get("result",{}).get("response","").strip()
              except: pass
              return None
          EOF
          cat > anges_AI.py << 'EOF'
          import os, requests
          def generate(p, m=500):
              k = os.getenv("ANGES_API_KEY")
              if not k: return None
              try:
                  r = requests.post("https://apihub.agnes-ai.com/v1/chat/completions", headers={"Authorization":f"Bearer {k}","Content-Type":"application/json"}, json={"model":"agnes-2.5-flash","messages":[{"role":"user","content":p}],"max_tokens":m}, timeout=30)
                  if r.status_code == 200: return r.json()["choices"][0]["message"]["content"].strip()
              except: pass
              return None
          EOF
          cat > magic_AI.py << 'EOF'
          import os, requests
          def generate(p, m=500):
              k = os.getenv("MAGICHOUR_API_KEY")
              if not k: return None
              try:
                  r = requests.post("https://api.magichour.ai/v1/ai-image-generator", headers={"Authorization":f"Bearer {k}","Content-Type":"application/json"}, json={"name":"test","image_count":1,"model":"z-image-turbo","aspect_ratio":"1:1","resolution":"640px","style":{"prompt":p[:500],"tool":"ai-anime-generator"}}, timeout=30)
                  if r.status_code in (200,201,202): return f"Magic: {r.json().get('id')}"
              except: pass
              return None
          EOF
          cat > tanvo_AI.py << 'EOF'
          import os, requests
          def generate(p, m=500):
              k = os.getenv("TANVO_API_KEY")
              if not k: return None
              try:
                  r = requests.post("https://tanvo.ai/api/v1/generations", headers={"Authorization":f"Bearer {k}","Content-Type":"application/json"}, json={"model":"studio-image-v1","prompt":p[:500],"kind":"image","options":{"aspect":"1:1","resolution":"1K","format":"PNG"}}, timeout=30)
                  if r.status_code in (200,201,202): return f"Tanvo: {r.json().get('generation',{}).get('id')}"
              except: pass
              return None
          EOF

      - name: 11. 📝 Fetching/Background
        working-directory: Workshop/Video_Generator/Management/fetching/Background
        run: |
          cat > Music/API_fallback/freesound.py << 'EOF'
          import os, subprocess, requests
          def fetch(q="islamic peaceful", d=60, o="temp/music.mp3"):
              k = os.getenv("FREESOUND_API_KEY")
              if not k: return _fb(d, o)
              try:
                  r = requests.get("https://freesound.org/apiv2/search/text/", params={"query":q,"token":k,"fields":"previews","page_size":5}, timeout=15)
                  if r.status_code == 200:
                      for x in r.json().get("results", []):
