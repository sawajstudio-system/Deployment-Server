          from .config import generate_ass_style_string, ARABIC_STYLE, HINDI_STYLE, ENGLISH_STYLE, INTRO_STYLE, OUTRO_STYLE

          def merge_ass_files(paths, output_path):
              header = "[Script Info]\nScriptType: v4.00+\nPlayResX: 1080\nPlayResY: 1920\nWrapStyle: 2\n[V4+ Styles]\nFormat: Name, Fontname, Fontsize, PrimaryColour, SecondaryColour, OutlineColour, BackColour, Bold, Italic, Underline, StrikeOut, ScaleX, ScaleY, Spacing, Angle, BorderStyle, Outline, Shadow, Alignment, MarginL, MarginR, MarginV, Encoding\n"
              for n, s in [("Arabic", ARABIC_STYLE), ("Hindi", HINDI_STYLE), ("English", ENGLISH_STYLE), ("Intro", INTRO_STYLE), ("Outro", OUTRO_STYLE)]:
                  header += generate_ass_style_string(n, s) + "\n"
              header += "[Events]\nFormat: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"
              os.makedirs(os.path.dirname(output_path), exist_ok=True)
              with open(output_path, "w", encoding="utf-8") as f:
                  f.write(header)
                  for p in paths:
                      if p and os.path.exists(p):
                          with open(p, "r", encoding="utf-8") as fp:
                              for line in fp:
                                  if line.startswith("Dialogue:"): f.write(line)
              return output_path

          def build_and_render_story(bg_video, music_path, voice_path, hadith, hindi_text, intro_text, outro_text, cta_text, output_path="temp/Final_Story.mp4"):
              os.makedirs("temp", exist_ok=True)
              duration = get_audio_duration(voice_path)
              intro_ass = create_intro_subtitle(intro_text, duration=2.5, output_path="temp/intro.ass")
              main_ass = create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main.ass")
              outro_ass = create_outro_subtitle(outro_text, duration, outro_duration=3.5, output_path="temp/outro.ass")
              cta_img = generate_cta_image(output_path="temp/cta.png")
              master = merge_ass_files([intro_ass, main_ass, outro_ass], "temp/master.ass")
              logo = os.path.join(os.path.dirname(os.path.dirname(os.path.dirname(os.path.dirname(os.path.abspath(__file__))))), "assets", "logo.png")
              cmd = build_ffmpeg_cmd(bg_video, voice_path, music_path, cta_img, logo, master, duration, output_path)
              return output_path if run_ffmpeg(cmd) else None
          EOF

