name: 🔧 Fix intro_sub_builder.py

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - name: 1. 📥 Checkout Workshop
        uses: actions/checkout@v4
        with:
          repository: 'sawajstudio-system/Workshop'
          token: ${{ secrets.TOKEN_GITHUB }}
          path: 'Workshop'

      - name: 2. 🔍 पहले — पुरानी फाइल दिखाओ
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          echo "════════════════════════════════════════"
          echo "🔍 intro_sub_builder.py (पुराना):"
          echo "════════════════════════════════════════"
          cat intro_sub_builder.py
          echo ""
          echo "════════════════════════════════════════"
          echo "🔍 outro_sub_builder.py (पुराना):"
          echo "════════════════════════════════════════"
          cat outro_sub_builder.py
          echo ""
          echo "════════════════════════════════════════"
          echo "🔍 main_sub_builder.py (पुराना):"
          echo "════════════════════════════════════════"
          cat main_sub_builder.py

      - name: 3. 🔍 create_intro_subtitle का signature जाँचो
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          echo "════════════════════════════════════════"
          echo "🔍 जो function मिला:"
          echo "════════════════════════════════════════"
          grep -A 2 "def create_intro_subtitle" intro_sub_builder.py
          echo ""
          grep -A 2 "def create_outro_subtitle" outro_sub_builder.py
          echo ""
          grep -A 2 "def create_main_subtitles" main_sub_builder.py

      - name: 4. 🔧 intro_sub_builder.py को fix करो
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          cat > intro_sub_builder.py << 'EOF'
          # ══════════════════════════════════════════════════════════════════════════════
          # 📁 FILE: Story_Render/subtitle/builders/intro_sub_builder.py
          # 🎯 PURPOSE: इंट्रो (Intro) सबटाइटल बनाना — शुरुआत में धीमा फेड-इन
          # ✅ FIX: duration parameter जोड़ा गया (जो पहले missing था)
          # ══════════════════════════════════════════════════════════════════════════════
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts
          from ...config.colors import get_color_tag


          def create_intro_subtitle(intro_text, duration=3.5, output_path="temp/intro_sub.ass"):
              """
              शुरुआत के लिए इंट्रो सबटाइटल बनाता है।

              Args:
                  intro_text (str): इंट्रो का टेक्स्ट
                  duration (float): इंट्रो कितनी देर दिखे (सेकंड में)
                  output_path (str): कहाँ सेव करना है

              Returns:
                  str: बनी हुई ASS फाइल का path (या None)
              """
              if not intro_text:
                  return None

              clean_text = str(intro_text).strip()

              # ── ASS फाइल हेडर ─────────────────────────────────────────────────
              content = get_ass_header()
              content += "\n[V4+ Styles]\n"
              content += get_all_styles()
              content += "\n[Events]\n"
              content += "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"

              # ── गोल्डन कलर + ग्लो + धीमा फेड-इन ─────────────────────────────
              formatted_text = f"{{\\fad(1000,1000)\\blur5\\c&H00D7FF&\\3c&H000000&}}{clean_text}"

              content += f"Dialogue: 0,{ts(0.0)},{ts(duration)},Intro,,0,0,0,,{formatted_text}\n"

              return save_ass(content, output_path)
          EOF
          echo "✅ intro_sub_builder.py fix हो गई"

      - name: 5. 🔧 outro_sub_builder.py को भी fix करो (सुरक्षित)
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          cat > outro_sub_builder.py << 'EOF'
          # ══════════════════════════════════════════════════════════════════════════════
          # 📁 FILE: Story_Render/subtitle/builders/outro_sub_builder.py
          # 🎯 PURPOSE: आउट्रो (Outro) सबटाइटल बनाना — आखिर में धन्यवाद
          # ✅ FIX: parameters जोड़े गए
          # ══════════════════════════════════════════════════════════════════════════════
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts
          from ...config.colors import get_color_tag


          def create_outro_subtitle(outro_text, total_duration, outro_duration=3.5, output_path="temp/outro_sub.ass"):
              """
              आखिर में दिखने वाला आउट्रो सबटाइटल बनाता है।
              """
              if not outro_text:
                  return None

              clean_text = str(outro_text).strip()

              content = get_ass_header()
              content += "\n[V4+ Styles]\n"
              content += get_all_styles()
              content += "\n[Events]\n"
              content += "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"

              start_t = max(0.0, total_duration - outro_duration)
              formatted_text = f"{{\\fad(500,500)\\c{get_color_tag(1)}}}{clean_text}"

              content += f"Dialogue: 0,{ts(start_t)},{ts(total_duration)},Outro,,0,0,0,,{formatted_text}\n"

              return save_ass(content, output_path)
          EOF
          echo "✅ outro_sub_builder.py fix हो गई"

      - name: 6. 🔧 main_sub_builder.py को भी fix करो (सुरक्षित)
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          cat > main_sub_builder.py << 'EOF'
          # ══════════════════════════════════════════════════════════════════════════════
          # 📁 FILE: Story_Render/subtitle/builders/main_sub_builder.py
          # 🎯 PURPOSE: मुख्य कराओके सबटाइटल बनाना (अरबी + हिंदी + इंग्लिश)
          # ✅ FIX: parameters जोड़े गए
          # ══════════════════════════════════════════════════════════════════════════════
          import re
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts, compute_word_timings
          from ...config.colors import get_color_tag


          def create_main_subtitles(hadith, hindi_text, duration, output_path="temp/main_subtitles.ass"):
              """
              मुख्य कराओके सबटाइटल फाइल बनाता है।
              """
              print("✍️ [main_sub_builder] Building Left-Aligned Smooth Subtitles...")

              ara_text = re.sub(r'[\n\r"]', ' ', str(hadith.get("arabic", ""))).strip()
              hin_text = re.sub(r'[\n\r"]', ' ', str(hindi_text)).strip()
              eng_text = re.sub(r'[\n\r"]', ' ', str(hadith.get("english", ""))).strip()

              content = get_ass_header()
              content += "\n[V4+ Styles]\n"
              content += get_all_styles()
              content += "\n[Events]\n"
              content += "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"

              start_t = 4.0
              end_t = max(duration - 5.5, start_t + 1.0)
              total_dur = end_t - start_t

              def process_language(text, style_name, lang_idx):
                  words = text.split()
                  if not words:
                      return ""
                  timings = compute_word_timings(words, total_dur)
                  window_size = 3
                  lines = ""
                  for i in range(len(words)):
                      w_start = start_t + timings[i][0]
                      w_end = start_t + timings[i][1]
                      start_idx = max(0, i - window_size + 1)
                      visible_words = words[start_idx:i + 1]
                      dot_color = get_color_tag(i // 3 + (lang_idx * 3))
                      if lang_idx == 0:
                          karaoke_text = f"\u202B{{\\c{dot_color}}}●  "
                      else:
                          karaoke_text = f"{{\\c{dot_color}}}●  "
                      for j, word in enumerate(visible_words):
                          global_idx = start_idx + j
                          color = get_color_tag(global_idx)
                          if global_idx == i:
                              cs = int((w_end - w_start) * 100)
                              karaoke_text += f"{{\\c{color}\\k{cs}}}{word} "
                          else:
                              karaoke_text += f"{{\\c{color}}}{word} "
                      if lang_idx == 0:
                          karaoke_text += "\u202C"
                      lines += f"Dialogue: 0,{ts(w_start)},{ts(w_end)},{style_name},,,0,0,,{karaoke_text.strip()}\n"
                  return lines

              if ara_text:
                  content += process_language(ara_text, "Arabic", 0)
              if hin_text:
                  content += process_language(hin_text, "Hindi", 1)
              if eng_text:
                  content += process_language(eng_text, "English", 2)

              return save_ass(content, output_path)
          EOF
          echo "✅ main_sub_builder.py fix हो गई"

      - name: 7. 🔧 cta_sub_builder.py को भी fix करो (सुरक्षित)
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          cat > cta_sub_builder.py << 'EOF'
          # ══════════════════════════════════════════════════════════════════════════════
          # 📁 FILE: Story_Render/subtitle/builders/cta_sub_builder.py
          # 🎯 PURPOSE: CTA (Call to Action) सबटाइटल
          # ✅ FIX: parameters जोड़े गए
          # ══════════════════════════════════════════════════════════════════════════════
          import re
          from ..assembler import get_ass_header, get_all_styles, save_ass
          from ..timing import ts
          from ...config.colors import get_color_tag


          def create_cta_subtitle(cta_text, total_duration, cta_duration=3.5, output_path="temp/cta_sub.ass"):
              """
              CTA सबटाइटल बनाता है (Like/Share/Subscribe)।
              """
              if not cta_text:
                  return None

              clean_text = re.sub(r'[\n\r"]', ' ', str(cta_text)).strip()

              content = get_ass_header()
              content += "\n[V4+ Styles]\n"
              content += get_all_styles(include_cta=True)
              content += "\n[Events]\n"
              content += "Format: Layer, Start, End, Style, Name, MarginL, MarginR, MarginV, Effect, Text\n"

              start_t = max(0.0, total_duration - cta_duration)
              formatted_text = f"{{\\fad(500,500)\\c{get_color_tag(2)}}}● {clean_text}"

              content += f"Dialogue: 0,{ts(start_t)},{ts(total_duration)},CTA,,0,0,0,,{formatted_text}\n"

              return save_ass(content, output_path)
          EOF
          echo "✅ cta_sub_builder.py fix हो गई"

      - name: 8. 🔍 Syntax जाँच
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          pip install requests -q
          echo "════════════════════════════════════════"
          echo "🔍 Syntax check:"
          echo "════════════════════════════════════════"
          for f in intro_sub_builder.py outro_sub_builder.py main_sub_builder.py cta_sub_builder.py; do
            if python -c "import ast; ast.parse(open('$f').read())"; then
              echo "✅ $f"
            else
              echo "❌ $f"
            fi
          done

      - name: 9. 🔍 Function signatures जाँच
        run: |
          cd Workshop/Video_Generator/Story_Generator/Story_Render/subtitle/builders
          echo "════════════════════════════════════════"
          echo "🔍 नए function signatures:"
          echo "════════════════════════════════════════"
          grep "def create_intro_subtitle" intro_sub_builder.py
          grep "def create_outro_subtitle" outro_sub_builder.py
          grep "def create_main_subtitles" main_sub_builder.py
          grep "def create_cta_subtitle" cta_sub_builder.py

      - name: 10. 💾 Commit & Push
        run: |
          cd Workshop
          git config user.name "Sawaj Studio Bot"
          git config user.email "bot@sawajstudio.com"
          git add -A
          git commit -m "🔧 Fix create_*_subtitle() signatures (duration parameter)" || echo "No changes"
          git push origin main || echo "Push failed"
