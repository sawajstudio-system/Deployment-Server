                          if url:
                              data = requests.get(url, timeout=30).content
                              os.makedirs(os.path.dirname(output_path), exist_ok=True)
                              with open("temp/raw.mp3", "wb") as f: f.write(data)
                              subprocess.run(f'ffmpeg -y -stream_loop -1 -i temp/raw.mp3 -t {duration} -c:a libmp3lame {output_path}', shell=True, capture_output=True)
                              if os.path.exists("temp/raw.mp3"): os.remove("temp/raw.mp3")
                              return output_path
              except Exception: pass
              return _fallback(duration, output_path)

