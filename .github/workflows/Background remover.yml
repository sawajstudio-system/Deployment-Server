name: ⚡ Fast Background Remover

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  remove_bg:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Public Repo
        uses: actions/checkout@v4

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # सिर्फ 2 छोटी लाइब्रेरी इंस्टॉल होंगी (5 सेकंड में)
      - name: 3. 📦 Install Pillow & Numpy
        run: pip install Pillow numpy

      - name: 4. 🪄 Remove Background (Super Fast)
        run: |
          python -c "
          from PIL import Image
          import numpy as np
          import os

          input_file = 'logo.png'
          output_file = 'transparent_logo.png'

          if not os.path.exists(input_file):
              raise FileNotFoundError('logo.png nahi mila!')

          img = Image.open(input_file).convert('RGBA')
          data = np.array(img)

          # RGB और Alpha चैनल्स अलग करें
          r, g, b, a = data[:,:,0], data[:,:,1], data[:,:,2], data[:,:,3]

          # ---------------------------------------------------------
          # 🎯 यहाँ अपना बैकग्राउंड चुनें:
          
          # 1. आपके लोगो में सफ़ेद (White) बैकग्राउंड है, उसे हटाने के लिए:
          mask = (r > 235) & (g > 235) & (b > 235) 
          
          # 2. अगर आप कभी हरा (Green Screen) बैकग्राउंड हटाना चाहें, तो ऊपर वाली लाइन हटाकर यह लाइन लगाएं:
          # mask = (g > 100) & (g > r * 1.2) & (g > b * 1.2)
          # ---------------------------------------------------------

          # जहाँ-जहाँ बैकग्राउंड है, वहाँ का Alpha (पारदर्शिता) 0 कर दें
          data[mask, 3] = 0

          # नई ट्रांसपेरेंट इमेज सेव करें
          transparent_img = Image.fromarray(data)
          transparent_img.save(output_file)
          print('✅ Background removed instantly in 1 second!')
          "

      - name: 5. 🚀 Send Transparent Logo to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set. Skipping."
            exit 0
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@transparent_logo.png" \
            -F "caption=⚡ Super Fast! Yeh raha aapka saaf Transparent Logo." \
            || true

      - name: 6. 💾 Commit and Push to Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add transparent_logo.png
          git commit -m "⚡ Added fast transparent logo" || echo "No changes"
          git push || echo "No changes"
