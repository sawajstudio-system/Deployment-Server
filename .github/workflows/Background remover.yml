name: ⚡ Fast Remove Background (AI Powered)

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  remove_bg:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Public Repo
        uses: actions/checkout@v4

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 📦 Install rembg (Fast CPU version)
        run: |
          pip install rembg[cpu] pillow

      - name: 4. 💾 Cache Lightweight AI Model (u2netp - 4.7MB)
        uses: actions/cache@v4
        id: model-cache
        with:
          path: ~/.u2net
          key: ${{ runner.os }}-u2netp-model-v1

      - name: 5. ⬇️ Download Fast Model (Only if not cached)
        if: steps.model-cache.outputs.cache-hit != 'true'
        run: |
          echo "फास्ट मॉडल (4.7MB) डाउनलोड हो रहा है..."
          mkdir -p ~/.u2net
          # u2netp मॉडल डाउनलोड करने का लिंक
          curl -L -s -o ~/.u2net/u2netp.onnx \
            "https://github.com/danielgatis/rembg/releases/download/v0.0.0/u2netp.onnx"
          echo "✅ फास्ट मॉडल डाउनलोड हो गया!"

      - name: 6. 🪄 Remove Background (Super Fast)
        run: |
          python -c "
          from rembg import remove, new_session
          from PIL import Image
          import os

          input_file = 'logo.png'
          output_file = 'transparent_logo.png'

          if not os.path.exists(input_file):
              raise FileNotFoundError('logo.png nahi mila!')

          print('AI model se background remove ho raha hai... (Fast Mode)')
          input_image = Image.open(input_file)
          
          # u2netp (Portable) मॉडल का इस्तेमाल करना ताकि प्रोसेस फास्ट हो
          session = new_session('u2netp')
          output_image = remove(input_image, session=session)
          
          output_image.save(output_file)
          print('✅ Background removed successfully in record time!')
          "

      - name: 7. 🚀 Send Transparent Logo to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set. Skipping."
            exit 0
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@transparent_logo.png" \
            -F "caption=⚡ AI ki speed! Yeh raha aapka ekdum clean aur professional Transparent Logo." \
            || true

      - name: 8. 💾 Commit and Push to Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add transparent_logo.png
          git commit -m "⚡ Added ultra-fast AI transparent logo" || echo "No changes"
          git push || echo "No changes"
