name: ⚡ Fast Background Remover

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  remove_bg:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Public Repo
        uses: actions/checkout@v4

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      # सिर्फ 2 छोटी लाइब्रेरी इंस्टॉल होंगी (5 सेकंड में)
      - name: 3. 📦 Install Pillow & Numpy
        run: pip install Pillow numpy

      - name: 4. 🪄 Remove Green Background (Super Fast)
        run: |
          python - << 'EOF'
          from PIL import Image
          import numpy as np
          import os

          input_file = 'logo.png'
          output_file = 'transparent_logo.png'

          if not os.path.exists(input_file):
              raise FileNotFoundError('logo.png nahi mila!')

          img = Image.open(input_file).convert('RGBA')
          data = np.array(img)

          # RGB और Alpha चैनल्स अलग करें
          r, g, b, a = data[:,:,0], data[:,:,1], data[:,:,2], data[:,:,3]

          # 🎯 Green Background Removal Mask: 
          # Green color high hoga aur Red & Blue low honge, jisse sirf green background transparent hoga
          mask = (g > 120) & (r < 100) & (b < 100)

          # जहाँ-जहाँ हरा बैकग्राउंड है, वहाँ का Alpha (पारदर्शिता) 0 कर दें
          data[mask, 3] = 0

          # नई ट्रांसपेरेंट इमेज सेव करें
          transparent_img = Image.fromarray(data)
          transparent_img.save(output_file)
          print('✅ Green background removed successfully and logo is safe!')
          EOF

      - name: 5. 🚀 Send Transparent Logo to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set. Skipping."
            exit 0
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@transparent_logo.png" \
            -F "caption=⚡ Super Fast! Green background remove karke transparent logo bhej diya hai." \
            || true

      - name: 6. 💾 Commit and Push to Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add transparent_logo.png
          git commit -m "⚡ Removed green background and added transparent logo" || echo "No changes"
          git push origin HEAD:${{ github.ref_name }} || echo "No changes"
          
