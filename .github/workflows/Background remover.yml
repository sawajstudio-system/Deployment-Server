name: 🧹 Remove Background (AI Powered)

on:
  workflow_dispatch: 

permissions:
  contents: write

jobs:
  remove_bg:
    runs-on: ubuntu-latest

    steps:
      - name: 1. 📥 Checkout Public Repo
        uses: actions/checkout@v4

      - name: 2. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: 3. 📦 Install rembg (AI) & Pillow
        run: |
          pip install rembg pillow onnxruntime

      - name: 4. 🪄 Remove Background using AI
        run: |
          python -c "
          from rembg import remove
          from PIL import Image
          import os

          input_file = 'logo.png'
          output_file = 'transparent_logo.png'

          if not os.path.exists(input_file):
              raise FileNotFoundError('logo.png nahi mila!')

          print('AI model se background remove ho raha hai...')
          input_image = Image.open(input_file)
          
          # AI model se background remove karna
          output_image = remove(input_image)
          
          output_image.save(output_file)
          print('✅ Background removed successfully with AI!')
          "

      - name: 5. 🚀 Send Transparent Logo to Telegram
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
        run: |
          if [ -z "$TELEGRAM_BOT_TOKEN" ] || [ -z "$TELEGRAM_CHAT_ID" ]; then
            echo "⚠️ Telegram secrets not set. Skipping."
            exit 0
          fi
          
          curl -s -X POST "https://api.telegram.org/bot${TELEGRAM_BOT_TOKEN}/sendDocument" \
            -F "chat_id=${TELEGRAM_CHAT_ID}" \
            -F "document=@transparent_logo.png" \
            -F "caption=✨ AI ka kamaal! Yeh raha aapka ekdum clean aur professional Transparent Logo." \
            || true

      - name: 6. 💾 Commit and Push to Repo
        run: |
          git config --global user.name "Sawaj Studio Bot"
          git config --global user.email "bot@sawajstudio.com"
          git add transparent_logo.png
          git commit -m "✨ Added ultra-clean AI transparent logo" || echo "No changes"
          git push || echo "No changes"
