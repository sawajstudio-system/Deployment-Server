name: 🌐 Natural Sound URL Test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest
    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}
      FREESOUND_API_KEY: ${{ secrets.FREESOUND_API_KEY }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'
          
      - name: 2. 📦 Install requests
        run: pip install requests
        
      - name: 3. 🪶 Fetch & Run Natural Sound Test
        run: |
          echo "📥 Downloading natural_sound.py from A_API_room/02_audio_media..."
          curl -sSL -f -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/A_API_room/02_audio_media/natural_sound.py" \
            -o /tmp/natural_sound.py
          
          if [ -s /tmp/natural_sound.py ]; then
            echo "✅ File mil gayi!"
            python /tmp/natural_sound.py
          else
            echo "❌ File download fail ho gaya."
            exit 1
          fi
          rm -f /tmp/natural_sound.py
