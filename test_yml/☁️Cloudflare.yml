name: ☁️ Cloudflare API Test

on:
  workflow_dispatch:

jobs:
  run:
    runs-on: ubuntu-latest

    env:
      TELEGRAM_API_REPORT_TOKEN: ${{ secrets.TELEGRAM_API_REPORT_TOKEN }}
      TELEGRAM_API_REPORT_CHAT_ID: ${{ secrets.TELEGRAM_API_REPORT_CHAT_ID }}
      CLOUDFLARE_ACCOUNT_ID: ${{ secrets.CLOUDFLARE_ACCOUNT_ID }}
      CLOUDFLARE_API_TOKEN: ${{ secrets.CLOUDFLARE_API_TOKEN }}
      TOKEN_GITHUB: ${{ secrets.TOKEN_GITHUB }}

    steps:
      - name: 1. 🐍 Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.11'

      - name: 2. 📦 Install requests
        run: pip install requests

      - name: 3. 🔍 Debug — Env Check
        run: |
          echo "CLOUDFLARE_ACCOUNT_ID set: ${{ secrets.CLOUDFLARE_ACCOUNT_ID != '' }}"
          echo "CLOUDFLARE_API_TOKEN set:  ${{ secrets.CLOUDFLARE_API_TOKEN != '' }}"

      - name: 4. 🔍 Debug — Check File in Backend
        run: |
          echo "🔍 Checking cloudflare.py in Backend repo..."
          set +e
          HTTP_CODE=$(curl -sS -o /tmp/resp.json -w "%{http_code}" \
            -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/A_API_room/01_ai_models/cloudflare.py")
          echo "HTTP Status: $HTTP_CODE"

      - name: 5. 🪶 Fetch Cloudflare Test
        run: |
          echo "📥 Downloading cloudflare.py..."
          set +e
          curl -sSL -f \
            -H "Authorization: token ${{ secrets.TOKEN_GITHUB }}" \
            -H "Accept: application/vnd.github.raw" \
            "https://api.github.com/repos/sawajstudio-system/Backend/contents/System_room/A_API_room/01_ai_models/cloudflare.py" \
            -o /tmp/cloudflare.py
          
          if [ -f /tmp/cloudflare.py ] && [ -s /tmp/cloudflare.py ]; then
            echo "✅ Downloaded: $(wc -c < /tmp/cloudflare.py) bytes"
          else
            echo "❌ Download FAILED"
            exit 1
          fi

      - name: 6. 🧪 Run Cloudflare Test
        continue-on-error: true
        run: python /tmp/cloudflare.py

      - name: 7. 💨 Vanished
        if: always()
        run: |
          rm -f /tmp/cloudflare.py /tmp/resp.json
          echo "✅ Hawa mein hi ud gaya!"
